<style>
:root{ --paper:#ECF1FF; --panel:#FFFFFF; --ink:#2A2B45; --ink-2:#585D82; --line:#DCE2F6; --berry:#FF7593; --butter:#FFD36E;
  --round:ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; color-scheme:light; }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--round)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px}
.bar h1{margin:0 8px 0 0;font:700 18px/1.2 var(--round)}
.proto{background:var(--butter);color:#4A3500;font:600 12px/1 var(--round);padding:6px 11px;border-radius:999px}
.btn{font:600 13px/1 var(--round);border:1.5px solid var(--line);background:#F3F5FE;color:var(--ink);border-radius:12px;padding:0 12px;min-height:32px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px;height:calc(100vh - 110px);min-height:420px}
.side{position:relative;overflow:hidden}
.side canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.side h2{position:absolute;left:10px;top:6px;margin:0;font:700 15px/1.3 var(--round);background:rgba(255,255,255,.8);padding:2px 8px;border-radius:8px}
.empty-land{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font:600 15px/1.4 var(--round);color:var(--ink-2);background:rgba(255,255,255,.85);padding:8px 14px;border-radius:12px}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.note{padding:0 16px 6px;color:var(--ink-2);font-size:12.5px}
@media (max-width:900px){ .two{grid-template-columns:1fr;height:auto} .side{height:360px} }
</style>

<script>
(() => {
const SC = JSON.parse(document.getElementById('scenes-json').textContent);
const TERRAIN_LOOK = {
  grassland: { wild:'#8FC46B', ground:'#CBE8A9', path:'#E9D8AE' },
  mountain:  { wild:'#8CA084', ground:'#C9D0BE', path:'#D8D1C2' },
  desert:    { wild:'#DEBB74', ground:'#F4E0AE', path:'#D7B173' },
  forest:    { wild:'#3F7A3C', ground:'#A2CE8B', path:'#CFB68A' },
  coast:     { wild:'#9FD37E', ground:'#DAEEBB', path:'#F2E4B9' },
};
const ERA_ROAD = { village: null, town: '#A9A39A', city: '#5B5E68' };
const TRACK_COLOR = '#C9A874', TRACK_PAVED_COLOR = '#9C9C92', BEACH_COLOR = '#F5E2B2', PASS_COLOR = '#8C8C86',
  FOREST_FLOOR = '#243B24', ROCK_GREY = '#8A8A86', RAVINE_FLOOR = '#33312F', WATER_COLOR = '#3E86C4';
const h2r = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const rgbOf = hex => h2r(hex).map(v => v / 255);
function terrOfCell(view, X, Z){
  const key = Math.floor((X + 13) / 26) + ',' + Math.floor((Z + 13) / 26);
  return (view.territories || []).find(t => (t.slot[0] + ',' + t.slot[1]) === key) || null;
}
const terrAtOf = (view, X, Z) => { const t = terrOfCell(view, X, Z); return t ? t.terrain : 'grassland'; };
const roadColor = t => (t && ERA_ROAD[t.era || 'village']) || TERRAIN_LOOK[(t && t.terrain) || 'grassland'].path;
const trackColor = t => t && t.balance && t.balance.infra && t.balance.infra.state === 'healthy' ? TRACK_PAVED_COLOR : TRACK_COLOR;
const chAt = (view, X, Z) => { const r = Z - view.z0, c = X - view.x0; if (r < 0 || r >= view.h) return ' '; const row = view.rows[r] || ''; return c >= 0 && c < row.length ? row[c] : ' '; };
const isLand = ch => !' wsBk'.includes(ch);
const isWater = ch => ch === 'w' || ch === 's' || ch === 'B';

/* ================= TODAY: the page's groundGeometry / waterGeometry, as on main ================= */
function oldGround(view){
  const positions = [], colors = [], indices = [];
  const at = (X, Z) => chAt(view, X, Z);
  const gap = ch => ch === ' ' || ch === 'k';
  const cl = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const quad = (x0, y0, z0, x1, y1, z1, x2, y2, z2, x3, y3, z3, rgb) => {
    const base = positions.length / 3;
    positions.push(x0, y0, z0, x1, y1, z1, x2, y2, z2, x3, y3, z3);
    for (let i = 0; i < 4; i++) colors.push(rgb[0], rgb[1], rgb[2]);
    indices.push(base, base + 1, base + 2, base, base + 2, base + 3);
  };
  const jitter = (X, Z, rgb) => { const j = (Math.abs(Math.sin(X * 12.9898 + Z * 78.233) * 43758.5453) % 1 - .5) * .05; return [cl(rgb[0] + j), cl(rgb[1] + j), cl(rgb[2] + j)]; };
  const rock = rgbOf(ROCK_GREY);
  for (let r = 0; r < view.h; r++) for (let c = 0; c < view.w; c++) {
    const X = view.x0 + c, Z = view.z0 + r, ch = view.rows[r][c];
    if (ch === 'k') { quad(X, -1.2, Z + 1, X + 1, -1.2, Z + 1, X + 1, -1.2, Z, X, -1.2, Z, rgbOf(RAVINE_FLOOR)); continue; }
    if (!isLand(ch)) continue;
    const look = TERRAIN_LOOK[terrAtOf(view, X, Z)];
    const rgb = jitter(X, Z, ch === '.' ? rgbOf(look.wild) : ch === 'r' ? rgbOf(roadColor(terrOfCell(view, X, Z))) : ch === 't' ? rgbOf(trackColor(terrOfCell(view, X, Z))) :
      ch === 'b' ? rgbOf(BEACH_COLOR) : ch === 'm' ? rgbOf(PASS_COLOR) : ch === 'f' ? rgbOf(FOREST_FLOOR) : rgbOf(look.ground));
    quad(X, 0, Z + 1, X + 1, 0, Z + 1, X + 1, 0, Z, X, 0, Z, rgb);
    if (gap(at(X, Z - 1))) quad(X, 0, Z, X + 1, 0, Z, X + 1, -1, Z, X, -1, Z, rock);
    if (gap(at(X, Z + 1))) quad(X + 1, 0, Z + 1, X, 0, Z + 1, X, -1, Z + 1, X + 1, -1, Z + 1, rock);
    if (gap(at(X - 1, Z))) quad(X, 0, Z + 1, X, 0, Z, X, -1, Z, X, -1, Z + 1, rock);
    if (gap(at(X + 1, Z))) quad(X + 1, 0, Z, X + 1, 0, Z + 1, X + 1, -1, Z + 1, X + 1, -1, Z, rock);
    const bankY = -.3, b = [rgb[0] * .7, rgb[1] * .7, rgb[2] * .7];
    if (isWater(at(X, Z - 1))) quad(X, 0, Z, X + 1, 0, Z, X + 1, bankY, Z, X, bankY, Z, b);
    if (isWater(at(X, Z + 1))) quad(X + 1, 0, Z + 1, X, 0, Z + 1, X, bankY, Z + 1, X + 1, bankY, Z + 1, b);
    if (isWater(at(X - 1, Z))) quad(X, 0, Z + 1, X, 0, Z, X, bankY, Z, X, bankY, Z + 1, b);
    if (isWater(at(X + 1, Z))) quad(X + 1, 0, Z, X + 1, 0, Z + 1, X + 1, bankY, Z + 1, X + 1, bankY, Z, b);
  }
  return { positions, colors, indices };
}
function oldWater(view){
  const positions = [], colors = [], indices = [], rgb = rgbOf(WATER_COLOR);
  for (let r = 0; r < view.h; r++) for (let c = 0; c < view.w; c++) {
    if (!isWater(view.rows[r][c])) continue;
    const X = view.x0 + c, Z = view.z0 + r, base = positions.length / 3;
    positions.push(X, -.06, Z + 1, X + 1, -.06, Z + 1, X + 1, -.06, Z, X, -.06, Z);
    for (let i = 0; i < 4; i++) colors.push(...rgb);
    indices.push(base, base + 1, base + 2, base, base + 2, base + 3);
  }
  return { positions, colors, indices };
}

/* ================= NEW: smooth land (the tile grid stays hidden logic) ================= */
const SUB = 4;          // sample points per tile along each axis
const LAND_SIGMA = .55; // how round the outline is (tiles); small enough that 1-tile features survive
const COLOR_SIGMA = .8; // how soft colour borders are (tiles)
/* weighted share of tiles around (x, z) (tile centres at X+.5) that pass pred, gaussian falloff */
function fieldAt(view, pred, x, z, sigma){
  const X0 = Math.floor(x - .5), Z0 = Math.floor(z - .5), k = 1 / (2 * sigma * sigma);
  let s = 0, n = 0;
  for (let dz = -1; dz <= 2; dz++) for (let dx = -1; dx <= 2; dx++) {
    const X = X0 + dx, Z = Z0 + dz, ex = X + .5 - x, ez = Z + .5 - z, w = Math.exp(-(ex * ex + ez * ez) * k);
    n += w; if (pred(chAt(view, X, Z))) s += w;
  }
  return s / n;
}
function tileColor(view, X, Z, ch){
  const look = TERRAIN_LOOK[terrAtOf(view, X, Z)];
  return rgbOf(ch === '.' || ch === 't' ? look.wild : ch === 'b' ? BEACH_COLOR : ch === 'm' ? PASS_COLOR : ch === 'f' ? FOREST_FLOOR : look.ground);
}
/* ground colour at a point: gaussian mix of the land tiles' colours around it (no per-tile steps) */
function colorAt(view, x, z){
  const X0 = Math.floor(x - .5), Z0 = Math.floor(z - .5), k = 1 / (2 * COLOR_SIGMA * COLOR_SIGMA);
  let r = 0, g = 0, b = 0, n = 0;
  for (let dz = -2; dz <= 3; dz++) for (let dx = -2; dx <= 3; dx++) {
    const X = X0 + dx, Z = Z0 + dz, ch = chAt(view, X, Z);
    if (!isLand(ch)) continue;
    const ex = X + .5 - x, ez = Z + .5 - z, w = Math.exp(-(ex * ex + ez * ez) * k), c = tileColor(view, X, Z, ch);
    r += c[0] * w; g += c[1] * w; b += c[2] * w; n += w;
  }
  return n ? [r / n, g / n, b / n] : rgbOf(TERRAIN_LOOK.grassland.wild);
}
/* marching squares over a sampled field: fills where f >= .5 at height y; calls edge(P, Q) for every outline piece */
function contourMesh(view, pred, sigma, level, y, colorFn, edge){
  const positions = [], colors = [], indices = [];
  const nx = view.w * SUB + 1, nz = view.h * SUB + 1, x0 = view.x0, z0 = view.z0;
  const F = new Float32Array(nx * nz);
  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) F[j * nx + i] = fieldAt(view, pred, x0 + i / SUB, z0 + j / SUB, sigma) - level;
  const vid = new Map();
  const vert = (key, x, z) => {
    let id = vid.get(key);
    if (id === undefined) { id = positions.length / 3; vid.set(key, id); positions.push(x, y, z); colors.push(...colorFn(x, z)); }
    return id;
  };
  const corner = (i, j) => vert('c' + i + ',' + j, x0 + i / SUB, z0 + j / SUB);

/* ================= NEW: lanes — smooth curves along the road tiles' centre lines ================= */
const LANE_HALF = .32;
function lanePaths(view){

/* ================= two little scenes, one camera ================= */

  sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, far: 120 }); scene.add(sun);

const M = {
  hall: new THREE.MeshLambertMaterial({ color: '#E8D6B4' }), roof: new THREE.MeshLambertMaterial({ color: '#C8574A' }),
  house: new THREE.MeshLambertMaterial({ color: '#F2EBDD' }), tower: new THREE.MeshLambertMaterial({ color: '#9DB8FF' }),
  shop: new THREE.MeshLambertMaterial({ color: '#FFB08A' }), pine: new THREE.MeshLambertMaterial({ color: '#2F6B3A' }),
  tree: new THREE.MeshLambertMaterial({ color: '#4E9A45' }), trunk: new THREE.MeshLambertMaterial({ color: '#7A5A3A' }),
  rock: new THREE.MeshLambertMaterial({ color: '#9A9A95' }), deck: new THREE.MeshLambertMaterial({ color: '#9C7148' }),

function drawScene(v, view, smooth){

/* camera: shared by both sides */
const cam = { az: Math.PI / 4, el: 30 * Math.PI / 180, dist: 9, tx: 0, tz: 0 };
let scene = null, dmax = 60;
const SCENES = [
  { id: 'day0', label: '第 0 天（刚启动）', view: 'day0', at: t => [t.cx, t.cz + 2.2], dist: 9, note: '新仓库：一小块地 + 小市政厅，总督站在门口，镜头默认在市政厅前面。' },
  { id: 'river', label: '河 + 桥', view: 'demo', at: () => [10.5, .5], dist: 11, az: .9, note: '两块领地之间的河：河岸是弯的，小路弯着走上桥。' },
  { id: 'coast', label: '海岸', view: 'demo', at: () => [27, 12], dist: 16, az: .2, el: 38, note: '海岸线和沙滩是平滑曲线，不是台阶。' },
  { id: 'town', label: '城镇道路', view: 'demo', at: () => [26, 0], dist: 13, az: .6, el: 45, note: '城里的路是一条条带子，拐角是圆的；地块和房子还在原来的格子上。' },
  { id: 'all', label: '全景', view: 'demo', at: () => [0, 0], dist: 62, az: .7, el: 50, whole: true, note: '三块领地：草原（第 0 天）、海港（城市）、山地（小镇），中间是河和山口。' },
  { id: 'empty', label: '空世界', view: 'empty', at: () => [0, 0], dist: 9, note: '不在仓库里启动：一句话说明还没有领地；缩放照样能动（最小 2.5，最大 40），不画总督。' },

function setScene(s){

function draw(){
  for (const v of V) {
    const r = v.canvas.getBoundingClientRect(); const W = Math.max(1, r.width), H = Math.max(1, r.height);

const bar = document.getElementById('scenes');
for (const s of SCENES) { const b = document.createElement('button'); b.className = 'btn'; b.type = 'button'; b.dataset.id = s.id; b.textContent = s.label; b.onclick = () => setScene(s); bar.appendChild(b); bar.appendChild(document.createTextNode(' ')); }
const zoom = k => { cam.dist = Math.max(2.5, Math.min(dmax, cam.dist * Math.pow(1.35, k))); draw(); };
document.getElementById('zin').onclick = () => zoom(-1);
