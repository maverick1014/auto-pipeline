<title>Agent 办公楼</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one office floor fills the page; people list on the left, lift buttons on the right, a person's panel docks right */
:root{
  --paper:#ECF1FF; --panel:#FFFFFF; --panel-2:#F3F5FE; --ink:#2A2B45; --ink-2:#585D82; --ink-3:#8D91B3;
  --line:#DCE2F6; --sky:#CFE6FF; --berry:#FF7593; --berry-deep:#D9506E; --butter:#FFD36E; --butter-ink:#4A3500;
  --mint:#6FD4A8; --focus:#4D7CFE; --guide:#B9C1E2;
  --build-bg:#E1ECFF; --build-ink:#3160B5; --ask-bg:#FFE1E8; --ask-ink:#C2345A;
  --rest-bg:#DAF5E8; --rest-ink:#1E8657; --bgrun-bg:#ECE4FF; --bgrun-ink:#5A3EC8;
  --gov-bg:#FFF0C7; --gov-ink:#8A6000; --me-bg:#D9FDD3; --me-ink:#1F3D2B;
  --scrim:rgba(42,43,69,.32);
  --round:ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --display:"Fredoka",ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#13162A; --panel:#1C2040; --panel-2:#242951; --ink:#EEF0FF; --ink-2:#B0B5DB; --ink-3:#7B81AA;
  --line:#2D3360; --sky:#1B2046; --focus:#8FB0FF; --guide:#4A5290;
  --build-bg:#1E3160; --build-ink:#A9C6FF; --ask-bg:#4A1F33; --ask-ink:#FFB0C3;
  --rest-bg:#173D33; --rest-ink:#93E8C0; --bgrun-bg:#30265F; --bgrun-ink:#CDBEFF;
  --gov-bg:#43381A; --gov-ink:#FFDD8A; --me-bg:#144D37; --me-ink:#E3F7EA; --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#13162A; --panel:#1C2040; --panel-2:#242951; --ink:#EEF0FF; --ink-2:#B0B5DB; --ink-3:#7B81AA;
  --line:#2D3360; --sky:#1B2046; --focus:#8FB0FF; --guide:#4A5290;
  --build-bg:#1E3160; --build-ink:#A9C6FF; --ask-bg:#4A1F33; --ask-ink:#FFB0C3;
  --rest-bg:#173D33; --rest-ink:#93E8C0; --bgrun-bg:#30265F; --bgrun-ink:#CDBEFF;
  --gov-bg:#43381A; --gov-ink:#FFDD8A; --me-bg:#144D37; --me-ink:#E3F7EA; --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 var(--round);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}

/* header: one row */
.top{flex:none;display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.sign{flex:none;display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--ink);border-radius:18px;padding:5px 16px 5px 8px;box-shadow:0 3px 0 var(--ink)}
.sign svg{width:30px;height:30px;flex:none}
.sign-name{display:block;font:700 22px/1 var(--display);letter-spacing:.01em}
.sign-sub{display:block;font:600 10.5px/1.2 var(--mono);color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.stats{display:flex;gap:8px;min-width:0;overflow-x:auto;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{flex:none;display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px;color:var(--ink-2)}
.stat b{color:var(--ink);font:700 14px/1 var(--display);font-variant-numeric:tabular-nums}
.stat.wait{cursor:pointer;border-color:var(--berry);background:var(--ask-bg);color:var(--ask-ink)}
.stat.wait b{color:var(--ask-ink)}
.stat.wait:disabled{cursor:default;border-color:var(--line);background:var(--panel);color:var(--ink-3)}
.stat.wait:disabled b{color:var(--ink-3)}
.sd{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.top-r{margin-left:auto;display:flex;gap:8px;flex:none}
.btn{all:unset;cursor:pointer;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--panel);font:600 13px/1.2 var(--round);box-shadow:0 2px 0 var(--ink)}
.btn:hover{background:var(--panel-2)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.pri{background:var(--ink);color:var(--paper)}

/* stage */
.stage{position:relative;overflow:hidden;flex:1 1 0;min-height:0;--rail-w:300px;--msg-w:380px;--lift-w:168px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.dragging{cursor:grabbing}
.tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* people labels on the map */
.ptag{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transform:translate(-50%,-100%);will-change:transform;white-space:nowrap}
.ptag .nm{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1.5px solid var(--ink);border-radius:999px;padding:2px 9px 2px 6px;font:600 12px/1.25 var(--round);box-shadow:0 2px 0 rgba(42,43,69,.2)}
.ptag .rl{font:700 10px/1 var(--round);padding:2px 6px;border-radius:999px}
.rl.mgr{background:var(--gov-bg);color:var(--gov-ink)}
.rl.tm{background:var(--build-bg);color:var(--build-ink)}
.rl.helper{background:var(--rest-bg);color:var(--rest-ink)}
.rl.designer{background:var(--bgrun-bg);color:var(--bgrun-ink)}
.ptag .doing{font:500 11px/1.2 var(--round);color:var(--ink-2);background:color-mix(in srgb,var(--panel) 82%,transparent);padding:1px 7px;border-radius:7px}
.ptag .wk{font:600 10.5px/1 var(--mono);background:var(--ink);color:var(--paper);padding:3px 6px;border-radius:6px}
.ptag .bub{font:700 12px/1 var(--round);padding:5px 10px;border-radius:12px;background:var(--berry);color:#fff;box-shadow:0 2px 0 var(--berry-deep)}
.ptag .ico{font-size:18px;line-height:1;background:var(--panel);border:1.5px solid var(--ink);border-radius:50%;width:30px;height:30px;display:grid;place-items:center}
.ptag.sel .nm{background:var(--ink);color:var(--paper)}
.ptag.far .doing{display:none}

/* floor sign */
.floorsign{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:3;display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:5px 14px 5px 6px;box-shadow:0 3px 0 rgba(42,43,69,.18);white-space:nowrap}
.floorsign .fno{font:700 18px/1 var(--display);background:var(--ink);color:var(--paper);border-radius:9px;padding:5px 8px}
.floorsign .frn{font:700 15px/1 var(--display)}
.floorsign .frs{font:500 12px/1 var(--round);color:var(--ink-3)}
.rc{width:10px;height:10px;border-radius:50%;background:var(--rc);flex:none;display:inline-block}

/* rail (people list) */
.rail{position:absolute;left:12px;top:12px;z-index:4;width:var(--rail-w);max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(42,43,69,.18);overflow:hidden;transition:transform .25s ease}
.rail-head{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-bottom:1.5px solid var(--line);font-weight:700;font-size:13px}
.rail-head .n{font:600 12px/1 var(--mono);color:var(--ink-3)}
.fold{all:unset;cursor:pointer;margin-left:auto;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2);font:700 14px/1 var(--round)}
.fold:hover{background:var(--panel-2);color:var(--ink)}
.rail-body{overflow-y:auto;padding:4px 6px 8px}
.grp{padding:4px 0}
.grp+.grp{border-top:1.5px dashed var(--line)}
.grp-h{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:7px;padding:6px 6px 4px;border-radius:8px;font:700 12px/1.2 var(--mono);color:var(--ink-2)}
.grp-h:hover{background:var(--panel-2)}
.grp-h .fl{font:700 12px/1 var(--display);background:var(--panel-2);border:1.5px solid var(--line);border-radius:6px;padding:2px 5px;color:var(--ink)}
.grp.cur .grp-h .fl{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grp-h .n{margin-left:auto;color:var(--ink-3);font-weight:600;display:inline-flex;gap:5px;align-items:center}
.you{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--berry);color:#fff;font:700 11px/1 var(--round);box-sizing:border-box}
.tree{list-style:none;margin:0;padding:0}
.tree .tree{padding-left:14px}
.tree li{position:relative}
.tree .tree>li::before{content:"";position:absolute;left:-8px;top:0;bottom:0;border-left:1.5px solid var(--guide)}
.tree .tree>li:last-child::before{bottom:auto;height:13px}
.tree .tree>li::after{content:"";position:absolute;left:-8px;top:13px;width:7px;border-top:1.5px solid var(--guide)}
.rrow{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;align-items:flex-start;gap:6px;padding:3px 6px;border-radius:8px;font-size:12.5px;line-height:1.35}
.rrow:hover{background:var(--panel-2)}
.rrow[aria-current="true"]{background:var(--ink);color:var(--paper)}
.rrow .sd{margin-top:5px}
.rrow .rn{min-width:0;flex:1 1 auto;overflow-wrap:anywhere}
.rrow .rs{flex:none;font-size:11.5px;color:var(--ink-3)}
.rrow[aria-current="true"] .rs{color:inherit;opacity:.8}
.rrow .wk{flex:none;font:600 10px/1 var(--mono);border:1.5px solid currentColor;border-radius:5px;padding:2px 4px;opacity:.75;margin-top:1px}
.empty-line{font-size:12px;color:var(--ink-3);padding:2px 6px 4px 22px}
.rail-tab{position:absolute;left:0;top:12px;z-index:4;display:none;align-items:center;gap:6px;padding:8px 10px 8px 8px;background:var(--panel);border:2px solid var(--ink);border-left:none;border-radius:0 12px 12px 0;cursor:pointer;font:700 12px/1 var(--round)}
.stage.rail-folded .rail{transform:translateX(calc(-100% - 20px))}
.stage.rail-folded .rail-tab{display:inline-flex}

/* lift buttons */
.lift{position:absolute;right:12px;top:12px;z-index:4;width:var(--lift-w);display:flex;flex-direction:column;background:var(--ink);color:var(--paper);border-radius:16px;padding:8px;gap:6px;box-shadow:0 4px 0 rgba(42,43,69,.25);transition:right .25s ease;max-height:calc(100% - 96px);overflow-y:auto;box-sizing:border-box}
.lift-h{display:flex;align-items:center;justify-content:space-between;font:700 12px/1 var(--round);padding:2px 4px 4px;opacity:.85}
.lift-h .arw{font:700 11px/1 var(--mono);opacity:.7}
.lb{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.14)}
.lb:hover{background:rgba(255,255,255,.16)}
.lb[aria-current="true"]{background:var(--butter);color:var(--butter-ink);border-color:var(--butter)}
.lb .no{font:700 16px/1 var(--display);min-width:28px}
.lb .ln{min-width:0;font:600 11.5px/1.2 var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .lc{display:inline-flex;gap:4px;align-items:center;font:600 11px/1 var(--mono);opacity:.85}
.stage.has-panel .lift{right:calc(var(--msg-w) + 24px)}

/* zoom buttons */
.cam{position:absolute;right:12px;bottom:12px;z-index:4;display:flex;gap:6px;transition:right .25s ease}
.cam .btn{width:38px;height:38px;padding:0;justify-content:center;font-size:16px}
.stage.has-panel .cam{right:calc(var(--msg-w) + 24px)}

/* prototype strip */
.proto{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:8px;background:var(--butter);color:var(--butter-ink);padding:6px 6px 6px 12px;border-radius:999px;box-shadow:0 2px 0 rgba(42,43,69,.18);font:600 12px/1 var(--display);white-space:nowrap}
.proto button{all:unset;cursor:pointer;background:rgba(255,255,255,.65);color:var(--butter-ink);padding:6px 10px;border-radius:999px;font:600 12px/1 var(--round)}
.proto button:hover{background:#fff}

/* person panel */
.panel{position:absolute;right:12px;top:12px;bottom:12px;z-index:5;width:var(--msg-w);display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(42,43,69,.18);overflow:hidden}
.p-head{display:flex;align-items:flex-start;gap:8px;padding:10px 10px 8px 14px;border-bottom:1.5px solid var(--line)}
.p-title{min-width:0;flex:1}
.p-name{font:700 16px/1.25 var(--display);overflow-wrap:anywhere}
.p-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--round);padding:4px 8px;border-radius:999px}
.st-busy{background:var(--build-bg);color:var(--build-ink)}
.st-wait{background:var(--ask-bg);color:var(--ask-ink)}
.st-idle{background:var(--rest-bg);color:var(--rest-ink)}
.st-bg{background:var(--bgrun-bg);color:var(--bgrun-ink)}
.sd.st-busy{background:var(--build-ink)} .sd.st-wait{background:var(--berry)} .sd.st-idle{background:var(--rest-ink)} .sd.st-bg{background:var(--bgrun-ink)}
.x{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:9px;font:700 18px/1 var(--round);color:var(--ink-2)}
.x:hover{background:var(--panel-2);color:var(--ink)}
.p-facts{padding:8px 14px;display:grid;gap:3px;font-size:12.5px;color:var(--ink-2);border-bottom:1.5px solid var(--line)}
.p-facts b{color:var(--ink);font-weight:600}
.p-note{font-size:12px;color:var(--ink-3)}
.card{margin:10px 12px 0;border:2px solid var(--berry);background:var(--ask-bg);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.card-h{font:700 12px/1 var(--round);color:var(--ask-ink)}
.card-q{font-weight:600;color:var(--ink)}
.opt{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.opt input{margin-top:3px}
.rec{font:600 10.5px/1 var(--round);background:var(--rest-bg);color:var(--rest-ink);padding:3px 6px;border-radius:999px;margin-left:4px;white-space:nowrap}
.card .done{font-weight:700;color:var(--rest-ink)}
.hist{flex:1 1 auto;min-height:60px;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:6px}
.h-t{font:600 11px/1 var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.hl{font-size:12.5px;color:var(--ink-2);display:flex;gap:8px}
.hl time{font:500 11px/1.6 var(--mono);color:var(--ink-3);flex:none}
.msg{align-self:flex-start;max-width:88%;background:var(--panel-2);border-radius:12px 12px 12px 4px;padding:6px 10px;font-size:13px}
.msg.me{align-self:flex-end;background:var(--me-bg);color:var(--me-ink);border-radius:12px 12px 4px 12px}
.msg .ms{display:block;font:500 10.5px/1.2 var(--round);opacity:.7;margin-top:2px;text-align:right}
.reply{display:flex;gap:8px;padding:10px 12px;border-top:1.5px solid var(--line);align-items:flex-end}
.reply textarea{flex:1;min-width:0;resize:none;height:38px;box-sizing:border-box;border:1.5px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink);font:13px/1.4 var(--round);padding:8px 10px}
.reply .hint{font-size:12px;color:var(--ink-3)}

/* repo picker */
.sheet-bg{position:absolute;inset:0;z-index:8;background:var(--scrim);display:grid;place-items:center;padding:16px}
.sheet{width:min(440px,100%);max-height:100%;overflow:auto;background:var(--panel);border:2px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 rgba(42,43,69,.25);box-sizing:border-box}
.sh-h{padding:14px 16px 6px;font:700 18px/1.2 var(--display)}
.sh-sub{padding:0 16px 10px;font-size:13px;color:var(--ink-2)}
.pk{list-style:none;margin:0;padding:0 10px}
.pk li{display:grid;grid-template-columns:auto auto 1fr auto auto;align-items:center;gap:10px;padding:8px 6px;border-top:1.5px solid var(--line)}
.pk input{width:18px;height:18px;accent-color:var(--ink);margin:0}
.pk label{min-width:0;cursor:pointer;display:grid}
.pk .pn{font:600 14px/1.2 var(--mono);overflow-wrap:anywhere}
.pk .ps{font-size:12px;color:var(--ink-3)}
.pk .pf{font:700 13px/1 var(--display);background:var(--panel-2);border:1.5px solid var(--line);border-radius:6px;padding:3px 6px}
.pk .mv{display:flex;gap:4px}
.pk .mv button{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:8px;font:700 13px/1 var(--round)}
.pk .mv button:disabled{opacity:.3;cursor:default}
.pk .mv button:not(:disabled):hover{background:var(--panel-2)}
.pk .des{color:var(--ink-2)}
.redo{all:unset;cursor:pointer;color:var(--focus);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.sh-f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px 14px;border-top:1.5px solid var(--line);font-size:12.5px;color:var(--ink-3)}

/* log */
.logpop{position:absolute;top:12px;left:calc(var(--rail-w) + 24px);z-index:7;width:min(340px,calc(100% - 24px));max-height:50%;overflow:auto;background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:10px 12px;box-shadow:0 4px 0 rgba(42,43,69,.18);box-sizing:border-box}
.logpop .hl{padding:2px 0}


/* outside view */
.ftag{all:unset;position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1.5px solid var(--ink);border-radius:10px;padding:4px 9px 4px 5px;font:600 12px/1.2 var(--round);box-shadow:0 2px 0 rgba(42,43,69,.2);white-space:nowrap;will-change:transform}
.ftag:hover{background:var(--panel-2)}
.ftag b{font:700 13px/1 var(--display);background:var(--ink);color:var(--paper);border-radius:6px;padding:3px 5px}
.ftag .fr{font-family:var(--mono)}
.ftag .fd{color:var(--ink-2);font-weight:500}
.ftag .fc{color:var(--ink-3);font:600 11px/1 var(--mono)}
.doorhint{all:unset;position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;background:var(--butter);color:var(--butter-ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font:700 14px/1 var(--display);box-shadow:0 3px 0 var(--ink);white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{margin-top:-6px}}
.stage.outside .proto button{display:none}
.lb.gnd{margin-top:4px;border-style:dashed}
@media (prefers-reduced-motion:reduce){ .doorhint{animation:none} }


/* floor design popover */
.fedit{all:unset;cursor:pointer;font:600 12px/1 var(--round);padding:5px 9px;border-radius:8px;background:var(--panel-2);border:1.5px solid var(--line);color:var(--ink)}
.fedit:hover{border-color:var(--ink)}
.floorsign{pointer-events:auto}
.dpop{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:7;width:min(380px,calc(100% - 24px));max-height:calc(100% - 80px);overflow:auto;background:var(--panel);border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(42,43,69,.18);padding:10px 12px 12px;box-sizing:border-box;display:grid;gap:9px}
.dp-h{display:flex;align-items:center;gap:8px}
.dp-h b{font:700 15px/1.2 var(--display)}
.dp-h span{font-size:12px;color:var(--ink-3);flex:1;min-width:0}
.dp-sw{display:flex;flex-wrap:wrap;gap:6px}
.sw{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-2)}
.sw i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);display:inline-block}
.dp-dec{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dp-dec span{display:grid;gap:2px;background:var(--panel-2);border-radius:9px;padding:6px 8px;font-weight:600;font-size:12.5px}
.dp-dec small{font-weight:500;font-size:10.5px;color:var(--ink-3)}
.dp-l{font-size:12.5px;font-weight:600}

/* ---------------- walk grid ---------------- */
const CELL = 0.4, N = 35, ORG = -7;
let blocked = new Uint8Array(N*N);
function resetGrid(){
  blocked = new Uint8Array(N*N);
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){
    const cx = ORG+(i+.5)*CELL, cz = ORG+(j+.5)*CELL;
    if(Math.abs(cx) > 6.55 || Math.abs(cz) > 6.55) blocked[j*N+i] = 1;
  }
}
function blockRect(x1,z1,x2,z2,pad){
  pad = pad == null ? 0.18 : pad;
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){
    const cx = ORG+(i+.5)*CELL, cz = ORG+(j+.5)*CELL;
    if(cx >= x1-pad && cx <= x2+pad && cz >= z1-pad && cz <= z2+pad) blocked[j*N+i] = 1;
  }
}
const cl = v => Math.max(0, Math.min(N-1, v));
const cellOf = (x,z) => [cl(Math.floor((x-ORG)/CELL)), cl(Math.floor((z-ORG)/CELL))];
const isB = (i,j) => i<0||j<0||i>=N||j>=N||blocked[j*N+i]===1;
function nearestFree(i,j){
  if(!isB(i,j)) return [i,j];
  for(let r=1;r<12;r++){
    let best=null, bd=1e9;
    for(let di=-r;di<=r;di++) for(let dj=-r;dj<=r;dj++){
      if(Math.max(Math.abs(di),Math.abs(dj))!==r) continue;
      if(!isB(i+di,j+dj)){ const d=di*di+dj*dj; if(d<bd){bd=d;best=[i+di,j+dj];} }
    }
    if(best) return best;
  }
  return [i,j];
}
function astar(s, g){
  const key = (i,j) => j*N+i;
  const open = [[0, s[0], s[1]]], gs = new Float32Array(N*N).fill(1e9), from = new Int32Array(N*N).fill(-1), closed = new Uint8Array(N*N);
  gs[key(s[0],s[1])] = 0;
  const hfn = (i,j) => { const dx=Math.abs(i-g[0]), dy=Math.abs(j-g[1]); return Math.max(dx,dy)+0.414*Math.min(dx,dy); };
  while(open.length){
    let bi=0; for(let k=1;k<open.length;k++) if(open[k][0]<open[bi][0]) bi=k;
    const [, i, j] = open.splice(bi,1)[0];
    const kk = key(i,j); if(closed[kk]) continue; closed[kk]=1;
    if(i===g[0] && j===g[1]){
      const out=[]; let c=kk; while(c!==-1){ out.push([c%N, Math.floor(c/N)]); c=from[c]; } return out.reverse();
    }
    for(let di=-1;di<=1;di++) for(let dj=-1;dj<=1;dj++){
      if(!di && !dj) continue; const ni=i+di, nj=j+dj; if(isB(ni,nj)) continue;
      if(di && dj && (isB(i+di,j) || isB(i,j+dj))) continue;
      const nk = key(ni,nj), ng = gs[kk] + (di&&dj?1.414:1);
      if(ng < gs[nk]){ gs[nk]=ng; from[nk]=kk; open.push([ng+hfn(ni,nj), ni, nj]); }
    }
  }
  return null;
}
function los(a, b){
  const dx=b.x-a.x, dz=b.z-a.z, L=Math.hypot(dx,dz); if(L<0.01) return true;
  for(let t=0.45; t<L-0.45; t+=0.15){
    const c = cellOf(a.x+dx*t/L, a.z+dz*t/L); if(isB(c[0],c[1])) return false;
  }
  return true;
}
function findPath(from, to){
  const s = nearestFree(...cellOf(from.x, from.z)), g = nearestFree(...cellOf(to.x, to.z));
  const cells = astar(s, g);
  const pts = [{x:from.x, z:from.z}];
  if(cells) cells.forEach(c => pts.push({x:ORG+(c[0]+.5)*CELL, z:ORG+(c[1]+.5)*CELL}));
  pts.push({x:to.x, z:to.z});
  const out = [pts[0]]; let i = 0;
  while(i < pts.length-1){
    let j = pts.length-1; while(j > i+1 && !los(pts[i], pts[j])) j--;
    out.push(pts[j]); i = j;
  }

function makeWall(def, p){
  const g = new THREE.Group(); p.add(g);

  const mWall = own(C.wall, 1), mGlass = own(C.glass, 0.28), mFrame = own(C.frame, 1);

  const add = (m, w, h, d, x, y, z) => { const o = new THREE.Mesh(BOXG, m); o.scale.set(w,h,d); o.position.set(x,y,z); o.userData.own = true; g.add(o); return o; };
  add(mWall, def.w, 0.5, def.d, def.x, 0.25, def.z);
  const glass = add(mGlass, horiz?def.w:0.06, 1.85, horiz?0.06:def.d, def.x, 1.425, def.z);
  const beam = add(mFrame, def.w, 0.2, def.d, def.x, 2.45, def.z);
  const mulls = [];
  const L = horiz ? def.w : def.d;
  for(let t=-L/2; t<=L/2+0.01; t+=L/8){
    mulls.push(horiz ? add(mFrame, 0.1, 1.85, 0.12, def.x+t, 1.425, def.z) : add(mFrame, 0.12, 1.85, 0.1, def.x, 1.425, def.z+t));

  return {def, g, mGlass, mFrame, upper:[glass, beam].concat(mulls), f:0};
}

const wait = ms => new Promise(r => setTimeout(r, ms));
function goHome(p){ return walkTo(p, homeOf(p)); }
const angLerp = (a, b, t) => { let d = ((b - a + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI; return a + d*t; };

function animPerson(p, dt, T){
  const spd = reduce ? 0.5 : 1;
  if(p.path.length){
    p.mode = 'walk';
    const tgt = p.path[0], pos = p.g.position, dx = tgt.x-pos.x, dz = tgt.z-pos.z, L = Math.hypot(dx,dz), step = 1.55*dt;
    if(L <= step){ pos.x = tgt.x; pos.z = tgt.z; p.path.shift(); }
    else { pos.x += dx/L*step; pos.z += dz/L*step; p.yaw = angLerp(p.yaw, Math.atan2(dx,dz), Math.min(1, dt*10)); }
    if(!p.path.length){
      p.mode = 'stand'; p.sit = !!(p.goal && p.goal.sit);
      if(p.goal){ p.g.position.set(p.goal.x, 0, p.goal.z); }
      const cb = p.onArrive; p.onArrive = null; if(cb) cb();
    }
  } else if(p.goal){ p.yaw = angLerp(p.yaw, p.goal.yaw, Math.min(1, dt*6)); }
  p.g.rotation.y = p.yaw;
  const L = p.legs, A = p.arms, st = p.d.state;
  let hip = 0, knee = 0, by = 0, a0 = 0, a1 = 0, az = 0;
  if(p.mode === 'walk'){
    const s = Math.sin(T*8.5*spd + p.ph);
    L[0].hip.rotation.x = s*0.55; L[1].hip.rotation.x = -s*0.55;
    L[0].knee.rotation.x = Math.max(0, s)*0.6; L[1].knee.rotation.x = Math.max(0, -s)*0.6;
    a0 = -s*0.45; a1 = s*0.45; by = Math.abs(s)*0.035;
  } else {
    if(p.sit){ hip = -Math.PI/2; knee = Math.PI/2; by = -0.12; }
    L[0].hip.rotation.x = L[1].hip.rotation.x = hip; L[0].knee.rotation.x = L[1].knee.rotation.x = knee;
    const talking = p.iconUntil > T;
    if(talking){ a0 = -0.55 + Math.sin(T*5*spd)*0.25; a1 = -0.35 + Math.sin(T*4*spd+1)*0.2; }
    else if(st === 'busy' && p.sit){ a0 = -1.05 + Math.sin(T*15*spd)*0.08; a1 = -1.05 + Math.sin(T*15*spd+Math.PI)*0.08; }
    else if(st === 'bg' && p.sit){ a0 = -0.9; a1 = -0.9; }
    else if(p.press > T){ a0 = -1.45; }
    else if(st === 'wait'){ a0 = -2.75 + Math.sin(T*3*spd)*0.12; az = -0.25; a1 = 0; }
    else if(p.sit){ a0 = -0.35; a1 = -0.35; }
    else { a0 = Math.sin(T*1.2+p.ph)*0.04; a1 = -a0; by += Math.sin(T*1.6+p.ph)*0.006; }
  }
  A[0].rotation.x = a0; A[1].rotation.x = a1; A[0].rotation.z = az;
  p.body.position.y = by;
  // idle people take a short stroll now and then
  if(st === 'idle' && p.d.role !== 'mgr' && !p.path.length && p.iconUntil < T && T > p.nextIdle){
    p.nextIdle = T + 14 + (hash(p.d.id) % 9);
    if(Math.random() < 0.5){
      const free = PANTRY.filter(s => !people.some(q => q !== p && q.goal === s));
      if(free.length) walkTo(p, free[Math.floor(Math.random()*free.length)]);
    }
  }
}

const cam = {yaw:-0.62, pitch:0.86, dist:21, target:new THREE.Vector3(0,0,0.3), follow:null, wantDist:null};
function fitDist(){ const r = stage.getBoundingClientRect(); return r.width / Math.max(1, r.height) < 0.9 ? 31 : 21; }
function resetView(){ cam.yaw = -0.62; cam.pitch = 0.86; cam.wantDist = fitDist(); const sh = innerWidth > 720 ? 1.2 : 0; cam.target.set(-Math.cos(cam.yaw)*sh, 0, 0.3 + Math.sin(cam.yaw)*sh); stopFollow(); }
function updateCamera(){
  const tw = stepTween();
  if(!tw && cam.follow){
    const p = people.find(q => q.d.id === cam.follow);
    if(p){ cam.target.x += (p.g.position.x - cam.target.x)*0.08; cam.target.z += (p.g.position.z - cam.target.z)*0.08; cam.target.y += (0.9 - cam.target.y)*0.08; }
  }
  if(!tw && cam.wantDist != null){ cam.dist += (cam.wantDist - cam.dist)*0.08; if(Math.abs(cam.wantDist-cam.dist) < 0.05) cam.wantDist = null; }
  const cp = Math.cos(cam.pitch);
  camera.position.set(cam.target.x + Math.sin(cam.yaw)*cp*cam.dist, cam.target.y + Math.sin(cam.pitch)*cam.dist, cam.target.z + Math.cos(cam.yaw)*cp*cam.dist);
  camera.lookAt(cam.target);
}
function stopFollow(){ cam.follow = null; }
function updateWalls(dt){
  const dx = camera.position.x - cam.target.x, dz = camera.position.z - cam.target.z, L = Math.hypot(dx,dz) || 1;
  walls.forEach(w => {

}

  if(!drag.moved && Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) > 8){ drag.moved = true; cv.classList.add('dragging'); }
  if(drag.moved){ tween = null; cam.yaw -= dx*0.006; cam.pitch = view === 'outside' ? Math.max(0.04, Math.min(1.0, cam.pitch + dy*0.005)) : Math.max(0.32, Math.min(1.3, cam.pitch + dy*0.005)); }
});

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e){
  const r = cv.getBoundingClientRect();

  ray.setFromCamera(ndc, camera);
  if(view === 'outside'){
    const h = ray.intersectObjects(OUT.hits, false)[0];
    if(h && h.object.userData.door) enter(); else if(h && h.object.userData.floor) enter(h.object.userData.floor);
    return;
  }
  const hit = ray.intersectObjects(people.map(p => p.hit), false)[0];
  if(hit){ select(hit.object.userData.pid); return; }
  let best = null, bd = 28;
  people.forEach(p => {
    p.body.getWorldPosition(v3); v3.y += 0.9; v3.project(camera);
    const x = (v3.x*0.5+0.5)*r.width + r.left, y = (-v3.y*0.5+0.5)*r.height + r.top, d = Math.hypot(x-e.clientX, y-e.clientY);

}

/* ---------------- repo picker ---------------- */
function openPicker(){ renderPicker(); $('#pickBg').hidden = false; setTimeout(() => { const f = $('#pickSheet input'); if(f) f.focus(); }, 0); }
function closePicker(){ $('#pickBg').hidden = true; }
function desLine(id, isOn){
  const d = DESIGN[id];
  if(d && d.st === 'running') return `<span class="ps des">装修中…</span>`;
  if(!isOn) return `<span class="ps des">勾上后会问你要不要装修</span>`;
  const t = theme(id);
  return `<span class="ps des">${t === BASE_TH ? '还没装修' : '装修：' + esc(t.name)} · <button type="button" class="redo" data-redo="${esc(id)}">${t === BASE_TH ? '装修' : '重新装修'}</button></span>`;
}
function renderPicker(){
  const on = order.slice().reverse(), off = REPOS.map(r => r.id).filter(id => !order.includes(id));
  const li = (id, isOn) => {
    const n = P.filter(d => d.repo === id).length, i = order.indexOf(id);
    return `<li><input type="checkbox" id="pk-${esc(id)}" data-id="${esc(id)}" ${isOn?'checked':''} ${isOn && order.length===1?'disabled':''}>
      <i class="rc" style="--rc:${repo(id).color}"></i>
      <label for="pk-${esc(id)}"><span class="pn">${esc(id)}</span><span class="ps">${n} 个 session 在线${isOn?'':' · 不在楼里'}</span>${desLine(id, isOn)}</label>
      ${isOn?`<span class="pf">${i+1}F</span><span class="mv"><button type="button" data-up="${esc(id)}" aria-label="上移一层" ${i===order.length-1?'disabled':''}>↑</button><button type="button" data-down="${esc(id)}" aria-label="下移一层" ${i===0?'disabled':''}>↓</button></span>`:'<span></span><span></span>'}</li>`;
  };
  $('#pickSheet').innerHTML = `<div class="sh-h" id="pickTitle">选楼层</div>
    <div class="sh-sub">勾几个 repo，楼就有几层。一个 repo 一层，新勾的放在最上面。新 repo 进楼就像新公司搬进来：会问你自己装修，还是请室内设计师。</div>
    <ul class="pk">${on.map(id => li(id,true)).join('')}${off.map(id => li(id,false)).join('')}</ul>
    <div class="sh-f"><span>${order.length} 层 · 至少留一层</span><button class="btn pri" id="pickDone" type="button">完成</button></div>`;
  $('#pickSheet').querySelectorAll('input[type=checkbox]').forEach(c => c.onchange = () => {
    const id = c.dataset.id;
    if(c.checked){ order.push(id); log(`${id} 进楼了：${order.length}F`); if(!DESIGN[id] && !OVR[id]){ afterOrder(); closePicker(); askRenovate(id); return; } }
    else if(order.length > 1){ order = order.filter(x => x !== id); log(`${id} 出楼了`); }
    afterOrder(); renderPicker();
  });
  $('#pickSheet').querySelectorAll('[data-up],[data-down]').forEach(b => b.onclick = () => {
    const id = b.dataset.up || b.dataset.down, i = order.indexOf(id), j = b.dataset.up ? i+1 : i-1;
    if(j < 0 || j >= order.length) return;
    [order[i], order[j]] = [order[j], order[i]]; afterOrder(); renderPicker();
  });
  $('#pickDone').onclick = closePicker;
  $('#pickSheet').querySelectorAll('[data-redo]').forEach(b => b.onclick = e => { e.preventDefault(); closePicker(); askRenovate(b.dataset.redo); });
}
function afterOrder(){
  if(!order.includes(cur)){ cur = order[order.length-1]; sel = null; }
  if(sel && !shown(P.find(d => d.id === sel))) sel = null;
  if(view === 'outside') buildOutside(); else buildFloor(); renderAll();
}

const pOf = d => people.find(q => q.d === d);
async function liftOut(p, k, bid){
  await walkTo(p, LIFT_CALL); if(bid !== buildId) return false;
  p.press = T + 0.8; p.icon = '⏳'; p.iconUntil = T + 2.0;
  await wait(1400); if(bid !== buildId) return false;
  doors[k].goal = 1; await wait(550); if(bid !== buildId) return false;
  await walkTo(p, LIFT_IN[k]); if(bid !== buildId) return false;
  doors[k].goal = 0; await wait(450); if(bid !== buildId) return false;
  p.g.visible = false; return true;
}
async function liftIn(p, k, bid){
  place(p, LIFT_IN[k]); p.g.visible = false; doors[k].goal = 1;
  await wait(500); if(bid !== buildId) return false;
  p.g.visible = true; await walkTo(p, LIFT_OUT[k]); doors[k].goal = 0; return bid === buildId;
}

function saveDiy(){

  COLOR_ZH.forEach(([k]) => o[k] = $('#dy-'+k).value.toUpperCase());

  if(!o.name) bad.push('名字不能空');

  FLOOR_KEYS.forEach(([k,z]) => { const h = {}; new THREE.Color(o[k]).getHSL(h); const L = Math.round(h.l*100); if(L < 55 || L > 95) bad.push(`${z}的亮度是 ${L}%，要在 55%–95% 之间`); });

function hireDesigner(id){

  const arrive = () => {
    const p = pOf(d);
    if(p){ place(p, LIFT_IN[1]); p.g.visible = false; doors[1].goal = 1; setTimeout(() => { p.g.visible = true; walkTo(p, {x:-0.25, z:-4.6, yaw:Math.PI*0.75}).then(() => { doors[1].goal = 0; }); }, reduce ? 0 : 600); }

      <button type="button" class="btn" id="abRot" ${selName ? '' : 'disabled'}>⟳ 转向</button>
      <button type="button" class="btn" id="abDel" ${selName && !(ARR.L.items[ARR.sel].k === 'meet') ? '' : 'disabled'}>拿走</button>
      <select id="abAdd" class="btn"><option value="">＋ 加一件…</option><option value="tm">经理桌</option><option value="helper">助理桌</option><option value="plant">植物</option>${Object.keys(DECOR_ZH).map(k => `<option value="decor:${k}">摆设 · ${DECOR_ZH[k]}</option>`).join('')}</select>
    </div>
    <div class="ab-row">
      <button type="button" class="btn" id="abUndo" ${ARR.hist.length ? '' : 'disabled'}>撤销</button>
      <button type="button" class="btn" id="abReset">恢复默认</button>
      <span class="sp"></span>
      <button type="button" class="btn" id="abCancel">取消</button>
      <button type="button" class="btn pri" id="abDone">完成，保存</button>
    </div>`;
  $('#abRot').onclick = arrRotate; $('#abDel').onclick = arrRemove; $('#abUndo').onclick = arrUndo; $('#abReset').onclick = arrReset;
  $('#abCancel').onclick = () => leaveArrange(false); $('#abDone').onclick = () => leaveArrange(true);
  $('#abAdd').onchange = e => { const v = e.target.value; if(!v) return; if(v.startsWith('decor:')) arrAdd('decor', v.slice(6)); else arrAdd(v); };
}
/* pointer: in the mode a press on a piece drags it (snapped to 0.2), a tap selects it; elsewhere the camera turns as before */
const floorPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0), hitPt = new THREE.Vector3();
function arrRay(e){ const r = cv.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc, camera); }
cv.addEventListener('pointerdown', e => {
  if(!ARR || view !== 'inside' || pts.size > 1) return;
  arrRay(e); const h = ray.intersectObjects(ARR.hits, false)[0];
  if(!h) return;
  const i = h.object.userData.item, it = ARR.L.items[i];
  ray.ray.intersectPlane(floorPlane, hitPt);
  ARR.dragI = {i, prev: clone(ARR.L), dx: it.x - hitPt.x, dz: it.z - hitPt.z, moved:false, sx:e.clientX, sy:e.clientY};
  drag = null; e.stopImmediatePropagation();
}, true);
cv.addEventListener('pointermove', e => {
  if(!ARR || !ARR.dragI) return;
  const d = ARR.dragI; if(!d.moved && Math.hypot(e.clientX-d.sx, e.clientY-d.sy) < 6) return;
  d.moved = true; arrRay(e); if(!ray.ray.intersectPlane(floorPlane, hitPt)) return;
  const it = ARR.L.items[d.i]; it.x = snap2(hitPt.x + d.dx); it.z = snap2(hitPt.z + d.dz);
  if(it._g) it._g.position.set(it.x, 0, it.z);
  const c = checkLayout(ARR.L); ARR.sel = d.i; ARR.err = !c.ok; ARR.badI = c.ok ? null : d.i; ARR.msg = c.ok ? '这里可以放' : '这里不行：' + c.why;
  renderArrBar(); e.stopImmediatePropagation();
}, true);
window.addEventListener('pointerup', e => {
  if(!ARR || !ARR.dragI) return;
  const d = ARR.dragI; ARR.dragI = null;
  if(!d.moved){ ARR.sel = d.i; ARR.msg = `选中了「${itemName(ARR.L, d.i)}」：可以拖、转向（R）或拿走（Delete）`; ARR.err = false; buildFloor(); renderArrBar(); return; }
  const now = ARR.L; ARR.L = d.prev; const prev = clone(ARR.L); ARR.L = now; arrCommit(prev, `「${itemName(ARR.L, d.i)}」放好了`);
}, true);
document.addEventListener('keydown', e => {
  if(!ARR || /INPUT|SELECT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName)) return;
  if(e.key === 'r' || e.key === 'R') arrRotate(); else if(e.key === 'Delete' || e.key === 'Backspace') arrRemove(); else if(e.key === 'Escape') leaveArrange(false);
});

/* ---------------- loop ---------------- */
function renderAll(){ renderRail(); renderLift(); renderCounts(); renderFloorSign(); if(sel) renderPanel(); else { $('#panel').hidden = true; stage.classList.remove('has-panel'); } }
let last = performance.now(), T = 0;
function frame(t){
  const dt = Math.min(0.05, (t - last)/1000); last = t; T += dt;
  if(!reduce && $('#pickBg').hidden && view === 'inside' && !tween) cam.yaw += dt*(Math.PI*2/300);
  OUT.open += (OUT.goal - OUT.open)*Math.min(1, dt*5); OUT.doors.forEach(d => { d.o.position.x = d.dx + Math.sign(d.dx)*OUT.open*1.05; });
  updateCamera(); updateWalls(dt);
  people.forEach(p => animPerson(p, dt, T));
  if(!reduce) ANIMS.forEach(f => f(dt, T));
  doors.forEach(d => { d.open += (d.goal - d.open)*Math.min(1, dt*6); d.L.position.x = d.dx - 0.28 - d.open*0.5; d.R.position.x = d.dx + 0.28 + d.open*0.5; });
  renderer.render(scene, camera);
  updateTags();
  requestAnimationFrame(frame);
}
resize(); stage.classList.add('outside'); applyTheme(); buildOutside(); renderAll();
{ const d = fitOut(), t = outTarget(d); cam.yaw = -0.95; cam.pitch = 0.55; cam.dist = d*1.4; cam.target.set(t.x, OUT.H*0.55, t.z); camTween(Object.assign({yaw:-0.5, pitch:0.26, dist:d}, t), 1800); }
log('打开办公楼：从楼外面开始，点门进去');
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if(view === 'outside') buildOutside(); else { const s = sel; buildFloor(); sel = s; } renderAll(); });
requestAnimationFrame(frame);
})();
</script>
