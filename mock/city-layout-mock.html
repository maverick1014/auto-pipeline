<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agent City · 整理你的城 · mock</title>
<link rel="icon" href="data:,">
<style>
:root{
  --paper:#ECF1FF; --panel:#FFFFFF; --panel-2:#F3F5FE; --ink:#2A2B45; --ink-2:#585D82; --ink-3:#8D91B3;
  --line:#DCE2F6; --berry:#FF7593; --butter:#FFD36E; --focus:#4D7CFE;
  --ok:#1E8657; --ok-bg:#DDF5E9; --ask-bg:#FFE1E8; --ask-ink:#C2345A;
  --round:ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --display:"Fredoka",ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13162A; --panel:#1C2040; --panel-2:#242951; --ink:#EEF0FF; --ink-2:#B0B5DB; --ink-3:#7B81AA;
    --line:#2D3360; --focus:#8FB0FF; --ok:#5FD39C; --ok-bg:#173A2C; --ask-bg:#4A1F33; --ask-ink:#FFB0C3;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 var(--round)}
.mock{max-width:1560px;margin-inline:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.sign{display:inline-flex;flex-direction:column;background:var(--panel);border:2px solid var(--ink);border-radius:18px;padding:6px 16px;box-shadow:0 3px 0 var(--ink)}
.sign b{font:700 21px/1.15 var(--display)}
.sign small{font:600 10.5px/1.3 var(--mono);color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.pill{background:var(--butter);color:#4A3500;font:600 12px/1 var(--display);padding:7px 12px;border-radius:999px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:8px}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;border-radius:12px;font:600 13.5px/1 var(--round);color:var(--ink-2);background:var(--panel-2)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
.tabs button:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.note{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;color:var(--ink-2)}
.note b{color:var(--ink)}
.note .en{display:block;color:var(--ink-3);font-size:12.5px}
.screen{display:grid;gap:14px}
.screen.side{grid-template-columns:minmax(0,1fr) 330px;align-items:start}
.screen.phones{grid-template-columns:420px minmax(0,1fr);align-items:start}
@media (max-width: 1100px){ .screen.side,.screen.phones{grid-template-columns:1fr} }
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.frame{border:2px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--panel);box-shadow:0 5px 0 rgba(42,43,69,.2)}
.frame .url{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel-2);border-bottom:1.5px solid var(--line);font:600 12px/1 var(--mono);color:var(--ink-2)}
.frame .url i{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.frame .url span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frame iframe{display:block;width:100%;height:727px;border:0;background:var(--paper)}
.phone-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.phone{width:394px;border:2px solid var(--ink);border-radius:38px;padding:10px 0 12px;background:var(--ink);box-shadow:0 6px 0 rgba(42,43,69,.25)}
.phone .notch{width:110px;height:6px;border-radius:6px;background:#6b6f93;margin:2px auto 9px}
.phone .glass{width:390px;height:760px;margin-inline:auto;border-radius:26px;overflow:hidden;background:#D5D8E6;display:flex;flex-direction:column}
.phone iframe{display:block;width:390px;flex:1 1 auto;min-height:0;border:0;background:var(--paper)}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:12px 16px}
.card h3{margin:0 0 6px;font:700 15px/1.3 var(--display)}
.card ul,.card ol{margin:0;padding-left:18px}
.card li{margin:5px 0;color:var(--ink-2)}
.card li b{color:var(--ink)}
.card p{margin:6px 0 0;color:var(--ink-2)}
.card code,.tbl code{font:600 12px/1 var(--mono);background:var(--panel-2);padding:2px 5px;border-radius:6px}
.fail{background:var(--ask-bg);color:var(--ask-ink);border-radius:14px;padding:12px 16px;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--ink-3);font-weight:600;white-space:nowrap}
.tbl td b{color:var(--ink)}
.tbl-wrap{overflow-x:auto}
.try{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.try button{all:unset;cursor:pointer;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);font:600 13px/1.35 var(--round)}
.try button small{display:block;color:var(--ink-3);font-weight:500}
.try button:hover{border-color:var(--ink-3)}
.try button:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.ask{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--butter);color:#4A3500;font:700 11.5px/1.6 var(--round)}

<div class="mock" id="mock">
  <div class="top">
    <span class="sign"><b>Agent City · 整理你的城</b><small>city-layout · 自己摆仓库的位置 · 不想看的仓库藏起来</small></span>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const Q = new URLSearchParams(location.search);
const PAGE_URL = '../bin/agent-city.html', PLANS_URL = '../bin/agent-city-plans.json';
const ME = 'you@example.com';
const HOST = { cloud: 'https://agent-city-page.<你的子域>.workers.dev  (云端页面)', local: 'http://127.0.0.1:8787  (本地页面)' };

const SCREENS = [
  { id: 'pc', tab: '1 整理', note: '<b>地图顶上那一排仓库的最右边，多一个小按钮「整理」。点它：镜头拉高看整座岛，每块地上出一个名牌，岛边上的空位变成虚线格子。</b> 把一块地<b>拖</b>到虚线格子 = 搬过去；拖到另一块地上 = 两块<b>交换</b>。也可以不拖：<b>点一块地，再点一个格子</b>（或另一块地）。名牌上的「隐藏」把这个仓库收起来。底下那一条：<b>取消</b>全部放回去，<b>完成</b>收工。整理的时候城里照常：人照样干活、说话、盖楼。<span class="en">One small control "整理" at the right end of the repo row on the stage. In the mode: drag a land to a dashed slot (move) or onto another land (swap); or tap a land, then tap a slot. Cancel puts everything back, Done leaves the mode. The city stays live.</span>' },
  { id: 'hid', tab: '2 隐藏的仓库', note: '<b>隐藏 = 不画，不是删。</b> 这一页已经帮你把 pos-lite 隐藏了，而且里面有一个人在等你。它的地、人、名单里的那一组、顶上的仓库标签都不画；它的会话照常跑。<b>名单最底下有一行小字：已隐藏 1 个 · 其中 1 个在等你 · 管理</b>（有人等你时这行变红，名单折起来时小标签上的红点也算上他）。点这行 = 打开整理，在底下那条里点「显示」把它放回来。<span class="en">Hidden = not drawn, never deleted; its sessions go on. One quiet line at the rail\'s foot says how many are hidden and whether someone there waits for you; it opens the arrange mode.</span>' },
  { id: 'phone', tab: '3 手机', note: '<b>手机宽度：一样能拖（手指按住一块地拖），也能点两下（点地，再点格子）。</b> 「整理」在仓库那一条的最右边；整理的那一条贴在最底下，不盖住地。<span class="en">Phone width: finger drag works, and so does tap + tap. The mode bar sits at the bottom edge and never covers the lands.</span>' },
  { id: 'cloud', tab: '4 云端和别的电脑', note: '<b>每台电脑各摆各的。</b> 云端页面显示的是「那台电脑」的摆法；在那台电脑上隐藏的仓库，云端上<b>完全没有</b>（没有地、没有人、没有名字）。云端页面这一步<b>只能看</b>，没有「整理」按钮。下面这个云端页面用的就是你在第 1、2 页摆出来的样子。<span class="en">Each machine keeps its own arrangement. The cloud picture is the machine\'s arrangement; a repo hidden there is not in it at all. No arrange mode on the cloud page in this step.</span>' },
  { id: 'rules', tab: '5 规则和要你定的', note: '<b>我替你先定了 8 件事，都写在下面。</b> 标着 <span class="ask">你来定</span> 的三件最值得你看一眼；不说话就按这里写的做。<span class="en">The decisions taken for you; three of them are marked for a look.</span>' },
];

/* ---------- layout() of bin/agent_city.py in JS: for this mock only (on the real page the SERVER lays the island out) ---------- */
function makeLayout(plans) {
  const CELL = 22, HALF = 11, BOX_LO = -8, BOX_HI = 7, R0 = 1.9, RMAX = 8.6, L0 = 50, LCAP = 1000000, SEA_ROWS = 8;
  const GAP_CH = { river: 'w', ravine: 'k', pass: 'm', forest: 'f' };
  const GAPS = { 'grassland|mountain': 'pass', 'desert|grassland': 'ravine', 'forest|grassland': 'forest', 'coast|grassland': 'river', 'desert|mountain': 'ravine',
    'forest|mountain': 'pass', 'coast|mountain': 'river', 'desert|forest': 'river', 'coast|desert': 'river', 'coast|forest': 'forest' };
  const gapOf = (a, b) => GAPS[[a, b].sort().join('|')] || 'river';
  const fnv1a = text => { let h = 0x811c9dc5; for (const b of new TextEncoder().encode(text)) { h = (h ^ b) >>> 0; h = Math.imul(h, 0x01000193) >>> 0; } return h; };
  const terrId = ident => ('0000000' + fnv1a(ident).toString(16)).slice(-8);
  const growth = lines => Math.min(1, Math.log1p(Math.max(0, lines) / L0) / Math.log1p(LCAP / L0));
  const radius = lines => R0 + (RMAX - R0) * growth(lines);
  const mulberry32 = seed => { let a = seed >>> 0; return () => {
    a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1) >>> 0;
    t = (t ^ ((t + (Math.imul(t ^ (t >>> 7), t | 61) >>> 0)) >>> 0)) >>> 0;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
  const interpEdge = (edge, theta) => {
    let a = theta / (2 * Math.PI) * 12; a = (a % 12 + 12) % 12;
    const i = Math.floor(a) % 12, t = a - Math.floor(a), j = (i + 1) % 12, s = (1 - Math.cos(Math.PI * t)) / 2;
    return edge[i] * (1 - s) + edge[j] * s;
  };
  const shapeOf = (ident, plan) => { const rnd = mulberry32(fnv1a(ident)); const edge = plan.edge.map(e => e * (1 + 0.16 * (rnd() - 0.5))); const p1 = rnd() * 2 * Math.PI, p2 = rnd() * 2 * Math.PI; return { edge, p1, p2 }; };
  const mult = (sh, th) => Math.max(0.75, Math.min(1.17, interpEdge(sh.edge, th) * (1 + 0.06 * Math.sin(5 * th + sh.p1) + 0.04 * Math.sin(8 * th + sh.p2))));
  const K = (x, z) => x + ',' + z;
  const roadSet = plan => { const roads = new Set(); for (const [x0, z0, x1, z1] of plan.roads) {
    const xlo = Math.max(Math.min(x0, x1), BOX_LO), xhi = Math.min(Math.max(x0, x1), BOX_HI), zlo = Math.max(Math.min(z0, z1), BOX_LO), zhi = Math.min(Math.max(z0, z1), BOX_HI);
    for (let x = xlo; x <= xhi; x++) for (let z = zlo; z <= zhi; z++) roads.add(K(x, z)); } return roads; };
  const clipToBox = ([x, z]) => [Math.max(BOX_LO, Math.min(BOX_HI, x)), Math.max(BOX_LO, Math.min(BOX_HI, z))];
  const frontOfPlot = (roads, x, z) => { for (const [a, b] of [[x, z + 1], [x + 1, z], [x - 1, z], [x, z - 1]]) if (roads.has(K(a, b))) return [a, b]; return null; };
  const isHall = (x, z) => x >= -1 && x <= 0 && z >= -1 && z <= 0;
  const plotNeed = (plan, x, z) => { const cx = x + 0.5, cz = z + 0.5; return (Math.hypot(cx, cz) + 0.7) / interpEdge(plan.edge, Math.atan2(cz, cx)); };
  const openCount = (plan, r) => { let m = 0, n = 0; for (const [x, z] of plan.plots) { m = Math.max(m, plotNeed(plan, x, z)); if (m > r) break; n++; } return n; };
  const openPlots = (plan, lines) => { const first = {}; plan.plots.forEach(([, , d], k) => { if (!(d in first)) first[d] = k; });
    const set = new Set(Object.values(first)); const n = openCount(plan, radius(lines)); for (let k = 0; k < n; k++) set.add(k); return [...set].sort((a, b) => a - b); };
  const territoryTiles = (plan, ident, lines) => {
    const r = radius(lines), shape = shapeOf(ident, plan), roads = roadSet(plan), land = new Set();
    for (let x = -HALF; x < HALF; x++) for (let z = -HALF; z < HALF; z++) { const cx = x + 0.5, cz = z + 0.5; if (isHall(x, z) || Math.hypot(cx, cz) <= r * mult(shape, Math.atan2(cz, cx))) land.add(K(x, z)); }
    const opens = openPlots(plan, lines);
    for (const k of opens) { const [x, z] = plan.plots[k]; land.add(K(x, z)); const f = frontOfPlot(roads, x, z); if (f) land.add(K(f[0], f[1])); }
    return { r, open: opens.length, land };
  };
  const trimDepth = (a, c) => 1 + Math.max(0, Math.min(2, Math.floor(1.3 + 0.45 * Math.sin(a * 0.7 + c) + 0.4 * Math.sin(a * 1.7 + 2 * c) + 0.35 * Math.sin(a * 3.1 + 3 * c) + 0.3 * Math.sin(a * 5.3 + 5 * c) + 0.5)));
  const beltOffset = (a, c) => Math.max(-2, Math.min(2, Math.floor(1.5 * Math.sin(a * 0.23 + c) + 0.8 * Math.sin(a * 0.61 + 2 * c) + 0.5)));
  const cornerCut = (x, z) => 4 + Math.floor(2 * Math.sin(x * 0.5 + z * 0.3) + 0.5);
  const planBy = {}; for (const p of plans) planBy[p.id] = p;

  function layout(world) {
    const order = world.order.filter(i => world.territories[i]);
    if (!order.length) return { cell: CELL, x0: 0, z0: 0, w: 0, h: 0, rows: [], territories: [], links: [] };
    const T = i => world.territories[i];
    const bySlot = {}; for (const i of order) bySlot[K(T(i).slot[0], T(i).slot[1])] = i;
    let x0 = null, z0 = null, x1 = null, z1 = null;
    for (const ident of order) {
      const t = T(ident), [i, j] = t.slot, sea = planBy[t.plan].sea;
      const cx0 = i * CELL - HALF, cx1 = i * CELL + HALF - 1, cz0 = j * CELL - HALF, cz1 = j * CELL + HALF - 1 + (sea ? SEA_ROWS : 0);
      x0 = x0 === null ? cx0 : Math.min(x0, cx0); x1 = x1 === null ? cx1 : Math.max(x1, cx1);
      z0 = z0 === null ? cz0 : Math.min(z0, cz0); z1 = z1 === null ? cz1 : Math.max(z1, cz1);
    }
    const w = x1 - x0 + 1, h = z1 - z0 + 1;
    const grid = []; for (let r = 0; r < h; r++) grid.push(new Array(w).fill(' '));
    const get = (x, z) => { const row = z - z0, col = x - x0; return row >= 0 && row < h && col >= 0 && col < w ? grid[row][col] : null; };
    const setTile = (x, z, c) => { const row = z - z0, col = x - x0; if (row >= 0 && row < h && x >= x0 && x <= x1) grid[row][col] = c; };
    const links = [];
    for (const ident of order) {
      const t = T(ident), [i, j] = t.slot;
      for (const [di, dj, side] of [[1, 0, 'E'], [0, 1, 'S']]) {
        const nb = bySlot[K(i + di, j + dj)]; if (!nb) continue;
        const gap = gapOf(planBy[t.plan].terrain, planBy[T(nb).plan].terrain);
        links.push({ a: ident, b: nb, side, gap, kind: gap === 'river' || gap === 'ravine' ? 'bridge' : 'road' });
      }
    }
    const linkAt = (a, b) => links.find(l => (l.a === a && l.b === b) || (l.a === b && l.b === a)) || null;
    const views = [];
    for (const ident of order) {
      const t = T(ident), plan = planBy[t.plan], [i, j] = t.slot, ox = i * CELL, oz = j * CELL;
      const nb = { N: bySlot[K(i, j - 1)], S: bySlot[K(i, j + 1)], W: bySlot[K(i - 1, j)], E: bySlot[K(i + 1, j)] };
      const vBelt = (bx, z) => { const o = beltOffset(z, bx * 0.37); return [bx - 1 + o, bx + o]; };
      const hBelt = (bz, x) => { const o = beltOffset(x, bz * 0.41); return [bz - 1 + o, bz + o]; };
      for (let x = -HALF; x < HALF; x++) for (let z = -HALF; z < HALF; z++) {
        const X = ox + x, Z = oz + z, kN = z + HALF, kS = HALF - 1 - z, kW = x + HALF, kE = HALF - 1 - x;
        const tN = trimDepth(X, 0.7), tS = trimDepth(X, 2.1), tW = trimDepth(Z, 1.3), tE = trimDepth(Z, 3.3), cc = cornerCut(X, Z);
        const cut = (!nb.N && kN < tN) || (!nb.W && kW < tW) || (!nb.E && kE < tE) || (!plan.sea && !nb.S && kS < tS)
          || (!nb.N && !nb.W && kN + kW < cc) || (!nb.N && !nb.E && kN + kE < cc) || (!nb.S && !nb.W && kS + kW < cc) || (!nb.S && !nb.E && kS + kE < cc);
        let c = '.';
        const seaOk = (nb.E || kE >= trimDepth(Z, 6.1) - 1) && (nb.W || kW >= trimDepth(Z, 6.9) - 1);
        if (plan.sea && (kS < tS + 1 || (cut && kS < 9))) c = seaOk ? 's' : ' ';
        else if (cut) c = ' ';
        else if (plan.sea && kS < tS + 3) c = 'b';
        else {
          let hit = null;
          if (nb.E && vBelt(ox + HALF, Z).includes(X)) hit = nb.E;
          else if (nb.W && vBelt(ox - HALF, Z).includes(X)) hit = nb.W;
          else if (nb.S && hBelt(oz + HALF, X).includes(Z)) hit = nb.S;
          else if (nb.N && hBelt(oz - HALF, X).includes(Z)) hit = nb.N;
          if (hit) c = GAP_CH[linkAt(ident, hit).gap];
        }
        setTile(X, Z, c);
      }
      if (plan.sea) for (let x = -HALF; x < HALF; x++) for (let z = HALF; z < HALF + SEA_ROWS; z++) {
        if (z - HALF < 1 + trimDepth(ox + x, 5.5) && get(ox + x, oz + z - 1) === 's' && x + HALF >= trimDepth(oz + z, 6.9) + z - HALF && HALF - 1 - x >= trimDepth(oz + z, 6.1) + z - HALF) setTile(ox + x, oz + z, 's');
      }
      const tr = territoryTiles(plan, ident, t.peak), roads = roadSet(plan);
      for (const key of tr.land) { const [x, z] = key.split(',').map(Number); if (get(ox + x, oz + z) === '.') setTile(ox + x, oz + z, roads.has(key) ? 'r' : 'g'); }
      const opens = openPlots(plan, t.peak);
      for (const k of opens) setTile(ox + plan.plots[k][0], oz + plan.plots[k][1], 'P');
      for (let x = -1; x < 1; x++) for (let z = -1; z < 1; z++) setTile(ox + x, oz + z, 'H');
      let rest = null;
      if (t.rest) { const [rx, rz] = plan.rest; rest = { x: ox + rx, z: oz + rz }; for (const dx of [0, 1]) for (const dz of [0, 1]) setTile(ox + rx + dx, oz + rz + dz, 'g'); }
      views.push({ id: terrId(ident), name: t.name, plan: plan.id, terrain: plan.terrain, slot: [i, j], cx: ox, cz: oz, lines: t.lines, size: growth(t.peak), r: tr.r, open: tr.open,
        plots_total: plan.plots.length, plots: opens.map(k => ({ k, x: ox + plan.plots[k][0], z: oz + plan.plots[k][1], d: plan.plots[k][2] })),
        buildings: (t.buildings || []).filter(b => opens.includes(b.plot)).map(b => ({ plot: b.plot, type: b.type, by: b.by, x: ox + plan.plots[b.plot][0], z: oz + plan.plots[b.plot][1], files: [], hist: [], q: 'good', home: true, lv: 0, name: '' })),
        era: t.era || 'village', balance: {}, rules_note: '', offices: [], rest, sites: [], here: t.here !== false });
    }
    const trunk = (ident, dir) => {
      const t = T(ident), plan = planBy[t.plan], ox = t.slot[0] * CELL, oz = t.slot[1] * CELL, roads = roadSet(plan);
      const ex = clipToBox(plan.exits[dir]);
      const prev = new Map([[K(ex[0], ex[1]), null]]), queue = [ex];
      let hit = null;
      while (queue.length) {
        const [x, z] = queue.shift(), c = get(ox + x, oz + z);
        if (c === 'r' || c === 'H' || c === 'g') { hit = [x, z]; break; }

let current = null;
async function show(id) {
  const sc = SCREENS.find(s => s.id === id) || SCREENS[0];
  current = sc.id;
  for (const b of $('#tabs').children) b.setAttribute('aria-selected', String(b.dataset.id === sc.id));
  $('#note').innerHTML = sc.note;
  const view = $('#view');
  view.textContent = '';
  try {
    await loadPage();
    const el = await RENDER[sc.id]();
    if (current === sc.id) view.appendChild(el);
  } catch (err) {
    view.innerHTML = '<p class="fail">这个 mock 要从一个小网页服务器打开（它要读 ../bin/agent-city.html）。在仓库根目录跑：python3 -m http.server 8765，然后打开 http://127.0.0.1:8765/mock/city-layout-mock.html<br>(' + String(err && err.message || err) + ')</p>';
  }
  const q = new URLSearchParams(location.search); q.set('s', sc.id);
  history.replaceState(null, '', '?' + q.toString());
}
for (const s of SCREENS) {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.id = s.id; b.textContent = s.tab; b.setAttribute('role', 'tab');
  b.addEventListener('click', () => show(s.id));
  $('#tabs').appendChild(b);
}
show(Q.get('s') || 'pc');
})();
