<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agent City · city-talk mock</title>

<style>
/* the real page's own colours, fonts, rail, name tag and bubble rules (bin/agent-city.html) */
:root{
  --paper:#ECF1FF; --panel:#FFFFFF; --panel-2:#F3F5FE; --ink:#2A2B45; --ink-2:#585D82; --ink-3:#8D91B3;
  --line:#DCE2F6; --berry:#FF7593; --berry-deep:#D9506E; --butter:#FFD36E; --focus:#4D7CFE;
  --build-bg:#E1ECFF; --build-ink:#3160B5; --ask-bg:#FFE1E8; --ask-ink:#C2345A;
  --rest-bg:#DAF5E8; --rest-ink:#1E8657; --walk-bg:#EDEFF7; --walk-ink:#5F6488;
  --gov-bg:#FFF0C7; --gov-ink:#8A6000; --bgrun-bg:#ECE4FF; --bgrun-ink:#5A3EC8;
  --round:ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --display:"Fredoka",ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 var(--round)}
.app{max-width:1500px;margin-inline:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;min-height:100dvh}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.sign{display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--ink);border-radius:18px;padding:5px 16px 5px 12px;box-shadow:0 3px 0 var(--ink)}
.sign-name{font:700 20px/1 var(--display)}
.sign-sub{display:block;font:600 10.5px/1.2 var(--mono);color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.proto{background:var(--butter);color:#4A3500;font:600 12px/1 var(--display);padding:7px 12px;border-radius:999px;box-shadow:0 2px 0 rgba(42,43,69,.18)}
.stat{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);font:600 12px/1.3 var(--mono);color:var(--ink-2)}
.stat.ok{border-color:#1E8657;color:#146342}
.stat.bad{border-color:var(--ask-ink);background:var(--ask-bg);color:var(--ask-ink)}
.right{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chk{display:inline-flex;align-items:center;gap:5px;font:600 13px/1 var(--round);cursor:pointer}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:8px}
.group{display:inline-flex;flex-wrap:wrap;align-items:center;gap:5px}
.sep{width:1.5px;align-self:stretch;background:var(--line);margin:0 2px}
.lead{font-size:13px;color:var(--ink-2);margin-right:2px}
.btn{font:600 13px/1 var(--round);border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:12px;padding:0 12px;min-height:36px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary{background:var(--berry);border-color:var(--berry);color:#fff;box-shadow:0 3px 0 var(--berry-deep)}
.btn.primary:active{transform:translateY(3px);box-shadow:none}
.btn.small{min-height:30px;font-size:12px;padding:0 9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{min-height:44px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;font-size:13px;color:var(--ink-2)}
.note b{color:var(--ink)}
.note .ev{display:block;font:600 11.5px/1.5 var(--mono);color:var(--ink-3)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:12px;flex:1;min-height:0}
.stage{position:relative;overflow:hidden;border-radius:16px;min-height:520px;height:calc(100dvh - 220px);background:#BFE3F5;--rail-w:212px}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.ov > div{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap}
.tagl{background:var(--c);color:#fff;border-radius:999px;padding:3px 10px;font:600 11.5px/1.3 var(--mono);box-shadow:0 2px 0 rgba(42,43,69,.2)}
.bub{background:#FFFFFF;color:#2A2B45;border:2px solid #2A2B45;border-radius:14px;padding:3px 10px;font:600 12.5px/1.4 var(--round);box-shadow:0 2px 0 rgba(42,43,69,.2)}
.bub.ask{border-color:#E4476F}
/* new: the small talk bubble (an icon, never chat text) */
.talkb{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;background:#fff;border:2px solid #2A2B45;border-radius:15px;font:600 15px/1 var(--round);box-shadow:0 2px 0 rgba(42,43,69,.2)}
.talkb::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:#fff;border-right:2px solid #2A2B45;border-bottom:2px solid #2A2B45;transform:translateX(-50%) rotate(45deg)}
.talkb small{font:700 10.5px/1 var(--mono);color:var(--ink-2);margin-left:3px}
.talkb.bob{animation:bob .9s ease-in-out infinite}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-4px}}
.letter{font:16px/1 system-ui;filter:drop-shadow(0 2px 0 rgba(42,43,69,.25))}
.rail{position:absolute;left:12px;top:12px;z-index:4;width:var(--rail-w);max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(42,43,69,.18);overflow:hidden}
.rail-head{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1.5px solid var(--line);font-weight:700;font-size:13px}
.rail-head .n{font:600 12px/1 var(--mono);color:var(--ink-3)}
.you{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--berry);color:#fff;font:700 11px/1 var(--round);margin-left:auto}
.rail-list{overflow:auto;padding:4px 4px 8px}
.rc{width:10px;height:10px;border-radius:50%;background:var(--rc);flex:none;display:inline-block}
.grp-h{display:flex;align-items:center;gap:6px;padding:3px 6px;font:700 11.5px/1.2 var(--mono);color:var(--ink-2)}
.grp-h .n{margin-left:auto;color:var(--ink-3);font-weight:600}
.rail-grp{border-left:4px solid var(--rc);margin:4px 0 6px;padding-left:2px}
.rrows{list-style:none;margin:0;padding:0}
.rrow{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:8px;font-size:12.5px;line-height:1.35}
.rrow.sub{padding-left:16px}
.rrow:hover{background:var(--panel-2)}
.rrow b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow i{font:600 10.5px/1 var(--mono);font-style:normal;color:var(--ink-3);flex:none}
.sdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-3)}
.sdot.st-you{background:var(--berry)}
.sdot.st-ask{background:#E0A526}
.sdot.st-build{background:#4D7CFE}
.sdot.st-rest{background:#2FB57A}
.sdot.st-bgrun{background:#8B6CF0}
aside{display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:calc(100dvh - 220px);min-height:520px}
.card{background:var(--panel);border-radius:18px;padding:10px 12px;box-shadow:0 1px 3px rgba(40,40,80,.08)}
.card h3{margin:0 0 6px;font:700 14px/1.3 var(--round)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-top:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
th{font-weight:700;color:var(--ink-2)}
ol{margin:0;padding-left:18px;font-size:12.5px} ol li{margin:0 0 6px}
.fail{padding:40px;font:600 15px/1.6 var(--round);color:var(--ask-ink)}
@media (max-width:980px){ .main{grid-template-columns:1fr} aside{max-height:none;min-height:0} .stage{height:520px} }
@media (prefers-reduced-motion: reduce){ .talkb.bob{animation:none} }
.rm .talkb.bob{animation:none}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bar">
    <span class="sign"><span><span class="sign-name" data-t="title"></span><span class="sign-sub">city-talk · T1 T2 T3</span></span></span>
    <span class="proto">mock</span>
    <span class="stat" id="gapStat"></span>
    <span class="right">
      <label class="chk"><input type="checkbox" id="rm"> <span data-t="rm"></span></label>
      <span class="group" id="lang"></span>
      <span class="stat" id="fps"></span>
    </span>
  </div>
  <div class="toolbar">
    <span class="group" id="mainBtns"></span>
    <span class="sep"></span>
    <span class="group" id="moreBtns"></span>
    <span class="sep"></span>
    <span class="group"><span class="lead" data-t="farLbl"></span><span class="group" id="farSeg"></span></span>
    <span class="group" style="margin-left:auto"><button type="button" class="btn small" id="reset" data-t="reset"></button></span>
  </div>
  <div class="note" id="note"></div>
  <div class="main">
    <div class="stage" id="stage">
      <canvas id="c" aria-label="3D preview"></canvas>
      <div class="ov" id="ov"></div>
      <aside class="rail" aria-label="rail" style="min-height:0">
        <div class="rail-head"><span data-t="railTitle"></span><span class="n" id="rail-n"></span><span class="you" id="rail-you" hidden></span></div>
        <div class="rail-list" id="rail-list"></div>
      </aside>
    </div>
    <aside>
      <section class="card"><h3 data-t="seeTitle"></h3><div id="see"></div></section>
      <section class="card"><h3 data-t="askTitle"></h3><ol id="asks"></ol></section>
    </aside>
  </div>
</div>

        tk.phase = 'approach'; tk.walked = true;
      } else { tk.remote = true; tk.phase = 'talk'; }
    } else if (tk.phase === 'approach') {
      if (!tk.a.goal) { tk.phase = 'talk'; tk.t = 0; }
      else if (tk.a.stuckT > .5) {                                          // held up on the way: another free side of the other one, else the letter
        const s = besideSpot(tk.b, yawTo(tk.b, tk.a), [tk.a], tk.a);
        if (s) tk.a.goal = s; else { tk.a.goal = null; tk.a.pathFor = null; tk.remote = true; tk.phase = 'talk'; tk.t = 0; }
        tk.a.stuckT = 0;
      }
    } else {
      tk.t += dt; if (tk.t >= tk.dur) endTalk(tk);
    }
  }
}
function speaking(p, tk){ if (tk.group) return p === tk.a; return (tk.t / tk.dur < SPLIT) === (p === tk.a); }
function partner(p, tk){ if (!tk.group) return p === tk.a ? tk.b : tk.a; return p === tk.a ? tk.group[Math.floor(tk.t / .6) % tk.group.length] : tk.a; }
// a real status change: shown at once. 等你 ends the talk of that person at once.
function setStatus(p, st){
  p.st = st;
  if (st === 'you' && p.talk && !p.talk.keepOnYou) endTalk(p.talk, true);
  renderRail();
}

/* ---------- T1: a new one appears next to its sender ---------- */
function ownSpot(parent, role){
  if (role === 'tm') return freeHome(1.25, 1.55);
  const dir = parent.spawnDir != null ? parent.spawnDir : parent.yaw + Math.PI;
  return freeHome(parent.home.x + Math.sin(dir) * 1.3, parent.home.z + Math.cos(dir) * 1.3);
}
function spawn(parent, list){
  const dir = parent.spawnDir != null ? parent.spawnDir : parent.yaw + Math.PI;
  const n = list.length, kids = [];
  const R = n <= 2 ? TALK_DIST : Math.max(TALK_DIST, GAP * 1.1 / (2 * Math.sin(Math.min(Math.PI / 2, 2.6 / (2 * Math.max(1, n - 1))))));
  const stepA = n > 1 ? Math.min(2.6 / (n - 1), 2 * Math.asin(Math.min(1, GAP * 1.1 / (2 * R))) * 1.02) : 0;
  list.forEach((o, i) => {
    const a = dir + (i - (n - 1) / 2) * stepA;
    let x = parent.x + Math.sin(a) * R, z = parent.z + Math.cos(a) * R;
    if (!isFree(x, z, [parent])) ({ x, z } = n === 1 ? besideSpot(parent, a, [parent]) : freeSpot(x, z, [parent]));
    const kid = addPerson({ name: o.name, role: o.role, lead: parent, color: o.color, x, z, yaw: yawTo({ x, z }, parent), pop: true, st: 'build' });
    kids.push(kid);
  });
  for (const kid of kids) { const s = ownSpot(parent, kid.role); kid.home = { x: s.x, z: s.z, yaw: kid.role === 'tm' ? Math.PI / 2 : parent.home.yaw }; }
  const after = () => kids.forEach((kid, i) => later(i * .22, () => goHome(kid)));
  if (n === 1) talk(parent, kids[0], 'handover', { done: after, back: false });
  else talk(parent, null, 'handover', { group: kids, done: after, back: false, dur: DUR.handover + .3 });
  renderRail();
  return kids;
}

/* ---------- per frame ---------- */
const q = new THREE.Quaternion(), eul = new THREE.Euler();
function stepPerson(p, dt){
  if (p.pop < 1) { p.pop = Math.min(1, p.pop + dt / (RM ? .01 : .28)); const k = 1 - Math.pow(1 - p.pop, 3); p.g.scale.setScalar(.25 + .75 * k); }
  let walking = false;
  if (p.goal) walking = moveToward(p, dt);
  const tk = p.talk, talking = !!tk && tk.phase === 'talk';
  let clip = 'idle', speed = 1, want = null, nod = false;
  if (walking) { clip = 'walk'; speed = p.speed / WALK * .9; want = p.heading; }
  else if (talking) { want = yawTo(p, partner(p, tk)); if (speaking(p, tk)) { if (!RM) clip = 'interact-left'; } else nod = !RM; }
  else if (p.look) want = yawTo(p, p.look);
  else if (atHome(p)) { want = p.home.yaw; if (p.st === 'build') clip = 'interact-right'; }
  if (want != null) faceYaw(p, want, dt, walking ? 12 : 8);
  anim(p, clip, speed);
  if (p.mixer) p.mixer.update(dt);
  if (p.head && nod) { q.setFromEuler(eul.set(.16 + .14 * Math.sin(clock * 7), 0, 0)); p.head.quaternion.multiply(q); }
  return { walking, talking };
}
function tick(dt){
  clock += dt;
  for (let i = timers.length - 1; i >= 0; i--) if (timers[i].at <= clock) { const f = timers[i].f; timers.splice(i, 1); f(); }
  stepTalks(dt);
  for (const p of people) p.fr = stepPerson(p, dt);
  separate();
  for (const p of people) { p.g.position.x = p.x; p.g.position.z = p.z; p.g.rotation.y = p.yaw; }
}

/* ---------- overlays: name tag, 等你回话 bubble, talk bubble, flying letter ---------- */
const v3 = new THREE.Vector3();
let W = 1, H = 1;
function toScreen(x, y, z){ v3.set(x, y, z).project(camera); return [(v3.x + 1) / 2 * W, (1 - v3.y) / 2 * H]; }
function pin(e, x, y){ e.hidden = false; e.style.transform = `translate(${Math.round(x)}px,${Math.round(y)}px) translate(-50%,-100%)`; }
const letters = [];
function overlays(){
  // name tags sit under the feet (always shown in this mock), so heads and bubbles stay clear;
  // a tag that would cover another moves down
  const placed = [];
  const list = people.map(p => { const [x, y] = toScreen(p.x, 0, p.z); return { p, x, y: y + 12 }; }).sort((a, b) => a.y - b.y);
  for (const it of list) {
    const p = it.p; if (!p.tw) { p.tag.hidden = false; p.tw = p.tag.offsetWidth; p.th = p.tag.offsetHeight; }
    let y = it.y, moved = true, guard = 0;
    while (moved && guard++ < 12) { moved = false; for (const o of placed) if (Math.abs(o.x - it.x) < (o.w + p.tw) / 2 + 2 && y < o.y + o.h + 2 && y + p.th > o.y - 2) { y = o.y + o.h + 3; moved = true; } }
    placed.push({ x: it.x, y, w: p.tw, h: p.th });
    pin(p.tag, it.x, y + p.th);
    const [hx, hy] = toScreen(p.x, p.h * p.g.scale.y + .1, p.z);
    let top = hy;
    if (p.st === 'you') { p.bub.textContent = t('bub.you'); pin(p.bub, hx, top); top -= 32; } else p.bub.hidden = true;
    const tk = p.talk;
    if (tk && tk.phase === 'talk' && speaking(p, tk)) {
      const reply = !tk.group && p === tk.b, w = waitingFor(p);
      p.tb.textContent = reply ? REPLY : ICON[tk.kind];
      if (tk.group && tk.group.length > 1) { const s = document.createElement('small'); s.textContent = '×' + tk.group.length; p.tb.appendChild(s); }
      else if (w) { const s = document.createElement('small'); s.textContent = '+' + w; p.tb.appendChild(s); }
      p.tb.classList.toggle('bob', !RM);
      pin(p.tb, hx, top - 6);
    } else p.tb.hidden = true;
  }
  // the letter of a talk where nobody walks (far apart, letter mode)
  for (const tk of talks) {
    if (!tk.remote || tk.phase !== 'talk') { if (tk.letter) tk.letter.hidden = true; continue; }
    if (!tk.letter) { tk.letter = el('letter'); tk.letter.textContent = '✉️'; letters.push(tk.letter); }
    const k = tk.t / tk.dur, out = k < SPLIT, u = out ? Math.min(1, k / (SPLIT * .7)) : Math.min(1, (k - SPLIT) / ((1 - SPLIT) * .8));
    const from = out ? tk.a : tk.b, to = out ? tk.b : tk.a, e = RM ? (u < 1 ? 0 : 1) : u * u * (3 - 2 * u);
    const [x, y] = toScreen(from.x + (to.x - from.x) * e, .62 + Math.sin(Math.PI * e) * .7, from.z + (to.z - from.z) * e);
    if (u >= 1) tk.letter.hidden = true; else pin(tk.letter, x, y);
  }
  for (let i = letters.length - 1; i >= 0; i--) if (!talks.some(tk => tk.letter === letters[i])) { letters[i].remove(); letters.splice(i, 1); }
}

/* ---------- the scene: a small piece of one territory ---------- */
let P = {};
function ground(w, d, color){ const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), lam(color)); m.rotation.x = -Math.PI / 2; m.receiveShadow = true; world.add(m); }
function disc(x, z, r, color, y){ const m = new THREE.Mesh(new THREE.CircleGeometry(r, 48), lam(color)); m.rotation.x = -Math.PI / 2; m.position.set(x, y || .004, z); m.receiveShadow = true; world.add(m); }
const C = { repo: '#7C6CF0', gov: '#C99A1E' };
function build(){
  while (world.children.length) world.remove(world.children[0]);
  for (const e of [...ov.children]) e.remove();
  people.length = 0; talks = []; timers.length = 0; letters.length = 0; minGap = Infinity; pushes = 0; charI = 0; uid = 0; wn = 1; dn = 0;
  ground(40, 40, '#8FC46B');
  disc(0, 0, 3.6, '#CBE8A9', .003);
  disc(0, -.55, .85, '#E9D8AE', .005);                       // the plaza in front of the hall
  place('hexagon/building-village', 0, -1.75, { fit: 1.15 });
  place('forest/flag', .75, -1.25, { h: .5, tint: C.repo });
  place('suburban/building-type-a', -2.5, -.2, { fit: .7, ry: Math.PI / 2 });
  place('survival/structure', -2.55, .6, { fit: .5, h: .3 });
  place('hexagon/building-cabin', 2.5, .1, { fit: .75, ry: -.4 });
  place('kaykit-city/bench', 0, 2.55, { fit: .38 });
  for (const [x, z, k] of [[-3.0, 1.7, 'nature/tree_default'], [3.0, -1.5, 'nature/tree_oak'], [3.1, 1.6, 'nature/tree_default'], [-2.9, -1.9, 'nature/tree_oak'], [1.6, -2.6, 'nature/plant_bush'], [-1.5, 2.9, 'nature/plant_bush']])
    place(k, x, z, { fit: k === 'nature/plant_bush' ? .3 : .5 });
  P = {
    gov: addPerson({ key: CHARS[5], name: '总督', role: 'gov', color: C.gov, x: 0, z: -.75, yaw: 0, st: 'rest', spawnDir: .9 }),
    tm: addPerson({ key: CHARS[4], name: 'city-talk Task Manager', role: 'tm', color: C.repo, x: -1.65, z: -.2, yaw: -Math.PI / 2, st: 'build', spawnDir: Math.PI / 2 - .5 }),
    w1: null,
    helper: addPerson({ key: CHARS[1], name: 'auto-pipeline Helper', role: 'session', color: C.repo, x: 1.7, z: .3, yaw: Math.PI / 2 - .4, st: 'build', spawnDir: -Math.PI / 2 }),
    dep: null,
  };
  P.gov.home.yaw = 0;
  P.w1 = addPerson({ key: CHARS[0], name: 'Worker 1: tests', role: 'worker', lead: P.tm, color: C.repo, x: -1.35, z: .5, yaw: -Math.PI / 2 - .3, st: 'build' });
  P.dep = addPerson({ key: CHARS[3], name: 'msg-sides Deputy', role: 'deputy', lead: P.gov, color: C.repo, x: .85, z: -.3, yaw: .6, st: 'build' });
  charI = 2;
  cam.tx = 0; cam.tz = .35; cam.ty = .15; cam.dist = 5.9 * Math.max(1, Math.min(1.6, 760 / Math.max(1, W - 236))); cam.el = .74; cam.az = .06;
  renderRail();
}

/* ---------- the cases ---------- */
let wn = 1, dn = 0, cur = 'idle';
const DEPUTIES = ['rail-fix Deputy', 'typo Deputy', 'label Deputy'];
const CASES = {
  spawn(){ spawn(P.tm, [{ name: 'Worker ' + (++wn) + ': page', role: 'worker', color: C.repo }]); },
  deputy(){ spawn(P.gov, [{ name: DEPUTIES[dn++ % DEPUTIES.length], role: 'deputy', color: C.repo }]); },
  tm(){ spawn(P.gov, [{ name: 'city-rail Task Manager', role: 'tm', color: C.repo }]); },
  msg(){ talk(P.helper, P.tm, 'msg'); },
  near(){ talk(P.w1, P.tm, 'msg'); },
  ask(){
    setStatus(P.w1, 'ask');
    talk(P.w1, P.tm, 'ask', { mustWalk: true, back: false, done(){
      P.w1.look = P.tm;                                             // the worker waits next to its lead's spot
      setStatus(P.tm, 'ask');
      talk(P.tm, P.gov, 'ask', { mustWalk: true, back: false, done(){
        P.tm.look = P.gov;
        setStatus(P.gov, 'you');                                    // the 总督 needs the owner: shown at once
        later(3, () => { setStatus(P.gov, 'rest');
          talk(P.gov, P.tm, 'answer', { back: false, done(){
            setStatus(P.tm, 'build');
            goHome(P.tm, () => talk(P.tm, P.w1, 'answer', { back: false, done(){ setStatus(P.w1, 'build'); goHome(P.w1); } }));
          } });
        });
      } });
    } });
  },
  five(){ spawn(P.tm, [0, 1, 2, 3, 4].map(() => ({ name: 'Worker ' + (++wn), role: 'worker', color: C.repo }))); },
  many(){ talk(P.helper, P.tm, 'msg'); talk(P.w1, P.tm, 'msg'); talk(P.dep, P.gov, 'msg'); },
  six(){
    const pt = { x: .15, z: 1.25 };
    const six = people.filter(p => p.role !== 'gov').slice(0, 6);
    while (six.length < 6) six.push(spawnPlain());
    six.forEach((p, i) => later(i * .12, () => { if (p.talk) return; p.look = null; p.speed = WALK * 1.4; p.want = pt; p.loose = true; p.goal = { x: pt.x, z: pt.z }; p.onArrive = () => { p.look = pt; later(3.2, () => { if (!p.talk && !p.goal) goHome(p); }); }; }));
  },
  status(){
    talk(P.helper, P.tm, 'msg', { dur: 3 });
    const wait = () => { const tk = P.tm.talk; if (tk && tk.phase === 'talk' && tk.t > .9) { setStatus(P.tm, 'you'); later(4, () => setStatus(P.tm, 'build')); } else later(.1, wait); };
    later(.1, wait);
  },
};
function spawnPlain(){
  const s = freeHome(1.5, 1.85);
  const p = addPerson({ name: 'Worker ' + (++wn), role: 'worker', lead: P.tm, color: C.repo, x: s.x, z: s.z, yaw: 0, st: 'build' });
  renderRail(); return p;
}
const busy = () => talks.length > 0 || timers.length > 0 || people.some(p => p.goal);
function play(id){ if (busy()) return; cur = id; minGap = Infinity; pushes = 0; CASES[id](); renderNote(); syncURL(); }

/* ---------- camera: drag to orbit, wheel to zoom ---------- */
const cam = { tx: 0, ty: 0, tz: 0, dist: 7, el: .7, az: 0 };
let drag = null;
function resize(){ const r = stage.getBoundingClientRect(); W = Math.max(1, r.width); H = Math.max(1, r.height); renderer.setSize(W, H, false); camera.aspect = W / H;
  const off = W > 700 ? 118 : 0; if (off) camera.setViewOffset(W, H, -off, 0, W, H); else camera.clearViewOffset(); camera.updateProjectionMatrix(); }
function updateCamera(){
  const h = Math.cos(cam.el) * cam.dist;
  camera.position.set(cam.tx + Math.sin(cam.az) * h, cam.ty + Math.sin(cam.el) * cam.dist, cam.tz + Math.cos(cam.az) * h);
  camera.lookAt(cam.tx, cam.ty, cam.tz); camera.updateMatrixWorld();
}
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!drag) return; cam.az -= (e.clientX - drag.x) * .006; cam.el = Math.max(.15, Math.min(1.4, cam.el + (e.clientY - drag.y) * .004)); drag = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.dist = Math.max(1.8, Math.min(20, cam.dist * (e.deltaY > 0 ? 1.1 : .9))); }, { passive: false });

/* ---------- UI ---------- */
function seg(host, items, curId, on, cls){
  host.innerHTML = '';
  for (const [id, label] of items) {
    const b = document.createElement('button'); b.className = 'btn ' + (cls || 'small'); b.type = 'button'; b.textContent = label; b.dataset.id = id;
    if (curId !== undefined) b.setAttribute('aria-pressed', String(id === curId));
    b.addEventListener('click', () => on(id)); host.appendChild(b);
  }
}
function renderRail(){
  const order = [];
  for (const p of people) if (!p.lead || p.role === 'tm') { order.push([p, false]); for (const c of people) if (c.lead === p && c.role !== 'tm') order.push([c, true]); }
  const you = people.filter(p => p.st === 'you').length;
  $('#rail-n').textContent = people.length;
  $('#rail-you').hidden = !you; $('#rail-you').textContent = you;
  const host = $('#rail-list'); host.innerHTML = '';
  const sec = document.createElement('section'); sec.className = 'rail-grp'; sec.style.setProperty('--rc', C.repo);
  sec.innerHTML = '<div class="grp-h"><span class="rc"></span><span>auto-pipeline</span><span class="n">' + people.length + '</span></div>';
  const ul = document.createElement('ul'); ul.className = 'rrows';
  for (const [p, sub] of order) {
    const li = document.createElement('li'), b = document.createElement('button'); b.type = 'button'; b.className = 'rrow' + (sub ? ' sub' : '');
    const d = document.createElement('span'); d.className = 'sdot st-' + p.st;
    const n = document.createElement('b'); n.textContent = p.name;
    const w = document.createElement('i'); w.textContent = t('st.' + p.st);
    b.append(d, n, w); b.addEventListener('click', () => { cam.tx = p.x; cam.tz = p.z; cam.dist = Math.min(cam.dist, 4.2); });
    li.appendChild(b); ul.appendChild(li);
  }
  sec.appendChild(ul); host.appendChild(sec);
}
function renderNote(){
  const n = $('#note'); n.innerHTML = t(cur === 'msg' && farMode === 'letter' ? 'n.msgLetter' : 'n.' + cur);
  if (cur !== 'idle') { const e = document.createElement('span'); e.className = 'ev'; e.textContent = t('e.' + cur); n.appendChild(e); }
}
function renderUI(){
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.body.classList.toggle('rm', RM);
  for (const e of document.querySelectorAll('[data-t]')) e.textContent = t(e.dataset.t);
  seg($('#mainBtns'), ['spawn', 'msg', 'ask', 'five'].map(k => [k, t('b.' + k)]), undefined, play, 'primary');
  seg($('#moreBtns'), ['deputy', 'tm', 'near', 'many', 'six', 'status'].map(k => [k, t('b.' + k)]), undefined, play);
  seg($('#farSeg'), [['walk', t('far.walk')], ['letter', t('far.letter')]], farMode, v => { farMode = v; syncURL(); renderUI(); });
  seg($('#lang'), [['zh', '中文'], ['en', 'EN']], lang, v => { lang = v; syncURL(); renderUI(); });
  const h = TX[lang]['see.h'], rows = TX[lang]['see.rows'];
  $('#see').innerHTML = '<table><tr>' + h.map(x => '<th>' + x + '</th>').join('') + '</tr>' + rows.map(r => '<tr><th>' + r[0] + '</th><td>' + r[1] + '</td></tr>').join('') + '</table>';
  $('#asks').innerHTML = TX[lang].asks.map(a => '<li>' + a + '</li>').join('');
  wasBusy = false; renderNote(); renderRail();
}
function syncURL(){
  const u = new URLSearchParams({ lang, far: farMode }); if (RM) u.set('rm', '1');
  history.replaceState(null, '', '?' + u.toString());
}
$('#rm').addEventListener('change', e => { RM = e.target.checked; syncURL(); renderUI(); });
$('#reset').addEventListener('click', () => { cur = 'idle'; build(); renderNote(); });

/* ---------- loop ---------- */
let last = performance.now(), fpsN = 0, fpsT = 0, fpsShow = 0, wasBusy = false;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  fpsN++; fpsT += dt; if (fpsT >= 1) { fpsShow = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; }
  tick(dt);
  updateCamera(); overlays();
  renderer.render(scene, camera);
  $('#fps').textContent = t('fps', { fps: fpsShow, n: people.length });
  const gs = $('#gapStat'), ok = minGap >= GAP - .005;
  gs.textContent = minGap === Infinity ? t('gapNone', { g: GAP }) : t('gap', { d: minGap.toFixed(2), g: GAP });
  gs.className = 'stat ' + (ok ? 'ok' : 'bad');
  const b = busy(); if (b !== wasBusy) { wasBusy = b; for (const e of document.querySelectorAll('#mainBtns .btn, #moreBtns .btn')) e.disabled = b; }
}
resize(); new ResizeObserver(resize).observe(stage);
loadAll().then(() => {
  build(); renderUI();
  // for still screenshots: ?case=<id>[,<id>] plays it, ?adv=<seconds> runs that much before the first frame
  const cs = (Q.get('case') || '').split(',').filter(k => CASES[k]);
  const adv = Math.min(120, +Q.get('adv') || 0), gapS = +Q.get('gapS') || 0;
  cs.forEach((k, i) => { if (!i) play(k); else timers.push({ at: gapS * i, f: () => CASES[k]() }); });
  for (let s = 0; s < adv; s += 1 / 30) tick(1 / 30);
  for (const k of ['dist', 'az', 'el', 'tx', 'tz']) if (Q.get(k)) cam[k] = +Q.get(k);
  if (Q.get('debug')) document.body.insertAdjacentHTML('beforeend', '<pre id="dbg">' + JSON.stringify({ minGap: +minGap.toFixed(3), pushes, people: people.map(p => [p.name, +p.x.toFixed(2), +p.z.toFixed(2), +p.yaw.toFixed(2), p.st, p.talk ? p.talk.kind + ':' + p.talk.phase : '', p.cur, p.goal ? [+p.goal.x.toFixed(2), +p.goal.z.toFixed(2), p.push ? 'push' : '', (p.path || []).length, +p.home.x.toFixed(2), +p.home.z.toFixed(2)] : '']) }) + '</pre>');
  last = performance.now(); requestAnimationFrame(frame);
});
})();
