<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>待答问题 Mock</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --fg:#1d1d1b; --muted:#6b6a64; --line:#e2e0d8;
  --chip:#efede6; --accent:#2f5bd3; --accent-fg:#ffffff; --accent-soft:#e6ecfb;
  --ok:#1f7a45; --ok-soft:#e2f3e8; --warn-bg:#fff4d6; --warn-fg:#6b4a00; --warn-line:#e8c766;
  --bad:#a3261f; --mock:#5b2bbf; --mock-soft:#efe8fd; --shadow:0 1px 2px rgba(0,0,0,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151513; --card:#1f1f1c; --fg:#ecebe6; --muted:#a3a198; --line:#34332e;
    --chip:#2a2926; --accent:#7f9fff; --accent-fg:#0d1530; --accent-soft:#232c48;
    --ok:#6fd39a; --ok-soft:#1b3326; --warn-bg:#3a2f12; --warn-fg:#f3d98c; --warn-line:#6e5a1f;
    --bad:#ff8a80; --mock:#c3a6ff; --mock-soft:#2b2340; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151513; --card:#1f1f1c; --fg:#ecebe6; --muted:#a3a198; --line:#34332e;
  --chip:#2a2926; --accent:#7f9fff; --accent-fg:#0d1530; --accent-soft:#232c48;
  --ok:#6fd39a; --ok-soft:#1b3326; --warn-bg:#3a2f12; --warn-fg:#f3d98c; --warn-line:#6e5a1f;
  --bad:#ff8a80; --mock:#c3a6ff; --mock-soft:#2b2340; --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow-x:hidden}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}

/* mock-only bar: never in the real page */
.mockbar{background:var(--mock-soft);color:var(--mock);border-bottom:1px dashed var(--mock);font-size:13px}
.mockbar .wrap{padding-top:8px;padding-bottom:8px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.mockbar b{letter-spacing:.05em}
.mockbar .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.mockbar button{border:1px solid var(--mock);background:transparent;color:var(--mock);border-radius:6px;padding:2px 8px;font-size:13px}
.mockbar button[aria-pressed="true"]{background:var(--mock);color:var(--card)}

header{padding:20px 0 8px}
h1{font-size:22px;line-height:1.25;margin:0}
.sub{color:var(--muted);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.progress{height:6px;background:var(--line);border-radius:3px;margin:14px 0 6px;overflow:hidden}
.progress>div{height:100%;width:0;background:var(--ok);transition:width .25s}
.countrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.count{font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--chip);border-radius:8px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:6px;padding:4px 12px;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow);font-weight:600}

.banner{border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-top:12px;box-shadow:var(--shadow)}
.pos{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pos .n{font-weight:700;color:var(--fg);font-size:15px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--fg);white-space:nowrap}
.chip.task{background:var(--accent-soft);color:var(--accent);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.q{font-size:19px;line-height:1.4;font-weight:650;margin:12px 0 14px;overflow-wrap:anywhere}
.field{margin:10px 0}
.field .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.field .v{overflow-wrap:anywhere;white-space:pre-wrap}
.field .v.ev{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;background:var(--chip);border-radius:8px;padding:6px 8px}
.rec{border-left:3px solid var(--ok);background:var(--ok-soft);border-radius:0 8px 8px 0;padding:6px 10px}
.rec .k{color:var(--ok);font-weight:700}
.missing{color:var(--muted)}

.opts{display:flex;flex-direction:column;gap:8px;margin:16px 0 10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px;overflow-wrap:anywhere}
.opt:hover{border-color:var(--accent)}
.opt .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--muted)}
.opt .t{flex:1;min-width:0}
.opt .tag{flex:none;font-size:11px;font-weight:700;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:0 7px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .dot{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--card)}
.opt:disabled{cursor:not-allowed;opacity:.6}
label.note{display:block;font-size:13px;color:var(--muted);margin-top:6px}
textarea{width:100%;min-height:72px;resize:vertical;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;margin-top:4px}
textarea:focus,.opt:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.save{font-size:13px;min-height:20px;margin-top:6px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.save.ok{color:var(--ok)} .save.bad{color:var(--bad)}
.linkbtn{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}

.nav{display:flex;gap:8px;margin-top:16px}
.nav button{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.nav button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.nav button:disabled{opacity:.4;cursor:default}

.filter{display:flex;gap:6px;margin:14px 0 4px}
.filter button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:13px}
.filter button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.rows{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px}
.row:hover{border-color:var(--accent)}
.row .num{flex:none;width:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.row .body{flex:1;min-width:0}
.row .rq{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row .ra{font-size:13px;color:var(--ok);margin-top:2px;overflow-wrap:anywhere}
.row .meta{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.st{flex:none;font-size:12px;border-radius:999px;padding:1px 8px;white-space:nowrap}
.st.answered{background:var(--ok-soft);color:var(--ok)}
.st.skipped{background:var(--warn-bg);color:var(--warn-fg)}
.st.open{background:var(--chip);color:var(--muted)}

.done{text-align:center;padding:28px 16px}
.done .big{font-size:22px;font-weight:700;margin-bottom:6px}
.done .jump{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.done .jump button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px}
.textout{margin-top:16px;text-align:left}
.textout textarea{min-height:180px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.secbtn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;margin-top:14px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
@media (max-width:420px){ .q{font-size:17.5px} .card{padding:16px 14px} h1{font-size:20px} }
</style>
</head>

<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("sq-data").textContent);
var ALL_LABELS = JSON.parse(document.getElementById("sq-labels").textContent);
var Q = Array.isArray(DATA.questions) ? DATA.questions : [];
var L = ALL_LABELS[DATA.lang] || ALL_LABELS.en;

var S = {
  view: "one",          // one | list | done
  idx: 0,
  filterOpen: false,
  answers: {},          // id -> {answer, note, answeredAt}
  skipped: {},          // id -> true (this visit only; skipped = still open)
  status: {},           // id -> {cls, text}
  db: null,             // the db namespace, null = absent
  dbState: "wait",      // wait | on | off
  readOnly: false,
  textShown: false
};

function fmt(s, v){ return String(s).replace(/\{(\w+)\}/g, function(_, k){ return v && v[k] != null ? v[k] : ""; }); }
function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function $(id){ return document.getElementById(id); }
function hhmm(iso){ try { var d = new Date(iso); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); } catch(e){ return ""; } }
function isAnswered(q){ var a = S.answers[q.id]; return !!(a && String(a.answer || "").trim()); }
function answeredCount(){ var n = 0; Q.forEach(function(q){ if (isAnswered(q)) n++; }); return n; }
function srcLabel(q){ return q.source === "todo" ? (L["src_" + q.kind] || L.src_question) : (L["src_" + q.source] || q.source); }
// Recommended option first; the rest keep their order.
function orderedOptions(q){
  var opts = Array.isArray(q.options) ? q.options.slice() : [];
  var r = String(q.rec || "").trim().toLowerCase(), at = -1;
  opts.forEach(function(o, i){ if (at < 0 && r && String(o).trim().toLowerCase() === r) at = i; });
  if (at > 0) { var x = opts.splice(at, 1)[0]; opts.unshift(x); at = 0; }
  return {opts: opts, rec: at};
}

/* ---------- saving: one write at a time per document, only on change ---------- */
var W = {}; // id -> {busy, pending, last}
function bodyFor(q){
  var a = S.answers[q.id];
  if (!a || !String(a.answer || "").trim()) return null;   // nothing left -> delete
  return {answer: String(a.answer), note: String(a.note || ""), answeredAt: a.answeredAt};
}
function queueSave(q){
  if (!S.db) { S.status[q.id] = {cls: "bad", text: L.unsaved}; paintSave(q); return; }
  var w = W[q.id] || (W[q.id] = {busy: false, pending: undefined, last: undefined});
  w.pending = bodyFor(q);
  pump(q, w);
}
function pump(q, w){
  if (w.busy || w.pending === undefined) return;
  var body = w.pending; w.pending = undefined;
  var key = JSON.stringify(body);
  if (key === w.last) return;
  w.busy = true;
  S.status[q.id] = {cls: "", text: L.saving}; paintSave(q);
  var ref = S.db.collection("answers").doc(q.id);
  var tries = 0;
  (function attempt(){
    tries++;
    (body === null ? ref.delete() : ref.set(body)).then(function(){
      w.last = key; w.busy = false;
      S.status[q.id] = body === null ? {cls: "", text: ""} : {cls: "ok", text: fmt(L.saved, {t: hhmm(body.answeredAt)})};
      paintSave(q); pump(q, w);
    }, function(e){
      if (e && e.code === "unavailable" && tries < 2) { setTimeout(attempt, 400 + Math.random() * 600); return; }
      w.busy = false;
      if (e && (e.code === "invalid_argument" || e.code === "not_granted")) S.readOnly = true;
      S.status[q.id] = {cls: "bad", text: fmt(L.saveFail, {e: (e && e.code) || "error"})};
      paintSave(q); paintBanners(); pump(q, w);
    });
  })();
}
var typingTimer = null;
function setAnswer(q, answer, note){
  var prev = S.answers[q.id] || {};
  var next = {answer: answer, note: note};
  if (prev.answer === next.answer && (prev.note || "") === (next.note || "")) return;
  next.answeredAt = new Date().toISOString();
  S.answers[q.id] = next;
  delete S.skipped[q.id];
  paintHead();
}

/* ---------- capabilities: render first, light up later ---------- */
function startCaps(useFn){
  S.dbState = "wait";
  var c = useFn ? useFn : (window.claude && typeof window.claude.use === "function" ? function(n){ return window.claude.use(n); } : null);
  if (!c) { S.dbState = "off"; paintAll(); return; }
  var timer = setTimeout(function(){ if (S.dbState === "wait") { S.dbState = "off"; paintAll(); } }, 10000);
  Promise.resolve(c("db")).then(function(db){
    if (!db) { clearTimeout(timer); S.dbState = "off"; paintAll(); return; }
    S.db = db;
    return db.collection("answers").get().then(function(snap){
      clearTimeout(timer);
      var ids = {}; Q.forEach(function(q){ ids[q.id] = 1; });
      (snap && snap.docs || []).forEach(function(d){
        if (!d.exists || !ids[d.id]) return;
        var v = d.data() || {};
        S.answers[d.id] = {answer: String(v.answer || ""), note: String(v.note || ""), answeredAt: String(v.answeredAt || "")};
        W[d.id] = {busy: false, pending: undefined, last: JSON.stringify({answer: String(v.answer || ""), note: String(v.note || ""), answeredAt: v.answeredAt})};
        S.status[d.id] = {cls: "ok", text: fmt(L.saved, {t: hhmm(v.answeredAt)})};
      });
      S.dbState = "on"; paintAll();
    });
  }).catch(function(){ clearTimeout(timer); S.db = null; S.dbState = "off"; paintAll(); });
  Promise.resolve(c("user")).then(function(user){
    if (!user || typeof user.can !== "function") return;
    return user.can("data.write").then(function(ok){ if (ok === false) { S.readOnly = true; paintAll(); } });
  }).catch(function(){});
}

/* ---------- painting ---------- */
function paintHead(){
  document.title = L.title;
  $("h-title").textContent = L.title;
  $("h-sub").textContent = fmt(L.sub, {repo: DATA.repo || "", n: Q.length, t: DATA.generated || ""});
  var a = answeredCount();
  $("h-count").textContent = fmt(L.count, {a: a, n: Q.length});
  $("h-bar").style.width = (Q.length ? Math.round(100 * a / Q.length) : 0) + "%";
  $("t-one").textContent = L.one; $("t-list").textContent = L.list;
  $("t-one").setAttribute("aria-pressed", String(S.view !== "list"));
  $("t-list").setAttribute("aria-pressed", String(S.view === "list"));
}
function paintBanners(){
  var nodb = $("b-nodb"); nodb.textContent = L.noDb; nodb.hidden = S.dbState !== "off";
  var ro = $("b-ro"); ro.textContent = L.ro; ro.hidden = !(S.readOnly && S.dbState === "on");
}
function paintSave(q){
  var box = document.querySelector('[data-save="1"]');
  if (!box || box.getAttribute("data-id") !== q.id) return;
  var st = S.status[q.id] || {cls: "", text: ""};
  box.className = "save " + (st.cls || "");
  box.firstChild.textContent = st.text || "";
  box.lastChild.hidden = !isAnswered(q) || S.readOnly;
}
function fieldRow(k, v, cls, vcls){
  var has = !!(v && String(v).trim());
  var f = el("div", "field" + (cls ? " " + cls : ""));
  f.appendChild(el("div", "k", k));
  f.appendChild(el("div", "v" + (has ? (vcls ? " " + vcls : "") : " missing"), has ? v : L.none));
  return f;
}
function paintOne(main){
  if (!Q.length) { main.appendChild(el("div", "empty", L.empty)); return; }
  var q = Q[S.idx], ord = orderedOptions(q), a = S.answers[q.id] || {answer: "", note: ""};
  var card = el("section", "card");
  var pos = el("div", "pos");
  pos.appendChild(el("span", "n", (S.idx + 1) + " / " + Q.length));
  var chips = el("span"); chips.style.display = "flex"; chips.style.gap = "6px"; chips.style.flexWrap = "wrap"; chips.style.minWidth = "0";
  chips.appendChild(el("span", "chip task", q.task || L.none));
  chips.appendChild(el("span", "chip", srcLabel(q)));
  pos.appendChild(chips);
  card.appendChild(pos);
  card.appendChild(el("div", "q", q.question));
  card.appendChild(fieldRow(L.why, q.why));
  card.appendChild(fieldRow(L.evidence, q.evidence, "", "ev"));
  card.appendChild(fieldRow(L.rec, q.rec, "rec"));

  var choices = ord.opts.slice(), recIdx = ord.rec;
  if (!choices.length && q.rec) { choices = [L.acceptRec]; recIdx = -2; }   // no options, but a recommendation
  var chosen = -1;
  choices.forEach(function(o, i){
    var val = recIdx === -2 ? q.rec : o;
    if (a.answer && a.answer === val) chosen = i;
  });
  var noteText = chosen >= 0 ? (a.note || "") : (a.answer || "");
  if (choices.length) {
    var opts = el("div", "opts");
    choices.forEach(function(o, i){
      var b = el("button", "opt"); b.type = "button";
      b.setAttribute("aria-pressed", String(i === chosen));
      b.disabled = S.readOnly;
      b.appendChild(el("span", "dot"));
      b.appendChild(el("span", "t", o));
      if (i === recIdx || recIdx === -2) b.appendChild(el("span", "tag", L.recTag));
      b.addEventListener("click", function(){
        var val = recIdx === -2 ? q.rec : o;
        var ta = card.querySelector("textarea"), t = ta ? ta.value : "";
        var cur = S.answers[q.id] || {};
        var curChosen = cur.answer === val;
        if (curChosen) setAnswer(q, t.trim() ? t : "", "");      // click again = unselect; the text becomes the answer
        else setAnswer(q, val, t);
        queueSave(q); paintMain();
      });
      opts.appendChild(b);
    });
    card.appendChild(opts);
  }
  var lab = el("label", "note", L.note); lab.htmlFor = "sq-note";
  var ta = el("textarea"); ta.id = "sq-note"; ta.placeholder = L.notePh; ta.value = noteText; ta.disabled = S.readOnly;
  ta.addEventListener("input", function(){
    var cur = S.answers[q.id] || {}, val = ta.value;
    var picked = chosen >= 0 ? (recIdx === -2 ? q.rec : choices[chosen]) : "";
    if (picked && cur.answer === picked) setAnswer(q, picked, val); else setAnswer(q, val, "");
    clearTimeout(typingTimer);
    typingTimer = setTimeout(function(){ queueSave(q); paintList(); }, 700);
  });
  ta.addEventListener("blur", function(){ clearTimeout(typingTimer); queueSave(q); });
  card.appendChild(lab); card.appendChild(ta);

  var save = el("div", "save"); save.setAttribute("data-save", "1"); save.setAttribute("data-id", q.id);
  save.appendChild(el("span"));
  var clr = el("button", "linkbtn", L.clear); clr.type = "button";
  clr.addEventListener("click", function(){ S.answers[q.id] = {answer: "", note: "", answeredAt: new Date().toISOString()}; queueSave(q); paintMain(); paintHead(); });
  save.appendChild(clr);
  card.appendChild(save);

  var nav = el("div", "nav");
  var back = el("button", "", L.back); back.type = "button"; back.disabled = S.idx === 0;
  back.addEventListener("click", function(){ flushTyping(q); S.idx--; paintMain(); });
  var skip = el("button", "", L.skip); skip.type = "button";
  skip.addEventListener("click", function(){ flushTyping(q); if (!isAnswered(q)) S.skipped[q.id] = true; go(1); });
  var last = S.idx === Q.length - 1;
  var next = el("button", "primary", last ? L.finish : L.next); next.type = "button";
  next.addEventListener("click", function(){ flushTyping(q); go(1); });
  nav.appendChild(back); nav.appendChild(skip); nav.appendChild(next);
  card.appendChild(nav);
  main.appendChild(card);
  paintSave(q);
}
function flushTyping(q){ if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; queueSave(q); } }
function go(d){
  if (S.idx + d >= Q.length) { S.view = "done"; paintAll(); window.scrollTo(0, 0); return; }
  S.idx = Math.max(0, S.idx + d); paintMain(); window.scrollTo(0, 0);
}
function rowFor(q, i){
  var li = el("li");
  var b = el("button", "row"); b.type = "button";
  b.appendChild(el("span", "num", String(i + 1)));
  var body = el("span", "body");
  body.appendChild(el("span", "rq", q.question));
  var meta = el("span", "meta", (q.task || "") + " · " + srcLabel(q)); meta.style.display = "block"; body.appendChild(meta);
  if (isAnswered(q)) { var ra = el("span", "ra", L.ans + S.answers[q.id].answer); ra.style.display = "block"; body.appendChild(ra); }
  b.appendChild(body);
  var st = isAnswered(q) ? "answered" : (S.skipped[q.id] ? "skipped" : "open");
  b.appendChild(el("span", "st " + st, L["st_" + st]));
  b.addEventListener("click", function(){ S.idx = i; S.view = "one"; paintAll(); window.scrollTo(0, 0); });
  li.appendChild(b);
  return li;
}
function paintList(){
  if (S.view !== "list") return;
  var main = $("main"); main.textContent = "";
  var f = el("div", "filter");
  [["all", false], ["openOnly", true]].forEach(function(p){
    var b = el("button", "", L[p[0]]); b.type = "button"; b.setAttribute("aria-pressed", String(S.filterOpen === p[1]));
    b.addEventListener("click", function(){ S.filterOpen = p[1]; paintList(); });
    f.appendChild(b);
  });
  main.appendChild(f);
  var ul = el("ul", "rows");
  Q.forEach(function(q, i){ if (S.filterOpen && isAnswered(q)) return; ul.appendChild(rowFor(q, i)); });
  main.appendChild(ul);
  main.appendChild(doneBlock(true));
}
function answersText(){
  return Q.map(function(q, i){
    var a = S.answers[q.id];
    var line = (i + 1) + ". [" + q.id + "] " + q.question + "\n   " + L.ans + (isAnswered(q) ? a.answer : L.st_open);
    if (a && a.note && isAnswered(q) && a.note !== a.answer) line += "\n   + " + a.note;
    return line;
  }).join("\n");
}
function doneBlock(compact){
  var box = el("section", compact ? "done card" : "done card");
  var openQs = []; Q.forEach(function(q, i){ if (!isAnswered(q)) openQs.push(i); });
  if (!openQs.length) {
    box.appendChild(el("div", "big", L.doneAll));
    box.appendChild(el("div", "", L.doneAllSub));
  } else {
    box.appendChild(el("div", "big", fmt(L.doneSome, {k: openQs.length})));
    box.appendChild(el("div", "", L.doneSomeSub));
    var j = el("div", "jump");
    openQs.forEach(function(i){
      var b = el("button", "", String(i + 1)); b.type = "button"; b.title = Q[i].question;
      b.addEventListener("click", function(){ S.idx = i; S.view = "one"; paintAll(); window.scrollTo(0, 0); });
      j.appendChild(b);
    });
    box.appendChild(j);
  }
  var tb = el("button", "secbtn", L.showText); tb.type = "button";
  tb.addEventListener("click", function(){ S.textShown = !S.textShown; paintMain(); });
  box.appendChild(tb);
  if (S.textShown) {
    var out = el("div", "textout");
    var ta = el("textarea"); ta.readOnly = true; ta.value = answersText();
    out.appendChild(ta);
    var cp = el("button", "secbtn", L.copy); cp.type = "button";
    cp.addEventListener("click", function(){
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch(e) {}
      if (!ok && navigator.clipboard) navigator.clipboard.writeText(ta.value).then(function(){ cp.textContent = L.copied; }, function(){});
      else if (ok) cp.textContent = L.copied;
    });
    out.appendChild(cp);
    box.appendChild(out);
  }
  return box;
}
function paintMain(){
  var main = $("main");
  if (S.view === "list") { paintList(); return; }
  main.textContent = "";
  if (S.view === "done") { main.appendChild(doneBlock(false)); return; }
  paintOne(main);
}
function paintAll(){ document.documentElement.lang = DATA.lang === "zh" ? "zh" : "en"; paintHead(); paintBanners(); paintMain(); }

$("t-one").addEventListener("click", function(){ S.view = "one"; paintAll(); });
$("t-list").addEventListener("click", function(){ S.view = "list"; paintAll(); });

/* ---------- MOCK ONLY: a fake db with the same calls, kept in localStorage, and the toolbar ---------- */
var MOCK_KEY = "sq-mock-answers";
function mockStore(){ try { return JSON.parse(localStorage.getItem(MOCK_KEY) || "{}") || {}; } catch(e){ return {}; } }
function mockWrite(o){ try { localStorage.setItem(MOCK_KEY, JSON.stringify(o)); } catch(e){} }
function later(v, ms){ return new Promise(function(r){ setTimeout(function(){ r(v); }, ms); }); }
var fakeDb = {
  collection: function(name){
    return {
      get: function(){ var s = mockStore(); return later({docs: Object.keys(s).map(function(id){ return {id: id, exists: true, data: function(){ return s[id]; }}; })}, 250); },
      doc: function(id){
        return {
          set: function(body){ return later(null, 350).then(function(){ if (mockMode === "ro") { var e = new Error("no write"); e.code = "invalid_argument"; throw e; } var s = mockStore(); s[id] = body; mockWrite(s); }); },
          delete: function(){ return later(null, 200).then(function(){ var s = mockStore(); delete s[id]; mockWrite(s); }); },
          get: function(){ var s = mockStore(); return later({id: id, exists: id in s, data: function(){ return s[id]; }}, 150); }
        };
      }
    };
  }
};
var fakeUser = { can: function(){ return later(mockMode === "ro" ? false : true, 100); } };
var mockMode = "on";
function mockUse(name){
  if (mockMode === "off") return later(null, 300);
  return later(name === "db" ? fakeDb : name === "user" ? fakeUser : null, 300);
}
function reopen(){
  S.answers = {}; S.skipped = {}; S.status = {}; S.db = null; S.readOnly = false; W = {}; S.view = "one"; S.idx = 0; S.textShown = false;
  paintAll(); startCaps(mockUse);
}
function press(ids, on){ ids.forEach(function(i){ $(i).setAttribute("aria-pressed", String(i === on)); }); }
$("m-db-on").onclick = function(){ mockMode = "on"; press(["m-db-on","m-db-off","m-db-ro"], "m-db-on"); reopen(); };
$("m-db-off").onclick = function(){ mockMode = "off"; press(["m-db-on","m-db-off","m-db-ro"], "m-db-off"); reopen(); };
$("m-db-ro").onclick = function(){ mockMode = "ro"; press(["m-db-on","m-db-off","m-db-ro"], "m-db-ro"); reopen(); };
$("m-zh").onclick = function(){ DATA.lang = "zh"; L = ALL_LABELS.zh; press(["m-zh","m-en"], "m-zh"); paintAll(); };
$("m-en").onclick = function(){ DATA.lang = "en"; L = ALL_LABELS.en; press(["m-zh","m-en"], "m-en"); paintAll(); };
$("m-reset").onclick = function(){ mockWrite({}); reopen(); };
$("m-reload").onclick = reopen;
/* ---------- end MOCK ONLY ---------- */

paintAll();
// Real page: startCaps() with no argument (window.claude.use). The mock uses its fake db.
startCaps(mockUse);
})();
</script>
</body>
