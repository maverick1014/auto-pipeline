  $("all-rec").textContent = L.allRec; $("copy").textContent = L.copy;
  if (!clearArmed) $("clear").textContent = L.clear;
  $("all-rec").disabled = $("clear").disabled = S.readOnly;
}
function paintHead() {
  document.title = L.title;
  document.documentElement.lang = DATA.lang === "zh" ? "zh" : "en";
  $("h1").textContent = fmt(L.h1, { n: Q.length, date: String(DATA.generated || "").slice(0, 10) });
  $("intro").textContent = L.intro;
}
function paintBanners() {
  $("b-nodb").textContent = L.noDb; $("b-nodb").hidden = S.dbState !== "off";
  $("b-ro").textContent = L.ro; $("b-ro").hidden = !(S.readOnly && S.dbState === "on");
}
var noteTimers = {};
function card(q, n) {
  var sec = el("section", "q" + (isAnswered(q) ? " done" : "")); sec.id = "q" + n;
  sec.appendChild(el("span", "num", String(n)));
  var head = el("div");
  head.appendChild(inline(el("h3"), q.title));
  var sub = [q.sub, q.since ? fmt(L.since, { d: shortDate(q.since) }) : ""].filter(function (x) { return x && String(x).trim(); }).join(" · ");
  if (sub) head.appendChild(inline(el("div", "amount"), sub));
  sec.appendChild(head);
  var body = el("div");
  var facts = Array.isArray(q.facts) ? q.facts.filter(function (f) { return Array.isArray(f) && f.length >= 2; }) : [];
  if (facts.length) {
    var ul = el("ul", "facts");
    facts.forEach(function (f) { var li = el("li"); li.appendChild(el("span", "k", f[0])); li.appendChild(inline(el("span"), f[1])); ul.appendChild(li); });
    body.appendChild(ul);
  }
  var a = S.ans[q.id] || { pick: "", note: "" };
  if (opts(q).length) {
    var box = el("div", "opts"); box.setAttribute("role", "radiogroup"); box.setAttribute("aria-label", q.title);
    opts(q).forEach(function (o) {
      var letter = String(o.letter);
      var b = el("button", "opt"); b.type = "button"; b.setAttribute("role", "radio");
      b.setAttribute("aria-checked", String(a.pick === letter)); b.disabled = S.readOnly;
      b.appendChild(el("span", "l", letter));
      var t = inline(el("span"), o.text);
      if (o.rec) t.appendChild(el("span", "rec", L.rec));
      b.appendChild(t);
      b.addEventListener("click", function () {
        var cur = S.ans[q.id] || { pick: "", note: "" };
        if (setAnswer(q, cur.pick === letter ? "" : letter, cur.note || "")) { save(q); refresh(q, n); }   // click again = unpick
      });
      box.appendChild(b);
    });
    body.appendChild(box);
  }
  var ta = el("textarea", "note"); ta.placeholder = opts(q).length ? L.notePh : L.noteOnlyPh;
  ta.value = a.note || ""; ta.disabled = S.readOnly; ta.setAttribute("aria-label", q.title);
  ta.addEventListener("input", function () {
    var cur = S.ans[q.id] || { pick: "", note: "" };
    setAnswer(q, cur.pick || "", ta.value);
    sec.classList.toggle("done", isAnswered(q)); paintBar();
    clearTimeout(noteTimers[q.id]); noteTimers[q.id] = setTimeout(function () { save(q); }, 700);
  });
  ta.addEventListener("blur", function () { clearTimeout(noteTimers[q.id]); save(q); });
  body.appendChild(ta);
  var st = S.status[q.id] || { cls: "", text: "" };
  var sv = el("div", "save " + st.cls, st.text); sv.setAttribute("data-id", q.id); sv.setAttribute("aria-live", "polite");
  body.appendChild(sv);
  sec.appendChild(body);
  return sec;
}
function refresh(q, n) {
  paintBar();
  var old = $("q" + n); if (old) old.parentNode.replaceChild(card(q, n), old);
}
// Groups: by task, in the order the tasks first come; numbers run on across groups (the writer already ordered them).
function groupsOf() {
  var out = [], at = {};
  Q.forEach(function (q, i) {
    var k = String(q.task || "");
    if (!(k in at)) { at[k] = out.length; out.push({ task: k, items: [] }); }
    out[at[k]].items.push({ q: q, n: i + 1 });
  });
  return out;
}
function paintCards() {
  var root = $("groups"); root.textContent = "";
  if (!Q.length) { root.appendChild(el("p", "empty", L.empty)); return; }
  var intros = DATA.intros || {};
  groupsOf().forEach(function (g) {
    var sec = el("section", "group");
    var gh = el("div", "group-head"), h2 = el("h2");
    h2.appendChild(document.createTextNode(g.task));
    var first = g.items[0].n, last = g.items[g.items.length - 1].n;
    h2.appendChild(el("span", "range", first === last ? String(first) : first + "–" + last));
    gh.appendChild(h2);
    if (intros[g.task]) gh.appendChild(inline(el("p"), intros[g.task]));
    sec.appendChild(gh);
    g.items.forEach(function (it) { sec.appendChild(card(it.q, it.n)); });
    root.appendChild(sec);
  });
}
function paintAll() { paintHead(); paintBar(); paintBanners(); paintCards(); }

/* ---------- the bar ---------- */
var toastTimer = null;
function toast(text) { var t = $("toast"); t.textContent = text; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2600); }
function copyText() {
  var lines = [];
  Q.forEach(function (q, i) {
    var a = S.ans[q.id]; if (!a) return;
    var note = String(a.note || "").replace(/\s+/g, " ").trim();
    if (!a.pick && !note) return;
    lines.push((i + 1) + (a.pick || "") + (note ? " — " + note : ""));
  });
  return lines.join("\n");
}
$("copy").addEventListener("click", function () {
  var text = copyText();
  if (!text) { toast(L.tNone); return; }
  var box = $("copybox"); box.value = text; $("copyrow").hidden = false;
  var done = function () { toast(fmt(L.tCopied, { k: text.split("\n").length })); };
  var fail = function () { box.focus(); box.select(); toast(L.tCopyFail); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () {
    box.select(); var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ok ? done() : fail();
  });
  else { box.select(); var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ok ? done() : fail(); }
});
$("copyclose").addEventListener("click", function () { $("copyrow").hidden = true; });
$("all-rec").addEventListener("click", function () {
  if (S.readOnly) return;
  var k = 0;
  Q.forEach(function (q) {
    var a = S.ans[q.id] || { pick: "", note: "" }, r = recLetter(q);
    if (a.pick || !r) return;            // only the unpicked ones that have a recommendation
    if (setAnswer(q, r, a.note || "")) { save(q); k++; }
  });
  paintCards(); paintBar();
  toast(k ? fmt(L.tAllRec, { k: k }) : L.tAllRecNone);
});
var clearArmed = false, clearTimer = null;
$("clear").addEventListener("click", function () {
  if (S.readOnly) return;
  if (!clearArmed) {   // two taps, no browser dialog
    clearArmed = true; $("clear").textContent = L.clearArm; $("clear").classList.add("armed");
    clearTimer = setTimeout(function () { clearArmed = false; $("clear").classList.remove("armed"); paintBar(); }, 3000);
    return;
  }
  clearTimeout(clearTimer); clearArmed = false; $("clear").classList.remove("armed");
  Q.forEach(function (q) { if (S.ans[q.id] && setAnswer(q, "", "")) save(q); });
  paintCards(); paintBar(); $("copyrow").hidden = true; toast(L.tCleared);
});

/* ---------- capabilities: render first, light up later; never write on load ---------- */
function startCaps(use) {
  S.dbState = "wait";
  if (!use && window.claude && typeof window.claude.use === "function") use = function (n) { return window.claude.use(n); };
  if (!use) { S.dbState = "off"; paintAll(); return; }
  var timer = setTimeout(function () { if (S.dbState === "wait") { S.dbState = "off"; paintBanners(); } }, 10000);
  Promise.resolve(use("db")).then(function (db) {
    if (!db) { clearTimeout(timer); S.dbState = "off"; paintBanners(); return; }
    return db.collection("answers").get().then(function (snap) {
      clearTimeout(timer); S.db = db; S.dbState = "on";
      var byId = {}; Q.forEach(function (q) { byId[q.id] = q; });
      (snap && snap.docs || []).forEach(function (d) {
        var q = byId[d.id]; if (!d.exists || !q) return;
        var v = d.data() || {};
        var pick = String(v.pick || ""); if (pick && !optText(q, pick)) pick = "";   // the options changed: keep only the note
        S.ans[q.id] = { pick: pick, note: String(v.note || ""), answeredAt: String(v.answeredAt || "") };
        W[q.id] = { busy: false, pending: undefined, last: JSON.stringify(v.pick === pick ? { pick: pick, option: String(v.option || ""), note: String(v.note || ""), answeredAt: v.answeredAt } : null) };
        S.status[q.id] = { cls: "", text: fmt(L.saved, { t: hhmm(v.answeredAt) }) };
      });
      paintAll();
    });
  }).catch(function () { clearTimeout(timer); S.db = null; S.dbState = "off"; paintBanners(); });
  Promise.resolve(use("user")).then(function (user) {
    if (!user || typeof user.can !== "function") return;
    return user.can("data.write").then(function (ok) { if (ok === false) { S.readOnly = true; paintAll(); } });
  }).catch(function () {});
}

/* ---------- MOCK ONLY: a fake db with the same calls (kept in localStorage) and the toolbar ---------- */
var mockMode = "on", MOCK_KEY = "sq-mock2-answers";
function mockStore() { try { return JSON.parse(localStorage.getItem(MOCK_KEY) || "{}") || {}; } catch (e) { return {}; } }
function mockWrite(o) { try { localStorage.setItem(MOCK_KEY, JSON.stringify(o)); } catch (e) {} }
function later(v, ms) { return new Promise(function (r) { setTimeout(function () { r(v); }, ms); }); }
var fakeDb = { collection: function () { return {
  get: function () { var s = mockStore(); return later({ docs: Object.keys(s).map(function (id) { return { id: id, exists: true, data: function () { return s[id]; } }; }) }, 250); },
  doc: function (id) { return {
    set: function (b) { return later(null, 300).then(function () { if (mockMode === "ro") { var e = new Error("no write"); e.code = "invalid_argument"; throw e; } var s = mockStore(); s[id] = b; mockWrite(s); }); },
    delete: function () { return later(null, 200).then(function () { var s = mockStore(); delete s[id]; mockWrite(s); }); }
  }; }
}; } };
var fakeUser = { can: function () { return later(mockMode !== "ro", 100); } };
function mockUse(name) { return mockMode === "off" ? later(null, 300) : later(name === "db" ? fakeDb : name === "user" ? fakeUser : null, 300); }
function reopen() { S = { ans: {}, db: null, dbState: "wait", readOnly: false, status: {} }; W = {}; $("copyrow").hidden = true; paintAll(); startCaps(mockUse); }
function press(ids, on) { ids.forEach(function (i) { $(i).setAttribute("aria-pressed", String(i === on)); }); }
var DBB = ["m-db-on", "m-db-off", "m-db-ro"];
$("m-db-on").onclick = function () { mockMode = "on"; press(DBB, "m-db-on"); reopen(); };
$("m-db-off").onclick = function () { mockMode = "off"; press(DBB, "m-db-off"); reopen(); };
$("m-db-ro").onclick = function () { mockMode = "ro"; press(DBB, "m-db-ro"); reopen(); };
$("m-zh").onclick = function () { DATA.lang = "zh"; L = LABELS.zh; press(["m-zh", "m-en"], "m-zh"); paintAll(); };
$("m-en").onclick = function () { DATA.lang = "en"; L = LABELS.en; press(["m-zh", "m-en"], "m-en"); paintAll(); };
$("m-reset").onclick = function () { mockWrite({}); reopen(); };
$("m-reload").onclick = reopen;
/* ---------- end MOCK ONLY ---------- */

paintAll();
startCaps(mockUse);   // real page: startCaps() — window.claude.use, or no db when the file is opened on its own
})();
</script>
</body></html>
