<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agent City · city-ux2 mock</title>
<link rel="icon" href="data:,">
<style>
:root{
  --paper:#ECF1FF; --panel:#FFFFFF; --panel-2:#F3F5FE; --ink:#2A2B45; --ink-2:#585D82; --ink-3:#8D91B3;
  --line:#DCE2F6; --sky:#CFE6FF; --berry:#FF7593; --butter:#FFD36E; --mint:#6FD4A8; --focus:#4D7CFE;
  --build-bg:#E1ECFF; --build-ink:#3160B5; --ask-bg:#FFE1E8; --ask-ink:#C2345A;
  --rest-bg:#DAF5E8; --rest-ink:#1E8657; --walk-bg:#EDEFF7; --walk-ink:#5F6488;
  --gov-bg:#FFF0C7; --gov-ink:#8A6000; --sea:#BFDDF6; --land:#CDE9B4; --land-edge:#9FCB84;
  --round:ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --display:"Fredoka",ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13162A; --panel:#1C2040; --panel-2:#242951; --ink:#EEF0FF; --ink-2:#B0B5DB; --ink-3:#7B81AA;
    --line:#2D3360; --sky:#1B2046; --focus:#8FB0FF;
    --build-bg:#1E3160; --build-ink:#A9C6FF; --ask-bg:#4A1F33; --ask-ink:#FFB0C3;
    --rest-bg:#173D33; --rest-ink:#93E8C0; --walk-bg:#262B50; --walk-ink:#B3B8DE;
    --gov-bg:#43381A; --gov-ink:#FFDD8A; --sea:#1A2A4A; --land:#2F4A34; --land-edge:#476B4C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#13162A; --panel:#1C2040; --panel-2:#242951; --ink:#EEF0FF; --ink-2:#B0B5DB; --ink-3:#7B81AA;
  --line:#2D3360; --sky:#1B2046; --focus:#8FB0FF;
  --build-bg:#1E3160; --build-ink:#A9C6FF; --ask-bg:#4A1F33; --ask-ink:#FFB0C3;
  --rest-bg:#173D33; --rest-ink:#93E8C0; --walk-bg:#262B50; --walk-ink:#B3B8DE;
  --gov-bg:#43381A; --gov-ink:#FFDD8A; --sea:#1A2A4A; --land:#2F4A34; --land-edge:#476B4C;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 var(--round)}
.app{max-width:1500px;margin-inline:auto;padding-inline:16px;padding-block:12px 22px;display:flex;flex-direction:column;gap:10px}
.app.phone{max-width:400px;border:2px dashed var(--ink-3);border-radius:28px;padding-inline:8px}

/* mock-only controls (not part of the page) */
.mockbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 12px;border:1.5px dashed var(--ink-3);border-radius:14px;font-size:12.5px;color:var(--ink-2)}
.mockbar b{font:700 12px/1 var(--mono);color:var(--ink-3);letter-spacing:.06em}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 10px;font:600 12px/1.2 var(--round);color:var(--ink-2);background:var(--panel)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.sign{display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--ink);border-radius:18px;padding:5px 16px 5px 12px;box-shadow:0 3px 0 var(--ink)}
.sign-name{font:700 22px/1 var(--display)}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.stat{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px;color:var(--ink-2)}
.stat b{color:var(--ink);font:700 14px/1 var(--display)}

.repos{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px}
.repo{all:unset;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 9px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);font:600 13px/1.2 var(--round);color:var(--ink-2);white-space:nowrap}
.repo:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.repo[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.repo.all{padding-left:12px}
.rc{width:9px;height:9px;border-radius:50%;background:var(--rc);flex:none;box-shadow:0 0 0 1.5px rgba(255,255,255,.6)}

.stage{position:relative;overflow:hidden;height:calc(100dvh - 330px);min-height:480px;background:var(--sea);border-radius:0}
.app.phone .stage{height:640px;min-height:0}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas.grabbing{cursor:grabbing}
.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.ov > div{position:absolute;left:0;top:0;will-change:transform}
.bub,.tagl{position:absolute;pointer-events:auto;cursor:pointer;white-space:nowrap}
.bub{background:#FFFFFF;color:#2A2B45;border:2px solid #2A2B45;border-radius:14px;padding:3px 10px;font:600 12.5px/1.4 var(--round);max-width:220px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 rgba(42,43,69,.2)}
.bub.ask{border-color:#E4476F}
.tagl{background:var(--c);color:#fff;border-radius:999px;padding:3px 10px;font:600 11.5px/1.3 var(--mono);box-shadow:0 2px 0 rgba(42,43,69,.2)}
/* V3: the hit area is 8 px bigger than the box on every side (16 px in total, at least the 12 asked) */
.bub::after,.tagl::after{content:"";position:absolute;inset:-8px;border-radius:18px}
.showhit .bub::after,.showhit .tagl::after{outline:1.5px dashed #E4476F;background:rgba(228,71,111,.08)}
.bub{overflow:visible}
.bub span{display:block;overflow:hidden;text-overflow:ellipsis}

/* V1: the rail -- always visible on a computer, left side, over the city */
.rail{position:absolute;left:12px;top:12px;bottom:12px;z-index:4;width:264px;display:flex;flex-direction:column;background:color-mix(in srgb,var(--panel) 94%,transparent);border:2px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 rgba(42,43,69,.18);overflow:hidden}
.rail-head{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;border-bottom:1.5px solid var(--line);font-weight:700}
.rail-head .n{font:700 12px/1 var(--mono);color:var(--ink-3)}
.rail-head .x{margin-left:auto}
.rail-list{flex:1;overflow:auto;padding:6px 6px 10px;display:flex;flex-direction:column;gap:6px}
.grp-h{display:flex;align-items:center;gap:7px;padding:6px 6px 2px;font:700 12px/1.2 var(--mono);color:var(--ink-2)}
.grp-h .n{margin-left:auto;color:var(--ink-3);font-weight:600}
.rrows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rrow{display:flex;align-items:stretch;border-radius:11px;border-left:4px solid var(--rc)}
.rrow.sub{margin-left:12px}
.rfocus{all:unset;cursor:pointer;flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:5px 6px 5px 8px;border-radius:0 11px 11px 0}
.rfocus:hover{background:var(--panel-2)}
.rfocus:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.rrow[aria-current="true"] .rfocus{background:var(--ink);color:var(--paper)}
.rrow[aria-current="true"] .rfocus .who small{color:var(--paper);opacity:.75}
.who{display:flex;align-items:center;gap:5px;min-width:0;flex:1}
.who b{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{font:11px/1.3 var(--mono);color:var(--ink-3);white-space:nowrap}
.eye{flex:none;width:14px;height:14px}
.pill{flex:none;display:inline-flex;padding:1px 8px;border-radius:999px;font:600 11px/1.5 var(--round);white-space:nowrap}
.pill.you{background:var(--ask-bg);color:var(--ask-ink);border:1px solid var(--berry)}
.pill.ask{background:var(--gov-bg);color:var(--gov-ink)}
.pill.build{background:var(--build-bg);color:var(--build-ink)}
.pill.walk{background:var(--walk-bg);color:var(--walk-ink)}
.pill.rest{background:var(--rest-bg);color:var(--rest-ink)}
.pill.gov{background:var(--gov-bg);color:var(--gov-ink)}
.ropen{all:unset;cursor:pointer;flex:none;align-self:center;padding:3px 6px;margin:0 2px 0 3px;border-radius:8px;font:600 11px/1.2 var(--round);color:var(--ink-2);border:1.5px solid var(--line);background:var(--panel)}
.ropen:hover{border-color:var(--ink-3)}
.ropen:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.rest-t{all:unset;cursor:pointer;margin:2px 0 0 4px;padding:3px 8px;border-radius:8px;font:600 12px/1.3 var(--round);color:var(--rest-ink)}
.rest-t:hover{background:var(--panel-2)}
.rest-t:focus-visible{outline:2px solid var(--focus)}
.rrow.resting{opacity:.72}

/* the following chip, top middle of the free city area */
.follow{position:absolute;top:12px;z-index:4;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border-radius:999px;background:var(--ink);color:var(--paper);font:600 13px/1.2 var(--round);box-shadow:0 3px 0 rgba(42,43,69,.25);white-space:nowrap;max-width:calc(100% - 24px)}
.follow span{overflow:hidden;text-overflow:ellipsis}
.follow kbd{font:600 11px/1 var(--mono);opacity:.7}
.follow button{all:unset;cursor:pointer;padding:3px 9px;border-radius:999px;background:var(--paper);color:var(--ink);font:600 12px/1.2 var(--round)}
.follow button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.cam{position:absolute;right:12px;bottom:12px;z-index:3;display:flex;flex-direction:column;gap:6px}
.btn{all:unset;cursor:pointer;display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:11px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:600 14px/1 var(--round)}
.btn:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.x{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border-radius:9px;color:var(--ink-2)}
.x:hover{background:var(--panel-2)}
.x:focus-visible{outline:2px solid var(--focus)}

/* the one team window -- moved right of the rail, never under it */
.win{position:absolute;left:288px;top:12px;z-index:5;width:min(700px,calc(100% - 300px));height:calc(100% - 24px);background:var(--panel);border:2px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 rgba(42,43,69,.22);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.win.narrow{height:auto;width:min(320px,calc(100% - 300px))}
.win-head{display:flex;align-items:center;gap:10px}
.win-title{flex:1;min-width:0;font-weight:700;font-size:16px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;flex:1;min-height:0}
.team{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;overflow:auto}
.trow{display:flex;align-items:center;gap:4px;border-radius:11px}
.trow.sub{margin-left:14px}
.tsel{all:unset;cursor:pointer;flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:11px}
.tsel:hover{background:var(--panel-2)}
.tsel:focus-visible{outline:2px solid var(--focus)}
.trow[aria-current="true"] .tsel{background:var(--panel-2);box-shadow:inset 0 0 0 1.5px var(--ink)}
.tsel b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.tfocus{all:unset;cursor:pointer;flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:9px;color:var(--ink-2)}
.tfocus:hover{background:var(--panel-2);color:var(--ink)}
.tfocus:focus-visible{outline:2px solid var(--focus)}
.tfocus[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.side{border-left:1.5px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.p-name{font-weight:700;font-size:15px}
.p-facts{font:12px/1.4 var(--mono);color:var(--ink-3)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.hist li{padding:6px 10px;border-radius:12px;background:var(--panel-2)}
.hist .act{background:none;padding:0 4px;color:var(--ink-3);font-size:12px}
.b-focus{all:unset;cursor:pointer;align-self:flex-start;display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:11px;border:1.5px solid var(--ink);font:600 13px/1.2 var(--round)}
.b-focus:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* phone: the rail becomes a drawer; the window is a bottom sheet; the two never show at once */
.drawer-btn{position:absolute;left:8px;top:8px;z-index:4;display:none;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:2px solid var(--ink);background:var(--panel);font:600 13px/1.2 var(--round);color:var(--ink);cursor:pointer}
.drawer-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.drawer-btn .you{background:var(--ask-bg);color:var(--ask-ink);border-radius:999px;padding:0 6px;font-size:11.5px}
.app.phone .drawer-btn{display:inline-flex}
.app.phone .rail{left:0;top:0;bottom:0;width:min(290px,84%);border-radius:0 18px 18px 0;border-left:0;transform:translateX(-105%);transition:transform .22s ease}
.app.phone .rail.open{transform:none}
.app.phone .win{left:6px;right:6px;top:auto;bottom:6px;width:auto;height:auto;max-height:62%;overflow:auto}
.app.phone .cols{grid-template-columns:minmax(0,1fr)}
.app.phone .side{border-left:0;padding-left:0;border-top:1.5px solid var(--line);padding-top:10px}
.app.phone .follow{top:50px}
@media (prefers-reduced-motion: reduce){ .app.phone .rail{transition:none} }

/* the note: what to click, and the rules */
.note{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.card h3{margin:0 0 6px;font-size:14px}
.card ol,.card ul{margin:0;padding-left:20px}
.card li{margin:2px 0}
.card p{margin:4px 0}
.pad{position:relative;height:190px;border-radius:12px;overflow:hidden;background:var(--sea);border:1.5px solid var(--line);cursor:grab;touch-action:none}
.pad canvas{display:block;width:100%;height:100%}
.pad-out{font:12px/1.4 var(--mono);color:var(--ink-2);margin-top:6px}
code{font:12px/1.4 var(--mono);background:var(--panel-2);border-radius:6px;padding:0 4px}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="mockbar" role="group" aria-label="mock controls">
    <b>MOCK</b>
    <span data-t="m.lang"></span>
    <span class="seg" id="seg-lang"><button type="button" data-v="zh" aria-pressed="true">中文</button><button type="button" data-v="en" aria-pressed="false">English</button></span>
    <span data-t="m.width"></span>
    <span class="seg" id="seg-width"><button type="button" data-v="pc" aria-pressed="true" data-t="m.pc"></button><button type="button" data-v="phone" aria-pressed="false" data-t="m.phone"></button></span>
    <span data-t="m.rowClick"></span>
    <span class="seg" id="seg-row"><button type="button" data-v="focus" aria-pressed="true" data-t="m.rowFocus"></button><button type="button" data-v="both" aria-pressed="false" data-t="m.rowBoth"></button></span>
    <span class="seg" id="seg-hit"><button type="button" data-v="off" aria-pressed="true" data-t="m.hitOff"></button><button type="button" data-v="on" aria-pressed="false" data-t="m.hitOn"></button></span>
  </div>

  <header class="bar">
    <div class="sign"><span class="sign-name">Agent City</span></div>
    <div class="stats" id="stats"></div>
  </header>
  <nav class="repos" id="repos"></nav>

  <div class="stage" id="stage">
    <canvas id="city"></canvas>
    <div class="ov" id="ov"></div>
    <button type="button" class="drawer-btn" id="drawer-btn" aria-controls="rail" aria-expanded="false"></button>
    <aside class="rail" id="rail">
      <div class="rail-head"><span data-t="rail.title"></span><span class="n" id="rail-n"></span><button type="button" class="x" id="rail-x" data-t-aria="btn.close" hidden>✕</button></div>
      <div class="rail-list" id="rail-list"></div>
    </aside>
    <div class="follow" id="follow" role="status" hidden><svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><span id="follow-t"></span><kbd>Esc</kbd><button type="button" id="follow-stop" data-t="follow.stop"></button></div>
    <div class="cam">
      <button type="button" class="btn" id="zin" data-t-aria="btn.zoomIn">+</button>
      <button type="button" class="btn" id="zout" data-t-aria="btn.zoomOut">−</button>
      <button type="button" class="btn" id="zfit" data-t-aria="btn.home">⌂</button>
    </div>
    <div class="win" id="win" role="dialog" aria-labelledby="win-title" hidden>
      <div class="win-head"><div class="win-title" id="win-title"></div><button type="button" class="x" id="win-x" data-t-aria="btn.close">✕</button></div>
      <div id="win-body" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
    </div>
  </div>

  <section class="note">
    <div class="card">
      <h3 data-t="n.clickTitle"></h3>
      <ol id="n-click"></ol>
    </div>
    <div class="card">
      <h3 data-t="n.rulesTitle"></h3>
      <ul id="n-rules"></ul>
    </div>
    <div class="card">
      <h3 data-t="n.v2Title"></h3>
      <p id="n-v2"></p>
      <p><span class="seg" id="seg-v2"><button type="button" data-v="today" aria-pressed="false" data-t="v2.today"></button><button type="button" data-v="A" aria-pressed="true" data-t="v2.A"></button><button type="button" data-v="B" aria-pressed="false" data-t="v2.B"></button></span></p>
      <div class="pad" id="pad"><canvas id="pad-c"></canvas></div>
      <div class="pad-out" id="pad-out"></div>
    </div>
  </section>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
let LANG = 'zh';
const TEXT = {
  zh: {
    'm.lang':'语言', 'm.width':'宽度', 'm.pc':'电脑', 'm.phone':'手机', 'm.rowClick':'点名单一行 =',
    'm.rowFocus':'只跟随（默认）', 'm.rowBoth':'跟随 + 打开窗口', 'm.hitOff':'点击范围：隐藏', 'm.hitOn':'点击范围：显示',
    'rail.title':'在线', 'rail.n':'{n} 人', 'rest.more':'休息 {n} ▸', 'rest.less':'休息 {n} ▾', 'row.open':'打开',
    'row.openAria':'打开 {name} 的窗口', 'row.focusAria':'看 {name}（再点一次停止）', 'drawer':'名单 · {n}',
    'follow.t':'跟随：{name}', 'follow.stop':'停止', 'btn.close':'关闭', 'btn.zoomIn':'放大', 'btn.zoomOut':'缩小', 'btn.home':'回到全部',
    'repo.all':'全部', 'team.title':'{repo} · 团队', 'team.focus':'看它', 'b.focus':'看看它', 'b.type':'{type} · {district}',
    'who.gov':'总督', 'stat.work':'干活', 'stat.you':'等你', 'stat.rest':'休息',
    'hist.a':'出门：{task}', 'hist.b':'Edit ×3 · Read ×2', 'hist.c':'问总督：“{q}”',
    'n.clickTitle':'怎么点', 'n.rulesTitle':'规则（写进 requirements/city.md）', 'n.v2Title':'V2 两指左右滚动',
    'n.click':[
      '左边「在线」名单：按仓库分组，每行 = 名字 + 状态。红色 = 等你。',
      '点「event」里的 <b>worker · 票价计算</b>：镜头飞过去、放大，一直跟着它走；上面出现黑色「跟随」条。城市照常慢慢转，它始终在中间。',

const cam = { tx:0, ty:60, s:.85, a:0 };

const FOLLOW_S = 2.1;

/* the free city area: right of the rail (and of the window) on a computer; above the sheet on a phone */
function freeBox(){

}
function toScreen(x, y){
  const f = freeBox(), c = Math.cos(cam.a), s = Math.sin(cam.a), dx = x - cam.tx, dy = y - cam.ty;
  return [f.cx + cam.s * (dx * c - dy * s), f.cy + cam.s * (dx * s + dy * c)];
}
function screenPan(dx, dy){ // the land moves (dx, dy) px on screen

}
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

function stopFollow(){ if (!follow) return; follow = null; render(); }

/* ---------- people walk ---------- */
function step(dt){
  for (const p of P) {
    if (p.still || p.st === 'rest') continue;
    if (!p.goal) { p.wait -= dt; if (p.wait <= 0) { const R = p.roam || 45, a = Math.random() * 6.28; p.goal = [p.home[0] + Math.cos(a) * R * Math.random(), p.home[1] + Math.sin(a) * R * Math.random()]; } continue; }
    const dx = p.goal[0] - p.x, dy = p.goal[1] - p.y, d = Math.hypot(dx, dy), v = 22 * dt;
    if (d <= v) { p.x = p.goal[0]; p.y = p.goal[1]; p.goal = null; p.wait = 1 + Math.random() * 2.5; }
    else { p.x += dx / d * v; p.y += dy / d * v; }
  }
  cam.a += dt * Math.PI * 2 / ROT_SEC;
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / .9);
    const e = ease(fly.t), lp = fly.live && P.find(q => q.id === fly.live);
    const x = lp ? lp.x : fly.x, y = lp ? lp.y : fly.y;
    cam.tx = fly.fx + (x - fly.fx) * e; cam.ty = fly.fy + (y - fly.fy) * e; cam.s = fly.fs + (fly.s - fly.fs) * e;
    if (fly.t >= 1) fly = null;
  } else if (follow) {
    const p = P.find(q => q.id === follow);
    if (!p) stopFollow(); else { cam.tx += (p.x - cam.tx) * .2; cam.ty += (p.y - cam.ty) * .2; }
  }
}
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  for (const r of REPOS) {
    const [x, y] = toScreen(r.x, r.y);
    ctx.beginPath(); ctx.arc(x, y, r.r * cam.s, 0, 7); ctx.fillStyle = css('--land'); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = css('--land-edge'); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, r.r * cam.s - 6, 0, 7); ctx.lineWidth = 2; ctx.strokeStyle = r.rc + '55'; ctx.stroke();
  }
  for (const b of BUILD) {
    const [x, y] = toScreen(b.x, b.y);
    ctx.save(); ctx.translate(x, y); ctx.rotate(cam.a);
    ctx.fillStyle = b.hall ? '#FFD36E' : '#F4F1E8'; ctx.strokeStyle = '#2A2B45'; ctx.lineWidth = 2;
    ctx.fillRect(-b.w * cam.s / 2, -b.h * cam.s / 2, b.w * cam.s, b.h * cam.s);
    ctx.strokeRect(-b.w * cam.s / 2, -b.h * cam.s / 2, b.w * cam.s, b.h * cam.s);
    ctx.restore();
  }
  for (const p of P) {
    const [x, y] = toScreen(p.x, p.y);
    ctx.beginPath(); ctx.arc(x, y, 6 + cam.s * 1.6, 0, 7); ctx.fillStyle = ROLE_C[p.role]; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#fff'; ctx.stroke();
    if (follow === p.id) { ctx.beginPath(); ctx.arc(x, y, 14 + cam.s * 3, 0, 7); ctx.lineWidth = 2; ctx.strokeStyle = '#2A2B45'; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]); }
  }

}

$('#rail-list').addEventListener('click', e => {
  const f = e.target.closest('[data-focus]'), o = e.target.closest('[data-open]'), rt = e.target.closest('[data-rest]');
  if (rt) { const id = rt.dataset.rest; restOpen.has(id) ? restOpen.delete(id) : restOpen.add(id); renderRail(); return; }
  if (o) { if (phone) setDrawer(false); openWin(o.dataset.open); return; }
  if (f) {
    const p = P.find(q => q.id === f.dataset.focus);
    if (follow === p.id) { stopFollow(); return; }
    if (phone) setDrawer(false);
    startFollow(p);
    if (rowMode === 'both') openWin(p.id);
  }
});
function setDrawer(open){
  drawerOpen = open;
  $('#rail').classList.toggle('open', open);
  $('#drawer-btn').setAttribute('aria-expanded', String(open));
  $('#rail-x').hidden = !open;
  if (phone) $('#win').style.visibility = open ? 'hidden' : '';
}
$('#drawer-btn').addEventListener('click', () => setDrawer(!drawerOpen));
$('#rail-x').addEventListener('click', () => setDrawer(false));

/* ---------- the team window / building window ---------- */
function openWin(pid){ selected = pid; winMode = 'team'; if (phone && drawerOpen) setDrawer(false); renderWin(); }
function openBuilding(bid){ selected = bid; winMode = 'b'; renderWin(); }
function renderWin(){
  const w = $('#win');
  if (!winMode) { w.hidden = true; return; }
  w.hidden = false;
  if (winMode === 'b') {
    const b = BUILD.find(x => x.id === selected);
    w.classList.add('narrow');
    $('#win-title').textContent = b.name[LANG];
    $('#win-body').innerHTML = `<p class="p-facts" style="margin:0">${esc(tr('b.type', { type: b.type[LANG], district: b.dist[LANG] }))}</p>`
      + `<button type="button" class="b-focus" data-bfocus="${b.id}"><svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>${esc(tr('b.focus'))}</button>`;
    return;
  }
  w.classList.remove('narrow');
  const p = P.find(q => q.id === selected), rep = repoOf(p.repo);
  $('#win-title').textContent = tr('team.title', { repo: rep.name });
  const list = rows(rep.id).map(r => {
    const q = r.p, [cls, txt] = STATE[q.st];
    return `<li class="trow${r.depth ? ' sub' : ''}" aria-current="${q.id === p.id}"><button type="button" class="tsel" data-sel="${q.id}"><span class="dot" style="--c:${ROLE_C[q.role]}"></span><b>${esc(nm(q))}</b><span class="pill ${cls}">${esc(txt[LANG])}</span></button>`
      + `<button type="button" class="tfocus" data-tfocus="${q.id}" aria-pressed="${follow === q.id}" aria-label="${esc(tr('team.focus'))}" title="${esc(tr('team.focus'))}"><svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></li>`;
  }).join('');
  const [cls, txt] = STATE[p.st];
  $('#win-body').innerHTML = `<div class="cols"><ul class="team">${list}</ul><div class="side">`
    + `<div class="p-name">${esc(nm(p))} <span class="pill ${cls}">${esc(txt[LANG])}</span></div>`
    + `<div class="p-facts">${esc(rep.name)} · main</div>`
    + `<ul class="hist"><li class="act">${esc(tr('hist.a', { task: nm(p) }))}</li><li class="act">${esc(tr('hist.b'))}</li>${p.bub ? `<li>${esc(tr('hist.c', { q: p.bub[LANG] }))}</li>` : ''}</ul></div></div>`;
}
$('#win-body').addEventListener('click', e => {
  const s = e.target.closest('[data-sel]'), f = e.target.closest('[data-tfocus]'), bf = e.target.closest('[data-bfocus]');
  if (f) { const p = P.find(q => q.id === f.dataset.tfocus); follow === p.id ? stopFollow() : startFollow(p); renderWin(); return; }
  if (s) { selected = s.dataset.sel; renderWin(); return; }
  if (bf) { const b = BUILD.find(x => x.id === bf.dataset.bfocus); stopFollow(); flyTo(b.x, b.y, FOLLOW_S); }
});
$('#win-x').addEventListener('click', () => { winMode = null; selected = null; renderWin(); });

/* ---------- the chip, repo tags, stats ---------- */
function renderFollow(){
  const el = $('#follow'), p = follow && P.find(q => q.id === follow);
  el.hidden = !p;
  if (!p) return;
  $('#follow-t').textContent = tr('follow.t', { name: nm(p) });
  el.style.left = freeBox().cx + 'px';
}
$('#follow-stop').addEventListener('click', stopFollow);
function renderRepos(){
  $('#repos').innerHTML = `<button type="button" class="repo all" data-terr="*">${esc(tr('repo.all'))}</button>`
    + REPOS.map(r => `<button type="button" class="repo" data-terr="${r.id}"><span class="rc" style="--rc:${r.rc}"></span>${esc(r.name)}</button>`).join('');
}
$('#repos').addEventListener('click', e => {
  const b = e.target.closest('.repo'); if (!b) return;
  stopFollow();
  if (b.dataset.terr === '*') { home(); return; }
  const r = repoOf(b.dataset.terr); flyTo(r.x, r.y, 1.35);
});
function renderStats(){
  const act = P.filter(p => p.role !== 'gov');
  const work = act.filter(p => ['build', 'walk'].includes(STATE[p.st][0])).length, you = act.filter(p => STATE[p.st][0] === 'you').length, rest = act.filter(p => p.st === 'rest').length;
  $('#stats').innerHTML = `<span class="stat">${esc(tr('stat.work'))} <b>${work}</b></span><span class="stat">${esc(tr('stat.you'))} <b>${you}</b></span><span class="stat">${esc(tr('stat.rest'))} <b>${rest}</b></span>`;
}
function render(){ renderRail(); renderFollow(); if (winMode) renderWin(); }

/* ---------- camera controls ---------- */
$('#zin').addEventListener('click', () => { fly = null; cam.s = Math.min(4, cam.s * 1.4); });
$('#zout').addEventListener('click', () => { fly = null; cam.s = Math.max(.35, cam.s / 1.4); });
$('#zfit').addEventListener('click', home);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && follow) { stopFollow(); e.preventDefault(); } });
let drag = null;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); drag = { x:e.clientX, y:e.clientY, x0:e.clientX, y0:e.clientY, moved:false }; });
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 8) return;
  if (!drag.moved) { drag.moved = true; stopFollow(); fly = null; canvas.classList.add('grabbing'); }
  screenPan(e.clientX - drag.x, e.clientY - drag.y); drag.x = e.clientX; drag.y = e.clientY;
});
canvas.addEventListener('pointerup', e => {
  canvas.classList.remove('grabbing');
  const d = drag; drag = null;
  if (!d || d.moved) return;
  const r = canvas.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  let best = null, bd = 28;
  for (const p of P) { const [x, y] = toScreen(p.x, p.y), dd = Math.hypot(x - px, y - py); if (dd < bd) { bd = dd; best = p; } }
  if (best) { openWin(best.id); return; }
  for (const b of BUILD) { const [x, y] = toScreen(b.x, b.y); if (Math.hypot(x - px, y - py) < Math.max(b.w, b.h) * cam.s / 1.6) { openBuilding(b.id); return; } }
  winMode = null; selected = null; renderWin();
});
/* V2: the rule. A = the fix (land moves the way of (deltaX, deltaY)); today = X the other way; B = web page style */
function wheelLand(dx, dy, mode){
  if (mode === 'today') return [-dx, dy];
  if (mode === 'B') return [-dx, -dy];
  return [dx, dy];
}
stage.addEventListener('wheel', e => {
  if (e.target.closest('.rail') || e.target.closest('.win')) return;
  e.preventDefault();
  if (e.ctrlKey) { cam.s = Math.max(.35, Math.min(4, cam.s * Math.exp(-e.deltaY * .01))); fly = null; return; }
  stopFollow(); fly = null;
  const [lx, ly] = wheelLand(e.deltaX, e.deltaY, v2Mode === 'today' ? 'today' : v2Mode);
  screenPan(lx, ly);
}, { passive:false });

/* ---------- V2 pad ---------- */
const pad = $('#pad'), pc = $('#pad-c'), pctx = pc.getContext('2d');
const padCam = { x:0, y:0 };
function drawPad(){
  const r = pad.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  pc.width = r.width * d; pc.height = r.height * d; pctx.setTransform(d, 0, 0, d, 0, 0);
  pctx.fillStyle = css('--sea'); pctx.fillRect(0, 0, r.width, r.height);
  for (let i = -6; i <= 6; i++) for (let j = -4; j <= 4; j++) {
    const x = r.width / 2 + i * 70 + padCam.x, y = r.height / 2 + j * 60 + padCam.y;
    pctx.fillStyle = css('--land'); pctx.fillRect(x - 28, y - 22, 56, 44);
    pctx.fillStyle = (i + j) % 3 === 0 ? '#FFD36E' : '#F4F1E8'; pctx.fillRect(x - 8, y - 8, 16, 16);
    pctx.fillStyle = '#2A2B45'; pctx.font = '600 10px ui-monospace,monospace'; pctx.fillText(`${i},${j}`, x - 10, y + 20);
  }
}
pad.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey) return;
  const [lx, ly] = wheelLand(e.deltaX, e.deltaY, v2Mode);
  padCam.x += lx; padCam.y += ly;
  const dir = [];
  if (Math.abs(lx) >= 1) dir.push(tr(lx > 0 ? 'dir.r' : 'dir.l'));
  if (Math.abs(ly) >= 1) dir.push(tr(ly > 0 ? 'dir.d' : 'dir.u'));
  $('#pad-out').textContent = tr('pad.out', { x: e.deltaX.toFixed(0), y: e.deltaY.toFixed(0), dir: dir.join(' + ') || '-' });
  drawPad();
}, { passive:false });

/* ---------- mock controls ---------- */
function seg(id, fn){
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    fn(b.dataset.v);
  });
}
function applyText(){
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = tr(el.dataset.t); });
  document.querySelectorAll('[data-t-aria]').forEach(el => el.setAttribute('aria-label', tr(el.dataset.tAria)));
  $('#rail').setAttribute('aria-label', tr('rail.title'));
  $('#n-click').innerHTML = tr('n.click').map(s => `<li>${s}</li>`).join('');
  $('#n-rules').innerHTML = tr('n.rules').map(s => `<li>${esc(s)}</li>`).join('');
  $('#n-v2').textContent = tr('n.v2');
  renderRepos(); renderStats(); render();
}
seg('#seg-lang', v => { LANG = v; applyText(); });
seg('#seg-width', v => { phone = v === 'phone'; $('#app').classList.toggle('phone', phone); setDrawer(false); requestAnimationFrame(() => { resize(); home(); }); });
seg('#seg-row', v => { rowMode = v; });
seg('#seg-hit', v => { stage.classList.toggle('showhit', v === 'on'); });
seg('#seg-v2', v => { v2Mode = v; });

let last = performance.now(), railT = 0;
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  step(dt); draw(); renderFollow();
  railT += dt; if (railT > 1) { railT = 0; renderStats(); }
  requestAnimationFrame(frame);
}
addEventListener('resize', () => { resize(); drawPad(); });
resize(); applyText(); drawPad(); requestAnimationFrame(frame);
window.mock = { P, cam, startFollow, stopFollow, get follow(){ return follow; }, toScreen, freeBox };
</script>
</body>
