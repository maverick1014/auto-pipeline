<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agent City · city-ux2 mock v2</title>
<link rel="icon" href="data:,">
<style>
:root{
  --paper:#ECF1FF; --panel:#FFFFFF; --panel-2:#F3F5FE; --ink:#2A2B45; --ink-2:#585D82; --ink-3:#8D91B3;
  --line:#DCE2F6; --berry:#FF7593; --focus:#4D7CFE;
  --build-bg:#E1ECFF; --build-ink:#3160B5; --ask-bg:#FFE1E8; --ask-ink:#C2345A;
  --rest-bg:#DAF5E8; --rest-ink:#1E8657; --walk-bg:#EDEFF7; --walk-ink:#5F6488;
  --gov-bg:#FFF0C7; --gov-ink:#8A6000; --sea:#BFDDF6; --land:#CDE9B4; --land-edge:#9FCB84;
  --round:ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --display:"Fredoka",ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rail-w:212px; --msg-w:330px; --tab-w:30px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13162A; --panel:#1C2040; --panel-2:#242951; --ink:#EEF0FF; --ink-2:#B0B5DB; --ink-3:#7B81AA;
    --line:#2D3360; --focus:#8FB0FF;
    --build-bg:#1E3160; --build-ink:#A9C6FF; --ask-bg:#4A1F33; --ask-ink:#FFB0C3;
    --rest-bg:#173D33; --rest-ink:#93E8C0; --walk-bg:#262B50; --walk-ink:#B3B8DE;
    --gov-bg:#43381A; --gov-ink:#FFDD8A; --sea:#1A2A4A; --land:#2F4A34; --land-edge:#476B4C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#13162A; --panel:#1C2040; --panel-2:#242951; --ink:#EEF0FF; --ink-2:#B0B5DB; --ink-3:#7B81AA;
  --line:#2D3360; --focus:#8FB0FF;
  --build-bg:#1E3160; --build-ink:#A9C6FF; --ask-bg:#4A1F33; --ask-ink:#FFB0C3;
  --rest-bg:#173D33; --rest-ink:#93E8C0; --walk-bg:#262B50; --walk-ink:#B3B8DE;
  --gov-bg:#43381A; --gov-ink:#FFDD8A; --sea:#1A2A4A; --land:#2F4A34; --land-edge:#476B4C;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 var(--round)}
.app{max-width:1500px;margin-inline:auto;padding-inline:16px;padding-block:12px 22px;display:flex;flex-direction:column;gap:10px}
.app.phone{max-width:400px;border:2px dashed var(--ink-3);border-radius:28px;padding-inline:8px}

/* mock-only controls (not part of the page) */
.mockbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 12px;border:1.5px dashed var(--ink-3);border-radius:14px;font-size:12.5px;color:var(--ink-2)}
.mockbar b{font:700 12px/1 var(--mono);color:var(--ink-3);letter-spacing:.06em}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 10px;font:600 12px/1.2 var(--round);color:var(--ink-2);background:var(--panel)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.sign{display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--ink);border-radius:18px;padding:5px 16px 5px 12px;box-shadow:0 3px 0 var(--ink)}
.sign-name{font:700 22px/1 var(--display)}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.stat{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px;color:var(--ink-2)}
.stat b{color:var(--ink);font:700 14px/1 var(--display)}
.repos{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px}
.repo{all:unset;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 9px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);font:600 13px/1.2 var(--round);color:var(--ink-2);white-space:nowrap}
.repo:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.repo.all{padding-left:12px}
.rc{width:9px;height:9px;border-radius:50%;background:var(--rc);flex:none}

.stage{position:relative;overflow:hidden;height:calc(100dvh - 330px);min-height:500px;background:var(--sea)}
.app.phone .stage{height:660px;min-height:0}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas.grabbing{cursor:grabbing}
.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.ov > div{position:absolute;left:0;top:0;will-change:transform}
.bub,.tagl{position:absolute;pointer-events:auto;cursor:pointer;white-space:nowrap}
.bub{background:#FFFFFF;color:#2A2B45;border:2px solid #2A2B45;border-radius:14px;padding:3px 10px;font:600 12.5px/1.4 var(--round);box-shadow:0 2px 0 rgba(42,43,69,.2)}
.bub span{display:block;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.bub.ask{border-color:#E4476F}
.tagl{background:var(--c);color:#fff;border-radius:999px;padding:3px 10px;font:600 11.5px/1.3 var(--mono);box-shadow:0 2px 0 rgba(42,43,69,.2)}
/* V3: the hit area is 8 px bigger than the box on every side */
.bub::after,.tagl::after{content:"";position:absolute;inset:-8px;border-radius:18px}
.showhit .bub::after,.showhit .tagl::after{outline:1.5px dashed #E4476F;background:rgba(228,71,111,.08)}

.x,.fold{all:unset;cursor:pointer;flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2);font:700 14px/1 var(--round)}
.x:hover,.fold:hover{background:var(--panel-2);color:var(--ink)}
.x:focus-visible,.fold:focus-visible{outline:2px solid var(--focus)}
.you{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--berry);color:#fff;font:700 11px/1 var(--round)}

/* V1 (W1): the compact rail, left */
.rail{position:absolute;left:12px;top:12px;z-index:4;width:var(--rail-w);max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(42,43,69,.18);overflow:hidden}
.rail-head{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-bottom:1.5px solid var(--line);font-weight:700;font-size:13px}
.rail-head .n{font:600 12px/1 var(--mono);color:var(--ink-3)}
.rail-head .fold{margin-left:auto}
.rail-list{overflow:auto;padding:4px 4px 8px}
.grp-h{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:6px;padding:6px 6px 3px;font:700 11.5px/1.2 var(--mono);color:var(--ink-2)}
.grp-h:focus-visible{outline:2px solid var(--focus);border-radius:6px}
.grp-h .n{margin-left:auto;color:var(--ink-3);font-weight:600}
.grp-h .car{width:10px;color:var(--ink-3);transition:transform .15s}
.grp-h[aria-expanded="false"] .car{transform:rotate(-90deg)}
.rrows{list-style:none;margin:0;padding:0}
.rrow{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:8px;border-left:3px solid var(--rc);font-size:12.5px;line-height:1.35}
.rrow.sub{padding-left:16px}
.rrow:hover{background:var(--panel-2)}
.rrow:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.rrow[aria-current="true"]{background:var(--ink);color:var(--paper)}
.rrow.resting{opacity:.7}
.sdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--sd)}
.rrow b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{flex:none;padding:0 6px;border-radius:999px;font:600 10.5px/1.6 var(--round);white-space:nowrap}
.chip.you{background:var(--ask-bg);color:var(--ask-ink)}
.chip.ask{background:var(--gov-bg);color:var(--gov-ink)}
.chip.build{background:var(--build-bg);color:var(--build-ink)}
.chip.walk{background:var(--walk-bg);color:var(--walk-ink)}
.chip.rest{background:var(--rest-bg);color:var(--rest-ink)}
.chip.gov{background:var(--gov-bg);color:var(--gov-ink)}
.rest-t{all:unset;cursor:pointer;display:block;margin:1px 0 2px 8px;padding:1px 6px;border-radius:6px;font:600 11.5px/1.5 var(--round);color:var(--rest-ink)}
.rest-t:focus-visible{outline:2px solid var(--focus)}

/* W4: a folded panel = a thin tab on its edge */
.tab{all:unset;cursor:pointer;position:absolute;z-index:4;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;width:var(--tab-w);background:var(--panel);border:2px solid var(--ink);box-shadow:0 3px 0 rgba(42,43,69,.18);font:700 12px/1.1 var(--round);color:var(--ink)}
.tab:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.tab .v{writing-mode:vertical-rl;white-space:nowrap;max-height:180px;overflow:hidden;text-overflow:ellipsis}
.rail-tab{left:0;top:12px;border-left:0;border-radius:0 12px 12px 0}
.win-tab{right:0;top:12px;border-right:0;border-radius:12px 0 0 12px}

/* W2: the message panel, docked right -- one person (or the governor), never a team list */
.win{position:absolute;right:12px;top:12px;bottom:12px;z-index:5;width:var(--msg-w);background:var(--panel);border:2px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 rgba(42,43,69,.2);display:flex;flex-direction:column;overflow:hidden}
.win.short{bottom:auto}
.win-head{display:flex;align-items:center;gap:6px;padding:8px 6px 8px 12px;border-bottom:1.5px solid var(--line)}
.win-head .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.win-title{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facts{padding:6px 12px 0;font:11.5px/1.4 var(--mono);color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hist{list-style:none;margin:0;padding:8px 12px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow:auto;font-size:13px}
.hist .act{display:flex;gap:8px;color:var(--ink-3);font-size:12px}
.hist .act time{font:11px/1.5 var(--mono)}
.hist .qa{border:1.5px solid var(--berry);background:var(--ask-bg);color:var(--ask-ink);border-radius:12px;padding:6px 9px}
.hist .qa p{margin:0}
.hist .msg{padding:6px 10px;border-radius:12px;background:var(--panel-2);max-width:92%}
.hist .msg.me{align-self:flex-end;background:var(--ink);color:var(--paper)}
.hist .msg small{display:block;font-size:11px;opacity:.7}
.hist .msg ul{margin:2px 0 0;padding-left:18px}
.say{display:flex;gap:6px;padding:8px 10px 10px;border-top:1.5px solid var(--line)}
.say textarea{flex:1;min-width:0;resize:none;height:38px;border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;font:13px/1.35 var(--round);background:var(--panel);color:var(--ink)}
.say textarea:focus-visible{outline:2px solid var(--focus)}
.btn{all:unset;cursor:pointer;display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:600 13px/1 var(--round)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.ro{margin:0;padding:8px 12px 10px;border-top:1.5px solid var(--line);font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pill{display:inline-flex;padding:0 7px;border-radius:999px;font:600 11px/1.6 var(--round)}
.pill.you{background:var(--ask-bg);color:var(--ask-ink)} .pill.ask{background:var(--gov-bg);color:var(--gov-ink)}
.pill.build{background:var(--build-bg);color:var(--build-ink)} .pill.walk{background:var(--walk-bg);color:var(--walk-ink)}
.pill.rest{background:var(--rest-bg);color:var(--rest-ink)} .pill.gov{background:var(--gov-bg);color:var(--gov-ink)}
.bld{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}

/* the following chip, top middle of the free map */
.follow{position:absolute;top:12px;z-index:4;transform:translateX(-50%);display:inline-flex;align-items:center;gap:7px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--ink);color:var(--paper);font:600 12px/1.2 var(--round);box-shadow:0 2px 0 rgba(42,43,69,.25);white-space:nowrap;max-width:60%}
.follow span{overflow:hidden;text-overflow:ellipsis}
.follow kbd{font:600 10.5px/1 var(--mono);opacity:.7}
.follow button{all:unset;cursor:pointer;padding:2px 8px;border-radius:999px;background:var(--paper);color:var(--ink);font:600 11.5px/1.3 var(--round)}
.follow button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.cam{position:absolute;bottom:12px;z-index:3;display:flex;flex-direction:column;gap:6px;transition:right .2s}

/* phone: the rail is a drawer from its tab; the message panel is a bottom sheet that folds to a bottom tab */
.app.phone .rail{left:0;top:0;bottom:0;max-height:none;width:min(250px,78%);border-left:0;border-radius:0 16px 16px 0}
.app.phone .win{left:6px;right:6px;top:auto;bottom:6px;width:auto;height:44%}
.app.phone .win.short{height:auto}
.app.phone .win-tab{right:auto;left:50%;top:auto;bottom:0;transform:translateX(-50%);width:auto;flex-direction:row;padding:6px 14px;border:2px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0}
.app.phone .win-tab .v{writing-mode:horizontal-tb;max-width:220px}
@media (prefers-reduced-motion: reduce){ .cam,.grp-h .car{transition:none} }

.note{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.card h3{margin:0 0 6px;font-size:14px}
.card ol,.card ul{margin:0;padding-left:20px}
.card li{margin:2px 0}
.card p{margin:4px 0}
.pad{position:relative;height:170px;border-radius:12px;overflow:hidden;background:var(--sea);border:1.5px solid var(--line);touch-action:none}
.pad canvas{display:block;width:100%;height:100%}
.pad-out{font:12px/1.4 var(--mono);color:var(--ink-2);margin-top:6px}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="mockbar" role="group" aria-label="mock controls">
    <b>MOCK v2</b>
    <span data-t="m.lang"></span>
    <span class="seg" id="seg-lang"><button type="button" data-v="zh" aria-pressed="true">中文</button><button type="button" data-v="en" aria-pressed="false">English</button></span>
    <span data-t="m.width"></span>
    <span class="seg" id="seg-width"><button type="button" data-v="pc" aria-pressed="true" data-t="m.pc"></button><button type="button" data-v="phone" aria-pressed="false" data-t="m.phone"></button></span>
    <span data-t="m.refold"></span>
    <span class="seg" id="seg-refold"><button type="button" data-v="open" aria-pressed="true" data-t="m.refoldA"></button><button type="button" data-v="keep" aria-pressed="false" data-t="m.refoldB"></button></span>
    <span class="seg" id="seg-hit"><button type="button" data-v="off" aria-pressed="true" data-t="m.hitOff"></button><button type="button" data-v="on" aria-pressed="false" data-t="m.hitOn"></button></span>
    <button type="button" class="btn" id="m-reset" data-t="m.reset"></button>
  </div>

  <header class="bar">
    <div class="sign"><span class="sign-name">Agent City</span></div>
    <div class="stats" id="stats"></div>
  </header>
  <nav class="repos" id="repos"></nav>

  <div class="stage" id="stage">
    <canvas id="city"></canvas>
    <div class="ov" id="ov"></div>

    <aside class="rail" id="rail">
      <div class="rail-head"><span data-t="rail.title"></span><span class="n" id="rail-n"></span><span class="you" id="rail-you" hidden></span><button type="button" class="fold" id="rail-fold" data-t-aria="fold.rail">«</button></div>
      <div class="rail-list" id="rail-list"></div>
    </aside>
    <button type="button" class="tab rail-tab" id="rail-tab" aria-controls="rail" hidden><span>›</span><span class="v" id="rail-tab-t"></span><span class="you" id="rail-tab-you" hidden></span></button>

    <div class="follow" id="follow" role="status" hidden><span id="follow-t"></span><kbd>Esc</kbd><button type="button" id="follow-stop" data-t="follow.stop"></button></div>

    <div class="cam" id="cam">
      <button type="button" class="btn" id="zin" data-t-aria="btn.zoomIn">+</button>
      <button type="button" class="btn" id="zout" data-t-aria="btn.zoomOut">−</button>
      <button type="button" class="btn" id="zfit" data-t-aria="btn.home">⌂</button>
    </div>

    <div class="win" id="win" role="dialog" aria-labelledby="win-title" hidden>
      <div class="win-head"><span class="dot" id="win-dot"></span><div class="win-title" id="win-title"></div><button type="button" class="fold" id="win-fold" data-t-aria="fold.msg">»</button><button type="button" class="x" id="win-x" data-t-aria="btn.close">✕</button></div>
      <div id="win-body" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
    </div>
    <button type="button" class="tab win-tab" id="win-tab" aria-controls="win" hidden><span id="win-tab-arrow">‹</span><span class="v" id="win-tab-t"></span><span class="you" id="win-tab-n" hidden></span></button>
  </div>

  <section class="note">
    <div class="card"><h3 data-t="n.clickTitle"></h3><ol id="n-click"></ol></div>
    <div class="card"><h3 data-t="n.rulesTitle"></h3><ul id="n-rules"></ul></div>
    <div class="card">
      <h3 data-t="n.v2Title"></h3>
      <p id="n-v2"></p>
      <p><span class="seg" id="seg-v2"><button type="button" data-v="today" aria-pressed="false" data-t="v2.today"></button><button type="button" data-v="A" aria-pressed="true" data-t="v2.A"></button><button type="button" data-v="B" aria-pressed="false" data-t="v2.B"></button></span></p>
      <div class="pad" id="pad"><canvas id="pad-c"></canvas></div>
      <div class="pad-out" id="pad-out"></div>
    </div>
  </section>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
let LANG = 'zh';
const TEXT = {
  zh: {
    'm.lang':'语言', 'm.width':'宽度', 'm.pc':'电脑', 'm.phone':'手机', 'm.refold':'消息面板折起后，再点一个人：',
    'm.refoldA':'自动打开（默认）', 'm.refoldB':'保持折起', 'm.hitOff':'点击范围：隐藏', 'm.hitOn':'点击范围：显示', 'm.reset':'重置（清掉记住的折叠）',
    'rail.title':'在线', 'rail.count':'{n}', 'rail.rest':'休息 {n} ▸', 'rail.restOpen':'休息 {n} ▾', 'rail.tab':'在线 {n}',
    'fold.rail':'折起名单', 'fold.msg':'折起消息', 'btn.close':'关闭', 'btn.zoomIn':'放大', 'btn.zoomOut':'缩小', 'btn.home':'回到全部',
    'follow.on':'跟随 {name}', 'follow.stop':'停止', 'repo.all':'全部', 'msg.tab':'消息 · {name}',
    'say.ph':'跟它说…', 'say.send':'发送', 'ro.remote':'只能看：这是 {who} 的 agent，只有 {who} 能回答。',
    'ro.sub':'它是子任务，这份对话只能看；有事去找组长。', 'ro.findLead':'找组长：{name}', 'b.focus':'看看它', 'b.type':'{type} · {district}',
    'hist.started':'出门：{task}', 'hist.tools':'Edit ×3 · Read ×2', 'hist.q':'问：', 'hist.a':'答：', 'hist.wait':'等回答…',
    'who.you':'你（页面）', 'who.it':'它', 'stat.work':'干活', 'stat.you':'等你', 'stat.rest':'休息',
    'n.clickTitle':'怎么点（v2）', 'n.rulesTitle':'规则（写进 requirements/city.md）', 'n.v2Title':'V2 两指左右滚动（和 v1 一样）',
    'n.click':[
      '左边「在线」名单变小了：一行 = 状态点 + 名字 + 小状态。仓库标题可以点，收起/展开那个仓库。',

/* the free map: between the rail (or its tab) and the message panel (or its tab); on a phone above the sheet */
function freeBox(){

/* ---------- people walk, camera ---------- */
function step(dt){
  for (const p of P) {
    if (p.still || p.st === 'rest') continue;
    if (!p.goal) { p.wait -= dt; if (p.wait <= 0) { const R = p.roam || 45, a = Math.random() * 6.28; p.goal = [p.home[0] + Math.cos(a) * R * Math.random(), p.home[1] + Math.sin(a) * R * Math.random()]; } continue; }
    const dx = p.goal[0] - p.x, dy = p.goal[1] - p.y, d = Math.hypot(dx, dy), v = 22 * dt;
    if (d <= v) { p.x = p.goal[0]; p.y = p.goal[1]; p.goal = null; p.wait = 1 + Math.random() * 2.5; } else { p.x += dx / d * v; p.y += dy / d * v; }
  }
  cam.a += dt * Math.PI * 2 / ROT_SEC;

    if (fly.t >= 1) fly = null;
  } else if (follow) {
    const p = byId(follow), k = 1 - Math.exp(-8 * dt);
    cam.tx += (p.x - cam.tx) * k; cam.ty += (p.y - cam.ty) * k;

}

    ctx.restore();

  const c = counts();
  $('#rail-n').textContent = tr('rail.count', { n: c.n });
  $('#rail-you').hidden = !c.you; $('#rail-you').textContent = c.you;
  $('#rail-tab-t').textContent = tr('rail.tab', { n: c.n });
  $('#rail-tab-you').hidden = !c.you; $('#rail-tab-you').textContent = c.you;
  $('#rail').hidden = !railShown();
  $('#rail-tab').hidden = railShown();
}
$('#rail-list').addEventListener('click', e => {
  const g = e.target.closest('[data-grp]'), rt = e.target.closest('[data-rest]'), f = e.target.closest('[data-focus]');
  if (g) { const id = g.dataset.grp; grpClosed.has(id) ? grpClosed.delete(id) : grpClosed.add(id); store.set('grpClosed', [...grpClosed].join(',')); renderRail(); return; }
  if (rt) { const id = rt.dataset.rest; restOpen.has(id) ? restOpen.delete(id) : restOpen.add(id); renderRail(); return; }

});
$('#rail-fold').addEventListener('click', () => { if (phone) drawerOpen = false; else { railFolded = true; store.set('railFolded', '1'); } renderAll(); $('#rail-tab').focus(); });
$('#rail-tab').addEventListener('click', () => { if (phone) drawerOpen = true; else { railFolded = false; store.set('railFolded', '0'); } renderAll(); });

/* ---------- the message panel (W2, W3) ---------- */
const HIST = {
  'g-ap': [['act', '09:02', { zh:'出门：main manager', en:'Headed out: main manager' }], ['me', { zh:'city-ux2 的 mock 怎么样了？', en:'How is the city-ux2 mock?' }], ['it', { zh:'mock v2 已推送，等主人看。\n- 名单变小\n- 点人 = 跟随 + 消息', en:'mock v2 is pushed, waiting for the owner.\n- smaller list\n- click = follow + messages' }]],
  'tm1': [['act', '08:52', { zh:'出门：city-ux2', en:'Headed out: city-ux2' }], ['act', '09:08', { zh:'Edit ×3 · Read ×2', en:'Edit ×3 · Read ×2' }], ['it', { zh:'失败测试已提交，等 **mock yes**。', en:'Failing tests are in, waiting for **mock yes**.' }]],
  'w1': [['act', '09:40', { zh:'出门：左侧名单', en:'Headed out: Left list' }], ['task', { zh:'按 tests/test_agent_city_ux2.py 做 V1', en:'Do V1 per tests/test_agent_city_ux2.py' }], ['act', '09:52', { zh:'Edit ×6 · Bash ×2', en:'Edit ×6 · Bash ×2' }]],
  'w2': [['act', '09:30', { zh:'出门：滚动方向', en:'Headed out: Scroll way' }], ['qa', { zh:'左右要不要跟系统？', en:'Sideways: follow the system?' }, null]],
  'tm2': [['act', '10:10', { zh:'出门：报名表', en:'Headed out: Sign-up form' }], ['qa', { zh:'要权限：Bash npm test', en:'Needs permission: Bash npm test' }, null]],
  'w3': [['act', '10:20', { zh:'出门：票价计算', en:'Headed out: Ticket price' }], ['me', { zh:'儿童票打几折？', en:'What is the child discount?' }], ['it', { zh:'按规则：**半价**，满 12 岁按成人。', en:'Per the rules: **half price**, adult from 12.' }], ['act', '10:31', { zh:'Edit ×2', en:'Edit ×2' }]],
  'w4': [['act', '08:40', { zh:'完工，去休息', en:'Finished, heading to rest' }]],
  'f1': [['act', '08:30', { zh:'完工，去休息', en:'Finished, heading to rest' }]],
  'g-ev': [['it', { zh:'今天 event 没有新任务。', en:'No new task for event today.' }]],
  'w5': [['act', '10:05', { zh:'出门：深色模式', en:'Headed out: Dark mode' }], ['qa', { zh:'深色用哪个蓝？', en:'Which blue for dark?' }, null]],
  'm1': [['act', '10:12', { zh:'出门：合并 login', en:'Headed out: Merge login' }]],
};
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split('\n- ').map((x, i) => i ? `<li>${x}</li>` : x).join('').replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>'); }
function histHtml(p){
  const items = (HIST[p.id] || []).map(h => {
    const [k] = h;
    if (k === 'act') return `<li class="act"><time>${h[1]}</time><span>${esc(h[2][LANG])}</span></li>`;
    if (k === 'qa') return `<li class="qa"><p><b>${esc(tr('hist.q'))}</b>${esc(h[1][LANG])}</p><p><b>${esc(tr('hist.a'))}</b>${h[2] ? esc(h[2][LANG]) : `<i>${esc(tr('hist.wait'))}</i>`}</p></li>`;
    if (k === 'me') return `<li class="msg me"><small>${esc(tr('who.you'))}</small>${md(h[1][LANG])}</li>`;
    return `<li class="msg"><small>${esc(nm(p))}</small>${md(h[1][LANG])}</li>`;
  });
  for (const m of p.msgs) items.push(`<li class="msg me"><small>${esc(tr('who.you'))}</small>${esc(m)}</li>`);
  return items.join('');
}
function renderWin(){
  const w = $('#win'), tab = $('#win-tab');
  if (!pick) { w.hidden = true; tab.hidden = true; return; }
  w.hidden = msgFolded; tab.hidden = !msgFolded;
  if (pick.t === 'b') {
    const b = BUILD.find(x => x.id === pick.id);
    w.classList.add('short');
    $('#win-dot').style.setProperty('--c', '#FFD36E');
    $('#win-title').textContent = b.name[LANG];
    $('#win-tab-t').textContent = b.name[LANG]; $('#win-tab-n').hidden = true;
    $('#win-body').innerHTML = `<div class="bld"><span class="facts" style="padding:0">${esc(tr('b.type', { type: b.type[LANG], district: b.dist[LANG] }))}</span><button type="button" class="btn" data-focus-b="${b.id}">👁 ${esc(tr('b.focus'))}</button></div>`;
    return;
  }
  w.classList.remove('short');
  const p = byId(pick.id), rep = repoOf(p.repo), [cls, txt] = STATE[p.st];
  $('#win-dot').style.setProperty('--c', ROLE_C[p.role]);
  $('#win-title').textContent = nm(p);
  $('#win-tab-t').textContent = tr('msg.tab', { name: nm(p) });
  const fresh = Math.max(0, p.msgs.length - seenMsgs); $('#win-tab-n').hidden = !fresh; $('#win-tab-n').textContent = fresh;
  let foot;
  if (p.remote) foot = `<p class="ro">${esc(tr('ro.remote', { who: p.remote }))}</p>`;
  else if (p.lead) { const l = byId(p.lead); foot = `<div class="ro"><span>${esc(tr('ro.sub'))}</span><button type="button" class="btn" data-lead="${l.id}">${esc(tr('ro.findLead', { name: nm(l) }))}</button></div>`; }
  else foot = `<form class="say" id="say"><textarea id="say-t" placeholder="${esc(tr('say.ph'))}" aria-label="${esc(tr('say.ph'))}"></textarea><button type="submit" class="btn primary">${esc(tr('say.send'))}</button></form>`;
  $('#win-body').innerHTML = `<div class="facts"><span class="pill ${cls}">${esc(txt[LANG])}</span><span>${esc(rep.name)} · main</span></div><ul class="hist" id="hist">${histHtml(p)}</ul>${foot}`;
  const h = $('#hist'); h.scrollTop = h.scrollHeight;
}
$('#win-body').addEventListener('click', e => {
  const l = e.target.closest('[data-lead]'), bf = e.target.closest('[data-focus-b]');
  if (l) pickPerson(l.dataset.lead);
  if (bf) { const b = BUILD.find(x => x.id === bf.dataset.focusB); stopFollow(); flyTo(b.x, b.y, FOLLOW_S); }
});
$('#win-body').addEventListener('submit', e => {
  e.preventDefault();
  const t = $('#say-t'), v = t.value.trim(); if (!v || !pick) return;
  byId(pick.id).msgs.push(v); seenMsgs = byId(pick.id).msgs.length; renderWin();
});
$('#win-x').addEventListener('click', unpick);
$('#win-fold').addEventListener('click', () => { msgFolded = true; store.set('msgFolded', '1'); renderAll(); $('#win-tab').focus(); });
$('#win-tab').addEventListener('click', () => { msgFolded = false; store.set('msgFolded', '0'); if (pick && pick.t === 'p') seenMsgs = byId(pick.id).msgs.length; renderAll(); });

/* ---------- chip, repo tags, stats, zoom buttons ---------- */
function renderFollow(){
  const el = $('#follow'), p = follow && byId(follow);
  el.hidden = !p; if (!p) return;
  $('#follow-t').textContent = tr('follow.on', { name: nm(p) });
  el.style.left = freeBox().cx + 'px';
}
function placeCam(){
  const f = freeBox();
  $('#cam').style.right = (W - f.x1 + 4) + 'px';
  $('#cam').style.bottom = phone && pick ? (H - f.y1 + 6) + 'px' : '12px';
}
$('#follow-stop').addEventListener('click', stopFollow);
function renderRepos(){
  $('#repos').innerHTML = `<button type="button" class="repo all" data-terr="*">${esc(tr('repo.all'))}</button>`
    + REPOS.map(r => `<button type="button" class="repo" data-terr="${r.id}"><span class="rc" style="--rc:${r.rc}"></span>${esc(r.name)}</button>`).join('');
}
$('#repos').addEventListener('click', e => { const b = e.target.closest('.repo'); if (!b) return; stopFollow(); if (b.dataset.terr === '*') { home(); return; } const r = repoOf(b.dataset.terr); flyTo(r.x, r.y, 1.35); });
function renderStats(){
  const act = P.filter(p => p.role !== 'gov');
  const work = act.filter(p => ['build', 'walk'].includes(STATE[p.st][0])).length, you = act.filter(p => STATE[p.st][0] === 'you').length, rest = act.filter(p => p.st === 'rest').length;
  $('#stats').innerHTML = `<span class="stat">${esc(tr('stat.work'))} <b>${work}</b></span><span class="stat">${esc(tr('stat.you'))} <b>${you}</b></span><span class="stat">${esc(tr('stat.rest'))} <b>${rest}</b></span>`;
}
function renderAll(){ renderRail(); renderWin(); renderFollow(); placeCam(); }
$('#zin').addEventListener('click', () => { fly = fly && fly.live ? null : fly; cam.s = Math.min(4, cam.s * 1.4); });
$('#zout').addEventListener('click', () => { fly = fly && fly.live ? null : fly; cam.s = Math.max(.35, cam.s / 1.4); });
$('#zfit').addEventListener('click', home);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && follow) { stopFollow(); e.preventDefault(); } });

/* ---------- the city: drag = pan (stops following), tap = pick ---------- */
let drag = null;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); drag = { x:e.clientX, y:e.clientY, x0:e.clientX, y0:e.clientY, moved:false }; });
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 8) return;
  if (!drag.moved) { drag.moved = true; stopFollow(); fly = null; canvas.classList.add('grabbing'); }
  screenPan(e.clientX - drag.x, e.clientY - drag.y); drag.x = e.clientX; drag.y = e.clientY;
});
canvas.addEventListener('pointerup', e => {
  canvas.classList.remove('grabbing');
  const d = drag; drag = null;
  if (!d || d.moved) return;
  const r = canvas.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  let best = null, bd = 28;
  for (const p of P) { const [x, y] = toScreen(p.x, p.y), dd = Math.hypot(x - px, y - py); if (dd < bd) { bd = dd; best = p; } }
  if (best) { pickPerson(best.id); return; }
  for (const b of BUILD) { const [x, y] = toScreen(b.x, b.y); if (Math.hypot(x - px, y - py) < Math.max(b.w, b.h) * cam.s / 1.6) { pickBuilding(b.id); return; } }
  if (phone && drawerOpen) { drawerOpen = false; renderAll(); return; }
  unpick();
});
/* V2 */
function wheelLand(dx, dy, mode){ if (mode === 'today') return [-dx, dy]; if (mode === 'B') return [-dx, -dy]; return [dx, dy]; }
stage.addEventListener('wheel', e => {
  if (e.target.closest('.rail') || e.target.closest('.win')) return;
  e.preventDefault();
  if (e.ctrlKey) { cam.s = Math.max(.35, Math.min(4, cam.s * Math.exp(-e.deltaY * .01))); return; }
  stopFollow(); fly = null;
  const [lx, ly] = wheelLand(e.deltaX, e.deltaY, v2Mode); screenPan(lx, ly);
}, { passive:false });

/* ---------- V2 pad ---------- */
const pad = $('#pad'), pc = $('#pad-c'), pctx = pc.getContext('2d'), padCam = { x:0, y:0 };
function drawPad(){
  const r = pad.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  pc.width = r.width * d; pc.height = r.height * d; pctx.setTransform(d, 0, 0, d, 0, 0);
  pctx.fillStyle = css('--sea'); pctx.fillRect(0, 0, r.width, r.height);
  for (let i = -6; i <= 6; i++) for (let j = -4; j <= 4; j++) {
    const x = r.width / 2 + i * 70 + padCam.x, y = r.height / 2 + j * 60 + padCam.y;
    pctx.fillStyle = css('--land'); pctx.fillRect(x - 28, y - 22, 56, 44);
    pctx.fillStyle = (i + j) % 3 === 0 ? '#FFD36E' : '#F4F1E8'; pctx.fillRect(x - 8, y - 8, 16, 16);
    pctx.fillStyle = '#2A2B45'; pctx.font = '600 10px ui-monospace,monospace'; pctx.fillText(`${i},${j}`, x - 10, y + 20);
  }
}
pad.addEventListener('wheel', e => {
  e.preventDefault(); if (e.ctrlKey) return;
  const [lx, ly] = wheelLand(e.deltaX, e.deltaY, v2Mode); padCam.x += lx; padCam.y += ly;
  const dir = []; if (Math.abs(lx) >= 1) dir.push(tr(lx > 0 ? 'dir.r' : 'dir.l')); if (Math.abs(ly) >= 1) dir.push(tr(ly > 0 ? 'dir.d' : 'dir.u'));
  $('#pad-out').textContent = tr('pad.out', { x: e.deltaX.toFixed(0), y: e.deltaY.toFixed(0), dir: dir.join(' + ') || '-' });
  drawPad();
}, { passive:false });

/* ---------- mock controls ---------- */
function seg(id, fn){ $(id).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); fn(b.dataset.v); }); }
function applyText(){
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = tr(el.dataset.t); });
  document.querySelectorAll('[data-t-aria]').forEach(el => el.setAttribute('aria-label', tr(el.dataset.tAria)));
  $('#rail').setAttribute('aria-label', tr('rail.title'));
  $('#n-click').innerHTML = tr('n.click').map(s => `<li>${s}</li>`).join('');
  $('#n-rules').innerHTML = tr('n.rules').map(s => `<li>${esc(s)}</li>`).join('');
  $('#n-v2').textContent = tr('n.v2');
  renderRepos(); renderStats(); renderAll();
}
seg('#seg-lang', v => { LANG = v; applyText(); });
seg('#seg-width', v => { phone = v === 'phone'; $('#app').classList.toggle('phone', phone); drawerOpen = false; requestAnimationFrame(() => { resize(); renderAll(); home(); }); });
seg('#seg-refold', v => { refold = v; });
seg('#seg-hit', v => { stage.classList.toggle('showhit', v === 'on'); });
seg('#seg-v2', v => { v2Mode = v; });
$('#m-reset').addEventListener('click', () => { try { for (const k of ['railFolded', 'msgFolded', 'grpClosed']) localStorage.removeItem('city-mock.' + k); } catch (e) {} railFolded = msgFolded = false; grpClosed.clear(); unpick(); home(); });

let last = performance.now(), statT = 0;
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  step(dt); draw(); renderFollow();
  statT += dt; if (statT > 1) { statT = 0; renderStats(); }
  requestAnimationFrame(frame);
}
addEventListener('resize', () => { resize(); drawPad(); placeCam(); });
resize(); applyText(); drawPad(); requestAnimationFrame(frame);
window.mock = { P, cam, get follow(){ return follow; }, get pick(){ return pick; }, toScreen, freeBox };
</script>
