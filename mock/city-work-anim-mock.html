<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agent City · work animation mock</title>
<link rel="icon" href="data:,">
<style>
:root{ --paper:#ECF1FF; --panel:#FFFFFF; --ink:#2A2B45; --ink-2:#585D82; --line:#DCE2F6; --berry:#FF7593; --butter:#FFD36E;
  --build-bg:#E3ECFF; --build-ink:#2F54C8; --rest-bg:#DAF5E8; --rest-ink:#1E8657; --walk-bg:#EDEFF7; --walk-ink:#5F6488;
  --round:ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; color-scheme:light; }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--round)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px 4px}
.bar h1{margin:0 8px 0 0;font:700 18px/1.2 var(--round)}
.proto{background:var(--butter);color:#4A3500;font:600 12px/1 var(--round);padding:6px 11px;border-radius:999px}
.seg{display:inline-flex;gap:4px}
.btn{font:600 13px/1 var(--round);border:1.5px solid var(--line);background:#F3F5FE;color:var(--ink);border-radius:12px;padding:0 11px;min-height:32px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.small{min-height:28px;font-size:12px;padding:0 9px}
.chk{display:inline-flex;align-items:center;gap:5px;font:600 13px/1 var(--round);cursor:pointer}
.fps{font:600 12px/1 ui-monospace,Menlo,monospace;color:var(--ink-2);margin-left:auto}
.note{padding:4px 16px 8px;color:var(--ink-2);font-size:13px;min-height:28px}
.main{display:grid;grid-template-columns:1fr 360px;gap:12px;padding:0 16px 16px;height:calc(100vh - 92px);min-height:520px}
.left{display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.row .lbl{font:600 12px/1 var(--round);color:var(--ink-2);margin-right:2px}
.stage{position:relative;overflow:hidden;border-radius:16px;flex:1;min-height:300px;background:#BFE3F5}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#ov{position:absolute;inset:0;pointer-events:none}
.tag,.icon,.head{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.tag{font:700 11.5px/1 var(--round);background:rgba(255,255,255,.92);color:var(--ink);padding:4px 8px;border-radius:999px;box-shadow:0 1px 4px rgba(40,40,80,.18)}
.tag i{font-style:normal;font-weight:600;color:var(--build-ink);margin-left:5px}
.tag.pause i{color:var(--walk-ink)} .tag.walk i{color:var(--walk-ink)} .tag.rest i{color:var(--rest-ink)}
.head{font:800 15px/1 var(--round);background:#fff;padding:6px 10px;border-radius:12px;box-shadow:0 2px 8px rgba(40,40,80,.2);color:var(--ink)}
.icon{font:18px/1 system-ui;background:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(40,40,80,.22)}
.strip{height:34px;border-radius:10px;background:#fff;position:relative;overflow:hidden}
.strip canvas{width:100%;height:100%;display:block}
aside{display:flex;flex-direction:column;gap:10px;overflow:auto}
.card{background:var(--panel);border-radius:18px;padding:10px 12px;box-shadow:0 1px 3px rgba(40,40,80,.08)}
.card h3{margin:0 0 6px;font:700 14px/1.3 var(--round)}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#F7F8FE;border-radius:12px;padding:8px 10px;margin:0 0 6px;cursor:pointer;font:inherit;color:inherit}
.opt[aria-pressed="true"]{border-color:var(--ink);background:#fff;box-shadow:0 0 0 2px var(--ink) inset}
.opt b{display:block;font:700 13px/1.35 var(--round)}
.opt span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.rec{background:var(--rest-bg);color:var(--rest-ink);font:700 11px/1 var(--round);padding:3px 7px;border-radius:999px;margin-left:4px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-top:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
th{font-weight:700;color:var(--ink-2);white-space:nowrap}
ol{margin:0;padding-left:18px;font-size:12.5px} ol li{margin:0 0 5px}
ol li b{font-weight:700}
.dim{color:var(--ink-2);font-size:12px}
@media (max-width:980px){ .main{grid-template-columns:1fr;height:auto} .stage{height:440px;flex:none} }
@media (prefers-reduced-motion: reduce){ .btn{transition:none} }
</style>
</head>
<body>
<div class="bar">
  <h1 data-t="title">干活动画</h1><span class="proto">mock</span>
  <span class="seg" id="views"></span>
  <label class="chk"><input type="checkbox" id="rm"> <span data-t="rm">减少动态</span></label>
  <span class="seg" id="lang"></span>
  <span class="fps" id="fps"></span>
</div>
<div class="note" id="note"></div>
<div class="main">
  <div class="left">
    <div class="row" id="kindRow"><span class="lbl" data-t="kindLbl">哪种活</span><span class="seg" id="kinds"></span></div>
    <div class="row" id="cityRow" hidden><span class="lbl" data-t="cmpLbl">对比</span><span class="seg" id="todaySeg"></span></div>
    <div class="stage" id="stage"><canvas id="c" aria-label="3D preview"></canvas><div id="ov"></div></div>
    <div class="row">
      <span class="seg" id="feed"></span>
      <span class="lbl" style="margin-left:10px" data-t="holdLbl">最后一个工具后继续干</span><span class="seg" id="hold"></span>
    </div>
    <div class="strip" id="stripWrap"><canvas id="strip"></canvas></div>
  </div>
  <aside>
    <section class="card"><h3 data-t="optTitle">方案</h3><div id="opts"></div></section>
    <section class="card"><h3 data-t="costTitle">用什么素材 · 代价</h3><div id="cost"></div></section>
    <section class="card"><h3 data-t="askTitle">要你定的（都有默认）</h3><ol id="asks"></ol></section>
  </aside>
</div>
<script src="../bin/agent-city-assets/vendor/three.min.js"></script>
<script src="../bin/agent-city-assets/vendor/GLTFLoader.js"></script>
<script src="../bin/agent-city-assets/vendor/SkeletonUtils.js"></script>
<script>

/* ---------- text: both languages (the real page gets the same keys in TEXT.zh / TEXT.en) ---------- */
const TX = {

    asks: [
      '<b>选哪个方案？</b> 默认 A。',
      '<b>工具之间停多久算「停一下」？</b> 默认最后一个工具后继续干 6 秒，然后站在原地。30 秒都没工具才像今天一样慢慢走一圈再回来。',
      '<b>查网页用望远镜（*）？</b> 服务器今天把 WebFetch/WebSearch 当成 Read，页面分不出来，要改一点服务器（多一种 “Web”）。默认：先不改，查网页就显示看文件；望远镜放进想法清单。',
      '<b>以前的规则改掉：</b>「没有房子的人干活时会走来走去」→ 改成「干活时站在自己的位置上」。走路只在去市政厅、去经理、去休息、慢慢走一圈的时候。',

  en: {

    optTitle: 'Options', costTitle: 'Assets · cost', askTitle: 'For you to decide (all have defaults)',
    'view.side': '① Three options side by side', 'view.city': '② In the city', 'view.many': '③ Many people',
    'note.side': 'Pick a kind of work above; the three people are the three options. Click "Stop tool events" to see the short pause: it stays on its spot, no wandering.',
    'note.city': 'A small piece of city: building, reading, running commands, walking to the hall, resting. Click "Today" to compare: today working people walk back and forth. Pick the option on the right.',

    'kind.build': 'Edit / Write · build', 'kind.read': 'Read · read files', 'kind.bash': 'Bash · run commands', 'kind.other': 'Other tools', 'kind.web': 'WebFetch · web *',
    'feed.auto': '▶ Tool events keep coming', 'feed.stop': '⏸ Stop tool events', 'feed.one': '+ One tool event',
    'cmp.new': 'New', 'cmp.today': 'Today',

    'opt.C': 'Option C · everyone hammers (smallest change)', 'opt.C.d': 'No difference by kind: a working person stays on its spot and plays today\'s building gesture with the hammer. Smallest change, but you cannot tell reading from running commands.',
    rec: 'recommended',
    'st.build': 'Building', 'st.edit': 'Editing', 'st.read': 'Reading', 'st.bash': 'Running', 'st.other': 'Busy', 'st.web': 'On the web', 'st.pause': 'Pausing',
    'st.walk': 'To the hall', 'st.rest': 'Resting', 'st.today': 'Working', 'st.gov': 'At the hall',
    'who.w1': 'Worker · Login API', 'who.tm': 'Task manager · Settings', 'who.w2': 'Worker · Tests', 'who.walk': 'Worker · Payment', 'who.rest': 'Deputy', 'who.gov': 'Governor',
    'strip.label': 'Last 15 s: line = a tool event, blue = working, grey = pausing',
    fps: '{fps} fps · {n} people',
    'cost.h': ['', 'A', 'B', 'C'],
    'cost.rows': [
      ['Clips', 'attack-melee-right (hammer), holding-both-shoot (book), interact-right (typing), interact-left (gesture), idle - in all 7 character models, no arms moved by code', 'interact-right, idle', 'interact-right, idle (same as building today)'],
      ['Props', 'hammer, planks (models we have); book, laptop, spyglass = a few boxes drawn in code, no new files', 'none (icons are text)', 'hammer (have it)'],
      ['New files', '0', '0', '0'],
      ['Per frame', 'the same animation mixer as today; at most 24 dust/spark sprites, shared', 'as today + 1 icon per person', 'as today'],
      ['Reduce motion', 'half speed, no dust / sparks / page flips', 'half speed, icon still', 'half speed'],
    ],
    asks: [
      '<b>Which option?</b> Default A.',
      '<b>How long a gap counts as a pause?</b> Default: keeps working 6 s after the last tool, then stands on its spot. Only after 30 s with no tool does it take today\'s slow walk around and come back.',
      '<b>A spyglass for web (*)?</b> Today the server counts WebFetch/WebSearch as Read, so the page cannot tell them apart; a small server change is needed (a new "Web" kind). Default: not now - web shows as reading; the spyglass goes to the ideas list.',
      '<b>An old rule changes:</b> "a person without a building walks around while it works" becomes "a working person stays on its own spot". Walking only to the hall, to the manager, to rest, or the slow walk around.',
      '<b>The status word in the list follows the work:</b> Building (only with a building) / Editing / Reading / Running / Busy / Pausing. Default yes.',
    ],
    'web.note': '* web needs a server change, see point 3 on the right',
  },
};
let lang = Q.get('lang') === 'en' ? 'en' : 'zh';
const t = (k, v) => { let s = TX[lang][k]; if (s == null) s = TX.zh[k] ?? k; if (v) for (const n in v) s = s.replace('{' + n + '}', v[n]); return s; };

/* ---------- state ---------- */
let view = ['side', 'city', 'many', 'clips', 'kinds'].includes(Q.get('view')) ? Q.get('view') : 'side';
let kind = ['build', 'read', 'bash', 'other', 'web'].includes(Q.get('kind')) ? Q.get('kind') : 'build';
let opt = ['A', 'B', 'C'].includes(Q.get('opt')) ? Q.get('opt') : 'A';
let today = Q.get('today') === '1';
let feeding = Q.get('feed') !== 'stop';
let HOLD = [3, 6, 10].includes(+Q.get('hold')) ? +Q.get('hold') : 6;
let RM = Q.get('rm') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches;
$('#rm').checked = RM;

/* ---------- three ---------- */
const MODELS = ['characters/character-male-a', 'characters/character-female-a', 'characters/character-male-c', 'characters/character-female-c', 'characters/character-male-b', 'characters/character-male-e',
  'survival/tool-hammer', 'survival/resource-planks', 'survival/structure', 'hexagon/building-house', 'hexagon/building-village', 'hexagon/building-cabin',
  'kaykit-city/bench', 'roads/construction-fence', 'suburban/building-type-a', 'nature/tree_default', 'nature/tree_oak', 'forest/flag', 'nature/plant_bush'];
const lib = {};
const HEX_SINK = { 'hexagon/building-house': .21, 'hexagon/building-village': .21, 'hexagon/building-cabin': .21 };
const canvas = $('#c'), stage = $('#stage'), ov = $('#ov');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#BFE3F5');
const camera = new THREE.PerspectiveCamera(35, 1, .05, 200);
scene.add(new THREE.HemisphereLight('#FFFFFF', '#C7D2E0', .8));
const sun = new THREE.DirectionalLight('#FFF3E0', .75); sun.position.set(-6, 12, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); scene.add(sun);
const world = new THREE.Group(); scene.add(world);
const lin = c => new THREE.Color(c).convertSRGBToLinear();
const lam = c => new THREE.MeshLambertMaterial({ color: lin(c) });

function prep(key, gltf){
  const root = gltf.scene;
  root.traverse(n => { if (n.isMesh) { const m = n.material; n.material = new THREE.MeshLambertMaterial({ color: m.color ? m.color.clone() : new THREE.Color('#fff'), map: m.map || null, skinning: !!n.isSkinnedMesh }); if (!m.map) n.material.color.convertSRGBToLinear(); n.castShadow = true; n.receiveShadow = true; } });
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  lib[key] = { scene: root, clips: gltf.animations, box, size: box.getSize(new THREE.Vector3()), skinned: !!root.getObjectByProperty('type', 'SkinnedMesh') };
}
function loadAll(){
  const loader = new THREE.GLTFLoader();
  return Promise.all(MODELS.map(k => new Promise(res => loader.load(A + k + '.glb', g => { prep(k, g); res(); }, undefined, () => res()))));
}
function place(key, x, z, o = {}){
  const L = lib[key]; if (!L) return new THREE.Group();
  const g = new THREE.Group(); g.rotation.y = o.ry || 0;
  const inner = L.skinned ? THREE.SkeletonUtils.clone(L.scene) : L.scene.clone(true);
  const s = o.s != null ? o.s : o.h != null ? o.h / L.size.y : (o.fit || .9) / Math.max(L.size.x, L.size.z);
  inner.scale.setScalar(s);
  const c = L.box.getCenter(new THREE.Vector3());
  inner.position.set(-c.x * s, o.keepY ? 0 : -L.box.min.y * s, -c.z * s);
  g.position.set(x, (o.y || 0) - (HEX_SINK[key] || 0) * s, z);
  if (o.tint) inner.traverse(n => { if (n.isMesh) { n.material = n.material.clone(); n.material.color = lin(o.tint); } });
  g.add(inner); (o.parent || world).add(g);
  return g;
}

/* ---------- props: drawn in code from a few boxes (shared geometry + materials, no new files) ---------- */
const G = {
  cover: new THREE.BoxGeometry(.075, .006, .1), page: new THREE.PlaneGeometry(.068, .092),
  crate: new THREE.BoxGeometry(.16, .16, .16), lapBase: new THREE.BoxGeometry(.15, .01, .1), lapScreen: new THREE.PlaneGeometry(.14, .09), lapBack: new THREE.BoxGeometry(.15, .1, .006),
  board: new THREE.BoxGeometry(.07, .1, .006), paper: new THREE.PlaneGeometry(.058, .08), tube: new THREE.CylinderGeometry(.012, .018, .16, 10),
};
const M = { cover: lam('#C0504D'), page: new THREE.MeshLambertMaterial({ color: lin('#FFFDF4'), side: THREE.DoubleSide }), crate: lam('#B98A55'), lap: lam('#5B6178'),
  board: lam('#8C6A43'), tube: lam('#B8912F') };
const screenCanvas = document.createElement('canvas'); screenCanvas.width = 64; screenCanvas.height = 40;
const screenTex = new THREE.CanvasTexture(screenCanvas); screenTex.encoding = THREE.sRGBEncoding;
const M_SCREEN = new THREE.MeshBasicMaterial({ map: screenTex }), M_SCREEN_OFF = new THREE.MeshBasicMaterial({ color: lin('#2B2F40') });
let screenT = 0;
function drawScreen(dt){
  screenT += dt * (RM ? .4 : 1);
  const x = screenCanvas.getContext('2d');
  x.fillStyle = '#1E2233'; x.fillRect(0, 0, 64, 40);
  const off = Math.floor(screenT * 6);
  for (let i = 0; i < 6; i++) { const w = 12 + ((i + off) * 37 % 40); x.fillStyle = (i + off) % 4 === 0 ? '#FFD36E' : '#6EE7A8'; x.fillRect(4, 4 + i * 6, w, 3); }
  screenTex.needsUpdate = true;
}
function book(){
  const g = new THREE.Group();
  const l = new THREE.Mesh(G.cover, M.cover), r = new THREE.Mesh(G.cover, M.cover);
  l.position.x = -.038; l.rotation.z = .18; r.position.x = .038; r.rotation.z = -.18; g.add(l, r);
  const pl = new THREE.Mesh(G.page, M.page), pr = new THREE.Mesh(G.page, M.page);
  pl.rotation.x = -Math.PI / 2; pl.position.set(-.036, .005, 0); pl.rotation.y = -.18;
  pr.rotation.x = -Math.PI / 2; pr.position.set(.036, .005, 0); pr.rotation.y = .18; g.add(pl, pr);
  const flipPivot = new THREE.Group(); g.add(flipPivot);
  const fp = new THREE.Mesh(G.page, M.page); fp.rotation.x = -Math.PI / 2; fp.position.x = .036; flipPivot.add(fp);
  g.userData.flip = flipPivot;
  return g;
}

    if (p.walkPath || p.sit) continue;
    if (now < p.nextAt) continue;
    if (view === 'side' || view === 'kinds') {
      if (!feeding) { p.nextAt = now + .3; continue; }
      toolEvent(p, p.fixedKind || kind, now); p.nextAt = now + .9 + Math.random() * 1.6;
    } else if (view === 'city') {
      if (p.gov) { p.nextAt = now + 99; continue; }
      if (!feeding) { p.nextAt = now + .3; continue; }
      const s = p.seq[p.seqI++ % p.seq.length];
      if (s === 'gap') { p.nextAt = now + HOLD + 2.5; continue; }
      toolEvent(p, s, now); p.nextAt = now + .8 + Math.random() * 1.5;
    } else {
      if (!feeding) { p.nextAt = now + .3; continue; }
      if (Math.random() < .15) { p.nextAt = now + HOLD + 1 + Math.random() * 3; continue; }
      toolEvent(p, p.kind, now); p.nextAt = now + .8 + Math.random() * 2;
    }
  }
}

/* ---------- the strip: last 15 s of the first person's tool events ---------- */
const strip = $('#strip'), sctx = strip.getContext('2d');
function drawStrip(now){
  const w = strip.clientWidth, h = strip.clientHeight, dpr = Math.min(2, devicePixelRatio || 1);
  if (strip.width !== Math.round(w * dpr)) { strip.width = Math.round(w * dpr); strip.height = Math.round(h * dpr); }
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const p = people.find(x => !x.walkPath && !x.sit && !x.gov);
  const span = 15, X = at => w - (now - at) / span * (w - 8) - 4;
  if (p) {
    // working bands
    const ev = p.events.slice().sort((a, b) => a.at - b.at);
    for (let i = 0; i < ev.length; i++) {
      const a = ev[i].at, b = Math.min(now, i + 1 < ev.length ? Math.min(ev[i + 1].at, a + HOLD) : a + HOLD);
      sctx.fillStyle = '#E3ECFF'; sctx.fillRect(X(a), 6, Math.max(0, X(b) - X(a)), h - 20);
    }
    for (const e of ev) { sctx.fillStyle = '#2F54C8'; sctx.fillRect(X(e.at) - 1, 4, 2, h - 16); }
  }
  sctx.fillStyle = '#585D82'; sctx.font = '600 10.5px ui-rounded, system-ui, sans-serif'; sctx.fillText(t('strip.label'), 6, h - 3);
}

/* ---------- camera: drag to orbit, wheel to zoom ---------- */
const cam = { tx: 0, ty: 0, tz: 0, dist: 5, el: .4, az: 0 };
let W = 1, H = 1, drag = null;
function resize(){ const r = stage.getBoundingClientRect(); W = Math.max(1, r.width); H = Math.max(1, r.height); renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix(); }
function updateCamera(){
  const h = Math.cos(cam.el) * cam.dist;
  camera.position.set(cam.tx + Math.sin(cam.az) * h, cam.ty + Math.sin(cam.el) * cam.dist, cam.tz + Math.cos(cam.az) * h);
  camera.lookAt(cam.tx, cam.ty, cam.tz);
}
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!drag) return; cam.az -= (e.clientX - drag.x) * .006; cam.el = Math.max(.15, Math.min(1.3, cam.el + (e.clientY - drag.y) * .004)); drag = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.dist = Math.max(1.6, Math.min(20, cam.dist * (e.deltaY > 0 ? 1.1 : .9))); }, { passive: false });

/* ---------- UI ---------- */
function seg(host, items, cur, on){
  host.innerHTML = '';
  for (const [id, label] of items) {
    const b = document.createElement('button'); b.className = 'btn small'; b.type = 'button'; b.textContent = label;
    b.setAttribute('aria-pressed', String(id === cur)); b.addEventListener('click', () => on(id)); host.appendChild(b);
  }
}
function renderUI(){
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  for (const e of document.querySelectorAll('[data-t]')) e.textContent = t(e.dataset.t);
  seg($('#views'), [['side', t('view.side')], ['city', t('view.city')], ['many', t('view.many')]], view, v => { view = v; syncURL(); rebuild(); });
  seg($('#lang'), [['zh', '中文'], ['en', 'EN']], lang, v => { lang = v; syncURL(); renderUI(); });
  seg($('#kinds'), ['build', 'read', 'bash', 'other', 'web'].map(k => [k, t('kind.' + k)]), kind, v => { kind = v; syncURL(); rebuild(); });
  seg($('#todaySeg'), [['0', t('cmp.new')], ['1', t('cmp.today')]], today ? '1' : '0', v => { today = v === '1'; for (const p of people) p.wander = null; syncURL(); renderUI(); });
  const fb = [['auto', t('feed.auto')], ['stop', t('feed.stop')], ['one', t('feed.one')]];
  seg($('#feed'), fb, feeding ? 'auto' : 'stop', v => {
    if (v === 'one') { for (const p of people) if (!p.walkPath && !p.sit && !p.gov) toolEvent(p, view === 'side' ? kind : p.kind, clock); return; }
    feeding = v === 'auto'; syncURL(); renderUI();
  });
  seg($('#hold'), [[3, '3 s'], [6, '6 s'], [10, '10 s']], HOLD, v => { HOLD = v; syncURL(); renderUI(); });
  $('#kindRow').hidden = view !== 'side';
  $('#cityRow').hidden = view !== 'city';
  $('#note').textContent = t('note.' + view) + (view === 'side' && kind === 'web' ? '  ' + t('web.note') : '');
  const oh = $('#opts'); oh.innerHTML = '';
  for (const o of OPTS) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.setAttribute('aria-pressed', String(o === opt || view === 'side'));
    const bb = document.createElement('b'); bb.textContent = t('opt.' + o);
    if (o === 'A') { const r = document.createElement('span'); r.className = 'rec'; r.style.display = 'inline'; r.textContent = t('rec'); bb.appendChild(r); }
    const d = document.createElement('span'); d.textContent = t('opt.' + o + '.d');
    b.append(bb, d);
    b.addEventListener('click', () => { opt = o; if (view === 'side') view = 'city'; syncURL(); rebuild(); });
    oh.appendChild(b);
  }
  const h = TX[lang]['cost.h'], rows = TX[lang]['cost.rows'];
  $('#cost').innerHTML = '<table><tr>' + h.map(x => '<th>' + x + '</th>').join('') + '</tr>' + rows.map(r => '<tr>' + r.map((c, i) => (i ? '<td>' : '<th>') + c + (i ? '</td>' : '</th>')).join('') + '</tr>').join('') + '</table>';
  $('#asks').innerHTML = TX[lang].asks.map(a => '<li>' + a + '</li>').join('');
}
function syncURL(){
  const u = new URLSearchParams({ view, kind, opt, lang, hold: HOLD });
  if (today) u.set('today', '1'); if (!feeding) u.set('feed', 'stop'); if (RM) u.set('rm', '1');
  history.replaceState(null, '', '?' + u.toString());
}
$('#rm').addEventListener('change', e => { RM = e.target.checked; syncURL(); });

/* ---------- loop ---------- */
let clock = 0, simStart = 0, last = performance.now(), fpsN = 0, fpsT = 0, fpsShow = 0;
function tick(dt){
  clock += dt;
  feedStep(clock);
  drawScreen(dt);
  for (const p of people) { const st = stepPerson(p, clock, dt); overlay(p, st, clock); }
  stepSites(); stepParts(dt);
}
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  fpsN++; fpsT += dt; if (fpsT >= 1) { fpsShow = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; }
  tick(dt);
  updateCamera();
  renderer.render(scene, camera);
  drawStrip(clock);
  $('#fps').textContent = t('fps', { fps: fpsShow, n: people.length });
}
resize(); new ResizeObserver(resize).observe(stage);
Promise.all([loadAll(), new Promise(res => new THREE.TextureLoader().load(A + 'particles/smoke_01.png', tx => { tx.encoding = THREE.sRGBEncoding; dustTex = tx; res(); }, undefined, () => res()))]).then(() => {
  rebuild();
  // ?adv=<seconds>: run that much of the scene before the first frame (still screenshots)
  const adv = Math.min(120, +Q.get('adv') || 0);
  for (let s = 0; s < adv; s += 1 / 30) tick(1 / 30);
  if (Q.get('dist')) cam.dist = +Q.get('dist');
  if (Q.get('focus')) cam.tx = { A: -1.25, B: 0, C: 1.25 }[Q.get('focus')] || 0;
  if (Q.get('az')) cam.az = +Q.get('az');
  if (Q.get('tx')) cam.tx = +Q.get('tx');
  if (Q.get('debug')) for (const p of people) document.body.insertAdjacentHTML('beforeend', '<pre class="dbg">' + ['DBG', p.who, p.opt, p.kind, p.cur, 'ham', p.hammer.visible, 'book', p.book.visible, 'spy', p.spy.visible, 'clip', p.clip.visible, 'lap', p.lap.visible, 'pl', p.planks.visible, 'cbpos', p.clip.getWorldPosition(new THREE.Vector3()).toArray().map(v => v.toFixed(2)).join(','), 'hand', p.bones.armL.getWorldPosition(new THREE.Vector3()).toArray().map(v => v.toFixed(2)).join(','), 'par', p.clip.parent && p.clip.parent.name].join(' ') + '</pre>');
  last = performance.now(); requestAnimationFrame(frame);
});
})();
</script>
