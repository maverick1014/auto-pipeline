<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Settings</title>
<style>
  :root {
    --bg: #f5f5f4;
    --card: #ffffff;
    --line: #d9d7d3;
    --text: #1c1b19;
    --dim: #6b6862;
    --ok-bg: #e7f5ea;
    --ok-line: #9cc9a7;
    --ok-text: #1d6b33;
    --bad: #b3261e;
    --bad-bg: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 64px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 24px; }
  h2 {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--dim);
    margin: 28px 0 10px;
  }
  .saved {
    background: var(--ok-bg);
    border: 1px solid var(--ok-line);
    color: var(--ok-text);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 20px;
    font-weight: 600;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 18px;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    align-items: baseline;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row label {
    flex: 0 0 200px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    word-break: break-all;
  }
  .field { flex: 1 1 240px; min-width: 200px; }
  .field input {
    width: 100%;
    padding: 7px 10px;
    font: inherit;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: #fff;
    color: var(--text);
  }
  .field input:focus { outline: 2px solid #7a7a7a; outline-offset: -1px; }
  .hint { flex: 1 0 100%; color: var(--dim); font-size: 13px; }
  .row.bad input { border-color: var(--bad); background: var(--bad-bg); }
  .err { color: var(--bad); font-size: 13px; margin-top: 5px; font-weight: 600; }
  .actions { margin-top: 24px; }
  button {
    font: inherit;
    font-weight: 600;
    padding: 10px 22px;
    border: 1px solid #1c1b19;
    border-radius: 6px;
    background: #1c1b19;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #333; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Agent Settings</h1>
  <p class="sub">Every value in <code>agent.conf</code>. Change it here. Do not edit the file by hand.</p>

  <!--SAVED-->

  <form method="post" action="/save">

    <h2>Limits</h2>
    <div class="card">
<!--ROWS:limits-->
    </div>

    <h2>Who does what</h2>
    <div class="card">
<!--ROWS:roles-->
    </div>
    <p class="hint" style="margin-top:8px">Effort must be one of: low, medium, high, xhigh.</p>

    <h2>Permission</h2>
    <div class="card">
<!--ROWS:permission-->
    </div>

    <!--ROWS:other-->

    <div class="actions">
      <button type="submit">Save</button>
    </div>

  </form>

</div>
</body>
</html>
