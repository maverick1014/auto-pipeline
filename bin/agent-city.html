<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="city-token" content="__CITY_TOKEN__">
<title>Agent City</title>
<link rel="icon" href="data:,">
<style>
:root{
  --paper:#ECF1FF; --panel:#FFFFFF; --panel-2:#F3F5FE; --ink:#2A2B45; --ink-2:#585D82; --ink-3:#8D91B3;
  --line:#DCE2F6; --sky:#CFE6FF; --berry:#FF7593; --berry-deep:#D9506E; --butter:#FFD36E; --mint:#6FD4A8;
  --focus:#4D7CFE;
  --build-bg:#E1ECFF; --build-ink:#3160B5; --ask-bg:#FFE1E8; --ask-ink:#C2345A;
  --rest-bg:#DAF5E8; --rest-ink:#1E8657; --walk-bg:#EDEFF7; --walk-ink:#5F6488;
  --me-bg:#D9FDD3; --me-ink:#1F3D2B; --gov-bg:#FFF0C7; --gov-ink:#8A6000; --ok:#1E8657; --ok-deep:#146342;
  --bgrun-bg:#ECE4FF; --bgrun-ink:#5A3EC8;
  --healthy:#2FB57A; --low:#E8A33A; --missing:#C4C8DD; --na:#9AA0C3;
  --round:ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --display:"Fredoka",ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13162A; --panel:#1C2040; --panel-2:#242951; --ink:#EEF0FF; --ink-2:#B0B5DB; --ink-3:#7B81AA;
    --line:#2D3360; --sky:#1B2046; --focus:#8FB0FF;
    --build-bg:#1E3160; --build-ink:#A9C6FF; --ask-bg:#4A1F33; --ask-ink:#FFB0C3;
    --rest-bg:#173D33; --rest-ink:#93E8C0; --walk-bg:#262B50; --walk-ink:#B3B8DE;
    --me-bg:#144D37; --me-ink:#E3F7EA; --gov-bg:#43381A; --gov-ink:#FFDD8A; --ok:#2FA56F; --ok-deep:#1B7049;
    --missing:#3A4070;
    --bgrun-bg:#30265F; --bgrun-ink:#CDBEFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#13162A; --panel:#1C2040; --panel-2:#242951; --ink:#EEF0FF; --ink-2:#B0B5DB; --ink-3:#7B81AA;
  --line:#2D3360; --sky:#1B2046; --focus:#8FB0FF;
  --build-bg:#1E3160; --build-ink:#A9C6FF; --ask-bg:#4A1F33; --ask-ink:#FFB0C3;
  --rest-bg:#173D33; --rest-ink:#93E8C0; --walk-bg:#262B50; --walk-ink:#B3B8DE;
  --me-bg:#144D37; --me-ink:#E3F7EA; --gov-bg:#43381A; --gov-ink:#FFDD8A; --ok:#2FA56F; --ok-deep:#1B7049;
  --missing:#3A4070;
  --bgrun-bg:#30265F; --bgrun-ink:#CDBEFF;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 var(--round)}
.app{max-width:1500px;margin-inline:auto;padding-inline:16px;padding-block:14px 22px;display:flex;flex-direction:column;gap:14px;min-height:100dvh}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.sign{display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--ink);border-radius:18px;padding:5px 16px 5px 8px;box-shadow:0 3px 0 var(--ink)}
.sign-name{font:700 24px/1 var(--display);letter-spacing:.01em}
.sign-sub{display:block;font:600 10.5px/1.2 var(--mono);color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.stat{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px;color:var(--ink-2)}
.stat b{color:var(--ink);font:700 14px/1 var(--display);font-variant-numeric:tabular-nums}
.stat i{width:9px;height:9px;border-radius:50%;display:block}
.stat.wait{font:inherit;font-size:13px;cursor:pointer;border-color:var(--berry);background:var(--ask-bg);color:var(--ask-ink)}
.stat.wait b{color:var(--ask-ink)}
.stat.wait:disabled{cursor:default;border-color:var(--line);background:var(--panel);color:var(--ink-3)}
.stat.wait:disabled b{color:var(--ink-3)}
.stat.wait:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.stat.ok{border-color:var(--ok);color:var(--ok-deep)}
.stat.off{border-color:var(--ink-3);color:var(--ink-3)}
.stat.refused{border-color:var(--ask-ink);background:var(--ask-bg);color:var(--ask-ink)}

.layout{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.stage-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage-col.no-bar{--stage-off:85px}
.stage{position:relative;overflow:hidden;height:calc(100dvh - var(--stage-off,150px));min-height:460px;--rail-w:212px;--msg-w:380px}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas.grabbing{cursor:grabbing}
.proto{position:absolute;top:12px;left:calc(var(--rail-w) + 24px);z-index:3;background:var(--butter);color:#4A3500;font:600 12px/1 var(--display);padding:7px 12px;border-radius:999px;box-shadow:0 2px 0 rgba(42,43,69,.18);pointer-events:none}
.cam{position:absolute;top:12px;right:12px;z-index:3;display:flex;flex-direction:column;gap:6px;transition:right .2s}
.cam .btn{width:38px;height:38px;padding:0;justify-content:center;background:var(--panel)}
/* V1 (city-ux2 v2): the zoom buttons must not sit under the right-docked message panel -- renderWin()
   toggles these classes on .stage so .cam moves left of whichever of #win/#win-tab actually shows. */
.stage.win-open .cam{right:calc(var(--msg-w) + 24px)}
.stage.win-tab-open .cam{right:52px}

/* V1 (W2): the compact rail, left -- the team list, folds to a thin tab on its own edge; the follow
   chip, top middle of whatever is free between the rail and the message panel. Approved look: mock v2
   (mock/city-ux2-mock.html), .rail/.rail-head/.rail-list/.grp-h/.rrows/.rrow/.sdot/.chip/.rest-t/.tab/
   .rail-tab/.follow/.you, adapted to this page's own CSS vars (--build-bg/ink etc already exist). */
.you{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--berry);color:#fff;font:700 11px/1 var(--round)}
.fold{all:unset;cursor:pointer;flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2);font:700 14px/1 var(--round)}
.fold:hover{background:var(--panel-2);color:var(--ink)}
.fold:focus-visible{outline:2px solid var(--focus)}
.rc{width:10px;height:10px;border-radius:50%;background:var(--rc);flex:none;display:inline-block}
.rail{position:absolute;left:12px;top:12px;z-index:4;width:var(--rail-w);max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(42,43,69,.18);overflow:hidden}
.rail-head{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-bottom:1.5px solid var(--line);font-weight:700;font-size:13px}
.rail-head .n{font:600 12px/1 var(--mono);color:var(--ink-3)}
.rail-head .fold{margin-left:auto}
.rail-list{overflow:auto;padding:4px 4px 8px}
.grp-h{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:6px;padding:6px 6px 3px;font:700 11.5px/1.2 var(--mono);color:var(--ink-2)}
.grp-h:focus-visible{outline:2px solid var(--focus);border-radius:6px}
.grp-h .n{margin-left:auto;color:var(--ink-3);font-weight:600}
/* city-polish P4: ONE straight colour bar per repo group (head + rows together), square corners; the
   section carries --rc, each row's dot carries the person's state colour (.sdot.st-*, below) */
.rail-grp{border-left:4px solid var(--rc);margin:4px 0 6px;padding-left:2px}
.rail-grp .grp-h{padding-top:3px}
.rrows{list-style:none;margin:0;padding:0}
.rrow{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:8px;font-size:12.5px;line-height:1.35}
.rrow.sub{padding-left:16px}
.rrow:hover{background:var(--panel-2)}
.rrow:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.rrow[aria-current="true"]{background:var(--ink);color:var(--paper)}
.rrow.resting{opacity:.7}
.sdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-3)}
.sdot.st-you{background:var(--berry)}
.sdot.st-ask,.sdot.st-gov{background:#E0A526}
.sdot.st-build{background:#4D7CFE}
.sdot.st-walk{background:var(--walk-ink)}
.sdot.st-rest{background:#2FB57A}
.sdot.st-bgrun{background:#8B6CF0}
.rrow b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.you{background:var(--ask-bg);color:var(--ask-ink)}
.chip.ask{background:var(--gov-bg);color:var(--gov-ink)}
.chip.build{background:var(--build-bg);color:var(--build-ink)}
.chip.walk{background:var(--walk-bg);color:var(--walk-ink)}
.chip.rest{background:var(--rest-bg);color:var(--rest-ink)}
.chip.gov{background:var(--gov-bg);color:var(--gov-ink)}
.chip.bgrun{background:var(--bgrun-bg);color:var(--bgrun-ink)}
.rest-t{all:unset;cursor:pointer;display:block;margin:1px 0 2px 8px;padding:1px 6px;border-radius:6px;font:600 11.5px/1.5 var(--round);color:var(--rest-ink)}
.rest-t:focus-visible{outline:2px solid var(--focus)}
.tab{all:unset;cursor:pointer;position:absolute;z-index:4;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;width:30px;background:var(--panel);border:2px solid var(--ink);box-shadow:0 3px 0 rgba(42,43,69,.18);font:700 12px/1.1 var(--round);color:var(--ink)}
.tab:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.tab .v{writing-mode:vertical-rl;white-space:nowrap;max-height:180px;overflow:hidden;text-overflow:ellipsis}
.rail-tab{left:0;top:12px;border-left:0;border-radius:0 12px 12px 0}
.win-tab{right:0;top:12px;border-right:0;border-radius:12px 0 0 12px}
.follow{position:absolute;top:12px;z-index:4;transform:translateX(-50%);display:inline-flex;align-items:center;gap:7px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--ink);color:var(--paper);font:600 12px/1.2 var(--round);box-shadow:0 2px 0 rgba(42,43,69,.25);white-space:nowrap;max-width:60%}
.follow span{overflow:hidden;text-overflow:ellipsis}
.follow kbd{font:600 10.5px/1 var(--mono);opacity:.7}
.follow button{all:unset;cursor:pointer;padding:2px 8px;border-radius:999px;background:var(--paper);color:var(--ink);font:600 11.5px/1.3 var(--round)}
.follow button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* city-add-agent (approved look: mock/city-add-agent-mock.html, owner 2026-10-01): every repo keeps its
   rail group (A1: a repo with nobody online gets one quiet line where the rows would be) and ends with one
   dashed button (A2); A4 opening = the same box with a small spinner, not clickable (a second click opens
   nothing); A4/A5/A6 = the one small box (error, over-cap confirm, the command) that stands in for it. */
.rail-none{margin:0;padding:1px 8px 2px;font-size:12px;line-height:1.5;color:var(--ink-3)}
.add{all:unset;cursor:pointer;box-sizing:border-box;width:calc(100% - 6px);margin:3px 3px 1px;display:flex;align-items:center;justify-content:center;gap:6px;padding:3px 8px;border:1.5px dashed var(--line);border-radius:8px;font:600 12px/1.5 var(--round);color:var(--ink-2)}
.add:hover{border-color:var(--ink-3);background:var(--panel-2);color:var(--ink)}
.add:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.add[aria-disabled="true"]{cursor:default;border-style:solid;color:var(--ink-3);background:none}
.spin{flex:none;width:10px;height:10px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--focus);animation:spin .8s linear infinite}
@keyframes spin{to{rotate:360deg}}
.addbox{margin:3px 3px 1px;padding:6px 8px;border-radius:8px;font-size:12px;line-height:1.45;overflow-wrap:anywhere}
.addbox.err{background:var(--ask-bg);color:var(--ask-ink)}
.addbox.cap{background:var(--gov-bg);color:var(--gov-ink)}
.addbox.cmd{background:var(--panel-2);color:var(--ink-2)}
.addbox b{font-weight:700}
.addbox .nums{display:block;font:600 11.5px/1.5 var(--mono)}
.addbox code{display:block;margin-top:4px;padding:5px 6px;border-radius:6px;background:var(--panel);border:1px solid var(--line);font:11px/1.45 var(--mono);color:var(--ink);word-break:break-all;user-select:all}
.addbox .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mini{all:unset;cursor:pointer;padding:2px 9px;border-radius:999px;background:var(--panel);border:1.5px solid currentColor;font:600 11.5px/1.5 var(--round);color:inherit}
.mini.main{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.mini:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.ov > div,.ov > button{position:absolute;left:0;top:0;will-change:transform}
.bub{background:#FFFFFF;color:#2A2B45;border:2px solid #2A2B45;border-radius:14px;padding:3px 10px;font:600 12.5px/1.4 var(--round);box-shadow:0 2px 0 rgba(42,43,69,.2);pointer-events:auto;cursor:pointer}
.bub>span{display:block;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bub.ask{border-color:#E4476F}
.bub.gov{background:#FFF1C9;border-color:#C99A1E}
.bub.done{border-color:#2FB57A;background:#EFFFF6}
.talkb{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;background:#fff;color:#2A2B45;border:2px solid #2A2B45;border-radius:15px;font:600 15px/1 var(--round);box-shadow:0 2px 0 rgba(42,43,69,.2);pointer-events:auto;cursor:pointer}
.talkb::after{content:"";position:absolute;left:50%;bottom:-9px;width:10px;height:10px;margin-left:-5px;box-sizing:border-box;background:#fff;border:2px solid #2A2B45;border-top:0;border-left:0;transform:rotate(45deg)}
.bub::after,.tagl::after,.qm::after,.rdev::after{content:"";position:absolute;inset:-8px}
.qm{all:unset;cursor:pointer;display:block;width:28px;height:28px;pointer-events:auto;z-index:3}
.qm span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#FF6F8B;color:#fff;font:700 17px/1 var(--display);border:2px solid #fff;box-shadow:0 2px 0 rgba(42,43,69,.25);animation:hop .7s ease-in-out infinite}
.qm:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.qm.grey span{background:#8D91B3;animation:none}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.stale{background:#585D82;color:#fff;border-radius:999px;padding:2px 9px;font:600 11px/1.4 var(--mono);white-space:nowrap}
.gwait{display:inline-flex;align-items:center;gap:5px;background:var(--gov-bg);color:var(--gov-ink);border:1.5px solid var(--gov-ink);border-radius:999px;padding:2px 9px;font:600 11px/1.4 var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none}
.zz{font:700 14px/1 var(--display);color:#8D91B3;letter-spacing:.1em}
.zz span{display:inline-block;animation:zz 2.4s ease-in-out infinite}
.zz span:nth-child(2){animation-delay:.4s}
.zz span:nth-child(3){animation-delay:.8s}
@keyframes zz{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(8px,-14px);opacity:0}}
.tagl{background:var(--c);color:#fff;border-radius:999px;padding:3px 10px;font:600 11.5px/1.3 var(--mono);white-space:nowrap;box-shadow:0 2px 0 rgba(42,43,69,.2);pointer-events:auto;cursor:pointer}
.rdev{background:var(--panel-2);color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:2px 7px;font:600 9.5px/1.3 var(--mono);white-space:nowrap;pointer-events:auto;cursor:pointer}
.tag{z-index:2}
.doing{background:rgba(255,255,255,.92);color:var(--ink-2);border-radius:999px;padding:2px 9px;font:600 10.5px/1.3 var(--mono);box-shadow:0 1px 0 rgba(42,43,69,.15);white-space:nowrap;pointer-events:none}
.lbl{background:rgba(255,255,255,.94);color:#2A2B45;border-radius:999px;padding:2px 10px;font:600 12px/1.5 var(--display);box-shadow:0 2px 0 rgba(42,43,69,.15);white-space:nowrap}
.dlbl{background:rgba(255,255,255,.86);color:#2A2B45;border-left:4px solid var(--c);border-radius:6px;padding:0 6px;font:600 10px/1.6 var(--display);white-space:nowrap;transition:opacity .25s}
.dlbl.far{opacity:0;pointer-events:none}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:8px}
.group{display:inline-flex;align-items:center;gap:5px}
.btn{font:600 13px/1 var(--round);border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:12px;padding:0 12px;min-height:36px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,box-shadow .12s,border-color .12s}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible,select:focus-visible,.row:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary{background:var(--berry);border-color:var(--berry);color:#fff;box-shadow:0 3px 0 var(--berry-deep)}
.btn.primary:active{transform:translateY(3px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 3px 0 var(--ok-deep);white-space:nowrap;min-width:92px;justify-content:center}
.btn.ok:active{transform:translateY(3px);box-shadow:none}
.btn.no{background:var(--panel);border-color:var(--ask-ink);color:var(--ask-ink);white-space:nowrap;min-width:92px;justify-content:center}
.btn svg{width:15px;height:15px}
select{font:600 13px/1 var(--round);min-height:36px;border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:12px;padding:0 10px}
.lead{font-size:13px;color:var(--ink-2);margin-right:2px}

.sign-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--berry);color:#fff;flex:none}
.sign-icon svg{width:20px;height:20px}
.btn svg.lucide{width:16px;height:16px}
.loading{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:var(--paper);font:600 14px/1.4 var(--display);color:var(--ink-2)}
.rdot{width:18px;height:18px;border-radius:50%;border:4px solid var(--c);background:var(--panel);flex:none;justify-self:center}
.rdot.gov{--c:#FFD36E}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.row{width:100%;display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 8px;border-radius:14px;border:1.5px solid transparent;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.row:hover{background:var(--panel-2)}
.row[aria-current="true"]{border-color:var(--berry);background:var(--panel-2)}
.sub{margin-left:22px}
.who{min-width:0;display:flex;flex-direction:column}
.who b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font:12px/1.3 var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font:600 12px/1 var(--round);padding:6px 10px;border-radius:999px;white-space:nowrap}
.pill.build{background:var(--build-bg);color:var(--build-ink)}
.pill.ask{background:var(--ask-bg);color:var(--ask-ink)}
.pill.rest{background:var(--rest-bg);color:var(--rest-ink)}
.pill.walk{background:var(--walk-bg);color:var(--walk-ink)}
.pill.gov{background:var(--gov-bg);color:var(--gov-ink)}
.pill.bgrun{background:var(--bgrun-bg);color:var(--bgrun-ink)}
.pill.you{background:#FF4F72;color:#fff}

.detail{display:flex;flex-direction:column;gap:11px;flex:1;min-height:0;overflow:auto}
.d-head{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center}
.d-name{font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.d-role{font:12px/1.3 var(--mono);color:var(--ink-3)}
.d-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;color:var(--ink-2)}
.track{height:10px;border-radius:999px;background:var(--panel-2);border:1.5px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;transition:width .4s}
.d-tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0}
.d-tools div{background:var(--panel-2);border-radius:12px;padding:7px 9px}
.d-tools dt{font:11px/1.2 var(--mono);color:var(--ink-3)}
.d-tools dd{margin:0;font:700 16px/1.3 var(--display);font-variant-numeric:tabular-nums}
.d-qa{display:flex;flex-direction:column;gap:4px;font-size:13px}
.d-qa p{margin:0;color:var(--ink-2)}
.d-qa b{color:var(--ink);font-weight:700}
.d-actions{display:flex;flex-wrap:wrap;gap:6px}
.d-note,.hint{margin:0;font-size:12.5px;color:var(--ink-3)}

/* the conversation + the box to talk to it (requirements/city.md, Talking) */
.chat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;flex:1 1 auto;min-height:0;overflow:auto}
.chat .msg{display:flex;flex-direction:column;gap:2px;max-width:88%;padding:7px 10px;border-radius:14px;background:var(--panel-2);font-size:13px;line-height:1.4;align-self:flex-start}
.chat .msg[data-kind="owner"],.chat .msg[data-kind="prompt"]:not([data-main="0"]){align-self:flex-end;background:var(--me-bg);color:var(--me-ink)}
.chat .msg b{font:600 11px/1.3 var(--mono);color:var(--ink-3)}
.chat .msg[data-kind="owner"] b,.chat .msg[data-kind="prompt"]:not([data-main="0"]) b{color:var(--me-ink)}
.chat .msg span{white-space:pre-wrap;overflow-wrap:anywhere}
.chat .msg-empty,.chat .msg-wait{text-align:center;font-size:12.5px;color:var(--ink-3);padding:4px 0}
.chat-fail{color:var(--ask-ink)}
.say{display:flex;align-items:center;gap:8px}
.say textarea{flex:1;min-width:0;height:38px;min-height:38px;resize:none;font:14px/1.4 var(--round);color:var(--ink);background:var(--panel-2);border:1.5px solid var(--line);border-radius:12px;padding:7px 10px}
.say .btn{flex:none;white-space:nowrap}
.say .say-send{display:inline-flex;align-items:center;justify-content:center;padding:8px 12px}

.files{margin:2px 0 8px 24px;padding:8px 10px;background:var(--panel-2);border-radius:10px;font:12px/1.5 var(--mono);max-height:180px;overflow:auto}
.files ol{margin:0;padding:0 0 0 18px}
.files p{margin:4px 0 0;font-family:var(--round);color:var(--ink-2)}
.files p:first-child{margin-top:0}
.files code{background:var(--panel);border-radius:6px;padding:1px 5px}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;flex:1;min-height:0;overflow:auto}
.log li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;font-size:13px;line-height:1.45}
.log time{font:12px/1.45 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.log .ask{color:var(--ask-ink)}
.log .done{color:var(--rest-ink)}
.log .wait-you{color:var(--ask-ink)}

/* the "?" panel: sits over the city, inside #stage */
.ask-panel{position:absolute;right:12px;top:12px;z-index:6;width:min(410px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 rgba(42,43,69,.22);padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.ask-head{display:grid;grid-template-columns:minmax(0,1fr) auto 32px;gap:10px;align-items:center}
.ask-title{font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere;outline:none}
.ask-role{font:12px/1.3 var(--mono);color:var(--ink-3)}
.x{all:unset;cursor:pointer;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;color:var(--ink-2)}
.x:hover{background:var(--panel-2)}
.x:focus-visible{outline:2.5px solid var(--focus)}
.why{display:flex;gap:8px;align-items:flex-start;background:var(--ask-bg);color:var(--ask-ink);border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.45}
.why.gov{background:var(--gov-bg);color:var(--gov-ink)}
.q{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.q legend{padding:0;margin-bottom:6px;font-weight:700;font-size:15px;line-height:1.4}
.chip{display:inline-block;font:600 11px/1 var(--mono);letter-spacing:.04em;background:var(--panel-2);color:var(--ink-2);border:1.5px solid var(--line);border-radius:999px;padding:4px 8px;margin-right:6px;vertical-align:2px}
.opt{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start;border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;cursor:pointer;background:var(--panel)}
.opt:hover{border-color:var(--ink-3)}
.opt:has(input:checked){border-color:var(--berry);background:var(--panel-2)}
.opt input{margin:3px 0 0;accent-color:var(--berry)}
.opt b{display:block;font-weight:700}
.opt small{display:block;color:var(--ink-3);font-size:12.5px}
.opt input[type=text]{width:100%;margin-top:6px;font:14px/1.3 var(--round);color:var(--ink);background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.perm{display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:baseline;font-size:13px}
.kv>span{color:var(--ink-3)}
.kv code{font:12.5px/1.4 var(--mono);overflow-wrap:anywhere;color:var(--ink-2)}
.cmd{margin:0;font:13px/1.5 var(--mono);background:var(--panel-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.said{margin:0;font-size:13px;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2)}
.field input{font:14px/1.3 var(--round);color:var(--ink);background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{min-height:40px;padding:0 16px;font-size:14px}
.foot{margin:0;font-size:12.5px;color:var(--ink-3)}
.closed{display:flex;gap:8px;align-items:flex-start;border-radius:12px;padding:9px 11px;font-size:13.5px;line-height:1.45;background:var(--rest-bg);color:var(--rest-ink)}
.closed.no{background:var(--ask-bg);color:var(--ask-ink)}
.closed.late{background:var(--gov-bg);color:var(--gov-ink)}

/* U1: the repo row -- always visible, above the city, one tag per territory; click flies the camera
   there. Approved mock v3 (mock/city-ux-mock.html): .repos/.repo. */
.repos{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding:2px 2px 4px}
.repo{all:unset;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 8px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);font:600 13px/1.2 var(--round);color:var(--ink-2);white-space:nowrap}
.repo:hover{border-color:var(--ink-3)}
.repo:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.repo[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.repo.all{padding-left:12px}
/* U1: the zoom-out hint -- shown briefly when a zoom-out was stopped by the limit. */
.cap-hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:4;background:var(--panel);color:var(--ink-2);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;pointer-events:none}

/* the window: click a person / building / the governor, or open 动态 -- V1 (city-ux2 v2, owner
   2026-09-29): a right-docked message panel, one person's own (the left rail, V1, is the team list; no
   two columns, no 'wide' any more). Folds to a thin tab on its own right edge, like the rail
   (#win-fold/#win-tab, setWinFolded -- mirrors #rail-fold/#rail-tab/setRailFolded). */
.win{position:absolute;right:12px;top:12px;bottom:12px;z-index:5;width:var(--msg-w);overflow:hidden;background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 rgba(42,43,69,.22);padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.win.short{bottom:auto}
.win-head{display:flex;align-items:center;gap:10px}
.win-head .fold{margin-left:auto}
.win-title{flex:1;min-width:0;font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere}

.p-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding-bottom:10px;border-bottom:1.5px solid var(--line)}
.p-name{font-weight:700;font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-facts{font:12px/1.4 var(--mono);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-facts code{font:inherit;color:var(--ink-2)}
.p-bar{grid-column:1 / -1;height:6px}
.p-note{grid-column:1 / -1}
.hist-h{display:flex;align-items:center;gap:8px;margin:0;font-weight:600}
.hist-all{margin-left:auto;font:600 11.5px/1 var(--round);color:var(--ink-2);background:var(--panel-2);border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.hist-all[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hist-all:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.newmsg{all:unset;cursor:pointer;position:absolute;left:50%;transform:translateX(-50%);bottom:64px;z-index:2;background:var(--ink);color:var(--paper);border-radius:999px;padding:5px 12px;font:600 12.5px/1.2 var(--round);box-shadow:0 3px 0 rgba(42,43,69,.25)}
/* U10: activity lines and question/answer cards inside the history list */
.chat .act{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--ink-3);padding:0 4px}
.chat .act time{font:11px/1.4 var(--mono);font-variant-numeric:tabular-nums;flex:none}
.chat .qa{align-self:stretch;border:1.5px solid var(--berry);background:var(--ask-bg);color:var(--ask-ink);border-radius:14px;padding:7px 10px;font-size:13px}
.chat .qa p{margin:2px 0 0}
.chat .qa .wait{font-style:italic}
/* U9: chat text rendered as simple, safe markdown (mdLite) */
.md{overflow-wrap:anywhere}
.md p{margin:0 0 6px} .md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 6px;padding-left:20px}
.md code{font:12px/1.4 var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 4px}
.md pre{margin:0 0 6px;font:12px/1.45 var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;overflow-x:auto;white-space:pre}
.md pre code{border:0;padding:0;background:none}
.md table{border-collapse:collapse;margin:0 0 6px;font-size:12.5px}
.md th,.md td{border:1px solid var(--line);padding:3px 8px;text-align:left}
.md th{background:var(--panel)}

@media (max-width: 960px){
  .stage-col{flex:1}
  .stage{flex:1 1 0;height:auto;min-height:340px}
  .stage canvas{position:absolute;inset:0}
  .stats{margin-left:0}

  .ask-panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:72%}
  /* V1 (city-ux2 v2): the message panel is a bottom sheet on a phone; its folded tab sits centred at
     the bottom edge, horizontal (the rail's own tab stays vertical, on the left edge). */
  .win{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:44%}
  .win-tab{right:auto;left:50%;top:auto;bottom:0;transform:translateX(-50%);width:auto;flex-direction:row;padding:6px 14px;border:2px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0}
  .win-tab .v{writing-mode:horizontal-tb;max-width:220px}

  /* city-polish: the bottom sheet is short (44% of a small stage), so the history must never shrink to
     nothing here -- #detail (overflow:auto) scrolls down to the input row instead. */
  .chat{min-height:96px}
}
@media (prefers-reduced-motion: reduce){ .qm span,.zz span{animation:none} .track i,.btn{transition:none} .spin{animation:none;border-top-color:var(--ink-3)} }

(() => {
'use strict';
/* idea-city C1: English too. LANG is filled in by the server (serve --lang, from agent.conf
   language) -- anything but 'en' counts as 'zh' (the page's default). TEXT carries every text the
   page shows, both languages, same keys; i18n(key, vars) looks the key up in the language now showing,
   replacing every "{name}" with vars[name] -- an unknown key gives the key itself back. Static markup
   (data-t / data-t-aria / data-t-title / data-t-placeholder) is filled once, at start, by applyText(). */

  } else if (role === 'fast-lane-deputy') {
    s.push('Read', 'Edit', 'Edit'); if (Math.random() < .5) s.push('Edit');

  if (Math.random() < p) { const [q, a] = pick(QA); seq.splice(Math.floor(rnd(1, seq.length - 1)), 0, { t:'stuck', q, a }); }
  const plot = freeDistrictPlot(terr, ROLE_TYPE[role] || 'house');
  if (plot) seq.splice(Math.min(seq.length - 1, Math.floor(rnd(1, Math.max(2, seq.length - 1)))), 0, { t:'build', plot });

function feed(c){

function spawnDemo(role, task, terr){

  if (!task) {

  }

  // him (one figure, in govTerr); a new one in another territory appears at its hall as before

let nextSpawn = 6;

  const active = citizens.filter(c => !c.remote && STATE[c.state][0] !== 'rest' && c.state !== 'leaving').length;
  if (active >= 6) return;

/* city-work-anim, #demo: another member's working person sends one relayed tool line about every
   DEMO_REMOTE_TOOL_SEC (names cycling Read, Edit, Bash, Grep; never a file), through the same apply() a real
   relay drives, so it acts out its work like a real member's would. None for a stuck or finished person,
   and none while a team relay is off (frozen). */
const DEMO_REMOTE_TOOL_SEC = 1.6;
const DEMO_REMOTE_TOOLS = [['Read', 'Read'], ['Edit', 'Edit'], ['Bash', 'Bash'], ['Read', 'Grep']];

  if (anyRelayOff()) return;
  for (const c of citizens.slice()) {
    if (!c.remote) continue;

    c.demoToolT = (c.demoToolT || 0) + dt;
    if (c.demoToolT < DEMO_REMOTE_TOOL_SEC) continue;
    c.demoToolT = 0;

    c.demoToolN = n + 1;

}

/* city-talk, #demo (fake data, same look): about every DEMO_TALK_SEC seconds two demo people at work in one

const DEMO_TALK_SEC = 9;

  demoGovTurn(dt);

  demoTalkAt = simT + 1.5; // nobody free to talk: look again soon

  for (const c of citizens) {
    if (c.gone || c.remote || c.stuck || c.doneFlag || (c.state !== 'working' && c.state !== 'building') || c.path.length || talkBusy(c.id)) continue;
    const l = by.get(c.terr);

    const y0 = demoGovYaw.get(t.id) || 0, y1 = turnToward(y0, o ? Math.atan2(o.x - hs.x, o.y - hs.y) : 0, dt);

function update(dt){
  simT += dt;
  pruneTalks();
  if (DEMO) demoRelayTick(dt);
  if (DEMO) demoRemoteTick(dt);
  if (DEMO) demoTalkTick(dt);
  for (const c of citizens) {
    c.stateT += dt;
    if (c.state === 'spawn') { c.alpha = Math.min(1, c.alpha + dt * 2.5); if (c.stateT > .7) leaveSpawn(c); }
    else if (c.state === 'handover') {
      // city-talk T1: it stands beside its sender, face to face, until the hand-over is over (or breaks)
      c.alpha = Math.min(1, c.alpha + dt * 2.5);
      c.yaw = turnToward(c.yaw, faceWant(c), dt);
      if (!handoverOk(c)) leaveSpawn(c);
    }
    else if (c.path.length) move(c, dt);
    else c.yaw = turnToward(c.yaw, faceWant(c), dt); // city-polish P1: a person who stands turns to its work / governor / seat
    switch (c.state) {
      case 'asking':
        // city-join: never mine to answer -- a remote citizen's grey "?" just waits (requirements/city.md, Joining)
        if (c.answered && simT - c.askT > .9) giveAnswer(c);
        else if (DEMO && !c.remote && !c.answered && simT - c.askT > 1.9) emit({ type:'answer', id:c.id, answer: c.pendingAnswer || pick(QA)[1] });
        break;
      case 'heard':
        if (c.stateT > 1.5) { releaseSlot(c); say(c, i18n('say.understood'), 1.1); goTo(c, c.stand, 'back'); }
        break;
      case 'finishing': if (c.stateT > 1.5) goRest(c); break;
      case 'resting': if (!DEMO && !c.leaveFlag && c.stateT > LIVE_REST_SEC) autoLeave(c); break;
      case 'leaving': if (!c.path.length) { c.alpha -= dt * 2; if (c.alpha <= 0) c.gone = true; } break;
      case 'working':
        // calm idle strolls (city-people): only a standalone citizen (no office of its own, no lead
        // keeping it near an office) that has had nothing to do for a while -- never a building citizen,
        // a lead or one of its workers, who keep to their own spot.
        if (c.bld || c.stuck || c.doneFlag || c.office || c.lead) break;
        if (talkBusy(c.id)) break; // city-talk: not while it talks
        if (c.strollPhase === 'pause') {
          if (simT >= c.strollPauseUntil) {
            const rev = reversePath(c.strollOutPath, c.home);
            if (c.strollOutPath.length && pathBlockedByModels(rev, c.x, c.y)) {
              // a new building went up while it was out -- a fresh route, never the stale reversed one.
              c.strollPhase = 'back'; c.path = findPath(c.x, c.y, c.home.x, c.home.y) || [];
              c.state = 'working'; c.stateT = 0;
            // the way out was clear of everyone when it left; only re-checked here in case someone new
            // has since settled right on that route -- a short extra wait, never walking through them.
            } else if (!c.strollOutPath.length || pathAvoidsPoints(rev, c.x, c.y, otherPositions(c.id, null), .5)) {
              c.strollPhase = 'back'; c.path = rev; c.state = 'working'; c.stateT = 0;
            } else c.strollPauseUntil = simT + 1;
          }
        } else if (!c.strollPhase && !c.path.length && simT - c.toolAt >= IDLE_STROLL_SEC) {
          const spot = strollSpot(c.home, 1.5, 4, terrOf(c.terr), otherPositions(c.id, null));
          if (spot) { c.strollPhase = 'out'; goTo(c, spot, 'working'); c.strollOutPath = c.path.slice(); }
        }

    }
    if (DEMO) feed(c);
  }

  updateGovernors(dt);
  for (let i = citizens.length - 1; i >= 0; i--) if (citizens[i].gone) {
    const c = citizens[i];
    if (c.rest && !c.rest.extra) c.rest.by = 0;
    releaseSlot(c);
    if (selected && selected.t === 'c' && selected.id === c.id) selected = c.bld && buildings.includes(c.bld) ? { t:'b', id:c.bld.id } : null;
    citizens.splice(i, 1);
  }
  for (const b of buildings) {
    if (!b.done) { b.shown = Math.min(1, (simT - b.risenAt) * .8); if (b.shown >= 1) { b.done = true; b.popAt = simT; } }

    if (b.showScafUntil != null && simT >= b.showScafUntil) { b.showScaf = false; b.showScafUntil = null; }
    // city-quality: MOVE_SEC after the 'move' event, the record itself lands on the new plot -- until
    // then it stays put (a builder show, 3D view) so nothing else can be built where it still stands.
    if (b.moveTo) {
      b.moveTo.t += dt;
      if (b.moveTo.t >= MOVE_SEC) {
        if (occupied.get(b.gx + ',' + b.gy) === b) occupied.delete(b.gx + ',' + b.gy);
        b.plot = b.moveTo.plot; b.gx = b.moveTo.x; b.gy = b.moveTo.z; b.home = true;
        occupied.set(b.gx + ',' + b.gy, b);
        b.moveTo = null;
        walkGridDirty = true;
      }
    }
  }
  // city-quality: DEMOLISH_SEC after the 'demolish' event, the record itself goes (a sink + fade show, 3D
  // view, plays out first) -- a reverse loop so removing one never skips its neighbour.
  for (let i = buildings.length - 1; i >= 0; i--) {
    const b = buildings[i];
    if (!b.demolishing) continue;
    b.demolishT += dt;
    if (b.demolishT < DEMOLISH_SEC) continue;
    if (occupied.get(b.gx + ',' + b.gy) === b) occupied.delete(b.gx + ',' + b.gy);
    if (selected && selected.t === 'b' && selected.id === b.id) selected = null;
    buildings.splice(i, 1);
  }
  // Worktrees: a merging site's lane finishes growing, a packing site finishes packing -- SITE_MERGE_SEC /
  // SITE_PACK_SEC after its own site_end (s.endAt), it is gone (removed straight from the sites map: no
  // 3D mesh, no fence, nothing left for it to be -- syncAllSiteMeshes drops its meshes on the next sync).
  for (const [id, s] of sites) {
    if (s.endAt == null) continue;
    const timedOut = (s.phase === 'merging' && simT - s.endAt >= SITE_MERGE_SEC) ||
      (s.phase === 'packing' && simT - s.endAt >= SITE_PACK_SEC);
    if (!timedOut) continue;
    sites.delete(id);
    if (typeof syncSiteMesh === 'function') syncSiteMesh(id); // 3D view: drop its meshes the moment it is gone
  }
  if (DEMO) spawner();
}

/* city-idea C7: the box of view's non-void tiles (' ' is void), in scene units relative to
   landState's own mid -- tile (X, Z) covers [X - mid.x, X - mid.x + 1] x [Z - mid.z, Z - mid.z + 1].
   Much of a view's whole w x h rectangle can be void (sea rows, gaps between territories), so this is
   usually smaller than { hx: view.w / 2, hz: view.h / 2 } and centred on the real land, not the view's
   own box. No land tile at all -> { hx: 0, hz: 0, cx: 0, cz: 0 }. Also carries pts: the convex hull of
   every non-void tile's 4 corners (a few dozen points at most, however ragged the land), re-centred on
   (cx, cz) -- an L of territories (or any land that isn't itself a rectangle) leaves a corner of its
   own box empty, so landSpread projects this outline instead of the box's 4 corners to fit and centre
   the real land, not the box around it. */
function landBox(view){
  const mid = { x: Math.round(view.x0 + view.w / 2), z: Math.round(view.z0 + view.h / 2) };
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  const seen = new Set(), pts = [];
  for (let r = 0; r < view.h; r++) {
    const row = view.rows[r];
    for (let c = 0; c < view.w; c++) {
      if (row[c] === ' ') continue;
      const X = view.x0 + c - mid.x, Z = view.z0 + r - mid.z;
      x0 = Math.min(x0, X); x1 = Math.max(x1, X + 1);
      z0 = Math.min(z0, Z); z1 = Math.max(z1, Z + 1);
      for (const p of [[X, Z], [X + 1, Z], [X, Z + 1], [X + 1, Z + 1]]) {
        const k = p[0] + ',' + p[1];
        if (!seen.has(k)) { seen.add(k); pts.push(p); }
      }
    }
  }
  if (!isFinite(x0)) return { hx: 0, hz: 0, cx: 0, cz: 0, pts: [] };
  const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
  // convex hull (monotone chain): sort by x then z, build the lower and upper chains, each dropping
  // the last point while it and the new one turn the same way or straighter (cross <= 0) as the point
  // before it -- what's left is the outline, every point on it or inside it dropped.
  pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [];
  for (const p of pts) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop(); lower.push(p); }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop(); upper.push(p); }
  lower.pop(); upper.pop();
  const hull = lower.concat(upper).map(p => [p[0] - cx, p[1] - cz]);
  return { hx: (x1 - x0) / 2, hz: (z1 - z0) / 2, cx, cz, pts: hull };
}
/* the non-3D half of buildLand(view): map, mid, land, the occupied/rest/home tile pools (a plot may have
   opened by the hall), a record for every already-built building in the view, then updateHome() (the
   world changed: look at a town hall, never at the empty middle of the land). buildLand() calls this
   first, then does the meshes. Runs with no three.js: the tests drive it straight (city-people). */
function landState(view){
  buildingLandState = true; // city-people, Walk: newBuildingRecord() below skips its own reroute -- one reroute at the end instead
  walkGridDirty = true; // a fresh view can move, add or drop any model -- never reuse the old walk grid
  occupied.clear();
  blocked.clear();
  restSlotsByTerr.clear();
  homeSlotsByTerr.clear();
  officeSlotsByLead.clear();
  map = view;
  mid = { x: Math.round(view.x0 + view.w / 2), z: Math.round(view.z0 + view.h / 2) };
  land = landBox(view);
  for (const t of view.territories || []) {
    for (const bd of t.buildings || []) {
      const existing = buildings.find(b => b.terr === t.id && b.plot === bd.plot);
      if (!existing) { newBuildingRecord(t.id, bd.plot, bd.type, bd.x, bd.z, bd.by, true, bd); continue; }
      occupied.set(bd.x + ',' + bd.z, existing);

    for (const o of t.offices || []) blocked.add(o.x + ',' + o.z);

  buildingLandState = false;
  rerouteBlocked(); // city-people, Walk (re-route): the footprints just changed -- move whoever now walks through one
}

/* askName(view): who asks, as people read it (owner E2E, 2026-09-25: the panel and the log used to
   drop the asker's name for the governor's own question). A governor's own ask (view.agent === 'gov')
   -> "<territory name> 总督" (the territory of view.terr, since the governor never asks itself -- the

function askName(view){

/* ASK_CLOSE_MS / askAutoClose(nowMs): the open ask panel closes itself ASK_CLOSE_MS after it first

   (case 'ask_closed' and decide()'s own success/409 paths), never on an open, unanswered ask. Called

const ASK_CLOSE_MS = 10000;
function askAutoClose(nowMs){
  if (!openAskId) return;

  if (!view || typeof view.shownAt !== 'number') return;

/* Camera state: cam = {az, el, dist, tx, tz} in scene coordinates (owner 2026-09-25 bug fix). Nothing
   but the reset-to-home call (the first world, the fit button, page start) and the user's own controls

/* cameraStep(dt): the per-frame camera advance -- the never-stop rotation (through autoRotate(), the

    cam.az = camTween.from + (camTween.to - camTween.from) * e;
    if (camTween.t >= 1) camTween = null;
  }
  if (camFly) {
    // V1: a fly started by startFollow() keeps its own end point tracking the followed person while it
    // flies (camFly.follow), refreshed here before the ease so the fly always arcs toward where the
    // person actually is right now -- never a jump once it lands.
    if (camFly.follow) {
      const p = followPos(camFly.follow);
      if (!p) stopFollow(); else { camFly.x = p[0]; camFly.z = p[1]; }
    }
    if (camFly) {

      const e = camFly.t < .5 ? 2 * camFly.t * camFly.t : 1 - Math.pow(-2 * camFly.t + 2, 2) / 2;
      cam.tx = camFly.fromTx + (camFly.x - camFly.fromTx) * e;
      cam.tz = camFly.fromTz + (camFly.z - camFly.fromTz) * e;
      cam.dist = camFly.fromDist + (camFly.dist - camFly.fromDist) * e;
      if (camFly.t >= 1) camFly = null;
    }

    // V1: once the fly-in is over, cam.tx/tz keep easing toward the followed person (a sprint stays
    // within .15 tiles of the middle); cam.el and cam.dist are never touched here.
    const p = followPos(follow);
    if (!p) stopFollow();
    else {
      const k = 1 - Math.exp(-8 * dt);

}
/* U1 (sim): repoTags(view) -> one tag {id, name, x, z} per territory, scene coordinates relative to
   the view's own middle (same mid as landState). nearestTerr(tags, x, z) -> the id of the nearest tag,
   null with no tags. */
function repoTags(view){
  const mid = { x: Math.round(view.x0 + view.w / 2), z: Math.round(view.z0 + view.h / 2) };
  return (view.territories || []).map(t => ({ id: t.id, name: t.name, x: t.cx - mid.x, z: t.cz - mid.z }));
}

   at every end and junction, flat just above the ground; nothing over water (the bridge deck is the lane
   there); colour smoothed along the lane so a road never steps to a track (mock's laneGeometry). Colour:
   roadColor(t) on a territory's 'r' tiles (its era), trackColor(t) on 't'. */
function laneGeometry(view){
  const positions = [], colors = [], indices = [], y = .02;
  // the lane colour at a point: a territory's own era/infra (roadColor(t) on 'r', trackColor(t) on 't')
  const laneColor = (x, z) => { const X = Math.floor(x), Z = Math.floor(z), ch = landAt(view, X, Z), t = cellTerrain(view, X, Z); return rgbOf(ch === 'r' ? roadColor(t) : trackColor(t)); };
  const { paths, joints } = laneGraph(view);
  for (const { pts } of paths) {
    const raw = pts.map(([x, z]) => laneColor(x, z));
    const col = raw.map((_, i) => { const s = [0, 0, 0]; let n = 0; for (let k = -6; k <= 6; k++) { const c = raw[i + k]; if (c) { s[0] += c[0]; s[1] += c[1]; s[2] += c[2]; n++; } } return s.map(v => v / n); });
    const base = positions.length / 3;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)], dx = b[0] - a[0], dz = b[1] - a[1], l = Math.hypot(dx, dz) || 1, nx = -dz / l, nz = dx / l;
      positions.push(pts[i][0] + nx * LANE_HALF, y, pts[i][1] + nz * LANE_HALF, pts[i][0] - nx * LANE_HALF, y, pts[i][1] - nz * LANE_HALF);
      colors.push(...col[i], ...col[i]);
    }
    for (let i = 0; i + 1 < pts.length; i++) {
      const mx = (pts[i][0] + pts[i + 1][0]) / 2, mz = (pts[i][1] + pts[i + 1][1]) / 2;
      if (isWater(landAt(view, Math.floor(mx), Math.floor(mz)))) continue; // the bridge deck is the lane there
      const a = base + 2 * i;
      indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
  }
  for (const [x, z] of joints) { // round joins and ends
    if (isWater(landAt(view, Math.floor(x), Math.floor(z)))) continue;
    const c = laneColor(x, z), base = positions.length / 3;
    positions.push(x, y + .001, z); colors.push(...c);
    for (let k = 0; k <= 16; k++) { const a = k / 16 * Math.PI * 2; positions.push(x + Math.cos(a) * LANE_HALF, y + .001, z + Math.sin(a) * LANE_HALF); colors.push(...c); }
    for (let k = 0; k < 16; k++) indices.push(base, base + 2 + k, base + 1 + k);
  }

}
function meshFromGeometry(geo, opt){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(geo.positions), 3));
  const col = new Float32Array(geo.colors.length), c = new THREE.Color();
  for (let i = 0; i < geo.colors.length; i += 3) { c.setRGB(geo.colors[i], geo.colors[i + 1], geo.colors[i + 2]).convertSRGBToLinear(); col[i] = c.r; col[i + 1] = c.g; col[i + 2] = c.b; }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(geo.indices);
  g.computeVertexNormals();

  mesh.receiveShadow = true;

}
/* U1: the repo row (approved mock v3, mock/city-ux-mock.html) -- an "All" tag then one tag per

function renderRepos(){
  const el = $('#repos');
  if (!el) return;
  const tags = repoTags(map);
  const parts = ['<button type="button" class="repo all" data-terr="*">' + esc(i18n('repo.all')) + '</button>'];
  for (const t of tags) {
    parts.push('<button type="button" class="repo" data-terr="' + esc(t.id) + '" aria-label="' +
      esc(i18n('repo.goAria', { name: t.name })) + '"><span class="rc" style="--rc:' + terrColor(t.id) +
      '"></span>' + esc(t.name) + '</button>');

/* U1: aria-current follows the look point -- the tag nearest it, or All whenever the view shows the

let reposAriaAt = -Infinity, reposAriaCur;
function updateReposAria(now){
  const el = $('#repos');

  reposAriaAt = now;

  const cur = allLand ? '*' : (nearestTerr(repoTags(map), cam.tx, cam.tz) || '*');

function buildLand(view){
  landState(view); // map, mid, land, the tile pools, building records, updateHome() -- city-people
  renderRepos(); // U1: the repo row follows every world event, not only the first
  while (landGroup.children.length) landGroup.remove(landGroup.children[0]);
  tall.clear();
  for (let i = fadeables.length - 1; i >= 0; i--) if (fadeables[i].fromLand) fadeables.splice(i, 1);
  world.position.set(-mid.x, 0, -mid.z);

  const territories = view.territories || [];
  // idea-city C10: systemsDecor(t, view) once per territory, up front, so its district signs can go
  // straight into landOverlays' .dlbl labels; the loop below reuses this same decor (never calls
  // systemsDecor a second time).
  const decorByTerr = new Map(), dSigns = [];
  for (const t of territories) {
    const decor = systemsDecor(t, view);
    decorByTerr.set(t.id, decor);
    for (const d of decor) if (d.kind === 'knowledge' && d.key === 'roads/road-sign-street' && d.d) dSigns.push({ x: d.x, z: d.z, d: d.d });
  }
  landOverlays(view, dSigns); // Balance E2E bounce 2: removes the old label/sign elements first, then makes fresh ones
  showEmptyLine(view); // city-land: the "还没有领地" line follows every world event, not only the first

  landGroup.add(meshFromGeometry(groundGeometry(view)));
  const wg = waterGeometry(view);
  if (wg.positions.length) landGroup.add(meshFromGeometry(wg, { transparent: true, opacity: .92 }));
  const lg = laneGeometry(view);
  if (lg.positions.length) landGroup.add(meshFromGeometry(lg, { polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }));

  // wild scenery on top of the ground: plants, forest-belt pines, mountain-pass rocks, bridge decks
  const by = {};
  for (const d of wildDecor(view)) (by[d.key] = by[d.key] || []).push(d);
  for (const k in by) instanced(k, by[k], { keepY: true, shadow: false, parent: landGroup });

  for (const t of territories) {
    const hs = t.size < .15 ? 1.3 : 1.85;
    const hallKey = eraLook(t).hall; // Balance: the hall model follows the era shown (village/town/city)
    const hallSink = HEX_SINK[hallKey] || 0;
    const hall = place(hallKey, t.cx - .5, t.cz - .5, { fit: hs, sink: hallSink, parent: landGroup });
    const hallS = fitScale(hallKey, hs);
    const flag = place('flag', t.cx - .4, t.cz - .25, { y: lib[hallKey].size.y * hallS - hallSink * hallS, s: .7, parent: landGroup });
    const hTiles = [[-1, 0], [0, 0], [-1, 1], [0, 1]].map(([dx, dz]) => (t.cx - mid.x + dx) + ',' + (t.cz - mid.z + dz));
    for (const g of [hall, flag]) fadeables.push({ g, tiles: hTiles, fromLand: true });
    const decor = hallDecor(t, view), lamps = decor.filter(d => d.key === 'lantern');
    for (const d of decor) if (d.key !== 'lantern') place(d.key, d.x, d.z, { fit: .8, parent: landGroup });
    instanced('lantern', lamps.map(({ x, z }) => ({ x, z, h: .55 })), { parent: landGroup });
    for (const { x, z } of lamps) { const s = new THREE.Sprite(glowMat); s.position.set(x, .62, z); s.scale.set(.9, .9, 1); s.visible = P.night; landGroup.add(s); glows.push(s); }
    for (const p of t.plots || []) place('patch-grass', p.x + .5, p.z + .5, { fit: .85, keepY: true, y: -.1, parent: landGroup });
    // Balance: the 5 systems' own things (signposts, flowers, a library, a water tower, ...); grouped by
    // model so repeats become one InstancedMesh (buildLand: "use instanced() when you can"). systemsDecor's
    // `key` is 'pack/name' (what the tests and MODELS pin); `lib` (and place()/instanced()) key off that
    // same full entry (idea-city C8: prep(key, g) in loadAll), so it is passed straight through here.
    const sysBy = {};
    for (const d of decorByTerr.get(t.id)) (sysBy[d.key] = sysBy[d.key] || []).push(d);
    for (const key in sysBy) {
      const items = sysBy[key], tint = SYS_TINT[key];
      // Balance: SYS_SCALE (an absolute scale) for keys a "fit to target size" would blow up on a small
      // model (the flowers); SYS_FIT (fit) for everything else, .8 if neither says otherwise.
      const scaleOpt = key in SYS_SCALE ? { s: SYS_SCALE[key] } : { fit: SYS_FIT[key] || .8 };
      if (items.length > 1) {
        instanced(key, items.map(it => Object.assign({ x: it.x, z: it.z }, scaleOpt)), Object.assign({ parent: landGroup, front: FRONT_KEYS.has(key) }, tint ? { tint } : null));
      } else {
        const g = place(key, items[0].x, items[0].z, Object.assign({ parent: landGroup, front: FRONT_KEYS.has(key) }, scaleOpt));
        if (tint) g.traverse(n => { if (n.isMesh) n.material = tintedMat(n.material, tint); }); // ready-made Kenney model, tint only — never a hand-made shape
      }
    }
    // city-people: the rest place's own models (restDecor) -- same grouping as systemsDecor above;
    // each item may carry its own `ry` (rotation), read straight off restDecor's own output.
    const restBy = {};
    for (const d of restDecor(t)) (restBy[d.key] = restBy[d.key] || []).push(d);
    for (const key in restBy) {
      const items = restBy[key], scaleOpt = { fit: REST_FIT[key] || .8 };
      if (items.length > 1) {
        instanced(key, items.map(it => Object.assign({ x: it.x, z: it.z, ry: it.ry || 0 }, scaleOpt)), { parent: landGroup, front: FRONT_KEYS.has(key) });
      } else {

      }
    }
    // city-people: every office's own KayKit cabin and flag (officeDecor); the flag is tinted in the
    // lead's colour, never the cabin (a ready-made model, tint only -- never a hand-made shape).
    const officeBy = {};
    for (const d of officeDecor(t)) (officeBy[d.key] = officeBy[d.key] || []).push(d);
    for (const key in officeBy) {
      const items = officeBy[key], tint = items[0].tint, scaleOpt = OFFICE_OPT[key] || { fit: .8 };
      if (items.length > 1) {
        instanced(key, items.map(it => Object.assign({ x: it.x, z: it.z, ry: it.ry || 0 }, scaleOpt)), Object.assign({ parent: landGroup }, tint ? { tint } : null));
      } else {
        const g = place(key, items[0].x, items[0].z, Object.assign({ parent: landGroup, ry: items[0].ry || 0 }, scaleOpt));
        if (tint) g.traverse(n => { if (n.isMesh) n.material = tintedMat(n.material, tint); });
      }
    }
    // Balance: one record (and mesh) per building, keyed by plot — never a duplicate across repeated
    // buildLand calls (every 'world' event, and the era-flip). A building already known keeps its record;
    // if its era look changed (eraShown(t) moved on), its old mesh is dropped so sync() remakes it fresh
    // with the new eraLook. Buildings are still permanent: none is ever removed.
    for (const bd of t.buildings || []) {

      const existing = buildings.find(b => b.terr === t.id && b.plot === bd.plot);
      if (existing.v && existing.builtEra !== eraShown(t)) dropBuildingMesh(existing);

  }

  if (!firstViewDone && territories.length && lastTouch === -Infinity) { firstViewDone = true; resetCam(); } // only the first world with a territory goes home; a later one never snaps the camera back
  scanTall();
  syncAllSiteMeshes(); // Worktrees: every current site (sites map, not just this view's own) gets its meshes
}

/* ---------- Worktrees: site meshes (fence/sign/light/scaffold/barrier/flag), the merge lane and the
   stalled smoke, all in siteGroup (never cleared by buildLand's own landGroup rebuild -- a merging or
   packing site keeps animating through a world event that no longer lists it, city-worktrees CityState).
   Cost (requirements/city.md, Limits): meshes are only ever rebuilt when a site's own decor-relevant
   fields change (siteMeshSig) -- a per-frame call (updateSiteFrames) only ever touches transforms and
   opacity (smoke puffs, the merge lane's own growth), never geometry. ---------- */
const siteMeshes = new Map(); // id -> {sig, objs:[Object3D...], road, smoke:[{sprite,t0}]}
let smokeTex = null;
const SMOKE_CYCLE = 2.4; // seconds a puff takes to rise and fully fade, then it starts over
const SMOKE_N = 4; // 3-5 puffs (owner, bounce 2)
function siteMeshSig(s){ return [s.phase, s.status, s.stalled, s.human, s.branch, s.x, s.z].join('|'); }
/* the office cabin's own real placed height (officeDecor's OFFICE_OPT fit, the same table it uses),
   read from the loaded model's own box -- never a raw guessed number (bounce 2, owner: "use the page's
   existing size/fit approach"). A sane fallback before the model has loaded (never crashes). */
function cabinHeight(){
  const key = 'kaykit-medieval/building_home_A_blue', opt = OFFICE_OPT[key];
  return lib[key] ? lib[key].size.y * fitScale(key, (opt && opt.fit) || 1.25) : 1.2;
}
/* siteModelOpt(key): place()'s own size option per site model (bounce 2, owner: the light and the fence

   SYS_SCALE already applies to the flowers). Heights are relative to cabinHeight(), so they track the
   cabin if its own fit ever changes. signpost/structure/flag keep 'fit: .8' (owner, bounce 2: "sign and
   flag sizes look fine"). idea-city C8: keyed by the full 'pack/name' entry, like `lib`. */
function siteModelOpt(key){
  const ch = cabinHeight();
  if (key === 'roads/construction-light') return { h: ch * .58 }; // "half to two-thirds of the cabin's height"
  if (key === 'roads/construction-fence') return { h: ch / 3 };   // "height roughly a third of the cabin"
  if (key === 'roads/construction-barrier') return { h: ch * .28 }; // "keep the barrier small"
  if (key === 'kaykit-medieval/building_home_A_blue') return OFFICE_OPT[key] || { fit: 1.25 }; // merging: officeDecor's own size

}
function removeSiteMesh(rec){
  for (const o of rec.objs) { if (o.parent) o.parent.remove(o); }
  if (rec.road && rec.road.parent) rec.road.parent.remove(rec.road);
  for (const p of rec.smoke || []) if (p.sprite.parent) p.sprite.parent.remove(p.sprite);
}
/* the merge lane: a plain-colour ribbon quad, the same technique laneGeometry already uses for every
   other road in the game (a few verts at y .02 plus polygonOffset, never a raised box a fixed height
   above a ground that may not sit exactly at that height everywhere -- bounce 4, owner, measured: "only
   a small flat patch... just above the ground so it never z-fights"). Its own 4 positions are rewritten
   every frame (updateRoadMesh) -- cheap, unlike the static decor meshes above, since it is only ever 4
   vertices; frustumCulled is off so a stale bounding sphere from a previous frame never clips it. Colour:
   the site's own territory road colour (ERA_LOOK[eraShown(t)].road), same as laneGeometry paints. */
const MERGE_LANE_HALF = .25; // "about 0.5 tile wide" (owner, bounce 4)
function makeRoadMesh(terr){
  const t = terrOf(terr), color = t ? eraLook(t).road : TRACK_COLOR;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(12), 3));
  geo.setIndex([0, 1, 2, 1, 3, 2]);

function updateRoadMesh(mesh, from, to, p){

/* syncSiteMesh(id): rebuild one site's static meshes only when siteMeshSig changed (or it is new); a

  const sig = siteMeshSig(site);
  if (prev && prev.sig === sig) return; // nothing a rebuild would change -- keep the meshes as they are
  if (prev) removeSiteMesh(prev);
  const rec = { sig, objs: [], road: prev ? prev.road : null, smoke: (prev && prev.smoke) || [] };
  for (const d of siteDecor(site)) {
    if (d.key === 'particles/smoke_01') continue; // its own puffs, made once below, animated every frame
    if (!lib[d.key]) continue; // never crash on a stray/unloaded key
    const opt = Object.assign({ parent: siteGroup, ry: d.ry || 0 }, siteModelOpt(d.key));
    const g = place(d.key, d.x, d.z, opt);

    // clearly opaque, never all of them caught mid-fade at once (bounce 2, owner: "no visible smoke").

function syncAllSiteMeshes(){

/* particles/smoke_01.png as a sprite, not a model atlas: loadTex() (loadAll's own helper) forces

   -- a plain sprite image needs the loader's normal flipY = true, so this loads it directly instead of
   going through loadTex() (bounce 2, owner: "check the texture actually loads"). Same URL shape either
   way: ASSET + 'particles/smoke_01.png?v=' + ASSET_V. */
function loadSmokeTex(){
  return new Promise(res => texLoader.load(ASSET + 'particles/smoke_01.png?v=' + ASSET_V,
    t => { t.encoding = THREE.sRGBEncoding; res(t); }, undefined, () => res(null)));
}
function makeSmokeSprite(){
  // bounce 3, owner: a dark grey tint reads as trouble on light ground -- the texture on its own is a
  // light, thin wisp that washes out against the grass; SpriteMaterial's own color tints its (white) map.
  const mat = new THREE.SpriteMaterial({ map: smokeTex, color: 0x6b6b6b, transparent: true, opacity: 0, depthWrite: false });
  const s = new THREE.Sprite(mat);
  s.scale.set(1.2, 1.2, 1); // 1.1-1.3 tile (owner, bounce 3)
  return s;
}
/* SMOKE_RISE: how far above its own start a puff climbs before it loops (owner, bounce 3: "1 to 1.5
   tiles more"). smokeStartY(): just above the office cabin's own roof (cabinHeight() -- the same real
   placed height siteModelOpt already reads, plus a little), not a fixed low number -- bounce 2's smoke
   rose from y .3, inside the cabin's own footprint, so the cabin's depth test hid every puff the whole
   time (owner, bounce 3, measured with a debug hook: opacities were fine, only ever hidden behind the
   cabin). */
const SMOKE_RISE = 1.3;

/* per-frame animation only (Limits: keep frame cost low) -- called from sync() every frame: the merge

function updateSiteFrames(dt){
  const y0 = smokeStartY();
  for (const [id, rec] of siteMeshes) {
    if (rec.road) { const r = siteRoad(id); if (r) updateRoadMesh(rec.road, r.from, r.to, r.p); else rec.road.visible = false; }
    for (const p of rec.smoke) {
      p.t0 += dt;
      const k = (p.t0 % SMOKE_CYCLE) / SMOKE_CYCLE;
      if (p.spot) p.sprite.position.set(p.spot.x, y0 + k * SMOKE_RISE, p.spot.z);
      p.sprite.material.opacity = (1 - k) * .75; // ~0.75 at its freshest, fading to 0 (owner, bounce 3)
    }
  }
}
/* the branch sign's own text (Worktrees: "reuse the page's existing text-label/sprite approach for

   name labels; pinSiteSigns() (sync()) positions and shows/hides them every frame. */
const siteSigns = new Map();
function ensureSiteSign(id){
  let s = siteSigns.get(id);
  if (!s) { s = { el: ovEl('lbl'), x: 0, z: 0, text: '' }; siteSigns.set(id, s); }
  return s;
}
function removeSiteSign(id){
  const s = siteSigns.get(id);
  if (s) { s.el.remove(); siteSigns.delete(id); }
}
function pinSiteSigns(){
  for (const [id, rec] of siteMeshes) {
    if (!rec.signAt) continue;
    const sign = siteSigns.get(id); if (!sign) continue;
    sign.x = rec.signAt.x; sign.z = rec.signAt.z;
    setText(sign.el, sign.text);
    const [sx, sy] = toScreen(sign.x, 1.1, sign.z);

function seedSites(){

    s.terr = t.id; s.x = t.cx + dx; s.z = t.cz + dz;
