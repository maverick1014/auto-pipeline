<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agent City</title>
<link rel="icon" href="data:,">
<style>
:root{
  --paper:#ECF1FF; --panel:#FFFFFF; --panel-2:#F3F5FE; --ink:#2A2B45; --ink-2:#585D82; --ink-3:#8D91B3;
  --line:#DCE2F6; --sky:#CFE6FF; --berry:#FF7593; --berry-deep:#D9506E; --butter:#FFD36E; --mint:#6FD4A8;
  --focus:#4D7CFE;
  --build-bg:#E1ECFF; --build-ink:#3160B5; --ask-bg:#FFE1E8; --ask-ink:#C2345A;
  --rest-bg:#DAF5E8; --rest-ink:#1E8657; --walk-bg:#EDEFF7; --walk-ink:#5F6488;
  --gov-bg:#FFF0C7; --gov-ink:#8A6000;
  --round:ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --display:"Fredoka",ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13162A; --panel:#1C2040; --panel-2:#242951; --ink:#EEF0FF; --ink-2:#B0B5DB; --ink-3:#7B81AA;
    --line:#2D3360; --sky:#1B2046; --focus:#8FB0FF;
    --build-bg:#1E3160; --build-ink:#A9C6FF; --ask-bg:#4A1F33; --ask-ink:#FFB0C3;
    --rest-bg:#173D33; --rest-ink:#93E8C0; --walk-bg:#262B50; --walk-ink:#B3B8DE;
    --gov-bg:#43381A; --gov-ink:#FFDD8A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#13162A; --panel:#1C2040; --panel-2:#242951; --ink:#EEF0FF; --ink-2:#B0B5DB; --ink-3:#7B81AA;
  --line:#2D3360; --sky:#1B2046; --focus:#8FB0FF;
  --build-bg:#1E3160; --build-ink:#A9C6FF; --ask-bg:#4A1F33; --ask-ink:#FFB0C3;
  --rest-bg:#173D33; --rest-ink:#93E8C0; --walk-bg:#262B50; --walk-ink:#B3B8DE;
  --gov-bg:#43381A; --gov-ink:#FFDD8A;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 var(--round)}
.app{max-width:1500px;margin-inline:auto;padding-inline:16px;padding-block:14px 22px;display:flex;flex-direction:column;gap:14px;min-height:100dvh}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.sign{display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--ink);border-radius:18px;padding:5px 16px 5px 8px;box-shadow:0 3px 0 var(--ink)}
.sign-name{font:700 24px/1 var(--display);letter-spacing:.01em}
.sign-sub{display:block;font:600 10.5px/1.2 var(--mono);color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.stat{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px;color:var(--ink-2)}
.stat b{color:var(--ink);font:700 14px/1 var(--display);font-variant-numeric:tabular-nums}
.stat i{width:9px;height:9px;border-radius:50%;display:block}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;flex:1;min-height:0}
.stage-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage{position:relative;overflow:hidden;height:calc(100dvh - 150px);min-height:460px}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas.grabbing{cursor:grabbing}
.proto{position:absolute;top:12px;left:12px;z-index:3;background:var(--butter);color:#4A3500;font:600 12px/1 var(--display);padding:7px 12px;border-radius:999px;box-shadow:0 2px 0 rgba(42,43,69,.18);pointer-events:none}
.cam{position:absolute;top:12px;right:12px;z-index:3;display:flex;flex-direction:column;gap:6px}
.cam .btn{width:38px;height:38px;padding:0;justify-content:center;background:var(--panel)}

.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.ov > div{position:absolute;left:0;top:0;will-change:transform}
.bub{background:#FFFFFF;color:#2A2B45;border:2px solid #2A2B45;border-radius:14px;padding:3px 10px;font:600 12.5px/1.4 var(--round);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 rgba(42,43,69,.2)}
.bub.ask{border-color:#E4476F}
.bub.gov{background:#FFF1C9;border-color:#C99A1E}
.bub.done{border-color:#2FB57A;background:#EFFFF6}
.qm{width:28px;height:28px}
.qm span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#FF6F8B;color:#fff;font:700 17px/1 var(--display);border:2px solid #fff;box-shadow:0 2px 0 rgba(42,43,69,.25);animation:hop .7s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.zz{font:700 14px/1 var(--display);color:#8D91B3;letter-spacing:.1em}
.zz span{display:inline-block;animation:zz 2.4s ease-in-out infinite}
.zz span:nth-child(2){animation-delay:.4s}
.zz span:nth-child(3){animation-delay:.8s}
@keyframes zz{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(8px,-14px);opacity:0}}
.tagl{background:var(--c);color:#fff;border-radius:999px;padding:3px 10px;font:600 11.5px/1.3 var(--mono);white-space:nowrap;box-shadow:0 2px 0 rgba(42,43,69,.2)}
.fl{background:var(--c);color:#fff;border-radius:8px;padding:1px 7px;font:600 11px/1.5 var(--mono)}
.lbl{background:rgba(255,255,255,.94);color:#2A2B45;border-radius:999px;padding:2px 10px;font:600 12px/1.5 var(--display);box-shadow:0 2px 0 rgba(42,43,69,.15);white-space:nowrap}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:8px}
.group{display:inline-flex;align-items:center;gap:5px}
.clock{margin-left:auto;font:600 12px/1 var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums;padding-right:4px}
.btn{font:600 13px/1 var(--round);border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:12px;padding:0 12px;min-height:36px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,box-shadow .12s,border-color .12s}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible,select:focus-visible,.row:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary{background:var(--berry);border-color:var(--berry);color:#fff;box-shadow:0 3px 0 var(--berry-deep)}
.btn.primary:active{transform:translateY(3px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
select{font:600 13px/1 var(--round);min-height:36px;border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:12px;padding:0 10px}
.lead{font-size:13px;color:var(--ink-2);margin-right:2px}

.panel{display:flex;flex-direction:column;gap:12px;min-width:0;max-height:calc(100dvh - 100px);overflow:auto;padding-bottom:3px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:14px 16px}
.card-head{margin:0 0 10px;touch-action:none;user-select:none;-webkit-user-select:none}
.card-head button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:8px;font:700 16px/1.2 var(--round);color:var(--ink);cursor:grab;border-radius:10px}
.card-head button:focus-visible{outline:2.5px solid var(--focus);outline-offset:3px}
.card-head .grip{width:14px;height:14px;color:var(--ink-3);flex:none}
.card-head .chev{width:16px;height:16px;margin-left:auto;color:var(--ink-3);transition:transform .15s;flex:none}
.card.collapsed .card-head{margin-bottom:0}
.card.collapsed .card-head .chev{transform:rotate(-90deg)}
.card.collapsed .card-body{display:none!important}
.card.dragging{position:relative;z-index:5;box-shadow:0 10px 24px rgba(42,43,69,.22);border-color:var(--ink-3)}
.card.dragging .card-head button{cursor:grabbing}
.card-head .en{font:600 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}


.sign-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--berry);color:#fff;flex:none}
.sign-icon svg{width:20px;height:20px}
.btn svg.lucide{width:16px;height:16px}
.loading{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:var(--paper);font:600 14px/1.4 var(--display);color:var(--ink-2)}
.rdot{width:18px;height:18px;border-radius:50%;border:4px solid var(--c);background:var(--panel);flex:none;justify-self:center}
.rdot.gov{--c:#FFD36E}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.row{width:100%;display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 8px;border-radius:14px;border:1.5px solid transparent;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.row:hover{background:var(--panel-2)}
.row[aria-current="true"]{border-color:var(--berry);background:var(--panel-2)}
.who{min-width:0;display:flex;flex-direction:column}
.who b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font:12px/1.3 var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font:600 12px/1 var(--round);padding:6px 10px;border-radius:999px;white-space:nowrap}
.pill.build{background:var(--build-bg);color:var(--build-ink)}
.pill.ask{background:var(--ask-bg);color:var(--ask-ink)}
.pill.rest{background:var(--rest-bg);color:var(--rest-ink)}
.pill.walk{background:var(--walk-bg);color:var(--walk-ink)}
.pill.gov{background:var(--gov-bg);color:var(--gov-ink)}

.detail{display:flex;flex-direction:column;gap:11px}
.d-head{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center}
.d-name{font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.d-role{font:12px/1.3 var(--mono);color:var(--ink-3)}
.d-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;color:var(--ink-2)}
.track{height:10px;border-radius:999px;background:var(--panel-2);border:1.5px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;transition:width .4s}
.d-tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0}
.d-tools div{background:var(--panel-2);border-radius:12px;padding:7px 9px}
.d-tools dt{font:11px/1.2 var(--mono);color:var(--ink-3)}
.d-tools dd{margin:0;font:700 16px/1.3 var(--display);font-variant-numeric:tabular-nums}
.d-qa{display:flex;flex-direction:column;gap:4px;font-size:13px}
.d-qa p{margin:0;color:var(--ink-2)}
.d-qa b{color:var(--ink);font-weight:700}
.d-actions{display:flex;flex-wrap:wrap;gap:6px}
.d-note,.hint{margin:0;font-size:12.5px;color:var(--ink-3)}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;max-height:260px;overflow:auto}
.log li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;font-size:13px;line-height:1.45}
.log time{font:12px/1.45 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.log .ask{color:var(--ask-ink)}
.log .done{color:var(--rest-ink)}


@media (max-width: 960px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .stage{height:min(66vh,calc(100vw * 1.1));min-height:340px}
  .panel{max-height:none;overflow:visible}
  .stats{margin-left:0}
}
@media (prefers-reduced-motion: reduce){ .qm span,.zz span{animation:none} .track i,.btn,.card-head .chev{transition:none} }
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="sign">
      <span class="sign-icon"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg></span>
      <div><span class="sign-name">Agent City</span><span class="sign-sub">auto-pipeline · 3D</span></div>
    </div>
    <div class="stats" id="stats" aria-live="polite"></div>
  </header>

  <main class="layout">
    <section class="stage-col" aria-label="城市">
      <div class="stage" id="stage">
        <canvas id="city" role="img" aria-label="3D 小岛：每个小人是一个 agent"></canvas>
        <div class="ov" id="ov"></div>
        <div class="proto" id="proto">原型 · 模拟数据</div>
        <div class="loading" id="loading"><span id="loading-text">正在搬来素材…</span></div>
        <div class="cam">
          <button class="btn" id="zin" type="button" aria-label="放大"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
          <button class="btn" id="zout" type="button" aria-label="缩小"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <button class="btn" id="rot" type="button" aria-label="转一下"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
          <button class="btn" id="zfit" type="button" aria-label="回到默认视角"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
          </button>
        </div>
      </div>
      <div class="toolbar" role="toolbar" aria-label="控制">
        <div class="group" id="spawn-group">
          <label for="role" class="lead">派一个</label>
          <select id="role">
            <option value="worker">worker · 盖房子</option>
            <option value="task-manager">task manager · 测试塔</option>
            <option value="fast-lane-deputy">fast-lane deputy · 花园</option>
            <option value="merge-deputy">merge deputy · 桥</option>
          </select>
          <button class="btn primary" id="spawn" type="button">派出</button>
        </div>
        <span class="clock" id="clock"></span>
      </div>
    </section>

    <aside class="panel" id="panel" aria-label="信息栏">
      <section class="card" data-card="detail">
        <h2 class="card-head"><button type="button" aria-expanded="true" aria-controls="detail" title="点一下收起或展开，按住拖动换位置"><svg class="grip" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg><span class="en">Selected</span>详情<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></h2>
        <div class="card-body detail" id="detail" aria-live="polite"></div>
      </section>
      <section class="card" data-card="citizens">
        <h2 class="card-head"><button type="button" aria-expanded="true" aria-controls="roster" title="点一下收起或展开，按住拖动换位置"><svg class="grip" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg><span class="en">Citizens</span>市民<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></h2>
        <ul class="card-body roster" id="roster"></ul>
      </section>
      <section class="card" data-card="log">
        <h2 class="card-head"><button type="button" aria-expanded="true" aria-controls="log" title="点一下收起或展开，按住拖动换位置"><svg class="grip" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg><span class="en">Log</span>动态<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></h2>
        <ol class="card-body log" id="log"></ol>
      </section>
    </aside>
  </main>
</div>

<script src="assets/vendor/three.min.js"></script>
<script src="assets/vendor/GLTFLoader.js"></script>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const stage = $('#stage'), canvas = $('#city'), ovRoot = $('#ov');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const BASE = Date.now();
const FRAME_MS = 33;
const IDLE_FRAME_MS = 100;
const MAX_CITIZENS = 40;
const MAX_LOG = 40;
const MAX_FLOATERS = 80;
const LIVE_REST_SEC = 180;
const WALK_SPEED = 1.9 / 3;
const SPRINT_SPEED = 2.3 / 3;
const WALK_ANIM_SCALE = 1 / 3;
const FOV = 40;
const EL_MIN = 15 * Math.PI / 180;
const EL_MAX = 60 * Math.PI / 180;
const EL_DEFAULT = 30 * Math.PI / 180;
const DIST_MIN = 2.5;
const DIST_MAX = 40;
const DIST_DEFAULT = 9;
const TARGET_Y = .4;
const CAM_CLEAR = .35;
const AUTO_ROT_SEC = 300;
const AUTO_ROT_IDLE_MS = 10000;
const CARD_KEY = 'agent-city-cards';
const DEMO = location.hash === '#demo' || location.protocol === 'file:';

function h2r(h){ h = h.replace('#',''); return [0,2,4].map(i => parseInt(h.slice(i,i+2),16)); }
function r2h(c){ return '#' + c.map(v => Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join(''); }
function mix(a, b, t){ const A = h2r(a), B = h2r(b); return r2h(A.map((x,i) => x + (B[i]-x)*t)); }
function sr(seed, i){ const x = Math.sin(seed*12.9898 + i*78.233) * 43758.5453; return x - Math.floor(x); }
function isDark(){ const t = document.documentElement.getAttribute('data-theme'); if (t === 'dark') return true; if (t === 'light') return false; return matchMedia('(prefers-color-scheme: dark)').matches; }

/* =========================================================
   Simulation: the same event contract the real city reads
   (spawn, tool, stuck, answer, done, leave).
   ========================================================= */
const ROLES = {
  'task-manager':     { zh:'任务经理',   color:'#9C86F2', kind:'tower'  },
  'worker':           { zh:'工人',       color:'#5AA9F0', kind:'house'  },
  'fast-lane-deputy': { zh:'快车道副手', color:'#43C58B', kind:'garden' },
  'merge-deputy':     { zh:'合并副手',   color:'#FF9A5C', kind:'bridge' },
  'other':            { zh:'帮手',       color:'#5FC3C9', kind:'house'  },
};
const KIND_ZH = { house:'小房子', tower:'测试塔', garden:'花园', bridge:'桥' };
const STATE = {
  spawn:['walk','出门'], to_plot:['walk','去工地'], building:['build','施工中'],
  to_hall:['ask','去问总督'], asking:['ask','在问总督'], heard:['ask','拿到答案'],
  back:['walk','回工地'], finishing:['rest','封顶了'], to_rest:['rest','去休息'],
  resting:['rest','休息中'], leaving:['walk','下班回家'],

  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 1) drag = { x:e.clientX, y:e.clientY, moved:false, pan: e.button === 2 || e.shiftKey };
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.dist, mx:(a.x + b.x) / 2, my:(a.y + b.y) / 2 }; drag = null; }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
function panBy(dx, dy){
  const k = 2 * cam.dist * Math.tan(FOV * Math.PI / 360) / H;
  const s = Math.sin(cam.az), c = Math.cos(cam.az);
  const f = 1 / Math.sin(cam.el);
  cam.tx = clamp(cam.tx - (dx * c - dy * s * f) * k, -6, 6);
  cam.tz = clamp(cam.tz - (-dx * s - dy * c * f) * k, -6, 6);
}
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    cam.dist = clamp(pinch.z * Math.max(20, pinch.d) / Math.max(20, d), DIST_MIN, DIST_MAX);
    panBy(mx - pinch.mx, my - pinch.my); pinch.mx = mx; pinch.my = my;
    camChanged(); return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 6) return;
  drag.moved = true; canvas.classList.add('grabbing');
  if (drag.pan) panBy(dx, dy);
  else { cam.az -= dx * .008; cam.el = clamp(cam.el + dy * .005, EL_MIN, EL_MAX); }
  drag.x = e.clientX; drag.y = e.clientY;
  camChanged();
});
function endPointer(e){
  const wasTap = drag && !drag.moved && pointers.size === 1;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (wasTap && e.type === 'pointerup') {
    const r = canvas.getBoundingClientRect();
    selected = pickAt(e.clientX - r.left, e.clientY - r.top);
    lastDetailKey = ''; lastRoster = ''; renderPanel(); needFrame = true;
  }
  if (!pointers.size) { drag = null; canvas.classList.remove('grabbing'); }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.dist = clamp(cam.dist * (e.deltaY < 0 ? 1 / 1.1 : 1.1), DIST_MIN, DIST_MAX); camChanged(); }, { passive:false });

/* ---------- opening scene: a city mid-day, not an empty island ---------- */
function placeBuilder(role, task, x, y, tools){
  const R = ROLES[role], c = newCitizen('d' + (++cid), role, task), b = newBuilding(R.kind, x, y, role);
  b.name = task; b.ownerId = c.id;
  c.bld = b; c.stand = standFor(R.kind, x, y); c.x = c.stand.x; c.y = c.stand.y;
  c.alpha = 1; c.state = 'building';
  Object.assign(c.tools, tools);
  c.work = Object.entries(tools).reduce((s, [k, v]) => s + (WEIGHT[k] || .5) * v, 0);
  b.target = b.shown = .92 * (1 - Math.exp(-c.work / KSCALE[R.kind]));
  c.feed = makeFeed(role, 0); c.feed.steps.splice(0, Math.min(4, c.feed.steps.length - 2));
  citizens.push(c);
  return c;
}
function placeResting(role, task, restIdx, bName){
  const c = newCitizen('d' + (++cid), role, task), spot = REST[restIdx];
  spot.by = c.id; c.rest = spot; c.x = spot.x; c.y = spot.y; c.alpha = 1; c.state = 'resting'; c.doneFlag = true;
  const b = buildings.find(x => x.name === bName); if (b) { b.ownerId = c.id; c.bld = b; }
  c.feed = { steps:[{ t:'leave' }], next:0, restSince:0, restFor:rnd(22, 34) };
  citizens.push(c);
  return c;
}
function seed(){
  const hist = [['house',3,0,'worker','价格计算',-420],['tower',5,3,'task-manager','登录',-380],['garden',1,1,'fast-lane-deputy','按钮颜色',-300],
    ['house',0,3,'worker','导出 CSV',-260],['bridge',4,-1,'merge-deputy','合并 login',-200],['house',9,6,'worker','深色模式',-150],['garden',5,1,'fast-lane-deputy','错别字',-45]];
  for (const [k, x, y, role, task, t] of hist) { const b = newBuilding(k, x, y, role); b.done = true; b.shown = b.target = 1; b.name = task; b.doneAt = t; }
  logAt(-420, '总督派出 worker：价格计算');
  logAt(-300, '按钮颜色 完工：花园封顶，去休息', 'done');
  logAt(-200, '合并 login 完工：桥封顶，去休息', 'done');
  logAt(-95, '总督派出 task-manager：设置页');
  logAt(-82, '总督派出 worker：设置页表单');
  logAt(-80, '总督派出 worker：设置页 API');
  logAt(-45, '错别字 完工：花园封顶，去休息', 'done');
  placeBuilder('worker', '设置页表单', 3, 6, { Read:1, Edit:4, Write:1, Bash:1 });
  placeBuilder('task-manager', '设置页', 10, 3, { Read:2, Write:3, Bash:1 });
  const api = placeBuilder('worker', '设置页 API', 8, 3, { Read:2, Edit:2, Bash:1 });
  placeResting('fast-lane-deputy', '错别字', 0, '错别字');
  placeResting('worker', '价格计算', 4, '价格计算');
  api.pendingAnswer = '用 /api/settings';
  api.x = 7.5; api.y = 5.2;
  emit({ type:'stuck', id:api.id, question:'API 路径用哪个？' });
  selected = { t:'c', id:api.id };
}

/* ---------- boot: load the ready-made models, then run at a capped frame rate ---------- */
let lastSim = performance.now(), lastDraw = 0, panelT = 0;
function busy(){
  if (drag && drag.moved || pinch || camTween || autoRotating(performance.now())) return true;
  if (floaters.length) return true;
  return citizens.some(c => c.path.length || c.state === 'building' || c.state === 'spawn' || c.state === 'asking');
}
function autoRotating(now){ return !RM && !drag && !pinch && !camTween && now - lastTouch >= AUTO_ROT_IDLE_MS; }
function autoRotate(now, dt){
  if (autoRotating(now)) cam.az -= dt * Math.PI * 2 / AUTO_ROT_SEC;
}
function frame(now){
  requestAnimationFrame(frame);
  if (document.hidden) { lastSim = now; return; }
  const interval = busy() || needFrame ? FRAME_MS : IDLE_FRAME_MS;
  if (now - lastDraw < interval - 2) return;
  const raw = Math.min(.1, (now - lastSim) / 1000);
  lastSim = now; lastDraw = now; needFrame = false;
  const before = new Set(citizens);
  for (let dt = raw; dt > 0; dt -= .05) update(Math.min(dt, .05));
  for (const c of before) if (!citizens.includes(c)) goneOv.push(c);
  autoRotate(now, raw);
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + raw * 2.2);
    const e = camTween.t < .5 ? 2 * camTween.t * camTween.t : 1 - Math.pow(-2 * camTween.t + 2, 2) / 2;
    cam.az = camTween.from + (camTween.to - camTween.from) * e;
    if (camTween.t >= 1) camTween = null;
  }
  applyTheme();
  updateCamera();
  sync(simT, raw);
  renderer.render(scene, camera);
  panelT += raw;
  if (panelT > .25) { panelT = 0; renderPanel(); }
}
resize(); resetCam(); updateCamera();
Promise.all([
  loadAll((n, total) => { $('#loading-text').textContent = `正在搬来素材 ${n}/${total}`; }),
  ...['suburban/Textures/variation-a.png', 'suburban/Textures/variation-b.png', 'suburban/Textures/variation-c.png'].map(loadTex),
]).then(([, ...tex]) => {
  tex.forEach(t => { if (t) variations.push(t); });
  buildIsland(); scanTall(); buildLife(); buildGlows(); makeGovernor();
  for (const [text, x, h, z] of [['市政厅', 6, 1.95, 6], ['咖啡馆', 5.5, 1.0, 10.5], ['main', 1.2, .85, -1.5]]) { const el = ovEl('lbl'); setText(el, text); labels.push({ el, x, h, z }); }
  if (DEMO) seed(); else connectLive();
  $('#loading').hidden = true;
  new ResizeObserver(() => resize()).observe(stage);
  applyTheme(); updateCamera(); sync(0, 0); renderer.render(scene, camera); renderPanel();
  requestAnimationFrame(frame);
}).catch(err => { $('#loading-text').textContent = '素材没加载成功：' + ((err && err.message) || err); });
})();
