<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="city-token" content="__CITY_TOKEN__">
<title>Agent City</title>
<link rel="icon" href="data:,">
<style>
:root{
  --paper:#ECF1FF; --panel:#FFFFFF; --panel-2:#F3F5FE; --ink:#2A2B45; --ink-2:#585D82; --ink-3:#8D91B3;
  --line:#DCE2F6; --sky:#CFE6FF; --berry:#FF7593; --berry-deep:#D9506E; --butter:#FFD36E; --mint:#6FD4A8;
  --focus:#4D7CFE;
  --build-bg:#E1ECFF; --build-ink:#3160B5; --ask-bg:#FFE1E8; --ask-ink:#C2345A;
  --rest-bg:#DAF5E8; --rest-ink:#1E8657; --walk-bg:#EDEFF7; --walk-ink:#5F6488;
  --gov-bg:#FFF0C7; --gov-ink:#8A6000; --ok:#1E8657; --ok-deep:#146342;
  --healthy:#2FB57A; --low:#E8A33A; --missing:#C4C8DD; --na:#9AA0C3;
  --round:ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --display:"Fredoka",ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13162A; --panel:#1C2040; --panel-2:#242951; --ink:#EEF0FF; --ink-2:#B0B5DB; --ink-3:#7B81AA;
    --line:#2D3360; --sky:#1B2046; --focus:#8FB0FF;
    --build-bg:#1E3160; --build-ink:#A9C6FF; --ask-bg:#4A1F33; --ask-ink:#FFB0C3;
    --rest-bg:#173D33; --rest-ink:#93E8C0; --walk-bg:#262B50; --walk-ink:#B3B8DE;
    --gov-bg:#43381A; --gov-ink:#FFDD8A; --ok:#2FA56F; --ok-deep:#1B7049;
    --missing:#3A4070;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#13162A; --panel:#1C2040; --panel-2:#242951; --ink:#EEF0FF; --ink-2:#B0B5DB; --ink-3:#7B81AA;
  --line:#2D3360; --sky:#1B2046; --focus:#8FB0FF;
  --build-bg:#1E3160; --build-ink:#A9C6FF; --ask-bg:#4A1F33; --ask-ink:#FFB0C3;
  --rest-bg:#173D33; --rest-ink:#93E8C0; --walk-bg:#262B50; --walk-ink:#B3B8DE;
  --gov-bg:#43381A; --gov-ink:#FFDD8A; --ok:#2FA56F; --ok-deep:#1B7049;
  --missing:#3A4070;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 var(--round)}
.app{max-width:1500px;margin-inline:auto;padding-inline:16px;padding-block:14px 22px;display:flex;flex-direction:column;gap:14px;min-height:100dvh}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.sign{display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--ink);border-radius:18px;padding:5px 16px 5px 8px;box-shadow:0 3px 0 var(--ink)}
.sign-name{font:700 24px/1 var(--display);letter-spacing:.01em}
.sign-sub{display:block;font:600 10.5px/1.2 var(--mono);color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.stat{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px;color:var(--ink-2)}
.stat b{color:var(--ink);font:700 14px/1 var(--display);font-variant-numeric:tabular-nums}
.stat i{width:9px;height:9px;border-radius:50%;display:block}
.stat.wait{font:inherit;font-size:13px;cursor:pointer;border-color:var(--berry);background:var(--ask-bg);color:var(--ask-ink)}
.stat.wait b{color:var(--ask-ink)}
.stat.wait:disabled{cursor:default;border-color:var(--line);background:var(--panel);color:var(--ink-3)}
.stat.wait:disabled b{color:var(--ink-3)}
.stat.wait:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;flex:1;min-height:0}
.stage-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage{position:relative;overflow:hidden;height:calc(100dvh - 150px);min-height:460px}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas.grabbing{cursor:grabbing}
.proto{position:absolute;top:12px;left:12px;z-index:3;background:var(--butter);color:#4A3500;font:600 12px/1 var(--display);padding:7px 12px;border-radius:999px;box-shadow:0 2px 0 rgba(42,43,69,.18);pointer-events:none}
.cam{position:absolute;top:12px;right:12px;z-index:3;display:flex;flex-direction:column;gap:6px}
.cam .btn{width:38px;height:38px;padding:0;justify-content:center;background:var(--panel)}

.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.ov > div,.ov > button{position:absolute;left:0;top:0;will-change:transform}
.bub{background:#FFFFFF;color:#2A2B45;border:2px solid #2A2B45;border-radius:14px;padding:3px 10px;font:600 12.5px/1.4 var(--round);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 rgba(42,43,69,.2)}
.bub.ask{border-color:#E4476F}
.bub.gov{background:#FFF1C9;border-color:#C99A1E}
.bub.done{border-color:#2FB57A;background:#EFFFF6}
.qm{all:unset;cursor:pointer;display:block;width:28px;height:28px;pointer-events:auto;z-index:3}
.qm span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#FF6F8B;color:#fff;font:700 17px/1 var(--display);border:2px solid #fff;box-shadow:0 2px 0 rgba(42,43,69,.25);animation:hop .7s ease-in-out infinite}
.qm:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.gwait{display:inline-flex;align-items:center;gap:5px;background:var(--gov-bg);color:var(--gov-ink);border:1.5px solid var(--gov-ink);border-radius:999px;padding:2px 9px;font:600 11px/1.4 var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none}
.zz{font:700 14px/1 var(--display);color:#8D91B3;letter-spacing:.1em}
.zz span{display:inline-block;animation:zz 2.4s ease-in-out infinite}
.zz span:nth-child(2){animation-delay:.4s}
.zz span:nth-child(3){animation-delay:.8s}
@keyframes zz{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(8px,-14px);opacity:0}}
.tagl{background:var(--c);color:#fff;border-radius:999px;padding:3px 10px;font:600 11.5px/1.3 var(--mono);white-space:nowrap;box-shadow:0 2px 0 rgba(42,43,69,.2)}
.tag{z-index:2}
.fl{background:var(--c);color:#fff;border-radius:8px;padding:1px 7px;font:600 11px/1.5 var(--mono)}
.lbl{background:rgba(255,255,255,.94);color:#2A2B45;border-radius:999px;padding:2px 10px;font:600 12px/1.5 var(--display);box-shadow:0 2px 0 rgba(42,43,69,.15);white-space:nowrap}
.era-sign{background:var(--gov-bg);color:var(--gov-ink);border:1.5px solid var(--gov-ink);border-radius:999px;padding:3px 10px;font:600 12px/1.3 var(--round);white-space:nowrap;box-shadow:0 2px 0 rgba(42,43,69,.18);z-index:1}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:8px}
.group{display:inline-flex;align-items:center;gap:5px}
.clock{margin-left:auto;font:600 12px/1 var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums;padding-right:4px}
.btn{font:600 13px/1 var(--round);border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:12px;padding:0 12px;min-height:36px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,box-shadow .12s,border-color .12s}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible,select:focus-visible,.row:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary{background:var(--berry);border-color:var(--berry);color:#fff;box-shadow:0 3px 0 var(--berry-deep)}
.btn.primary:active{transform:translateY(3px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 3px 0 var(--ok-deep);white-space:nowrap;min-width:92px;justify-content:center}
.btn.ok:active{transform:translateY(3px);box-shadow:none}
.btn.no{background:var(--panel);border-color:var(--ask-ink);color:var(--ask-ink);white-space:nowrap;min-width:92px;justify-content:center}
.btn svg{width:15px;height:15px}
select{font:600 13px/1 var(--round);min-height:36px;border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:12px;padding:0 10px}
.lead{font-size:13px;color:var(--ink-2);margin-right:2px}

.panel{display:flex;flex-direction:column;gap:12px;min-width:0;max-height:calc(100dvh - 100px);overflow:auto;padding-bottom:3px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:14px 16px}
.card-head{margin:0 0 10px;touch-action:none;user-select:none;-webkit-user-select:none}
.card-head button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:8px;font:700 16px/1.2 var(--round);color:var(--ink);cursor:grab;border-radius:10px}
.card-head button:focus-visible{outline:2.5px solid var(--focus);outline-offset:3px}
.card-head .grip{width:14px;height:14px;color:var(--ink-3);flex:none}
.card-head .chev{width:16px;height:16px;margin-left:auto;color:var(--ink-3);transition:transform .15s;flex:none}
.card.collapsed .card-head{margin-bottom:0}
.card.collapsed .card-head .chev{transform:rotate(-90deg)}
.card.collapsed .card-body{display:none!important}
.card.dragging{position:relative;z-index:5;box-shadow:0 10px 24px rgba(42,43,69,.22);border-color:var(--ink-3)}
.card.dragging .card-head button{cursor:grabbing}
.card-head .en{font:600 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}


.sign-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--berry);color:#fff;flex:none}
.sign-icon svg{width:20px;height:20px}
.btn svg.lucide{width:16px;height:16px}
.loading{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:var(--paper);font:600 14px/1.4 var(--display);color:var(--ink-2)}
.rdot{width:18px;height:18px;border-radius:50%;border:4px solid var(--c);background:var(--panel);flex:none;justify-self:center}
.rdot.gov{--c:#FFD36E}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.row{width:100%;display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 8px;border-radius:14px;border:1.5px solid transparent;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.row:hover{background:var(--panel-2)}
.row[aria-current="true"]{border-color:var(--berry);background:var(--panel-2)}
.who{min-width:0;display:flex;flex-direction:column}
.who b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font:12px/1.3 var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font:600 12px/1 var(--round);padding:6px 10px;border-radius:999px;white-space:nowrap}
.pill.build{background:var(--build-bg);color:var(--build-ink)}
.pill.ask{background:var(--ask-bg);color:var(--ask-ink)}
.pill.rest{background:var(--rest-bg);color:var(--rest-ink)}
.pill.walk{background:var(--walk-bg);color:var(--walk-ink)}
.pill.gov{background:var(--gov-bg);color:var(--gov-ink)}
.pill.you{background:#FF4F72;color:#fff}

.detail{display:flex;flex-direction:column;gap:11px}
.d-head{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center}
.d-name{font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.d-role{font:12px/1.3 var(--mono);color:var(--ink-3)}
.d-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;color:var(--ink-2)}
.track{height:10px;border-radius:999px;background:var(--panel-2);border:1.5px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;transition:width .4s}
.d-tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0}
.d-tools div{background:var(--panel-2);border-radius:12px;padding:7px 9px}
.d-tools dt{font:11px/1.2 var(--mono);color:var(--ink-3)}
.d-tools dd{margin:0;font:700 16px/1.3 var(--display);font-variant-numeric:tabular-nums}
.d-qa{display:flex;flex-direction:column;gap:4px;font-size:13px}
.d-qa p{margin:0;color:var(--ink-2)}
.d-qa b{color:var(--ink);font-weight:700}
.d-actions{display:flex;flex-wrap:wrap;gap:6px}
.d-note,.hint{margin:0;font-size:12.5px;color:var(--ink-3)}

/* 城市平衡 card (Balance): era line + sign, one bar per kind, its files when clicked open */
.era{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px;font-size:13px}
.era b{font-size:15px}
.note{margin:0 0 10px;font-size:12.5px;color:var(--ink-3)}
.need{background:var(--panel-2);border-radius:10px;padding:3px 9px;font-weight:600}
.bterr{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.kinds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.kind>button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:16px 52px minmax(0,1fr) 46px;gap:8px;align-items:center;padding:7px 6px;border-radius:10px;cursor:pointer}
.kind>button:hover{background:var(--panel-2)}
.kind>button:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.kind .ic{width:14px;height:14px;border-radius:5px}
.kind .nm{font-weight:700;white-space:nowrap}
.kind .st{font-size:12px;font-weight:700;text-align:right}
.kind .val{grid-column:2 / 5;font-size:12px;color:var(--ink-2);margin-top:-2px}
.st.healthy{color:var(--healthy)} .st.low{color:var(--low)} .st.missing{color:var(--ink-3)} .st.na{color:var(--na)}
.kind .track i{background:var(--ink-3)}
.kind[data-state="healthy"] .track i{background:var(--healthy)}
.kind[data-state="low"] .track i{background:var(--low)}
.kind[data-state="missing"] .track i{background:var(--missing)}
.kind[data-state="na"] .track i{background:var(--na)}
.files{margin:2px 0 8px 24px;padding:8px 10px;background:var(--panel-2);border-radius:10px;font:12px/1.5 var(--mono);max-height:180px;overflow:auto}
.files ol{margin:0;padding:0 0 0 18px}
.files p{margin:4px 0 0;font-family:var(--round);color:var(--ink-2)}
.files p:first-child{margin-top:0}
.files code{background:var(--panel);border-radius:6px;padding:1px 5px}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;max-height:260px;overflow:auto}
.log li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;font-size:13px;line-height:1.45}
.log time{font:12px/1.45 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.log .ask{color:var(--ask-ink)}
.log .done{color:var(--rest-ink)}
.log .wait-you{color:var(--ask-ink)}

/* the "?" panel: sits over the city, inside #stage */
.ask-panel{position:absolute;right:12px;top:12px;z-index:6;width:min(410px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 rgba(42,43,69,.22);padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.ask-head{display:grid;grid-template-columns:minmax(0,1fr) auto 32px;gap:10px;align-items:center}
.ask-title{font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere;outline:none}
.ask-role{font:12px/1.3 var(--mono);color:var(--ink-3)}
.x{all:unset;cursor:pointer;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;color:var(--ink-2)}
.x:hover{background:var(--panel-2)}
.x:focus-visible{outline:2.5px solid var(--focus)}
.why{display:flex;gap:8px;align-items:flex-start;background:var(--ask-bg);color:var(--ask-ink);border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.45}
.why.gov{background:var(--gov-bg);color:var(--gov-ink)}
.q{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.q legend{padding:0;margin-bottom:6px;font-weight:700;font-size:15px;line-height:1.4}
.chip{display:inline-block;font:600 11px/1 var(--mono);letter-spacing:.04em;background:var(--panel-2);color:var(--ink-2);border:1.5px solid var(--line);border-radius:999px;padding:4px 8px;margin-right:6px;vertical-align:2px}
.opt{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start;border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;cursor:pointer;background:var(--panel)}
.opt:hover{border-color:var(--ink-3)}
.opt:has(input:checked){border-color:var(--berry);background:var(--panel-2)}
.opt input{margin:3px 0 0;accent-color:var(--berry)}
.opt b{display:block;font-weight:700}
.opt small{display:block;color:var(--ink-3);font-size:12.5px}
.opt input[type=text]{width:100%;margin-top:6px;font:14px/1.3 var(--round);color:var(--ink);background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.perm{display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:baseline;font-size:13px}
.kv>span{color:var(--ink-3)}
.kv code{font:12.5px/1.4 var(--mono);overflow-wrap:anywhere;color:var(--ink-2)}
.cmd{margin:0;font:13px/1.5 var(--mono);background:var(--panel-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.said{margin:0;font-size:13px;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2)}
.field input{font:14px/1.3 var(--round);color:var(--ink);background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{min-height:40px;padding:0 16px;font-size:14px}
.foot{margin:0;font-size:12.5px;color:var(--ink-3)}
.closed{display:flex;gap:8px;align-items:flex-start;border-radius:12px;padding:9px 11px;font-size:13.5px;line-height:1.45;background:var(--rest-bg);color:var(--rest-ink)}
.closed.no{background:var(--ask-bg);color:var(--ask-ink)}
.closed.late{background:var(--gov-bg);color:var(--gov-ink)}

@media (max-width: 960px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .stage{height:min(66vh,calc(100vw * 1.1));min-height:340px}
  .panel{max-height:none;overflow:visible}
  .stats{margin-left:0}
  .ask-panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:72%}
}
@media (prefers-reduced-motion: reduce){ .qm span,.zz span{animation:none} .track i,.btn,.card-head .chev{transition:none} }
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="sign">
      <span class="sign-icon"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg></span>
      <div><span class="sign-name">Agent City</span><span class="sign-sub">auto-pipeline · 3D</span></div>
    </div>
    <div class="stats" id="stats" aria-live="polite"></div>
  </header>

  <main class="layout">
    <section class="stage-col" aria-label="城市">
      <div class="stage" id="stage">

const BASE = Date.now();

const IDLE_FRAME_MS = 100;
const MAX_CITIZENS = 40;
const MAX_LOG = 40;

function h2r(h){ h = h.replace('#',''); return [0,2,4].map(i => parseInt(h.slice(i,i+2),16)); }
function r2h(c){ return '#' + c.map(v => Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join(''); }

function rgbOf(hex){ const c = h2r(hex); return [c[0] / 255, c[1] / 255, c[2] / 255]; }
/* Growth ground/water: the terrain of the territory cell a world tile sits in (cell (i, j) = floor((X+13)/26), floor((Z+13)/26)) */
function terrAtOf(view, X, Z){
  const bySlot = new Map((view.territories || []).map(t => [t.slot[0] + ',' + t.slot[1], t.terrain]));
  return bySlot.get(Math.floor((X + 13) / 26) + ',' + Math.floor((Z + 13) / 26)) || 'grassland';

/* Balance: the territory object that owns a world tile's cell (used to pick the era's road colour); same

function cellTerrain(view, X, Z){

/* Balance: era shows (village -> town -> city). shows: Map<territory id, {from, to, end}>, set by the

function showOf(id){ return shows.get(id) || null; }

function eraLook(t){ return ERA_LOOK[eraShown(t)]; }
/* Balance: the road colour for t's era: village keeps the terrain's dirt path, town and city get the

function roadColor(t){

function signText(t){

}
/* hallDecor(t, view) -> [{key, x, z}]: lamps around t's hall, each on a 'g' tile (never a road, a plot or

function hallDecor(t, view){
  if (!t.open || eraShown(t) === 'village') return [];
  const on = (x, z) => tileAt(Math.floor(x), Math.floor(z)) === 'g';
  const out = [];
  for (const [x, z] of [[t.cx - 2.4, t.cz + .4], [t.cx + 2.4, t.cz + .4], [t.cx - 2.4, t.cz - .4], [t.cx + 2.4, t.cz - .4]])
    if (on(x, z) && out.filter(d => d.key === 'lantern').length < 2) out.push({ key: 'lantern', x, z });
  return out;
}
/* Balance: how big systemsDecor's items are placed (place()/instanced() 'fit'); unlisted keys use .8. */
const SYS_FIT = {
  'roads/road-sign-street': .55, 'roads/traffic-light': .55, 'industrial/building-h': .8, 'industrial/building-k': .8,
  'industrial/water-tower': .85, 'industrial/chimney-large': .8, 'nature/tree_default': .8, 'nature/tree_oak': .8,
  'nature/plant_bush': .6, 'fantasy/fountain-round': .9,
  // city-people: village-era KayKit stand-ins (police/library/power) and the town/city police car --
  // same numbers the approved mock (mock/city-people-mock.html, "KayKit 替换") already places them at.
  'kaykit-medieval/building_barracks_blue': 1.35, 'kaykit-medieval/building_church_green': 1.25,
  'kaykit-medieval/building_windmill_yellow': 1.35, 'kaykit-city/car_police': .9,
};
/* Balance: an absolute scale (not a "fit to target size" one) for keys where fit makes them huge on a
   small-footprint model — the same numbers buildLand already uses for the wild scenery's own flowers. */
const SYS_SCALE = { 'nature/flower_redA': .55, 'nature/flower_yellowA': .55, 'nature/flower_purpleA': .55 };
/* Balance: 'industrial/building-h' (police station, blue tint) and 'industrial/building-k'
   (library, green) are plain Kenney buildings with unique bare names (never 'commercial/building-a' or
   'industrial/building-a'/'-b', which the town/city ERA_LOOK already uses under the bare names 'building-a'
   and 'building-b' — lib is keyed by the bare name only, so reusing those would make the police station and
   the library look like whichever of the two packs' same-named model finished loading last). */
const SYS_TINT = { 'industrial/building-h': '#3C63D6', 'industrial/building-k': '#2FB57A' };
/* Balance: systemsDecor(t, view) -> [{key, x, z, kind}], the 5 systems made visible in the world
   (requirements/city.md, Balance): [] on day 0 (t.open === 0) or with no balance; nothing for a missing
   or na kind (reward, never punish — a missing kind is absent, never broken: no cones, no cracks). Every
   item stands on its own free 'g' tile of t, never a hallDecor tile. A healthy kind only ever adds to its
   low set, never removes from it. rules: signposts, a police station and traffic lights when healthy.
   beauty: flowers, then a park and the fountain when healthy (painted walls are makeBuilding's job, not
   an item here). knowledge: a library, then district signs when healthy. infra: a water tower, then a
   power plant when healthy. build has no item here: its own houses/shops/offices already show it.
   city-people: the police station, the library and the healthy-infra power item follow eraShown(t) --
   village gets its own KayKit stand-ins (never tinted: SYS_TINT only ever touches the old industrial
   ones), town/city keep the industrial buildings (police tinted blue) with a KayKit police car parked
   on a free ground tile right beside the station. */
function systemsDecor(t, view){
  if (!t.open || !t.balance) return [];
  const era = eraShown(t);
  const avoid = new Set((hallDecor(t, view) || []).map(d => Math.floor(d.x) + ',' + Math.floor(d.z)));
  const plotKeys = new Set((t.plots || []).map(p => p.x + ',' + p.z));
  // the rest place's own 2x2 area (its seats sit on these same tiles) and every office tile -- systemsDecor
  // never plants an item on top of either (city-people, Walk: a rest seat or an office front is a standing
  // point too, never inside another model's own footprint).
  const restKeys = new Set();
  if (t.rest) for (let dz = 0; dz < 2; dz++) for (let dx = 0; dx < 2; dx++) restKeys.add((t.rest.x + dx) + ',' + (t.rest.z + dz));
  const officeKeys = new Set((t.offices || []).map(o => o.x + ',' + o.z));
  const R = Math.min(24, 6 + Math.round((t.size || .3) * 16));
  const cx = Math.round(t.cx), cz = Math.round(t.cz);
  const isRoad = (x, z) => tileAt(x, z) === 'r';
  const roadN = (x, z) => (isRoad(x + 1, z) ? 1 : 0) + (isRoad(x - 1, z) ? 1 : 0) + (isRoad(x, z + 1) ? 1 : 0) + (isRoad(x, z - 1) ? 1 : 0);
  // free 'g' tiles of t, each flagged for whether it sits beside a road junction (3+ road neighbours) and
  // whether it is in the plaza (the hall's own tiles ±2, and the square south of the hall where the
  // governor stands and the default camera looks — home/hallStand/the sign all sit within a few tiles
  // south) — items never land on a road, a plot, the hall, a lamp, the rest place or an office.
  const free = [];
  for (let dz = -R; dz <= R; dz++) for (let dx = -R; dx <= R; dx++) {
    const x = cx + dx, z = cz + dz;
    if (tileAt(x, z) !== 'g') continue;
    const k = x + ',' + z;
    if (avoid.has(k) || plotKeys.has(k) || restKeys.has(k) || officeKeys.has(k)) continue;
    const junction = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([ddx, ddz]) => isRoad(x + ddx, z + ddz) && roadN(x + ddx, z + ddz) >= 3);
    const plaza = dx >= -3 && dx <= 2 && dz >= -3 && dz <= 3;

  }
  const near = free.slice().sort((a, b) => a.d - b.d); // near the hall (no plaza restriction)
  const nearOutPlaza = free.filter(s2 => !s2.plaza).sort((a, b) => a.d - b.d); // police, library: near, never in the plaza/south square
  const far = free.slice().sort((a, b) => b.d - a.d); // water tower, power plant: the outer part of the territory
  const junc = free.filter(s2 => s2.junction).sort((a, b) => a.d - b.d); // signposts, traffic lights: beside a road junction
  const used = new Set();
  const take = list => { for (const s2 of list) if (!used.has(s2.k)) { used.add(s2.k); return s2; } return null; };
  const out = [];
  const put = (list, key, kind) => { const s2 = take(list.length ? list : near); if (!s2) return; out.push({ key, x: s2.x, z: s2.z, kind }); return s2; };
  // put(list, villageKey, elseKey, kind): a village/town-city pair (police, library, power) -- village
  // gets its own KayKit stand-in, town/city keep the industrial building.
  const putEra = (list, villageKey, elseKey, kind) => put(list, era === 'village' ? villageKey : elseKey, kind);
  const st = k => t.balance[k] && t.balance[k].state;
  if (st('rules') === 'low' || st('rules') === 'healthy') {
    put(junc, 'roads/road-sign-street', 'rules'); put(junc, 'roads/road-sign-street', 'rules');
    // police station, near the hall but never in the plaza — low already has it (contract table); town/
    // city get a KayKit police car parked beside it, on a free ground tile within 1 tile (Chebyshev)
    const police = putEra(nearOutPlaza, 'kaykit-medieval/building_barracks_blue', 'industrial/building-h', 'rules');
    if (police && era !== 'village') {
      const carSpot = free.find(s2 => !used.has(s2.k) && Math.max(Math.abs(s2.x - police.x), Math.abs(s2.z - police.z)) <= 1);
      if (carSpot) { used.add(carSpot.k); out.push({ key: 'kaykit-city/car_police', x: carSpot.x, z: carSpot.z, kind: 'rules' }); }
    }

  }
  if (st('beauty') === 'low' || st('beauty') === 'healthy') {
    put(near, 'nature/flower_redA', 'beauty'); put(near, 'nature/flower_yellowA', 'beauty'); put(near, 'nature/flower_purpleA', 'beauty');
    if (st('beauty') === 'healthy') {
      // a park: trees and bushes grouped together, not scattered — an anchor tile, then its nearest
      // still-free neighbours (Chebyshev <= 2)
      const anchor = take(near);

        out.push({ key: 'nature/tree_default', x: anchor.x, z: anchor.z, kind: 'beauty' });

          const near2 = free.filter(s2 => !used.has(s2.k) && Math.max(Math.abs(s2.x - anchor.x), Math.abs(s2.z - anchor.z)) <= 2)

    // library, near the hall but never in the plaza -- village gets its own KayKit stand-in
    putEra(nearOutPlaza, 'kaykit-medieval/building_church_green', 'industrial/building-k', 'knowledge');
    const districts = new Set((t.plots || []).map(p => p.d)); // every district with an open plot
    const signs = st('knowledge') === 'healthy' ? Math.max(1, districts.size) : 1; // low: 1 sign; healthy: one per district
    for (let n = 0; n < signs; n++) put(near, 'roads/road-sign-street', 'knowledge');

    put(far, 'industrial/water-tower', 'infra');

    if (st('infra') === 'healthy') putEra(far, 'kaykit-medieval/building_windmill_yellow', 'industrial/chimney-large', 'infra');

}

   invents text; it only ever shows what the event itself carries. */
function askLine(ev, name) {
  const WHO = { governor: '总督', owner: '你', terminal: '终端' };
  const toolWhat = (tool, what) => tool ? (what ? tool + ' ' + what : tool) : (what || '');
  if (ev.type === 'ask') {
    if (ev.kind === 'permission') {
      return name + ' 要权限：' + toolWhat(ev.tool, ev.what) + ' → 等你批';
    }
    if (ev.agent === 'gov') {
      // the governor asks the owner, never itself -- never says 问总督 (owner E2E, 2026-09-25).
      return name + ' 问你：“' + (ev.what || '') + '”';
    }
    if (ev.phase === 'governor') {
      return name + ' 问总督：“' + (ev.what || '') + '”';
    }
    return name + ' 问总督：“' + (ev.what || '') + '”，没有总督在 → 等你回答';
  }
  if (ev.type === 'ask_phase') {
    if (ev.why === 'pass') return '总督：这个我定不了 → 等你回答 ' + name;
    return '总督 ' + ev.wait + ' 秒没回答 ' + name + ' → 等你';
  }
  if (ev.type === 'ask_closed') {
    const who = WHO[ev.by] || ev.by || '';
    const what = toolWhat(ev.tool, ev.what);
    if (ev.verb === 'closed') {
      // the terminal (or the hook giving up) only took it off the table; it
      // did not itself allow, deny or answer, so this stays neutral.
      return name + ' 的请求转到' + who + '处理：' + what;
    }
    if (ev.verb === 'answer') {
      return ev.text ? who + '回答 ' + name + '：“' + ev.text + '”' : who + '已回答 ' + name;
    }
    if (ev.verb === 'allow') return who + '批准 ' + name + '：' + what;
    if (ev.verb === 'deny') return who + '拒绝 ' + name + '：' + what + (ev.reason ? '，理由：“' + ev.reason + '”' : '');
    return who + '结束了 ' + name + '：' + what;
  }
  return '';
}

      if (!owner) { newBuildingRecord(ev.terr, ev.plot, ev.btype, ev.x, ev.z, ev.by, false); return null; }
      owner.pendingBuild = { terr: ev.terr, plot: ev.plot, btype: ev.btype, by: ev.by };
      // city-people, Walk: the plot stand is a standing point too -- nudged to the nearest free cell so a
      // stray decor item never leaves the worker (and the building record onArrive() makes from its own
      // final position) standing inside a model's own footprint.
      { const s = snapFree(ev.x, ev.z); goTo(owner, { x: s.x, y: s.y }, 'to_plot'); }
      return owner;
    }
    case 'tool': {
      if (!c) return null;
      c.tools[ev.tool] = (c.tools[ev.tool] || 0) + 1;
      c.work += WEIGHT[ev.tool] || .3;
      c.toolAt = simT; // calm idle strolls (city-people): a real tool event is never "nothing to do"
      // a catch-all "Other" tool has no real name to show over someone's head -- no floater for it.
      if (ev.tool !== 'Other' && floaters.length < MAX_FLOATERS) floaters.push({ text: ev.tool, x: c.x, y: c.y, t0: simT, color: c.color, el: null });
      workWalk(c);

    }
    case 'stuck': {
      if (!c) return null;
      const text = stuckText(ev);
      c.stuck = true; c.question = text; c.answered = false; c.answer = '';
      // a citizen with a lead goes to its office; everyone else (leads included) goes to the governor,
      // as before (Interaction: a question or a permission climbs the chain).
      if (['building','working','to_plot','back'].includes(c.state)) goChain(c);
      if (DEMO) log(`${c.task} 卡住了：“${text}” → 去问总督`, 'ask');
      return c;
    }
    case 'answer': {
      if (!c) return null;
      const text = typeof ev.answer === 'string' && ev.answer ? ev.answer : '已回答';
      c.answer = text; c.answered = true; c.stuck = false;
      if (DEMO) log(`总督回答 ${c.task}：“${text}”`);
      return c;
    }
    case 'relay': {
      // the chain of command (Interaction): to 'lead' walks to its lead's office, to 'governor' walks to
      // the territory's governor. citizenStatus reads the resulting state (to_lead/at_lead, to_hall/asking).
      if (!c) return null;

      log(`${c.task} 完工${c.bld ? '：' + TYPE_ZH[c.bld.type] + '封顶' : ''}，去休息`, 'done');
      return c;

    case 'leave': {

      log(`${c ? c.task : ev.by} 没有空地了，先等等`);
      return c;
    }
    case 'gov': {
      setGovState(ev.state);
      if (ev.terr) {
        // Camera home (updateHome) is fixed at the snapshot's own gov.terr (city-land, First view);
        // a live 'gov' event only ever updates that territory's own presence/state, never which
        // territory the camera calls home -- other governors coming and going must not move it.
        if (govTerr === null) govTerr = ev.terr;

      // relay/stuck heading his way (city-people, calm).
      if (ev.agent === 'gov' && ev.terr) governorSummon(ev.terr);
      log(askLine(ev, askName(ev)), ev.phase === 'owner' ? 'wait-you' : 'ask');
      return null;
    }
    case 'ask_phase': {
      const view = asks.get(ev.id);
      const name = view ? askName(view) : askName(ev);
      if (view) Object.assign(view, ev);
      const ac = byId(ev.agent);
      if (ac) ac.askPhase = ev.phase;
      log(askLine(ev, name), 'wait-you');
      if (openAskId === ev.id) renderAskPanel();
      return null;
    }
    case 'ask_closed': {
      const view = asks.get(ev.id);
      const name = view ? askName(view) : askName(ev);
      const ac = byId(ev.agent);
      if (ac) applyAsk(ac, null);
      log(askLine(ev, name));
      if (ev.by === 'governor' && ev.verb === 'answer') {
        say(gov, ev.text || '已回答', 2.6);
        gov.answered++;
      }
      if (openAskId === ev.id && view) {
        view.closed = { by: ev.by, verb: ev.verb, text: ev.text, reason: ev.reason, at: ev.at };
        view.shownAt = performance.now(); // Result line then close: askAutoClose(frame's now) closes it ASK_CLOSE_MS later

}
const emit = ev => apply(ev);
/* the governor row's own pill text, per territory (Interaction: a governor per territory): 不在 only
   when governorAt(terr) is null, else its state (busy/idle/waiting -> 在忙/空闲/等你). */
function govRowText(terr){
  const g = govsByTerr.get(terr);
  if (g && g.state === 'unknown') return '未知'; // seen before a restart, not present yet (city-people D5)
  if (!governorAt(terr)) return '不在';
  const state = g ? g.state : 'idle';
  if (state === 'waiting') return '等你';
  return state === 'busy' ? '在忙' : '空闲';
}
/* rosterGroups() -> [{terr, name, rows: [{id, depth}]}] in map order: per territory, the governor first
   (id "gov:<terr>"), then each lead (its own office -- Interaction) followed by its workers (depth 1),
   then everyone else (depth 0). renderRoster() draws this. */
function rosterGroups(){
  const groups = [];
  for (const t of map.territories || []) {
    const here = citizens.filter(c => c.terr === t.id && !c.gone);
    const rows = [{ id: 'gov:' + t.id, depth: 0 }];
    const leads = here.filter(c => c.office).sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
    const leadIds = new Set(leads.map(c => c.id));
    for (const lead of leads) {
      rows.push({ id: lead.id, depth: 0 });
      for (const w of here) if (w.lead === lead.id) rows.push({ id: w.id, depth: 1 });
    }
    for (const c of here) {
      if (leadIds.has(c.id) || (c.lead && leadIds.has(c.lead))) continue;
      rows.push({ id: c.id, depth: 0 });
    }
    groups.push({ terr: t.id, name: t.name, rows });
  }
  return groups;
}

const ROLE_TYPE = { 'task-manager':'tower', worker:'house', 'fast-lane-deputy':'shop', 'merge-deputy':'workshop' };
/* a free (unlocked, unbuilt) plot of the right district in a territory (Growth: view.territories[].plots) */
function freeDistrictPlot(terr, type){
  const t = terrOf(terr); if (!t) return null;
  const p = (t.plots || []).find(p => p.d === type);
  return p ? { terr, plot: p.k, x: p.x, z: p.z } : null;
}
function makeFeed(role, stuckChance, terr){
  const s = [];
  if (role === 'worker') {
    s.push('Read'); if (Math.random() < .5) s.push('Read');
    const n = Math.floor(rnd(6, 11));
    for (let i = 0; i < n; i++) { s.push(Math.random() < .8 ? 'Edit' : 'Write'); if (i % 3 === 2) s.push('Bash'); }
    s.push('Bash');
  } else if (role === 'task-manager') {
    s.push('Read', 'Read');
    const n = Math.floor(rnd(5, 8)); for (let i = 0; i < n; i++) s.push('Write');
    s.push('Bash', 'Bash');
  } else if (role === 'fast-lane-deputy') {
    s.push('Read', 'Edit', 'Edit'); if (Math.random() < .5) s.push('Edit');
  } else {
    s.push('Bash', 'Bash', 'Bash', 'Bash'); if (Math.random() < .4) s.push('Bash');
  }
  const seq = s.map(tool => ({ t:'tool', tool }));
  const p = stuckChance ?? (role === 'merge-deputy' ? .2 : .4);
  if (Math.random() < p) { const [q, a] = pick(QA); seq.splice(Math.floor(rnd(1, seq.length - 1)), 0, { t:'stuck', q, a }); }
  const plot = freeDistrictPlot(terr, ROLE_TYPE[role] || 'house');
  if (plot) seq.splice(Math.min(seq.length - 1, Math.floor(rnd(1, Math.max(2, seq.length - 1)))), 0, { t:'build', plot });
  seq.push({ t:'done' }, { t:'leave' });
  return { steps: seq, next: 0, restSince: 0, restFor: rnd(16, 30) };
}
function feed(c){
  const f = c.feed; if (!f || simT < f.next) return;
  const s = f.steps[0]; if (!s) return;
  if (c.doneFlag && s.t !== 'leave') { f.steps = f.steps.filter(x => x.t === 'leave'); return; }
  if (s.t === 'leave') {
    if (c.state !== 'resting') return;
    if (!f.restSince) { f.restSince = simT; return; }
    if (simT - f.restSince < f.restFor) return;
    f.steps.shift(); emit({ type:'leave', id:c.id }); return;
  }
  if (c.state !== 'building') return;
  f.steps.shift();
  if (s.t === 'tool') { emit({ type:'tool', id:c.id, tool:s.tool }); f.next = simT + rnd(.55, 1.35); }
  else if (s.t === 'stuck') { c.pendingAnswer = s.a; emit({ type:'stuck', id:c.id, question:s.q }); f.next = simT + .6; }
  else if (s.t === 'build') { const p = s.plot; emit({ type:'build', id:c.id, terr:p.terr, plot:p.plot, btype: ROLE_TYPE[c.role] || 'house', x:p.x, z:p.z, by:c.id }); f.next = simT + rnd(.6, 1.2); }
  else if (s.t === 'done') emit({ type:'done', id:c.id });
}
function spawnDemo(role, task, terr){
  if (!terr) { const ts = map.territories || []; if (!ts.length) return null; terr = pick(ts).id; }
  if (!task) {
    const busy = new Set(citizens.map(c => c.task));
    const opts = TASKS[role].filter(t => !busy.has(t));
    task = pick(opts.length ? opts : TASKS[role]);
  }
  const c = emit({ type:'spawn', id:'d' + (++cid), role, label:role, task, terr });
  if (c) c.feed = makeFeed(role, undefined, terr);
  return c;
}
let nextSpawn = 6;
function spawner(){
  if (simT < nextSpawn) return;
  nextSpawn = simT + rnd(7, 13);
  if (!(map.territories || []).length) return;
  const active = citizens.filter(c => STATE[c.state][0] !== 'rest' && c.state !== 'leaving').length;
  if (active >= 6) return;
  const r = Math.random();
  spawnDemo(r < .5 ? 'worker' : r < .65 ? 'task-manager' : r < .85 ? 'fast-lane-deputy' : 'merge-deputy');
}

function update(dt){
  simT += dt;
  for (const c of citizens) {
    c.stateT += dt;
    if (c.state === 'spawn') { c.alpha = Math.min(1, c.alpha + dt * 2.5); if (c.stateT > .7) { if (c.stuck) goHall(c); else goTo(c, c.stand, 'to_plot'); } }
    else if (c.path.length) move(c, dt);
    switch (c.state) {
      case 'asking':
        if (c.answered && simT - c.askT > .9) giveAnswer(c);
        else if (DEMO && !c.answered && simT - c.askT > 1.9) emit({ type:'answer', id:c.id, answer: c.pendingAnswer || pick(QA)[1] });
        break;
      case 'heard':
        if (c.stateT > 1.5) { releaseSlot(c); say(c, '明白！', 1.1); goTo(c, c.stand, 'back'); }
        break;
      case 'finishing': if (c.stateT > 1.5) goRest(c); break;
      case 'resting': if (!DEMO && !c.leaveFlag && c.stateT > LIVE_REST_SEC) autoLeave(c); break;
      case 'leaving': if (!c.path.length) { c.alpha -= dt * 2; if (c.alpha <= 0) c.gone = true; } break;
      case 'working':
        // calm idle strolls (city-people): only a standalone citizen (no office of its own, no lead
        // keeping it near an office) that has had nothing to do for a while -- never a building citizen,
        // a lead or one of its workers, who keep to their own spot.
        if (c.bld || c.stuck || c.doneFlag || c.office || c.lead) break;
        if (c.strollPhase === 'pause') {
          if (simT >= c.strollPauseUntil) {
            const rev = reversePath(c.strollOutPath, c.home);
            if (c.strollOutPath.length && pathBlockedByModels(rev, c.x, c.y)) {
              // a new building went up while it was out -- a fresh route, never the stale reversed one.
              c.strollPhase = 'back'; c.path = findPath(c.x, c.y, c.home.x, c.home.y) || [];
              c.state = 'working'; c.stateT = 0;
            // the way out was clear of everyone when it left; only re-checked here in case someone new
            // has since settled right on that route -- a short extra wait, never walking through them.
            } else if (!c.strollOutPath.length || pathAvoidsPoints(rev, c.x, c.y, otherPositions(c.id, null), .5)) {
              c.strollPhase = 'back'; c.path = rev; c.state = 'working'; c.stateT = 0;
            } else c.strollPauseUntil = simT + 1;
          }
        } else if (!c.strollPhase && !c.path.length && simT - c.toolAt >= IDLE_STROLL_SEC) {
          const spot = strollSpot(c.home, 1.5, 4, terrOf(c.terr), otherPositions(c.id, null));
          if (spot) { c.strollPhase = 'out'; goTo(c, spot, 'working'); c.strollOutPath = c.path.slice(); }
        }
        break;
    }
    if (DEMO) feed(c);
  }
  updateGovernors(dt);
  for (let i = citizens.length - 1; i >= 0; i--) if (citizens[i].gone) {
    const c = citizens[i];
    if (c.rest && !c.rest.extra) c.rest.by = 0;
    releaseSlot(c);
    if (selected && selected.t === 'c' && selected.id === c.id) selected = c.bld && buildings.includes(c.bld) ? { t:'b', id:c.bld.id } : null;
    citizens.splice(i, 1);
  }
  for (const b of buildings) {
    if (!b.done) { b.shown = Math.min(1, (simT - b.risenAt) * .8); if (b.shown >= 1) { b.done = true; b.popAt = simT; } }
  }
  for (let i = floaters.length - 1; i >= 0; i--) if (simT - floaters[i].t0 > 1.2) { const f = floaters[i]; if (f.el) f.el.remove(); floaters.splice(i, 1); }
  // Worktrees: a merging site's lane finishes growing, a packing site finishes packing -- SITE_MERGE_SEC /
  // SITE_PACK_SEC after its own site_end (s.endAt), it is gone (removed straight from the sites map: no
  // 3D mesh, no fence, nothing left for it to be -- syncAllSiteMeshes drops its meshes on the next sync).
  for (const [id, s] of sites) {
    if (s.endAt == null) continue;
    const timedOut = (s.phase === 'merging' && simT - s.endAt >= SITE_MERGE_SEC) ||
      (s.phase === 'packing' && simT - s.endAt >= SITE_PACK_SEC);
    if (!timedOut) continue;
    sites.delete(id);
    if (typeof syncSiteMesh === 'function') syncSiteMesh(id); // 3D view: drop its meshes the moment it is gone
  }
  if (DEMO) spawner();
}

/* the non-3D half of buildLand(view): map, mid, land, the occupied/rest/home tile pools (a plot may have
   opened by the hall), a record for every already-built building in the view, then updateHome() (the
   world changed: look at a town hall, never at the empty middle of the land). buildLand() calls this
   first, then does the meshes. Runs with no three.js: the tests drive it straight (city-people). */
function landState(view){
  buildingLandState = true; // city-people, Walk: newBuildingRecord() below skips its own reroute -- one reroute at the end instead
  walkGridDirty = true; // a fresh view can move, add or drop any model -- never reuse the old walk grid
  occupied.clear();
  blocked.clear();
  restSlotsByTerr.clear();
  homeSlotsByTerr.clear();
  officeSlotsByLead.clear();
  map = view;
  mid = { x: Math.round(view.x0 + view.w / 2), z: Math.round(view.z0 + view.h / 2) };
  land = { hx: view.w / 2, hz: view.h / 2 };
  for (const t of view.territories || []) {
    for (const bd of t.buildings || []) {
      const existing = buildings.find(b => b.terr === t.id && b.plot === bd.plot);
      if (!existing) { newBuildingRecord(t.id, bd.plot, bd.type, bd.x, bd.z, bd.by, true); continue; }
      occupied.set(bd.x + ',' + bd.z, existing);
    }
    // offices are not walkable for people (Interaction: a lead's office stands on its own tile)
    for (const o of t.offices || []) blocked.add(o.x + ',' + o.z);
  }
  updateHome();
  buildingLandState = false;
  rerouteBlocked(); // city-people, Walk (re-route): the footprints just changed -- move whoever now walks through one
}

/* askName(view): who asks, as people read it (owner E2E, 2026-09-25: the panel and the log used to
   drop the asker's name for the governor's own question). A governor's own ask (view.agent === 'gov')
   -> "<territory name> 总督" (the territory of view.terr, since the governor never asks itself -- the
   panel title, and every log line of an ask (ask, ask_phase, ask_closed), all read this). Anyone else
   -> its task, else its label. */
function askName(view){
  if (view.agent === 'gov') {
    const t = terrOf(view.terr);
    return (t && t.name ? t.name : view.terr) + ' 总督';
  }
  return view.task || view.label || '';
}
/* ASK_CLOSE_MS / askAutoClose(nowMs): the open ask panel closes itself ASK_CLOSE_MS after it first
   shows a result (answered, allowed, denied, or someone else was first) -- shownAt is stamped then
   (case 'ask_closed' and decide()'s own success/409 paths), never on an open, unanswered ask. Called
   from frame() every tick; a no-op with no open panel or no result shown yet. */
const ASK_CLOSE_MS = 10000;
function askAutoClose(nowMs){
  if (!openAskId) return;
  const view = asks.get(openAskId);
  if (!view || typeof view.shownAt !== 'number') return;
  if (nowMs - view.shownAt >= ASK_CLOSE_MS) closeAskPanel();
}

/* Camera state: cam = {az, el, dist, tx, tz} in scene coordinates (owner 2026-09-25 bug fix). Nothing
   but the reset-to-home call (the first world, the fit button, page start) and the user's own controls
   (drag, pan, pinch, wheel, the quarter-turn button) ever touches it: no live event of any kind. */
const cam = { az: Math.PI / 4, el: EL_DEFAULT, dist: DIST_DEFAULT, tx: 0, tz: 0 };
let camTween = null;
/* autoRotDir: which way the never-stop rotation turns, used by autoRotate(). Owner 2026-09-25 bug: it
   always turned the same way (-1), so a drag against it got turned straight back over the dragged
   angle. dragBy() points it the way the owner's last orbit drag went; before any drag, -1 (today's way). */
let autoRotDir = -1;
/* dragBy(dx, dy, limit): what an orbit drag does (the pointermove handler calls it, passing distMax()
   as limit; pan and pinch are separate). limit is the zoom-out cap for the tilt this drag lands on:
   already fully zoomed out, a tilt stays fully out at the (possibly new) limit for that tilt. */
function dragBy(dx, dy, limit){
  const out = limit != null && cam.dist >= limit - .01;
  cam.az -= dx * .008;
  cam.el = clamp(cam.el + dy * .005, EL_MIN, EL_MAX);
  if (out) cam.dist = limit;
  if (dx) autoRotDir = dx > 0 ? -1 : 1;
}
// owner 2026-09-25: the camera never stops turning — clicks, drags, pinch/wheel zoom and any
// panel (cards, the "?" panel) leave it running; only reduced motion, or a camera tween (reset/
// fit) that needs to finish without a fight, pause it.
function autoRotating(){ return !RM && !camTween; }
/* autoRotate(now, dt): the never-stop rotation, turning cam.az by autoRotDir's way, one turn per
   AUTO_ROT_SEC (now is unused; kept for the caller's convenience). */
function autoRotate(now, dt){
  if (autoRotating()) cam.az += autoRotDir * dt * Math.PI * 2 / AUTO_ROT_SEC;
}
/* cameraStep(dt): the per-frame camera advance -- the never-stop rotation (through autoRotate(), the
   one rotation path) plus the quarter-turn tween. frame() calls this every frame. */
function cameraStep(dt){
  autoRotate(0, dt);
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt * 2.2);
    const e = camTween.t < .5 ? 2 * camTween.t * camTween.t : 1 - Math.pow(-2 * camTween.t + 2, 2) / 2;
    cam.az = camTween.from + (camTween.to - camTween.from) * e;
    if (camTween.t >= 1) camTween = null;
  }
}

/* ---------- Worktrees: site meshes (fence/sign/light/scaffold/barrier/flag), the merge lane and the
   stalled smoke, all in siteGroup (never cleared by buildLand's own landGroup rebuild -- a merging or
   packing site keeps animating through a world event that no longer lists it, city-worktrees CityState).
   Cost (requirements/city.md, Limits): meshes are only ever rebuilt when a site's own decor-relevant
   fields change (siteMeshSig) -- a per-frame call (updateSiteFrames) only ever touches transforms and
   opacity (smoke puffs, the merge lane's own growth), never geometry. ---------- */
const siteMeshes = new Map(); // id -> {sig, objs:[Object3D...], road, smoke:[{sprite,t0}]}

const SMOKE_N = 4; // 3-5 puffs (owner, bounce 2)
function siteMeshSig(s){ return [s.phase, s.status, s.stalled, s.human, s.branch, s.x, s.z].join('|'); }
/* the office cabin's own real placed height (officeDecor's OFFICE_OPT fit, the same table it uses),
   read from the loaded model's own box -- never a raw guessed number (bounce 2, owner: "use the page's
   existing size/fit approach"). A sane fallback before the model has loaded (never crashes). */
function cabinHeight(){
  const key = 'building_home_A_blue', opt = OFFICE_OPT['kaykit-medieval/' + key];
  return lib[key] ? lib[key].size.y * fitScale(key, (opt && opt.fit) || 1.25) : 1.2;
}
/* siteModelOpt(bare): place()'s own size option per site model (bounce 2, owner: the light and the fence

   trying to fill a whole tile; 'h' sizes by the model's own real height instead, same fix systemsDecor's
   SYS_SCALE already applies to the flowers). Heights are relative to cabinHeight(), so they track the
   cabin if its own fit ever changes. signpost/structure/flag keep 'fit: .8' (owner, bounce 2: "sign and
   flag sizes look fine"). */
function siteModelOpt(bare){
  const ch = cabinHeight();
  if (bare === 'construction-light') return { h: ch * .58 }; // "half to two-thirds of the cabin's height"
  if (bare === 'construction-fence') return { h: ch / 3 };   // "height roughly a third of the cabin"

function removeSiteMesh(rec){

/* a thin flat lane segment, grown by scale/position/rotation only (updateSiteFrames) -- never a fresh

function makeRoadMesh(terr){

}
/* syncSiteMesh(id): rebuild one site's static meshes only when siteMeshSig changed (or it is new); a

   (an immediate reaction, no world event needed) and from syncAllSiteMeshes (buildLand). */
function syncSiteMesh(id){
  const site = sites.get(id);

  if (!site) { if (prev) removeSiteMesh(prev); siteMeshes.delete(id); return; }
  const sig = siteMeshSig(site);
  if (prev && prev.sig === sig) return; // nothing a rebuild would change -- keep the meshes as they are
  if (prev) removeSiteMesh(prev);
  const rec = { sig, objs: [], road: prev ? prev.road : null, smoke: (prev && prev.smoke) || [] };
  for (const d of siteDecor(site)) {
    if (d.key === 'particles/smoke_01') continue; // its own puffs, made once below, animated every frame
    const bare = d.key.split('/')[1];
    if (!lib[bare]) continue; // never crash on a stray/unloaded key
    const opt = Object.assign({ parent: siteGroup, ry: d.ry || 0 }, siteModelOpt(bare));
    const g = place(bare, d.x, d.z, opt);

  }

  if (smokeSpot) {
    // evenly staggered phases (never all-random): at any instant at least one puff is freshly spawned and
    // clearly opaque, never all of them caught mid-fade at once (bounce 2, owner: "no visible smoke").
    while (rec.smoke.length < SMOKE_N) rec.smoke.push({ sprite: makeSmokeSprite(), t0: (rec.smoke.length / SMOKE_N) * SMOKE_CYCLE });

    for (const p of rec.smoke) if (p.sprite.parent) p.sprite.parent.remove(p.sprite);

/* particles/smoke_01.png as a sprite, not a model atlas: loadTex() (loadAll's own helper) forces

   way: ASSET + 'particles/smoke_01.png?v=' + ASSET_V. */
function loadSmokeTex(){
  return new Promise(res => texLoader.load(ASSET + 'particles/smoke_01.png?v=' + ASSET_V,
    t => { t.encoding = THREE.sRGBEncoding; res(t); }, undefined, () => res(null)));

function makeSmokeSprite(){

  const mat = new THREE.SpriteMaterial({ map: smokeTex, color: 0x6b6b6b, transparent: true, opacity: 0, depthWrite: false });
  const s = new THREE.Sprite(mat);

}
/* SMOKE_RISE: how far above its own start a puff climbs before it loops (owner, bounce 3: "1 to 1.5
   tiles more"). smokeStartY(): just above the office cabin's own roof (cabinHeight() -- the same real
   placed height siteModelOpt already reads, plus a little), not a fixed low number -- bounce 2's smoke
   rose from y .3, inside the cabin's own footprint, so the cabin's depth test hid every puff the whole

const SMOKE_RISE = 1.3;

function updateSiteFrames(dt){
  const y0 = smokeStartY();

    for (const p of rec.smoke) {

/* the branch sign's own text (Worktrees: "reuse the page's existing text-label/sprite approach for

/* Worktrees Demo: DEMO_SITES placed at two of the demo world's own free ground tiles (offsets picked by
   hand off its 'meadow' plan -- 4d5d7e95's own free 'g' tiles around its hall, never a plot or the hall
   itself), fed through the same apply({type:'world'}) path a real worktree site takes, so everything
   above runs the very same code live and in demo. Optionally merges the stalled one after a while, so
   the owner also sees a site finish (requirements/city.md, Worktrees). */
function seedSites(){
  const t = DEMO_WORLD.territories && DEMO_WORLD.territories[0];
  if (!t) return;
  const offs = [[-2, -2], [1, 1]];
  t.offices = (t.offices || []).slice();
  t.sites = [];
  DEMO_SITES.forEach((s, i) => {
    const [dx, dz] = offs[i] || offs[offs.length - 1];
    s.terr = t.id; s.x = t.cx + dx; s.z = t.cz + dz;
    t.offices.push({ lead: '', site: s.id, x: s.x, z: s.z });
    t.sites.push({ id: s.id, branch: s.branch, module: s.module, status: s.status, human: s.human, stalled: s.stalled, x: s.x, z: s.z });
  });

    const s = DEMO_SITES[0];

  const t = (map.territories || []).find(t => t.open > 0); if (!t) return; // day 0 (no open plot yet) is bare
  for (const [dx, dz, sp] of [[-3.2, 3.2, .18], [3.2, 3.3, -.16]]) {
    const g = place('animal-chick', t.cx + dx, t.cz + dz, { s: .11, ry: Math.PI / 2, y: .01 });
    playClip(g.children[0], 'animal-chick', 'idle');

  }
  for (const [key, dx, dz] of [['animal-cat', 3.4, 2.6], ['animal-dog', -3.6, 2.7]]) {
    const g = place(key, t.cx + dx, t.cz + dz, { s: .13 });
    const mixer = new THREE.AnimationMixer(g.children[0]); mixers.push(mixer);
    pets.push({ g, key, mixer, cur: null, target: null, wait: rnd(1, 4), yaw: 0, home: { x: t.cx, z: t.cz } });

}
function petAnim(p, name){
  if (p.cur === name) return;
  const clip = THREE.AnimationClip.findByName(lib[p.key].clips, name); if (!clip) return;
  const next = p.mixer.clipAction(clip);

function updatePets(dt){
  for (const p of pets) {
    const pos = p.g.position;
    if (!p.target) {
      p.wait -= dt;
      if (p.wait <= 0) { p.target = { x: p.home.x + rnd(-2.5, 2.5), z: p.home.z + rnd(1.8, 4.2) }; petAnim(p, 'walk'); }
      else if (p.cur === 'walk') petAnim(p, Math.random() < .5 ? 'eat' : 'idle');
      continue;
    }
    const dx = p.target.x - pos.x, dz = p.target.z - pos.z, d = Math.hypot(dx, dz), sp = .45 * dt;
    let dy = Math.atan2(dx, dz) - p.g.rotation.y; while (dy > Math.PI) dy -= Math.PI * 2; while (dy < -Math.PI) dy += Math.PI * 2;
    p.g.rotation.y += dy * .15;
    if (d < sp) { p.target = null; p.wait = rnd(2, 6); petAnim(p, Math.random() < .5 ? 'eat' : 'idle'); }
    else { pos.x += dx / d * sp; pos.z += dz / d * sp; }
  }
  for (const c of chicks) { const p = c.g.position; p.x += c.sp * dt; if (c.sp > 0 && p.x > c.x1) p.x = c.x0; else if (c.sp < 0 && p.x < c.x0) p.x = c.x1; p.y = .01 + Math.sin(simT * 2 + c.ph) * .01; }
}

function ringMat(color){ let m = ringMats.get(color); if (!m) { m = new THREE.MeshBasicMaterial({ color: new THREE.Color(color), transparent: true, opacity: .85 }); ringMats.set(color, m); } return m; }

/* ---------- buildings: ready-made models, revealed floor by floor ---------- */
/* a building of Growth's 5 types, picked from eraLook(t).build[type] (Balance: replaces BUILD_MODELS); rises then stays (permanent) */
function makeBuilding(b){
  const x = b.gx + .5, z = b.gy + .5;
  const g = new THREE.Group(); g.position.set(x, 0, z); world.add(g);
  const v = { g, meshes: [], plane: null, h: 1 };

  const bt = terrOf(b.terr) || { id: b.terr, era: 'village' };
  b.builtEra = eraShown(bt); // Balance: the era this mesh was skinned for — buildLand drops it when this moves on
  const build = eraLook(bt).build;
  const opts = build[b.type] || build.house;

  const fit = b.type === 'tower' ? .82 : 1;
  const keySink = HEX_SINK[key] || 0;

  v.h = (lib[key].size.y - keySink) * v.model.userData.s;
  const variation = b.type === 'house' ? variations[Math.floor(sr(b.seed, 5) * (variations.length + 1))] : null;
  // Balance: painted walls once beauty is healthy (like the mock); a few bright colours, seeded per building
  const paint = bt.balance && bt.balance.beauty && bt.balance.beauty.state === 'healthy'

    '|' + terrs.map(x => x.id).join(',');
  if (key === lastBalanceKey) return;
  lastBalanceKey = key;
  el.innerHTML = balanceHtml(t, balanceOpen, terrs);
}
$('#balance').addEventListener('click', e => {
  const bterr = e.target.closest('[data-bterr]');

function renderPanel(){ renderStats(); renderRoster(); renderDetail(); renderLog(); renderBalance(); $('#clock').textContent = DEMO ? '模拟 ' + clock(simT) : '现在 ' + new Date().toTimeString().slice(0, 8); }

/* ---------- right column: collapse, drag to reorder, remembered per browser ---------- */
const panel = $('#panel');
const cardEls = () => [...panel.children].filter(el => el.dataset.card);
function setCollapsed(card, on){
  card.classList.toggle('collapsed', on);
  card.querySelector('.card-head button').setAttribute('aria-expanded', String(!on));
}
function saveCards(){
  const cards = cardEls();
  const state = { order: cards.map(c => c.dataset.card), collapsed: cards.filter(c => c.classList.contains('collapsed')).map(c => c.dataset.card) };
  try { localStorage.setItem(CARD_KEY, JSON.stringify(state)); } catch (e) { /* storage off: order lasts until reload */ }
}
function loadCards(){
  let state = null;
  try { state = JSON.parse(localStorage.getItem(CARD_KEY) || 'null'); } catch (e) { state = null; }
  if (!state || typeof state !== 'object') return;
  const byName = new Map(cardEls().map(c => [c.dataset.card, c]));
  const order = Array.isArray(state.order) ? state.order.filter(n => byName.has(n)) : [];
  for (const n of byName.keys()) if (!order.includes(n)) order.push(n);
  for (const n of order) panel.appendChild(byName.get(n));
  const collapsed = Array.isArray(state.collapsed) ? state.collapsed : [];
  for (const [n, c] of byName) setCollapsed(c, collapsed.includes(n));
}
let cardDrag = null, dragJustEnded = false;
panel.addEventListener('pointerdown', e => {
  const head = e.target.closest('.card-head');
  if (!head || e.button > 0 || cardDrag) return;
  const card = head.closest('[data-card]');
  head.querySelector('button').setPointerCapture(e.pointerId);
  cardDrag = { card, head, id: e.pointerId, y0: e.clientY, moved: false };
});
panel.addEventListener('pointermove', e => {
  if (!cardDrag || e.pointerId !== cardDrag.id) return;
  const d = cardDrag, card = d.card;
  if (!d.moved && Math.abs(e.clientY - d.y0) < 6) return;
  if (!d.moved) { d.moved = true; card.classList.add('dragging'); }
  const cards = cardEls(), i = cards.indexOf(card), top = card.offsetTop;
  const prev = cards[i - 1], next = cards[i + 1];
  if (prev && e.clientY < prev.getBoundingClientRect().top + prev.offsetHeight / 2) panel.insertBefore(card, prev);
  else if (next && e.clientY > next.getBoundingClientRect().top + next.offsetHeight / 2) panel.insertBefore(card, next.nextSibling);
  d.y0 += card.offsetTop - top;
  const all = cardEls(), first = all[0], last = all[all.length - 1];
  const lo = first.offsetTop - card.offsetTop, hi = last.offsetTop + last.offsetHeight - card.offsetTop - card.offsetHeight;
  card.style.transform = `translateY(${clamp(e.clientY - d.y0, lo, hi)}px)`;
});
function endCardDrag(e){
  if (!cardDrag || e.pointerId !== cardDrag.id) return;
  const d = cardDrag; cardDrag = null;
  if (!d.moved) return;
  d.card.classList.remove('dragging'); d.card.style.transform = '';
  dragJustEnded = true; setTimeout(() => { dragJustEnded = false; }, 0);
  saveCards();
}
panel.addEventListener('pointerup', endCardDrag);
panel.addEventListener('pointercancel', endCardDrag);
panel.addEventListener('click', e => {
  const head = e.target.closest('.card-head');
  if (!head || dragJustEnded) return;
  const card = head.closest('[data-card]');
  setCollapsed(card, !card.classList.contains('collapsed'));
  saveCards();
});
loadCards();

/* ---------- ask panel: the "?" — questions and permission requests from
   the live city (requirements/city.md, Interaction) ---------- */
function openAsk(id){
  const view = asks.get(id); if (!view) return;
  askReturnFocus = document.activeElement;
  openAskId = id;
  renderAskPanel();
  $('#ask').hidden = false;
  const title = $('#ask-title'); if (title) title.focus();
}
function closeAskPanel(){
  if (openAskId) { const v = asks.get(openAskId); if (v && v.closed) asks.delete(openAskId); }
  openAskId = null;
  $('#ask').hidden = true;
  $('#ask').innerHTML = '';
  if (askReturnFocus && document.contains(askReturnFocus)) askReturnFocus.focus();
  askReturnFocus = null;
  needFrame = true;
}
function askWhyLine(view){
  if (view.kind === 'permission') return `<div class="why">权限只由你来批，总督不批。</div>`;
  if (view.agent === 'gov') return `<div class="why gov">总督定不了，交给你。</div>`;
  if (view.why === 'timeout') return `<div class="why gov">总督 ${view.wait} 秒没回答，交给你。</div>`;
  if (view.why === 'pass') return `<div class="why gov">总督说：这个我定不了，交给你。</div>`;
  return `<div class="why gov">没有总督在，直接交给你。</div>`;
}
function askQuestionBody(view){
  const qs = view.questions || [];
  return `<form id="qform" class="perm" novalidate>` + qs.map((q, i) => `
    <fieldset class="q"><legend>${q.header ? `<span class="chip">${esc(q.header)}</span>` : ''}${esc(q.question || '')}</legend>
      ${(q.options || []).map(o => `<label class="opt"><input type="radio" name="q${i}" value="${esc(o.label)}"><span><b>${esc(o.label)}</b>${o.description ? `<small>${esc(o.description)}</small>` : ''}</span></label>`).join('')}
      <label class="opt"><input type="radio" name="q${i}" value="" data-other><span><b>其他</b><input type="text" data-text="${i}" placeholder="自己写回答" aria-label="自己写回答"></span></label>
    </fieldset>`).join('') + `<div class="acts"><button class="btn primary" type="submit" id="send" disabled>发送回答</button></div></form>`;
}
function askPermissionBody(view){
  const d = view.detail || {};
  const main = d.command ? `<pre class="cmd">${esc(d.command)}</pre>`
    : d.file_path ? `<div class="kv"><span>文件</span><code>${esc(d.file_path)}</code></div>`
    : d.url ? `<div class="kv"><span>网址</span><code>${esc(d.url)}</code></div>`
    : (view.what ? `<pre class="cmd">${esc(view.what)}</pre>` : '');
  return `<div class="perm">
    <div class="kv"><span>工具</span><b>${esc(view.tool || '')}</b></div>
    ${main}
    ${d.description ? `<p class="said">它说：${esc(d.description)}</p>` : ''}
    ${d.cwd ? `<div class="kv"><span>目录</span><code>${esc(d.cwd)}</code></div>` : ''}
    <label class="field" for="reason">拒绝理由（可以不填；填了会原样告诉它）<input id="reason" type="text" placeholder="比如：先别删 dist/，里面有发布包"></label>
    <div class="acts"><button class="btn ok" type="button" data-verb="allow">批准</button><button class="btn no" type="button" data-verb="deny">拒绝</button></div>
  </div>`;
}
function askClosedLine(view){
  const k = view.closed, byZh = { governor:'总督', owner:'你', terminal:'终端' }[k.by] || k.by;
  const t = new Date(k.at || Date.now()).toTimeString().slice(0, 8);
  const late = k.by !== 'owner';
  if (k.verb === 'closed') {
    // only taken off the table (terminal, or a 409 before the real facts
    // arrive by SSE) — never say it was approved, denied or answered.
    return late
      ? `<div class="closed late"><span>晚了一步：<b>${byZh}</b>在 ${t} 已经处理了。这里不用再点了。</span></div>`
      : `<div class="closed"><span>在 ${t} 已经处理了，结果还没传回来。已记下。</span></div>`;
  }
  const text = view.kind === 'question'
    ? (k.text ? `回答了：“${esc(k.text)}”` : '已回答')
    : (k.verb === 'allow' ? '批准了' : `拒绝了${k.reason ? `，理由：“${esc(k.reason)}”` : ''}`);
  return `<div class="closed ${late ? 'late' : (k.verb === 'deny' ? 'no' : '')}"><span>${late ? `晚了一步：<b>${byZh}</b>在 ${t} 先${text}。这里不用再点了。` : `<b>你</b>在 ${t} ${text}。已记下。`}</span></div>`;
}
function renderAskPanel(){
  const view = asks.get(openAskId);
  if (!view) { closeAskPanel(); return; }
  const closed = view.closed;
  const head = `<div class="ask-head"><div><div class="ask-title" id="ask-title" tabindex="-1">${esc(askName(view))} ${view.kind === 'question' ? '在问' : '要权限'}</div><div class="ask-role">${esc(view.label || '')}</div></div><span class="pill you">${closed ? '已关闭' : (view.kind === 'question' ? '等你回答' : '等你批')}</span><button class="x" type="button" data-close aria-label="收起（不回答）">✕</button></div>`;
  const why = closed ? '' : askWhyLine(view);
  const body = closed ? '' : (view.kind === 'question' ? askQuestionBody(view) : askPermissionBody(view));
  const closedHtml = closed ? askClosedLine(view) : '';
  const foot = closed ? '' : `<p class="foot">终端里也能答，先答的算。</p>`;
  $('#ask').innerHTML = head + why + closedHtml + body + foot;
  const form = $('#qform');
  if (form) {
    const answers = () => view.questions.map((q, i) => {
      const on = form.querySelector(`input[name="q${i}"]:checked`);
      if (!on) return '';
      return on.hasAttribute('data-other') ? form.querySelector(`[data-text="${i}"]`).value.trim() : on.value;
    });
    const sync = () => { const send = $('#send'); if (send) send.disabled = answers().some(a => !a); };
    form.addEventListener('input', e => { if (e.target.matches('[data-text]')) { const radio = e.target.closest('.opt').querySelector('input[type=radio]'); radio.checked = true; } sync(); });
    form.addEventListener('change', sync);
    form.addEventListener('submit', e => {
      e.preventDefault();
      const a = answers(); if (a.some(x => !x)) return;
      const answersObj = {};
      view.questions.forEach((q, i) => { answersObj[q.question] = a[i]; });
      decide(view.id, { id: view.id, answers: answersObj });
    });
  }
  $('#ask').querySelectorAll('[data-verb]').forEach(btn => btn.addEventListener('click', () => {
    const reasonEl = $('#reason');
    const body = { id: view.id, verb: btn.dataset.verb };
    if (btn.dataset.verb === 'deny' && reasonEl && reasonEl.value.trim()) body.reason = reasonEl.value.trim();
    decide(view.id, body);
  }));
}
function showAskFailure(text){
  const root = $('#ask'); if (!root) return;
  let el = root.querySelector('.why.fail');
  if (!el) {
    el = document.createElement('div');
    el.className = 'why fail';
    const head = root.querySelector('.ask-head');
    if (head) head.insertAdjacentElement('afterend', el); else root.insertBefore(el, root.firstChild);
  }
  el.innerHTML = `<span>${esc(text)}</span>`;
}
function setAskControlsDisabled(on){
  const root = $('#ask'); if (!root) return;
  root.querySelectorAll('#send,[data-verb],input').forEach(el => { el.disabled = on; });
}
async function decide(id, body){
  setAskControlsDisabled(true);
  let res;
  try {
    res = await fetch('/api/decide', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-City-Token': TOKEN }, body: JSON.stringify(body) });
  } catch (e) {
    showAskFailure('没发出去（连不上城市服务器）。终端里还能答。');
    setAskControlsDisabled(false);
    return;
  }
  if (res.ok) {
    const view = asks.get(id);
    if (view && !view.closed) {
      view.closed = body.answers
        ? { by:'owner', verb:'answer', text: Object.values(body.answers).join('；'), reason:'', at: Date.now() }
        : { by:'owner', verb: body.verb, text:'', reason: body.reason || '', at: Date.now() };
      view.shownAt = performance.now(); // Result line then close: askAutoClose(frame's now) closes it ASK_CLOSE_MS later
    }
    if (openAskId === id) renderAskPanel();
    return;
  }
  if (res.status === 409) {
    const data = await res.json().catch(() => ({}));
    const view = asks.get(id);
    if (view && !view.closed) {
      view.closed = { by: data.by || 'terminal', verb: 'closed', text: '', reason: '' };
      view.shownAt = performance.now(); // someone else was first: the panel still auto-closes ASK_CLOSE_MS later
    }
    if (openAskId === id) renderAskPanel();
    return;
  }
  showAskFailure(`没发出去（${res.status}）。终端里还能答，可以再试一次。`);
  setAskControlsDisabled(false);
}
$('#ask').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeAskPanel(); });
$('#stats').addEventListener('click', e => {
  if (!e.target.closest('#next')) return;
  const a = oldestOpenAsk(); if (a) openAsk(a.id);
});
ovRoot.addEventListener('click', e => { const t = e.target.closest('[data-open]'); if (t) openAsk(t.getAttribute('data-open')); });

/* ---------- input ---------- */
function selectFrom(val){
  if (val && val.slice(0, 4) === 'gov:') selected = { t:'gov', terr: val.slice(4) };
  else if (val === 'gov') selected = { t:'gov', terr: govTerr };
  else if (val) selected = { t:'c', id:val };
  lastDetailKey = ''; lastRoster = ''; renderPanel(); needFrame = true;
}
$('#roster').addEventListener('pointerdown', e => { const r = e.target.closest('[data-sel]'); if (r) selectFrom(r.dataset.sel); });
$('#roster').addEventListener('click', e => { const r = e.target.closest('[data-sel]'); if (r && e.detail === 0) selectFrom(r.dataset.sel); });
$('#detail').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]'); if (!btn || !selected || selected.t !== 'c') return;
  const c = byId(selected.id); if (!c) return;
  if (btn.dataset.act === 'stuck') { const [q, a] = pick(QA); c.pendingAnswer = a; emit({ type:'stuck', id:c.id, question:q }); }
  if (btn.dataset.act === 'done') emit({ type:'done', id:c.id });
  if (btn.dataset.act === 'leave') emit({ type:'leave', id:c.id });
  lastDetailKey = ''; renderPanel();
});
if (DEMO) {
  $('#spawn').addEventListener('click', () => { const c = spawnDemo($('#role').value); if (c) { selected = { t:'c', id:c.id }; lastDetailKey = ''; renderPanel(); } });
} else {
  $('#spawn-group').hidden = true;
  $('#proto').textContent = '实时 · 等服务器';
}
function connectLive(){
  const chip = $('#proto');
  let everOpen = false;
  const es = new EventSource('/events');
  es.onopen = () => { everOpen = true; chip.textContent = '实时 · 已连接'; };
  es.onerror = () => { chip.textContent = everOpen ? '实时 · 重连中…' : '实时 · 等服务器'; };
  es.onmessage = e => {
    let ev;
    try { ev = JSON.parse(e.data); } catch (err) { return; }
    apply(ev);
    needFrame = true;
  };
}
let lastTouch = -Infinity;
const camChanged = () => { needFrame = true; lastTouch = performance.now(); };
/* zoomStep(k): k = +1 zooms out, -1 zooms in; a big enough step that a handful reach distMax() on any land */
function zoomStep(k){ cam.dist = clamp(cam.dist * Math.pow(1.8, k), DIST_MIN, distMax()); camChanged(); }
$('#zin').addEventListener('click', () => zoomStep(-1));
$('#zout').addEventListener('click', () => zoomStep(1));
$('#rot').addEventListener('click', () => { camTween = { from: cam.az, to: cam.az - Math.PI / 2, t: 0 }; camChanged(); });
$('#zfit').addEventListener('click', () => { resetCam(); camChanged(); });

const pointers = new Map();
let drag = null, pinch = null;
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pickAt(px, py){
  ndc.set(px / W * 2 - 1, -(py / H) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, true);
  for (const h of hits) {
    let o = h.object;
    while (o && !o.userData.pick) o = o.parent;
    if (!o) continue;
    const pk = o.userData.pick;
    if (pk.t === 'b') { const b = buildings.find(x => x.id === pk.id); const owner = b && byId(b.ownerId); return owner ? { t:'c', id:owner.id } : pk; }
    return pk;
  }
  return null;
}
canvas.addEventListener('pointerdown', e => {
  lastTouch = performance.now();
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 1) drag = { x:e.clientX, y:e.clientY, moved:false, pan: e.button === 2 || e.shiftKey };
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.dist, mx:(a.x + b.x) / 2, my:(a.y + b.y) / 2 }; drag = null; }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
function panBy(dx, dy){
  const k = 2 * cam.dist * Math.tan(FOV * Math.PI / 360) / H;
  const s = Math.sin(cam.az), c = Math.cos(cam.az);
  const f = 1 / Math.sin(cam.el);
  cam.tx = clamp(cam.tx - (dx * c - dy * s * f) * k, -land.hx, land.hx);
  cam.tz = clamp(cam.tz - (-dx * s - dy * c * f) * k, -land.hz, land.hz);
}
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    cam.dist = clamp(pinch.z * Math.max(20, pinch.d) / Math.max(20, d), DIST_MIN, distMax());
    panBy(mx - pinch.mx, my - pinch.my); pinch.mx = mx; pinch.my = my;
    camChanged(); return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 6) return;
  drag.moved = true; canvas.classList.add('grabbing');
  if (drag.pan) panBy(dx, dy);
  else dragBy(dx, dy, distMax());
  drag.x = e.clientX; drag.y = e.clientY;
  camChanged();
});
function endPointer(e){
  const wasTap = drag && !drag.moved && pointers.size === 1;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (wasTap && e.type === 'pointerup') {
    const r = canvas.getBoundingClientRect();
    selected = pickAt(e.clientX - r.left, e.clientY - r.top);
    lastDetailKey = ''; lastRoster = ''; renderPanel(); needFrame = true;
  }
  if (!pointers.size) { drag = null; canvas.classList.remove('grabbing'); }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.dist = clamp(cam.dist * (e.deltaY < 0 ? 1 / 1.1 : 1.1), DIST_MIN, distMax()); camChanged(); }, { passive:false });

/* ---------- opening scene: a city mid-day, not an empty land (Growth: DEMO_WORLD already has some grown territories) ---------- */
function seed(){
  govTerr = (map.territories && map.territories[0] && map.territories[0].id) || null;
  updateHome();
  for (const role of ['worker', 'task-manager', 'fast-lane-deputy', 'worker']) spawnDemo(role);
  seedSites(); // Worktrees: DEMO_SITES, so #demo shows a construction site (one stalled) with no real worktree
}

/* ---------- boot: load the ready-made models, then run at a capped frame rate ---------- */
let lastSim = performance.now(), lastDraw = 0, panelT = 0;
function busy(){
  if (drag && drag.moved || pinch || camTween || autoRotating()) return true;
  if (floaters.length) return true;
  if (typeof shows !== 'undefined' && shows.size) return true; // Balance: an era show is running (builders walking, about to flip)
  return citizens.some(c => c.path.length || c.state === 'building' || c.state === 'spawn' || c.state === 'asking');
}
function frame(now){
  requestAnimationFrame(frame);
  if (document.hidden) { lastSim = now; return; }
  askAutoClose(now); // Result line then close: the open panel closes itself ASK_CLOSE_MS after its result showed
  const interval = busy() || needFrame ? FRAME_MS : IDLE_FRAME_MS;
  if (now - lastDraw < interval - 2) return;
  const raw = Math.min(.1, (now - lastSim) / 1000);
  lastSim = now; lastDraw = now; needFrame = false;
  const before = new Set(citizens);
  for (let dt = raw; dt > 0; dt -= .05) update(Math.min(dt, .05));
  for (const c of before) if (!citizens.includes(c)) goneOv.push(c);
  cameraStep(raw); // the never-stop rotation (through autoRotate) plus the quarter-turn tween
  applyTheme();
  updateCamera();
  applyFade(viewBlockers(cam.el + camLiftNow));
  stepShows(now); // Balance: the running era show(s) — builders walking, then the one-moment flip
  sync(simT, raw);
  renderer.render(scene, camera);
  panelT += raw;
  if (panelT > .25) { panelT = 0; renderPanel(); }
}
resize(); resetCam(); updateCamera();
Promise.all([
  loadAll((n, total) => { $('#loading-text').textContent = `正在搬来素材 ${n}/${total}`; }),
  loadSmokeTex(), // Worktrees: the stalled-site smoke sprites (siteDecor's 'particles/smoke_01') -- its own loader, not loadTex() (see loadSmokeTex's own comment)
  ...['suburban/Textures/variation-a.png', 'suburban/Textures/variation-b.png', 'suburban/Textures/variation-c.png'].map(loadTex),
]).then(([, smoke, ...tex]) => {
  smokeTex = smoke;
  tex.forEach(t => { if (t) variations.push(t); });
  if (DEMO) buildLand(DEMO_WORLD);
  makeGovernor(); buildLife();
  if (DEMO) seed(); else connectLive();
  $('#loading').hidden = true;
  new ResizeObserver(() => resize()).observe(stage);
  applyTheme(); updateCamera(); sync(0, 0); renderer.render(scene, camera); renderPanel();
  requestAnimationFrame(frame);
}).catch(err => { $('#loading-text').textContent = '素材没加载成功：' + ((err && err.message) || err); });
})();
