<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="city-token" content="__CITY_TOKEN__">
<title>Agent City</title>
<link rel="icon" href="data:,">
<style>
:root{
  --paper:#ECF1FF; --panel:#FFFFFF; --panel-2:#F3F5FE; --ink:#2A2B45; --ink-2:#585D82; --ink-3:#8D91B3;
  --line:#DCE2F6; --sky:#CFE6FF; --berry:#FF7593; --berry-deep:#D9506E; --butter:#FFD36E; --mint:#6FD4A8;
  --focus:#4D7CFE; --guide:#B9C1E2;
  --build-bg:#E1ECFF; --build-ink:#3160B5; --ask-bg:#FFE1E8; --ask-ink:#C2345A;
  --rest-bg:#DAF5E8; --rest-ink:#1E8657; --walk-bg:#EDEFF7; --walk-ink:#5F6488;
  --me-bg:#D9FDD3; --me-ink:#1F3D2B; --gov-bg:#FFF0C7; --gov-ink:#8A6000; --ok:#1E8657; --ok-deep:#146342;
  --bgrun-bg:#ECE4FF; --bgrun-ink:#5A3EC8;
  --healthy:#2FB57A; --low:#E8A33A; --missing:#C4C8DD; --na:#9AA0C3;
  --round:ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --display:"Fredoka",ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13162A; --panel:#1C2040; --panel-2:#242951; --ink:#EEF0FF; --ink-2:#B0B5DB; --ink-3:#7B81AA;
    --line:#2D3360; --sky:#1B2046; --focus:#8FB0FF; --guide:#4A5290;
    --build-bg:#1E3160; --build-ink:#A9C6FF; --ask-bg:#4A1F33; --ask-ink:#FFB0C3;
    --rest-bg:#173D33; --rest-ink:#93E8C0; --walk-bg:#262B50; --walk-ink:#B3B8DE;
    --me-bg:#144D37; --me-ink:#E3F7EA; --gov-bg:#43381A; --gov-ink:#FFDD8A; --ok:#2FA56F; --ok-deep:#1B7049;
    --missing:#3A4070;
    --bgrun-bg:#30265F; --bgrun-ink:#CDBEFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#13162A; --panel:#1C2040; --panel-2:#242951; --ink:#EEF0FF; --ink-2:#B0B5DB; --ink-3:#7B81AA;
  --line:#2D3360; --sky:#1B2046; --focus:#8FB0FF; --guide:#4A5290;
  --build-bg:#1E3160; --build-ink:#A9C6FF; --ask-bg:#4A1F33; --ask-ink:#FFB0C3;
  --rest-bg:#173D33; --rest-ink:#93E8C0; --walk-bg:#262B50; --walk-ink:#B3B8DE;
  --me-bg:#144D37; --me-ink:#E3F7EA; --gov-bg:#43381A; --gov-ink:#FFDD8A; --ok:#2FA56F; --ok-deep:#1B7049;
  --missing:#3A4070;
  --bgrun-bg:#30265F; --bgrun-ink:#CDBEFF;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 var(--round)}
.app{max-width:1500px;margin-inline:auto;padding-inline:16px;padding-block:14px 22px;display:flex;flex-direction:column;gap:14px;min-height:100dvh}

/* cloud-polish Q1: the header is one row (the machine row and the repo row left it for the stage); the counters scroll sideways when they do not fit */
.bar{display:flex;flex-wrap:nowrap;align-items:center;gap:10px 14px}
.bar>*{flex:none}
.sign{display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--ink);border-radius:18px;padding:5px 16px 5px 8px;box-shadow:0 3px 0 var(--ink)}
.sign-name{font:700 24px/1 var(--display);letter-spacing:.01em}
.sign-sub{display:block;font:600 10.5px/1.2 var(--mono);color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.stats{display:flex;flex:1 1 auto;min-width:0;flex-wrap:nowrap;justify-content:flex-end;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{flex:none;display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px;color:var(--ink-2)}
.stat b{color:var(--ink);font:700 14px/1 var(--display);font-variant-numeric:tabular-nums}
.stat i{width:9px;height:9px;border-radius:50%;display:block}
.stat.wait{font:inherit;font-size:13px;cursor:pointer;border-color:var(--berry);background:var(--ask-bg);color:var(--ask-ink)}
.stat.wait b{color:var(--ask-ink)}
.stat.wait:disabled{cursor:default;border-color:var(--line);background:var(--panel);color:var(--ink-3)}
.stat.wait:disabled b{color:var(--ink-3)}
.stat.wait:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.stat.ok{border-color:var(--ok);color:var(--ok-deep)}
.stat.off{border-color:var(--ink-3);color:var(--ink-3)}
.stat.refused{border-color:var(--ask-ink);background:var(--ask-bg);color:var(--ask-ink)}

.layout{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
/* cloud-polish: the stage fills what is left of the window (no fixed offset: the page never scrolls on a computer, an open window's reply box stays on screen) */
.stage-col{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1;min-height:0}
.stage{position:relative;overflow:hidden;flex:1 1 0;min-height:460px;--rail-w:300px;--msg-w:380px}
.stage canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas.grabbing{cursor:grabbing}
/* V1 (city-ux2 v2): the zoom buttons must not sit under the right-docked message panel -- renderWin()
   toggles these classes on .stage so .cam moves left of whichever of #win/#win-tab actually shows. */
.cam{position:absolute;right:12px;bottom:12px;z-index:4;display:flex;flex-direction:row;gap:6px;transition:right .2s}
.cam .btn{width:38px;height:38px;padding:0;justify-content:center;background:var(--panel)}
.stage.win-open .cam{right:calc(var(--msg-w) + 24px)}
.stage.win-tab-open .cam{right:52px}

/* V1 (W2): the compact rail, left -- the team list, folds to a thin tab on its own edge; the follow
   chip, top middle of whatever is free between the rail and the message panel. Approved look: mock v2
   (mock/city-ux2-mock.html), .rail/.rail-head/.rail-list/.grp-h/.rrows/.rrow/.sdot/.chip/.rest-t/.tab/
   .rail-tab/.follow/.you, adapted to this page's own CSS vars (--build-bg/ink etc already exist). */
.you{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--berry);color:#fff;font:700 11px/1 var(--round)}
.fold{all:unset;cursor:pointer;flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2);font:700 14px/1 var(--round)}
.fold:hover{background:var(--panel-2);color:var(--ink)}
.fold:focus-visible{outline:2px solid var(--focus)}
.rc{width:10px;height:10px;border-radius:50%;background:var(--rc);flex:none;display:inline-block}
.rail{position:absolute;left:12px;top:12px;z-index:4;width:var(--rail-w);max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(42,43,69,.18);overflow:hidden}
.rail-head{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-bottom:1.5px solid var(--line);font-weight:700;font-size:13px}
.rail-head .n{font:600 12px/1 var(--mono);color:var(--ink-3)}
.rail-head .fold{margin-left:auto}
.rail-list{overflow:auto;padding:4px 4px 8px}
.grp-h{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:6px;padding:6px 6px 3px;font:700 11.5px/1.2 var(--mono);color:var(--ink-2)}
.grp-h:focus-visible{outline:2px solid var(--focus);border-radius:6px}
.grp-h .n{margin-left:auto;color:var(--ink-3);font-weight:600}
/* city-polish P4: ONE straight colour bar per repo group (head + rows together), square corners; the
   section carries --rc, each row's dot carries the person's state colour (.sdot.st-*, below) */
.rail-grp{border-left:4px solid var(--rc);margin:4px 0 6px;padding-left:2px}
.rail-grp .grp-h{padding-top:3px}
.rrows{list-style:none;margin:0;padding:0}
.rrow{all:unset;cursor:pointer;box-sizing:border-box;width:100%;flex:1 1 auto;min-width:0;display:flex;align-items:flex-start;gap:6px;padding:3px 6px;border-radius:8px;font-size:12.5px;line-height:1.35}
/* city-rail-tree P5: ' sub' only marks depth > 0 -- the indent comes from the nesting (.kids), not from the row (and the
   old roster's .sub{margin-left} must not push it) */
.rrow.sub{margin-left:0}
.rrow:hover{background:var(--panel-2)}
.rrow:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.rrow[aria-current="true"]{background:var(--ink);color:var(--paper)}
.rrow.resting{opacity:.7}
.sdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-3)}
.sdot.st-you{background:var(--berry)}
.sdot.st-ask,.sdot.st-gov{background:#E0A526}
.sdot.st-build{background:#4D7CFE}
.sdot.st-walk{background:var(--walk-ink)}
.sdot.st-rest{background:#2FB57A}
.sdot.st-bgrun{background:#8B6CF0}
.rrow .sdot{margin-top:5px}
/* city-rail-tree P5: a long name wraps to two lines, then is cut with an ellipsis (no hover tip); the dot, the arrow and the
   tags sit on the first line */
.rrow b{font-weight:600;flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;overflow-wrap:anywhere}
.chip.you{background:var(--ask-bg);color:var(--ask-ink)}
.chip.ask{background:var(--gov-bg);color:var(--gov-ink)}
.chip.build{background:var(--build-bg);color:var(--build-ink)}
.chip.walk{background:var(--walk-bg);color:var(--walk-ink)}
.chip.rest{background:var(--rest-bg);color:var(--rest-ink)}
.chip.gov{background:var(--gov-bg);color:var(--gov-ink)}
.chip.bgrun{background:var(--bgrun-bg);color:var(--bgrun-ink)}
.rest-t{all:unset;cursor:pointer;display:block;margin:1px 0 2px 8px;padding:1px 6px;border-radius:6px;font:600 11.5px/1.5 var(--round);color:var(--rest-ink)}
.rest-t:focus-visible{outline:2px solid var(--focus)}
/* city-rail-tree P5 (approved look: mock/city-rail-tree-mock.html): the rail is a tree. A node is one line (.rl: the
   arrow .tw, then the row button); its children sit in a nested ul.kids, indented one level (7px margin + 7px
   padding) with a thin guide line: a vertical line down the children (::after), a short elbow into each child
   (::before), the last child's line stops at its elbow (├ ... └). A leaf's elbow reaches over its empty arrow place. */
.tree .rl{display:flex;align-items:flex-start;gap:0}
.tw{all:unset;cursor:pointer;flex:none;box-sizing:border-box;width:16px;height:26px;display:grid;place-items:center;border-radius:5px;color:var(--ink-3);font:700 9px/1 var(--round);transition:transform .15s}
.tw:hover{background:var(--panel-2);color:var(--ink)}
.tw:focus-visible{outline:2px solid var(--focus)}
.tw[aria-expanded="false"]{transform:rotate(-90deg)}
.tw.leaf{visibility:hidden;pointer-events:none}
.tree .rrow{padding-left:3px}
.tree ul.kids{list-style:none;margin:0;margin-left:7px;padding:0}
.tree ul.kids>li{position:relative;padding-left:7px}
.tree ul.kids>li::before{content:"";position:absolute;left:0;top:13px;width:7px;border-top:1.5px solid var(--guide)}
.tree ul.kids>li:has(>.rl>.tw.leaf)::before{width:20px}
.tree ul.kids>li::after{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid var(--guide)}
.tree ul.kids>li:last-child::after{bottom:auto;height:13.5px}
/* the tags of a row: +n on a folded one (a bare .more is also the stage strip's fade class: it gets the look only in a row),
   the dashed 上级不明 of a worker whose parent is not here (a bare .who is the roster's name block) */
.more{flex:none}
.rrow .more{font:700 10.5px/1 var(--mono);color:var(--ink-3);background:var(--panel-2);border:1.5px solid var(--line);border-radius:999px;padding:3px 6px}
.rrow[aria-current="true"] .more{color:var(--paper);background:transparent}
.rrow .who{flex:none;display:block;min-width:0;font:600 10px/1 var(--round);color:var(--ink-3);border:1.2px dashed var(--guide);border-radius:999px;padding:2px 6px}
.rrow[aria-current="true"] .who{color:var(--paper)}
.tab{all:unset;cursor:pointer;position:absolute;z-index:4;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;width:30px;background:var(--panel);border:2px solid var(--ink);box-shadow:0 3px 0 rgba(42,43,69,.18);font:700 12px/1.1 var(--round);color:var(--ink)}
.tab:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.tab .v{writing-mode:vertical-rl;white-space:nowrap;max-height:180px;overflow:hidden;text-overflow:ellipsis}
.rail-tab{left:0;top:12px;border-left:0;border-radius:0 12px 12px 0}
.win-tab{right:0;top:12px;border-right:0;border-radius:12px 0 0 12px}
.follow{position:absolute;top:58px;z-index:4;transform:translateX(-50%);display:inline-flex;align-items:center;gap:7px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--ink);color:var(--paper);font:600 12px/1.2 var(--round);box-shadow:0 2px 0 rgba(42,43,69,.25);white-space:nowrap;max-width:60%}
.follow span{overflow:hidden;text-overflow:ellipsis}
.follow kbd{font:600 10.5px/1 var(--mono);opacity:.7}
.follow button{all:unset;cursor:pointer;padding:2px 8px;border-radius:999px;background:var(--paper);color:var(--ink);font:600 11.5px/1.3 var(--round)}
.follow button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* city-add-agent (approved look: mock/city-add-agent-mock.html, owner 2026-10-01): every repo keeps its
   rail group (A1: a repo with nobody online gets one quiet line where the rows would be). cloud-polish Q5
   (approved mock mock/cloud-polish-mock.html): add agent is a small + at the right end of the repo NAME row
   (.grp-row > .add-i; a spinner while it opens, a tick when it is open), and what it has to say is ONE
   row of words under that row (.add-line) -- or the small box (error, over-cap confirm, the command, done)
   -- only while it applies. */
.rail-none{margin:0;padding:1px 8px 2px;font-size:12px;line-height:1.5;color:var(--ink-3)}
.grp-row{display:flex;align-items:center;gap:2px}
.grp-row .grp-h{flex:1 1 auto;width:auto;min-width:0}
.add-i{all:unset;cursor:pointer;flex:none;box-sizing:border-box;width:22px;height:22px;margin:2px 4px 0 0;display:grid;place-items:center;border-radius:7px;border:1.5px solid var(--line);color:var(--ink-2);font:700 15px/1 var(--round)}
.add-i:hover{border-color:var(--ink-3);background:var(--panel-2);color:var(--ink)}
.add-i:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.add-i[aria-disabled="true"]{cursor:default;color:var(--ink-3);background:none;border-color:var(--line)}
.add-i.ok{border-color:transparent;background:var(--rest-bg);color:var(--rest-ink)}
.add-line{display:flex;align-items:center;gap:6px;margin:0 3px 3px;padding:3px 8px;border-radius:8px;background:var(--panel-2);color:var(--ink-2);font:600 12px/1.5 var(--round);overflow-wrap:anywhere}
.spin{flex:none;width:10px;height:10px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--focus);animation:spin .8s linear infinite}
@keyframes spin{to{rotate:360deg}}
.addbox{margin:2px 3px 3px;padding:6px 8px;border-radius:8px;font-size:12px;line-height:1.45;overflow-wrap:anywhere}
.addbox.err{background:var(--ask-bg);color:var(--ask-ink)}
.addbox.cap{background:var(--gov-bg);color:var(--gov-ink)}
.addbox.ok{background:var(--rest-bg);color:var(--rest-ink);font-weight:600}
/* the ask panel's own `.cmd` (a <pre>, further down) also matches this box: this rule is more specific and
   gives the box its own margin / padding / no border / round font / normal wrapping back (only the <code> is mono) */
.addbox.cmd{margin:2px 3px 3px;padding:6px 8px;border:0;border-radius:8px;font:12px/1.45 var(--round);white-space:normal;background:var(--panel-2);color:var(--ink-2)}
.addbox b{font-weight:700}
.addbox .nums{display:block;font:600 11.5px/1.5 var(--mono)}
.addbox code{display:block;margin-top:4px;padding:5px 6px;border-radius:6px;background:var(--panel);border:1px solid var(--line);font:11px/1.45 var(--mono);color:var(--ink);word-break:break-all;user-select:all}
.addbox .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mini{all:unset;cursor:pointer;padding:2px 9px;border-radius:999px;background:var(--panel);border:1.5px solid currentColor;font:600 11.5px/1.5 var(--round);color:inherit}
.mini.main{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.mini:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.ov > div,.ov > button{position:absolute;left:0;top:0;will-change:transform}
.bub{background:#FFFFFF;color:#2A2B45;border:2px solid #2A2B45;border-radius:14px;padding:3px 10px;font:600 12.5px/1.4 var(--round);box-shadow:0 2px 0 rgba(42,43,69,.2);pointer-events:auto;cursor:pointer}
.bub>span{display:block;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bub.ask{border-color:#E4476F}
.bub.gov{background:#FFF1C9;border-color:#C99A1E}
.bub.done{border-color:#2FB57A;background:#EFFFF6}
.talkb{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;background:#fff;color:#2A2B45;border:2px solid #2A2B45;border-radius:15px;font:600 15px/1 var(--round);box-shadow:0 2px 0 rgba(42,43,69,.2);pointer-events:auto;cursor:pointer}
.talkb::after{content:"";position:absolute;left:50%;bottom:-9px;width:10px;height:10px;margin-left:-5px;box-sizing:border-box;background:#fff;border:2px solid #2A2B45;border-top:0;border-left:0;transform:rotate(45deg)}
.bub::after,.tagl::after,.qm::after{content:"";position:absolute;inset:-8px}
.qm{all:unset;cursor:pointer;display:block;width:28px;height:28px;pointer-events:auto;z-index:3}
.qm span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#FF6F8B;color:#fff;font:700 17px/1 var(--display);border:2px solid #fff;box-shadow:0 2px 0 rgba(42,43,69,.25);animation:hop .7s ease-in-out infinite}
.qm:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.qm.grey span{background:#8D91B3;animation:none}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.gwait{display:inline-flex;align-items:center;gap:5px;background:var(--gov-bg);color:var(--gov-ink);border:1.5px solid var(--gov-ink);border-radius:999px;padding:2px 9px;font:600 11px/1.4 var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none}
.zz{font:700 14px/1 var(--display);color:#8D91B3;letter-spacing:.1em}
.zz span{display:inline-block;animation:zz 2.4s ease-in-out infinite}
.zz span:nth-child(2){animation-delay:.4s}
.zz span:nth-child(3){animation-delay:.8s}
@keyframes zz{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(8px,-14px);opacity:0}}
.doing{background:rgba(255,255,255,.92);color:var(--ink-2);border-radius:999px;padding:2px 9px;font:600 10.5px/1.3 var(--mono);box-shadow:0 1px 0 rgba(42,43,69,.15);white-space:nowrap;pointer-events:none}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:8px}
.group{display:inline-flex;align-items:center;gap:5px}
.btn{font:600 13px/1 var(--round);border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:12px;padding:0 12px;min-height:36px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,box-shadow .12s,border-color .12s}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible,select:focus-visible,.row:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary{background:var(--berry);border-color:var(--berry);color:#fff;box-shadow:0 3px 0 var(--berry-deep)}
.btn.primary:active{transform:translateY(3px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 3px 0 var(--ok-deep);white-space:nowrap;min-width:92px;justify-content:center}
.btn.ok:active{transform:translateY(3px);box-shadow:none}
.btn.no{background:var(--panel);border-color:var(--ask-ink);color:var(--ask-ink);white-space:nowrap;min-width:92px;justify-content:center}
.btn svg{width:15px;height:15px}
select{font:600 13px/1 var(--round);min-height:36px;border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:12px;padding:0 10px}
.lead{font-size:13px;color:var(--ink-2);margin-right:2px}

.sign-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--berry);color:#fff;flex:none}
.sign-icon svg{width:20px;height:20px}
.btn svg.lucide{width:16px;height:16px}
.rdot{width:18px;height:18px;border-radius:50%;border:4px solid var(--c);background:var(--panel);flex:none;justify-self:center}
.rdot.gov{--c:#FFD36E}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.row{width:100%;display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 8px;border-radius:14px;border:1.5px solid transparent;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.row:hover{background:var(--panel-2)}
.row[aria-current="true"]{border-color:var(--berry);background:var(--panel-2)}
.sub{margin-left:22px}
.who{min-width:0;display:flex;flex-direction:column}
.who b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font:12px/1.3 var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font:600 12px/1 var(--round);padding:6px 10px;border-radius:999px;white-space:nowrap}
.pill.build{background:var(--build-bg);color:var(--build-ink)}
.pill.ask{background:var(--ask-bg);color:var(--ask-ink)}
.pill.rest{background:var(--rest-bg);color:var(--rest-ink)}
.pill.walk{background:var(--walk-bg);color:var(--walk-ink)}
.pill.gov{background:var(--gov-bg);color:var(--gov-ink)}
.pill.bgrun{background:var(--bgrun-bg);color:var(--bgrun-ink)}
.pill.you{background:#FF4F72;color:#fff}

.detail{display:flex;flex-direction:column;gap:11px;flex:1;min-height:0;overflow:auto}
.d-head{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center}
.d-name{font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.d-role{font:12px/1.3 var(--mono);color:var(--ink-3)}
.d-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;color:var(--ink-2)}
.track{height:10px;border-radius:999px;background:var(--panel-2);border:1.5px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;transition:width .4s}
.d-tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0}
.d-tools div{background:var(--panel-2);border-radius:12px;padding:7px 9px}
.d-tools dt{font:11px/1.2 var(--mono);color:var(--ink-3)}
.d-tools dd{margin:0;font:700 16px/1.3 var(--display);font-variant-numeric:tabular-nums}
.d-qa{display:flex;flex-direction:column;gap:4px;font-size:13px}
.d-qa p{margin:0;color:var(--ink-2)}
.d-qa b{color:var(--ink);font-weight:700}
.d-actions{display:flex;flex-wrap:wrap;gap:6px}
.d-note,.hint{margin:0;font-size:12.5px;color:var(--ink-3)}

/* the conversation + the box to talk to it (requirements/city.md, Talking) */
.chat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;flex:1 1 auto;min-height:0;overflow:auto}
.chat .msg{display:flex;flex-direction:column;gap:2px;max-width:88%;padding:7px 10px;border-radius:14px;background:var(--panel-2);font-size:13px;line-height:1.4;align-self:flex-start}
.chat .msg[data-kind="owner"],.chat .msg[data-kind="prompt"]:not([data-main="0"]){align-self:flex-end;background:var(--me-bg);color:var(--me-ink)}
.chat .msg b{font:600 11px/1.3 var(--mono);color:var(--ink-3)}
.chat .msg[data-kind="owner"] b,.chat .msg[data-kind="prompt"]:not([data-main="0"]) b{color:var(--me-ink)}
.chat .msg span{white-space:pre-wrap;overflow-wrap:anywhere}
.chat .msg-empty,.chat .msg-wait{text-align:center;font-size:12.5px;color:var(--ink-3);padding:4px 0}
.chat-fail{color:var(--ask-ink)}
.say{display:flex;align-items:center;gap:8px}
.say textarea{flex:1;min-width:0;height:38px;min-height:38px;resize:none;font:14px/1.4 var(--round);color:var(--ink);background:var(--panel-2);border:1.5px solid var(--line);border-radius:12px;padding:7px 10px}
.say .btn{flex:none;white-space:nowrap}
.say .say-send{display:inline-flex;align-items:center;justify-content:center;padding:8px 12px}

.files{margin:2px 0 8px 24px;padding:8px 10px;background:var(--panel-2);border-radius:10px;font:12px/1.5 var(--mono);max-height:180px;overflow:auto}
.files ol{margin:0;padding:0 0 0 18px}
.files p{margin:4px 0 0;font-family:var(--round);color:var(--ink-2)}
.files p:first-child{margin-top:0}
.files code{background:var(--panel);border-radius:6px;padding:1px 5px}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;flex:1;min-height:0;overflow:auto}
.log li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;font-size:13px;line-height:1.45}
.log time{font:12px/1.45 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.log .ask{color:var(--ask-ink)}
.log .done{color:var(--rest-ink)}
.log .wait-you{color:var(--ask-ink)}

/* the "?" panel: sits over the city, inside #stage */
.ask-panel{position:absolute;right:12px;top:12px;z-index:6;width:min(410px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 rgba(42,43,69,.22);padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.ask-head{display:grid;grid-template-columns:minmax(0,1fr) auto 32px;gap:10px;align-items:center}
.ask-title{font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere;outline:none}
.ask-role{font:12px/1.3 var(--mono);color:var(--ink-3)}
.x{all:unset;cursor:pointer;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;color:var(--ink-2)}
.x:hover{background:var(--panel-2)}
.x:focus-visible{outline:2.5px solid var(--focus)}
.why{display:flex;gap:8px;align-items:flex-start;background:var(--ask-bg);color:var(--ask-ink);border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.45}
.why.gov{background:var(--gov-bg);color:var(--gov-ink)}
.q{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.q legend{padding:0;margin-bottom:6px;font-weight:700;font-size:15px;line-height:1.4}
.chip{display:inline-block;font:600 11px/1 var(--mono);letter-spacing:.04em;background:var(--panel-2);color:var(--ink-2);border:1.5px solid var(--line);border-radius:999px;padding:4px 8px;margin-right:6px;vertical-align:2px}
.opt{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start;border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;cursor:pointer;background:var(--panel)}
.opt:hover{border-color:var(--ink-3)}
.opt:has(input:checked){border-color:var(--berry);background:var(--panel-2)}
.opt input{margin:3px 0 0;accent-color:var(--berry)}
.opt b{display:block;font-weight:700}
.opt small{display:block;color:var(--ink-3);font-size:12.5px}
.opt input[type=text]{width:100%;margin-top:6px;font:14px/1.3 var(--round);color:var(--ink);background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.perm{display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:baseline;font-size:13px}
.kv>span{color:var(--ink-3)}
.kv code{font:12.5px/1.4 var(--mono);overflow-wrap:anywhere;color:var(--ink-2)}
.cmd{margin:0;font:13px/1.5 var(--mono);background:var(--panel-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.said{margin:0;font-size:13px;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2)}
.field input{font:14px/1.3 var(--round);color:var(--ink);background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{min-height:40px;padding:0 16px;font-size:14px}
.foot{margin:0;font-size:12.5px;color:var(--ink-3)}
.closed{display:flex;gap:8px;align-items:flex-start;border-radius:12px;padding:9px 11px;font-size:13.5px;line-height:1.45;background:var(--rest-bg);color:var(--rest-ink)}
.closed.no{background:var(--ask-bg);color:var(--ask-ink)}
.closed.late{background:var(--gov-bg);color:var(--gov-ink)}
/* city-ask-panel: the open question or permission request is a card in the person's own message panel,
   between its head and the history (mock/city-ask-panel-mock.html). The slot is the panel's flex item and
   the card shrinks inside it; only the body (the details) scrolls, what the owner clicks (.askcard-acts)
   keeps its height and stays in sight. The card takes the free height first, the history keeps a strip. */
#askslot{flex:0 1 auto;min-height:0;display:flex;flex-direction:column}
#askslot:empty{display:none}
.askcard{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;gap:9px;border:2px solid var(--berry);border-radius:16px;padding:10px 12px 12px;background:var(--panel)}
.askcard-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.askcard-t{outline:none}
.askcard-main{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;gap:9px}.askcard-body{flex:0 1 auto;min-height:48px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.askcard-body>*{flex:none}
.askcard-body .q{min-width:0}
.askcard-acts{flex:none;display:flex;flex-direction:column;gap:8px}
.detail:has(.askcard) .chat{flex:1 1 0;min-height:56px}
.askcard.done{border-color:var(--line)}

/* ---------- the office building (city-office; approved look: mock/city-office-mock.html v5) ----------
   The street and one floor are drawn on the canvas; around them: the floor sign (top middle), the lift panel (top
   right), the tags of the outside view, the floor picker, the renovation boxes. */
.stage{--lift-w:168px}
.proto{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:3;background:var(--butter);color:#4A3500;font:600 12px/1 var(--display);padding:7px 12px;border-radius:999px;box-shadow:0 2px 0 rgba(42,43,69,.18);pointer-events:none;white-space:nowrap}
.tags{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.tags>*{position:absolute;left:0;top:0;will-change:transform}
.rolechip{font:700 10px/1 var(--round);padding:2px 6px;border-radius:999px}
.rolechip.mgr{background:var(--gov-bg);color:var(--gov-ink)}
.rolechip.tm{background:var(--build-bg);color:var(--build-ink)}
.rolechip.helper{background:var(--rest-bg);color:var(--rest-ink)}
.rolechip.designer{background:var(--bgrun-bg);color:var(--bgrun-ink)}
.tagl.tag{display:inline-flex;align-items:center;gap:5px;background:var(--panel);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:2px 9px 2px 6px;font:600 12px/1.25 var(--round);box-shadow:0 2px 0 rgba(42,43,69,.2);white-space:nowrap;pointer-events:auto;cursor:pointer}
.tagl.tag .nm{max-width:130px;overflow:hidden;text-overflow:ellipsis}
.tagl.tag .wk{font:600 10.5px/1 var(--mono);background:var(--ink);color:var(--paper);padding:3px 6px;border-radius:6px}
.tagl.tag.sel{background:var(--ink);color:var(--paper)}
.tagl.tag.sel .wk{background:var(--paper);color:var(--ink)}
.rrow b{min-width:5em}
.rrow .who.badge{white-space:normal;max-width:40%;line-height:1.2;border:1.5px solid currentColor;border-radius:5px;padding:2px 4px;opacity:.75;color:inherit;font:600 10px/1 var(--mono);margin-top:1px;align-self:flex-start}

/* floor sign */
.floorsign{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:3;display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:5px 14px 5px 6px;box-shadow:0 3px 0 rgba(42,43,69,.18);white-space:nowrap;pointer-events:auto;max-width:calc(100% - 24px)}
.floorsign .fno{font:700 18px/1 var(--display);background:var(--ink);color:var(--paper);border-radius:9px;padding:5px 8px}
.floorsign .frn{font:700 15px/1 var(--display);overflow:hidden;text-overflow:ellipsis}
.floorsign .frs{font:500 12px/1 var(--round);color:var(--ink-3)}
.fedit{all:unset;cursor:pointer;font:600 12px/1 var(--round);padding:5px 9px;border-radius:8px;background:var(--panel-2);border:1.5px solid var(--line);color:var(--ink)}
.fedit:hover{border-color:var(--ink)}
.fedit:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.follow{top:58px}

/* lift buttons */
.lift{position:absolute;right:12px;top:96px;z-index:4;width:var(--lift-w);display:flex;flex-direction:column;background:var(--ink);color:var(--paper);border-radius:16px;padding:8px;gap:6px;box-shadow:0 4px 0 rgba(42,43,69,.25);transition:right .2s;max-height:calc(100% - 160px);overflow-y:auto;box-sizing:border-box}
.lift-h{display:flex;align-items:center;justify-content:space-between;font:700 12px/1 var(--round);padding:2px 4px 4px;opacity:.85}
.lift-h .arw{font:700 11px/1 var(--mono);opacity:.7}
.lb{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.14)}
.lb:hover{background:rgba(255,255,255,.16)}
.lb:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.lb[aria-current="true"]{background:var(--butter);color:#4A3500;border-color:var(--butter)}
.lb .no{font:700 16px/1 var(--display);min-width:28px}
.lb .ln{min-width:0;font:600 11.5px/1.2 var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .lc{display:inline-flex;gap:4px;align-items:center;font:600 11px/1 var(--mono);opacity:.85}
.lb.gnd{margin-top:4px;border-style:dashed}
.stage.win-open .lift{right:calc(var(--msg-w) + 24px)}
.stage.win-tab-open .lift{right:52px}

/* the outside view: a tag on every floor, the door hint */
.ftag{all:unset;position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1.5px solid var(--ink);border-radius:10px;padding:4px 9px 4px 5px;font:600 12px/1.2 var(--round);box-shadow:0 2px 0 rgba(42,43,69,.2);white-space:nowrap;will-change:transform;color:var(--ink)}
.ftag:hover{background:var(--panel-2)}
.ftag:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.ftag b{font:700 13px/1 var(--display);background:var(--ink);color:var(--paper);border-radius:6px;padding:3px 5px}
.ftag .fr{font-family:var(--mono)}
.ftag .fd{color:var(--ink-2);font-weight:500}
.ftag .fc{color:var(--ink-3);font:600 11px/1 var(--mono)}
.doorhint{all:unset;position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;background:var(--butter);color:#4A3500;border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font:700 14px/1 var(--display);box-shadow:0 3px 0 var(--ink);white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.doorhint:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
@keyframes bob{50%{margin-top:-6px}}

/* the floor picker and the renovation box */
.sheet-bg{position:absolute;inset:0;z-index:8;background:rgba(42,43,69,.32);display:grid;place-items:center;padding:16px}
.sheet{width:min(440px,100%);max-height:100%;overflow:auto;background:var(--panel);border:2px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 rgba(42,43,69,.25);box-sizing:border-box}
.sh-h{padding:14px 16px 6px;font:700 18px/1.2 var(--display)}
.sh-sub{padding:0 16px 10px;font-size:13px;color:var(--ink-2)}
.pk{list-style:none;margin:0;padding:0 10px}
.pk li{display:grid;grid-template-columns:auto auto 1fr auto auto;align-items:center;gap:10px;padding:8px 6px;border-top:1.5px solid var(--line)}
.pk input{width:18px;height:18px;accent-color:var(--ink);margin:0}
.pk label{min-width:0;cursor:pointer;display:grid}
.pk .pn{font:600 14px/1.2 var(--mono);overflow-wrap:anywhere}
.pk .ps{font-size:12px;color:var(--ink-3)}
.pk .pf{font:700 13px/1 var(--display);background:var(--panel-2);border:1.5px solid var(--line);border-radius:6px;padding:3px 6px}
.pk .mv{display:flex;gap:4px}
.pk .mv button{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:8px;font:700 13px/1 var(--round)}
.pk .mv button:disabled{opacity:.3;cursor:default}
.pk .mv button:not(:disabled):hover{background:var(--panel-2)}
.pk .mv button:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.pk .des{color:var(--ink-2)}
.redo{all:unset;cursor:pointer;color:var(--focus);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.redo:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.sh-f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px 14px;border-top:1.5px solid var(--line);font-size:12.5px;color:var(--ink-3)}
.sheet .dp-msg{margin:8px 16px 0}
.dp-two,.reno{display:grid;gap:8px}
.reno{padding:0 16px 16px}
.reno-msg{font-size:12.5px}
.reno-msg .addbox{margin:0}
.optb{all:unset;cursor:pointer;box-sizing:border-box;display:grid;gap:3px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--panel)}
.optb:hover{border-color:var(--ink);background:var(--panel-2)}
.optb:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.optb b{font:700 14px/1.2 var(--display);display:flex;align-items:center;gap:6px}
.optb small{font-size:12px;color:var(--ink-2);line-height:1.4}
.rec{font:600 10.5px/1 var(--round);background:var(--rest-bg);color:var(--rest-ink);padding:3px 6px;border-radius:999px;white-space:nowrap}

/* the 自己装修 box */
.dpop{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:7;width:min(380px,calc(100% - 24px));max-height:calc(100% - 80px);overflow:auto;background:var(--panel);border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(42,43,69,.18);padding:10px 12px 12px;box-sizing:border-box;display:grid;gap:9px}
.dp-h{display:flex;align-items:center;gap:8px}
.dp-h b{font:700 15px/1.2 var(--display)}
.dp-h span{font-size:12px;color:var(--ink-3);flex:1;min-width:0}
.dp-l{font-size:12.5px;font-weight:600}
.dp-act{display:flex;gap:8px}
.dp-msg{font-size:12.5px;background:var(--rest-bg);color:var(--rest-ink);border-radius:9px;padding:7px 10px}
.dp-msg.err{background:var(--ask-bg);color:var(--ask-ink)}
.dp-rules summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.dp-rules ul{margin:6px 0 0;padding-left:18px;display:grid;gap:5px;font-size:12px;color:var(--ink-2)}
.dy-in{box-sizing:border-box;width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink);font:13px/1.4 var(--round);padding:7px 10px}
.dy-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dyc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);min-width:0}
.dyc input{width:30px;height:26px;padding:0;border:1.5px solid var(--line);border-radius:6px;background:none;flex:none}
.dy-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dy-slots label{display:grid;gap:3px;font-size:12px}
.dy-slots small{color:var(--ink-3)}
.dy-slots select{font:13px var(--round);padding:5px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);min-width:0}

/* the designer's panel: example wishes */
.dp-ex{display:flex;flex-wrap:wrap;gap:6px}
.pex{padding:6px 0 0}
.ex{all:unset;cursor:pointer;font-size:12px;padding:4px 9px;border-radius:999px;border:1.5px dashed var(--guide);color:var(--ink-2)}
.ex:hover{border-color:var(--ink);color:var(--ink)}
.ex:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.ex.bye{border-style:solid;border-color:var(--ink);color:var(--ink)}

@media (max-width:720px){
  .stage{--lift-w:64px}
  .lift{top:12px;max-height:calc(100% - 96px)}
  .floorsign,.dpop,.follow{left:42px!important;transform:none;max-width:calc(100% - 118px)}
  .lift .ln,.lift-h span:first-child{display:none}
  .lb{grid-template-columns:1fr;justify-items:center;gap:3px;padding:6px 4px}
  .lb .lc{font-size:10px}
  .floorsign .frs{display:none}
  .stage.win-open .lift,.stage.win-open .cam{right:12px}
  .stage.win-open .cam{display:none}
}
@media (max-width:520px){
  .sign{padding:4px 10px 4px 6px;gap:8px}
  .sign-name{font-size:17px}
  .sign-sub{display:none}
  .sign-icon{width:28px;height:28px}
  .bar{gap:8px}
  #btnPick,#logbtn{padding:0 10px}
}
@media (prefers-reduced-motion:reduce){ .doorhint{animation:none} .lift{transition:none} }

/* the window: click a person / building / the governor, or open 动态 -- V1 (city-ux2 v2, owner
   2026-09-29): a right-docked message panel, one person's own (the left rail, V1, is the team list; no
   two columns, no 'wide' any more). Folds to a thin tab on its own right edge, like the rail
   (#win-fold/#win-tab, setWinFolded -- mirrors #rail-fold/#rail-tab/setRailFolded). */
.win{position:absolute;right:12px;top:12px;bottom:12px;z-index:5;width:var(--msg-w);overflow:hidden;background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 rgba(42,43,69,.22);padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.win.short{bottom:auto}
.win-head{display:flex;align-items:center;gap:10px}
.win-head .fold{margin-left:auto}
.win-title{flex:1;min-width:0;font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere}

.p-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding-bottom:10px;border-bottom:1.5px solid var(--line)}
.p-name{font-weight:700;font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-facts{font:12px/1.4 var(--mono);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-facts code{font:inherit;color:var(--ink-2)}
.p-bar{grid-column:1 / -1;height:6px}
.p-note{grid-column:1 / -1}
.hist-h{display:flex;align-items:center;gap:8px;margin:0;font-weight:600}
.hist-all{margin-left:auto;font:600 11.5px/1 var(--round);color:var(--ink-2);background:var(--panel-2);border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.hist-all[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hist-all:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.newmsg{all:unset;cursor:pointer;position:absolute;left:50%;transform:translateX(-50%);bottom:64px;z-index:2;background:var(--ink);color:var(--paper);border-radius:999px;padding:5px 12px;font:600 12.5px/1.2 var(--round);box-shadow:0 3px 0 rgba(42,43,69,.25)}
/* U10: activity lines and question/answer cards inside the history list */
.chat .act{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--ink-3);padding:0 4px}
.chat .act time{font:11px/1.4 var(--mono);font-variant-numeric:tabular-nums;flex:none}
.chat .qa{align-self:stretch;border:1.5px solid var(--berry);background:var(--ask-bg);color:var(--ask-ink);border-radius:14px;padding:7px 10px;font-size:13px}
.chat .qa p{margin:2px 0 0}
.chat .qa .wait{font-style:italic}
/* U9: chat text rendered as simple, safe markdown (mdLite) */
.md{overflow-wrap:anywhere}
.md p{margin:0 0 6px} .md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 6px;padding-left:20px}
.md code{font:12px/1.4 var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 4px}
.md pre{margin:0 0 6px;font:12px/1.45 var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;overflow-x:auto;white-space:pre}
.md pre code{border:0;padding:0;background:none}
.md table{border-collapse:collapse;margin:0 0 6px;font-size:12.5px}
.md th,.md td{border:1px solid var(--line);padding:3px 8px;text-align:left}
.md th{background:var(--panel)}

@media (max-width: 960px){
  .stage{min-height:340px}
  .bar{flex-wrap:wrap;gap:8px 10px}
  .stats{order:9;flex:1 1 100%;margin-left:0;justify-content:flex-start}
  .acct,#logbtn{margin-left:auto}
  .acct~#logbtn,#logbtn~.acct{margin-left:0}
  .add-i{width:28px;height:28px;font-size:17px}
  .rail{left:0;top:0;bottom:0;max-height:none;width:min(300px,84%);border-left:0;border-radius:0 16px 16px 0}
  .stage.drawer-open .win,.stage.drawer-open .ask-panel,.stage.drawer-open .follow,.stage.drawer-open .lift{visibility:hidden}
  .ask-panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:72%}
  /* V1 (city-ux2 v2): the message panel is a bottom sheet on a phone; its folded tab sits centred at
     the bottom edge, horizontal (the rail's own tab stays vertical, on the left edge). */
  .win{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:44%}
  /* city-ask-panel: while a card is open the sheet takes what its content needs, up to the whole map */
  .win:has(.askcard){height:auto;max-height:calc(100% - 16px)}
  .win-tab{right:auto;left:50%;top:auto;bottom:0;transform:translateX(-50%);width:auto;flex-direction:row;padding:6px 14px;border:2px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0}
  .win-tab .v{writing-mode:horizontal-tb;max-width:220px}
  .newmsg{bottom:68px}
  /* city-polish: the bottom sheet is short (44% of a small stage), so the history must never shrink to
     nothing here -- #detail (overflow:auto) scrolls down to the input row instead. */
  .chat{min-height:96px}
}
@media (prefers-reduced-motion: reduce){ .qm span,.zz span{animation:none} .track i,.btn{transition:none} .spin{animation:none;border-top-color:var(--ink-3)} }

   this file reaches it by that name (never `T`: several test drivers use a local `T` for "the
   territory"). function_source("i18n") (tests/test_agent_city_page.py) finds it to run on its own. */
function i18n(key, vars) { const lang = LANG === 'en' ? 'en' : 'zh'; const table = TEXT[lang] || {}; let s = Object.prototype.hasOwnProperty.call(table, key) ? table[key] : key; if (vars) for (const name in vars) s = s.split('{' + name + '}').join(vars[name]); return s; }
/* idea-city C1: fills every data-t / data-t-aria / data-t-title / data-t-placeholder element from
   TEXT, once, at start -- the static markup carries no Chinese of its own any more. */
function applyText() {

  document.querySelectorAll('[data-t-aria]').forEach(el => { el.setAttribute('aria-label', i18n(el.getAttribute('data-t-aria'))); });

}

function topCounts(){

function askLine(ev, name) {
  const WHO = { governor: i18n('who.governor'), owner: i18n('who.owner'), terminal: i18n('who.terminal') };
  const toolWhat = (tool, what) => tool ? (what ? tool + ' ' + what : tool) : (what || '');
  if (ev.type === 'ask') {
    if (ev.kind === 'permission') {
      return i18n('ask.permission', { name, what: toolWhat(ev.tool, ev.what) });
    }
    if (ev.agent === 'gov') {

      return i18n('ask.toOwner', { name, what: ev.what || '' });
    }
    if (ev.phase === 'governor') {

      // did not itself allow, deny or answer, so this stays neutral.
      return i18n('closed.routed', { name, who, what });

/* rosterGroups() -> [{terr, name, rows: [{id, depth}]}], one per floor, top first: per floor, the area manager first

   renderDetail() draws a floor's group as its area manager's team list (city-focus). My own office only. */
function rosterGroups(){
  const groups = [];
  for (const t of map.territories || []) {
    const here = citizens.filter(c => c.terr === t.id && !c.gone && !isSub(c));
    const rows = [{ id: 'gov:' + t.id, depth: 0 }];
    const leads = here.filter(c => c.office).sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
    const leadIds = new Set(leads.map(c => c.id));
    for (const lead of leads) {
      rows.push({ id: lead.id, depth: 0 });
      for (const w of here) if (w.lead === lead.id) rows.push({ id: w.id, depth: 1 });
    }
    for (const c of here) {
      if (leadIds.has(c.id) || (c.lead && leadIds.has(c.lead))) continue;

   row carries badge = subBadge(row id)). Older words:

   add: true when the territory's view says here === true (its folder is on this machine: the group ends with

   next sibling), then the resting rows: [{id, depth, rest, up, kids, lost}]. The members, in this order: the

   citizens of it, each in citizens order, none gone. A
   person's parent is c.up || c.lead: the governor row for 'gov:<terr>' (when it is there), or another member
   of this group, else none (the repo). A loop (a -> b -> a, a person naming itself) is broken at its first
   member in members order: nobody shows twice, nothing hangs. Resting people (citizenStatus(c)[0] === 'rest')

  const figs = new Set(governorFigures().map(g => g.terr));

    const mem = [];
    if (figs.has(t.id)) mem.push({ id: 'gov:' + t.id, rest: false, role: '', want: '', par: null });
    for (const c of citizens) {
      if (c.terr !== t.id || c.gone || isSub(c)) continue;
      mem.push({ id: c.id, rest: citizenStatus(c)[0] === 'rest', role: c.role, want: c.up || c.lead || '', par: null });
    }
    const by = new Map(mem.map(m => [m.id, m]));
    for (const m of mem) { const p = by.get(m.want); if (p && p !== m) m.par = p; }

/* city-add-agent A4/A5/A6 (sim): addAnswer(terr, code, body) -> puts the server's answer to POST

function update(dt){
  simT += dt;

  pruneTalks();
  if (DEMO) demoTalkTick(dt);
  reseat(); // somebody whose seat changed (a manager left, a helper went idle) walks to the new one
  for (const c of citizens) {
    c.stateT += dt;
    if (c.trip) tripStep(c, dt); // a ride between floors (Between floors): the lift, the door, the ride
    if (c.state === 'spawn') { c.alpha = Math.min(1, c.alpha + dt * 2.5); if (c.stateT > .7) leaveSpawn(c); }
    else if (c.state === 'handover') {
      // city-talk T1: it stands beside its sender, face to face, until the hand-over is over (or breaks)
      c.alpha = Math.min(1, c.alpha + dt * 2.5);
      c.yaw = turnToward(c.yaw, faceWant(c), dt);
      if (!handoverOk(c)) leaveSpawn(c);
    }
    else if (c.path.length) move(c, dt);
    else c.yaw = turnToward(c.yaw, faceWant(c), dt); // city-polish P1: a person who stands turns to its work / governor / seat
    switch (c.state) {
      case 'asking':
        if (c.answered && simT - c.askT > .9) giveAnswer(c);
        else if (DEMO && !c.answered && simT - c.askT > 1.9) emit({ type:'answer', id:c.id, answer: c.pendingAnswer || pick(QA)[1] });
        break;
      case 'heard':
        if (c.stateT > 1.5) { releaseSlot(c); say(c, i18n('say.understood'), 1.1); goTo(c, c.stand, 'back'); }
        break;
      case 'finishing': if (c.stateT > 1.5) goRest(c); break;
      case 'resting': if (!DEMO && !c.leaveFlag && c.stateT > LIVE_REST_SEC) autoLeave(c); break;
      case 'leaving': if (!c.path.length && !c.trip) { c.alpha -= dt * 2; if (c.alpha <= 0) c.gone = true; } break;
    }
    if (DEMO) feed(c);
  }
  runTalks(); // city-talk T3: talks end, walkers arrive, the ones in line start
  updateGovernors(dt);
  for (let i = citizens.length - 1; i >= 0; i--) if (citizens[i].gone) {
    const c = citizens[i];
    if (c.rest && !c.rest.extra) c.rest.by = 0;
    releaseSlot(c);
    if (selected && selected.t === 'c' && selected.id === c.id) selected = null;
    citizens.splice(i, 1);
  }

}

function makeWall(def, p){

  add(mWall, def.w, .5, def.d, def.x, .25, def.z);

  const beam = add(mFrame, def.w, .2, def.d, def.x, 2.45, def.z);

}

function hireDesigner(terr, force){
  const old = citizens.find(c => !c.gone && c.role === 'designer' && c.terr === terr);
  if (old) { $('#renoBg').hidden = true; select(old.id); return; }
  desState.set(terr, { s:'opening', name:'' }); renoFor = terr; renderReno(); $('#renoBg').hidden = false;
  postJson('/api/designer', { terr, force:!!force }).then(({ code, body }) => {
    body = body || {};
    if (code === 200 && body.state === 'opening') { desState.delete(terr); hiredWait.add(terr); $('#renoBg').hidden = true; log(i18n('office.hired', { floor:floorLabel(terr) })); return; }
    if (code === 200 && body.state === 'cap') desState.set(terr, { s:'cap', ram:body.ram, cpu:body.cpu, max:body.max });
    else if (code === 200 && body.state === 'plain') desState.set(terr, { s:'cmd', cmd:body.command || '' });
    else if (code === 409 && body.error === 'busy') { desState.delete(terr); hiredWait.add(terr); $('#renoBg').hidden = true; return; }
    else if (code === 409 && body.error === 'designer-here') {
      desState.delete(terr); $('#renoBg').hidden = true;
      const d = citizens.find(c => !c.gone && c.role === 'designer' && c.terr === terr); if (d) select(d.id);
      return;
    }
    else desState.set(terr, { s:'err', why:addReason(body), retry:body.error === 'failed' || code === 0 });
    if (renoFor === terr) renderReno();
  });
}

function demoPost(path, body){
  const done = (code, b) => Promise.resolve({ code, body:b || {} });
  if (path === '/api/floors') {
    const ids = body.floors;
    if (!Array.isArray(ids) || !ids.length) return done(400, { error:'bad' });
    if (ids.some(id => !map.repos.some(r => r.id === id))) return done(404, { error:'unknown' });
    map.floors = ids.slice(); demoWorld({ kind:'floors' });
    return done(200, { floors:ids });
  }
  if (path === '/api/design') {
    const terr = body.terr;
    if (!terrOf(terr)) return done(404, { error:'unknown' });
    if (body.skip) { if (!map.asked.includes(terr)) map.asked.push(terr); return done(200, {}); }
    if (body.undo) {
      const st = demoUndo.get(terr) || [];
      if (!st.length) return done(409, { error:'empty' });
      const d = st.pop(), designs = Object.assign({}, map.designs);
      if (d) designs[terr] = d; else delete designs[terr];
      map.designs = designs; demoWorld({ kind:'undo', terr });
      return done(200, { design:d || null });
    }
    const d = body.design, problems = [];
    if (!d || typeof d.name !== 'string' || !d.name.trim() || d.name.length > 20) problems.push({ field:'name', zh:i18n('office.demoName'), en:i18n('office.demoName') });
    if (problems.length) return done(422, { error:'bad', problems });
    const st = demoUndo.get(terr) || []; st.push(map.designs[terr] || null); demoUndo.set(terr, st);
    map.designs = Object.assign({}, map.designs, { [terr]:d }); demoWorld({ kind:'design', terr, by:'owner' });
    return done(200, { design:d });
  }
  if (path === '/api/designer') {
    const terr = body.terr, t = terrOf(terr);
    if (!t) return done(404, { error:'unknown' });
    if (citizens.some(c => !c.gone && c.role === 'designer' && c.terr === terr)) return done(409, { error:'designer-here' });
    const c = spawnDemo('designer', undefined, terr);
    return done(200, { state:'opening', name:c ? c.label : t.name + ' Designer', role:'designer' });
  }
  if (path === '/api/designer/leave') {
    const c = citizens.find(x => !x.gone && x.role === 'designer' && x.terr === body.terr);
    if (!c) return done(404, { error:'none' });
    emit({ type:'leave', id:c.id });
    return done(200, {});
  }
  return done(404, {});
}

/* ---------- chat (requirements/city.md, Talking): a person's window shows what was typed to it
   and what it answered, plus a box to talk to it; the terminal keeps working in parallel. `chats`
   -- page chat id -> { entries, busy, canSend, loaded, error }. ---------- */
/* idea-city C1: the state words and every other bit of text here live in TEXT (chat.*), through
   i18n() -- chatHtml is pinned and run on its own (tests/test_agent_city_chat.py), with TEXT/i18n
   in its prelude (constants_prelude()). */
function chatHtml(entries, name, busy){
  if (!entries || !entries.length) return `<li class="msg-empty">${i18n('chat.empty')}</li>`;
  /* an owner's message says its state ('sent' and 'taken' both read "on its way") and why it did not arrive
     (only a reason the page knows). historyHtml() below says the same; each stays alone (esc, i18n, mdLite). */
  const CHAT_STATES = ['queued', 'delivered', 'undelivered', 'sent', 'taken'];
  const WHY = { 'not-listening': 'notListening', off: 'off', ended: 'ended', 'talk-off': 'talkOff', refused: 'refused', flood: 'flood' };
  const who = e => {
    if (e.kind === 'owner') {
      const known = e.state && CHAT_STATES.includes(e.state);
      const why = e.state === 'undelivered' && typeof e.why === 'string' && Object.prototype.hasOwnProperty.call(WHY, e.why) ? ' · ' + i18n('chat.why.' + WHY[e.why]) : '';
      return `${i18n('chat.you.page')}${known ? i18n('chat.stateSuffix', { state: i18n('chat.state.' + (e.state === 'taken' ? 'sent' : e.state)) }) : ''}${why}`;
    }
    if (e.kind === 'prompt') return i18n('chat.you.terminal');
    return esc(name);
  };
  // U9: the text goes through mdLite (its own escaping; simple markdown, never raw HTML) inside a "md" element.
  let html = entries.map(e => `<li class="msg" data-kind="${esc(e.kind)}" data-id="${esc(e.id)}"${e.main === false ? ' data-main="0"' : ''}><b>${who(e)}</b><div class="md">${mdLite(e.text)}</div></li>`).join('');
  const last = entries[entries.length - 1];
  if (busy && last && last.kind === 'owner' && last.state === 'queued') html += `<li class="msg-wait">${i18n('chat.wait')}</li>`;
  return html;
}

/* demo: a few made-up lines so the demo people look talked-to, and a fake send that turns
   delivered after a moment -- never a fetch (requirements/city.md, Talking). */
function demoChatFor(to){
  const seed = [{ kind: 'prompt', text: i18n('demo.seed.prompt') }, { kind: 'reply', text: i18n('demo.seed.reply') }];
  const now = Date.now() / 1000;
  return { entries: seed.map((s, i) => ({ id: ++demoChatSeq, kind: s.kind, text: s.text, at: now - (seed.length - i) * 40 })),
    busy: false, canSend: true, loaded: true };

function demoSendChat(to, text){
  if (!chats.has(to)) chats.set(to, demoChatFor(to));
  const box = chats.get(to), id = ++demoChatSeq;
  box.entries = box.entries.concat([{ id, kind: 'owner', text, at: Date.now() / 1000, state: 'queued' }]);
  renderPanel();
  setTimeout(() => {
    const e = box.entries.find(x => x.id === id);
    if (!e) return;
    e.state = 'delivered';
    log(i18n('log.chatSent', { to: chatDisplayName(to), text: e.text }));
    renderPanel();
  }, 900);
}
/* loadChat(to): fetches the conversation once per id (chats already has it -- no-op); a failure is
   shown in the window, never swallowed. Demo never fetches. */
function loadChat(to){
  if (chats.has(to)) return;
  if (DEMO) { chats.set(to, demoChatFor(to)); return; }
  chats.set(to, { entries: [], busy: false, canSend: true, loaded: false });
  fetch('/api/chat?to=' + encodeURIComponent(to), { headers: { 'X-City-Token': TOKEN } })
    .then(r => { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
    .then(body => { chats.set(to, { entries: body.entries || [], busy: !!body.busy, canSend: body.can_send !== false, loaded: true }); renderPanel(); })
    .catch(() => { const box = chats.get(to) || { entries: [], busy: false, canSend: true, loaded: false }; box.error = i18n('chat.loadError'); chats.set(to, box); renderPanel(); });
}
/* sendChat(to, text): posts to the session (live) or fakes it (demo); either way the owner's own
   entry lands in `chats` at once (queued), then moves to delivered/undelivered by a 'chat' event
   (live) or the demo timer above. A failure is shown in the window, never swallowed. Resolves true
   when the server took the message (a 2xx with a JSON body), false otherwise (network error or a
   non-ok status); demo always resolves true.
   */
function sendChat(to, text){
  if (DEMO) { demoSendChat(to, text); return Promise.resolve(true); }
  return fetch('/api/chat/send', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-City-Token': TOKEN }, body: JSON.stringify({ to, text }) })
    .then(r => { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
    .then(body => {
      const box = chats.get(to) || { entries: [], busy: false, canSend: true, loaded: true };
      if (!box.entries.some(e => e.id === body.id)) box.entries = box.entries.concat([{ id: body.id, kind: 'owner', text, at: Date.now() / 1000, state: body.state || 'queued' }]);
      chats.set(to, box);
      renderPanel();
      return true;
    })
    .catch(() => {
      const box = chats.get(to) || { entries: [], busy: false, canSend: true, loaded: true };
      box.error = i18n('chat.sendError');
      chats.set(to, box);
      renderPanel();
      return false;
    });
}

/* chat-enter: the chat box keys. sayKeyAction(e, coarse) -> 'send' | 'newline' | '' (leave the key alone).
   Enter sends; Shift/Cmd/Ctrl+Enter is a new line; never while an input method is composing (the Enter
   then only confirms the word); on a phone or tablet (coarse pointer) Enter is a new line and only the
   send button sends. */
function sayKeyAction(e, coarse){
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return '';
  if (e.shiftKey || e.metaKey || e.ctrlKey) return 'newline';
  if (e.altKey) return '';
  return coarse ? '' : 'send';
}
document.addEventListener('keydown', e => {
  const ta = e.target;
  if (!ta || ta.id !== 'say-text') return;
  const act = sayKeyAction(e, matchMedia('(pointer: coarse)').matches);
  if (!act) return;
  e.preventDefault();
  if (act === 'send') {
    if (ta.form && ta.value.trim()) ta.form.requestSubmit();
    return;
  }
  ta.setRangeText('\n', ta.selectionStart, ta.selectionEnd, 'end');
  ta.dispatchEvent(new Event('input', { bubbles: true }));
});

    if (c) {
      const [g, zh] = citizenStatus(c, governorCount);
      const facts = esc(factsLine(c)); // city-polish P3: the repo once, the task only when the name does not hold it

        ${chatTo ? `<p class="hint hist-h">${i18n('hist.title')}${histBtnHtml()}</p>${chatSectionHtml(chatTo)}` : ''}`;

          <div class="p-main"><div class="p-name">${i18n('who.governor')}</div><div class="p-facts">${esc(repoName)} · ${i18n('gov.ownTag')}</div></div>
          <span class="pill ${govRowStatus(terr)[0]}">${govRowStatus(terr)[1]}</span>

    } else {
      el.innerHTML = `<p class="hint">${i18n('hint.pickSomething')}</p>`;
    }
    keepAskSlot(el, oldAskSlot);
    // U8: a freshly built card wires its own newmsg chip once: a click scrolls to the bottom and
    // hides it, and it hides again once the owner scrolls back within CHAT_STICK_PX of the bottom.
    // A rebuild of the SAME chat target keeps the chip showing if it already was (never re-hidden
    // just because the card was rebuilt).
    const freshOl = el.querySelector('#chat'), freshChip = el.querySelector('#newmsg');
    if (freshOl && freshChip) {
      if (savedChat && savedChat.to === chatTo && savedChat.chip) freshChip.hidden = false;
      freshChip.addEventListener('click', () => { freshOl.scrollTop = freshOl.scrollHeight; freshChip.hidden = true; });
      freshOl.addEventListener('scroll', () => {
        if (freshOl.scrollHeight - freshOl.scrollTop - freshOl.clientHeight <= CHAT_STICK_PX) freshChip.hidden = true;
      });
    }
  }
  lastChatTo = chatTo;
  renderAskCard(); // city-ask-panel K8: the open ask's card in this panel (its own slot), on every call
  // city-work-anim: the status word changes with every work step, so the open person's pill is
  // refreshed on every call (text and class, only when changed) -- never by rebuilding the card.
  // cloud-polish: the governor's head follows its state the same way (the card key holds no governor state).
  refreshHeadPill(el, selected);
  if (c && selected && selected.t === 'c') {
    const bar = el.querySelector('.p-bar i'); if (bar) bar.style.width = pct(c) + '%';
  }
  if (chatTo) {
    // U8: chatScroll() decides the scroll position both when the log only refreshes (prev = the live
    // DOM state) and when the whole card was just rebuilt (prev = the state saved above, when the
    // rebuild kept the same chat target -- a different target starts at the bottom, prev null) --
    // never an unconditional jump to the bottom. res.chip only ever SHOWS the chip: it hides only on
    // its own click, or when the owner scrolls back within CHAT_STICK_PX of the bottom (both wired
    // once per fresh card above), or a different chat target is opened (a fresh, hidden chip).
    const box = chats.get(chatTo) || { entries: [], busy: false, canSend: true };
    // city-polish C2: the list shows the main messages, or every item while histAll is on; the toggle
    // (#hist-all, in the title line) says how many are hidden. Nothing main yet but something hidden ->
    // one line that says so, not "nothing yet".
    const isGov = !!(selected && selected.t === 'gov');
    const all = isGov ? markMain(box.entries, false) : personHistory(c, box.entries);
    const shown = histAll ? all : mainOnly(all);
    const hiddenN = all.length - mainOnly(all).length;
    let listHtml;
    if (!shown.length && hiddenN) listHtml = `<li class="msg-empty">${i18n('hist.onlyMech')}</li>`;
    else listHtml = isGov ? chatHtml(shown, chatName, box.busy) : historyHtml(shown, chatName, box.busy);
    const histBtn = el.querySelector('#hist-all');
    if (histBtn) {
      const label = histAll ? i18n('hist.hide') : i18n('hist.all', { n: hiddenN });
      if (histBtn.textContent !== label) histBtn.textContent = label;
      histBtn.hidden = !histAll && !hiddenN;
      histBtn.setAttribute('aria-pressed', String(histAll));
    }
    const ol = el.querySelector('#chat');
    if (ol) {
      const prev = !rebuilt ? { top: ol.scrollTop, height: ol.scrollHeight, client: ol.clientHeight }
        : (savedChat && savedChat.to === chatTo ? { top: savedChat.top, height: savedChat.height, client: savedChat.client } : null);
      if (ol.innerHTML !== listHtml) ol.innerHTML = listHtml;
      const next = { height: ol.scrollHeight, client: ol.clientHeight };
      const res = chatScroll(prev, next);
      ol.scrollTop = res.top;
      const chip = el.querySelector('#newmsg');
      if (chip && res.chip) chip.hidden = false;
    }
    const fail = el.querySelector('#chat-fail');
    if (fail) { const failText = chatFailText(chatTo, box); fail.hidden = !failText; if (fail.textContent !== failText) fail.textContent = failText; }
  }
}

/* ---------- rail: the compact, collapsible team list, left (V1) ---------- */
function readStoredBool(key, dflt){
  try { const v = localStorage.getItem(key); return v === null ? dflt : v === '1'; } catch (e) { return dflt; }
}
function writeStoredBool(key, v){ try { localStorage.setItem(key, v ? '1' : '0'); } catch (e) {} }
let railClosed = new Set();
try {
  const savedClosed = localStorage.getItem('agent-city.railClosed');
  if (savedClosed) railClosed = new Set(savedClosed.split(',').filter(Boolean));
} catch (e) {}
function saveRailClosed(){ try { localStorage.setItem('agent-city.railClosed', [...railClosed].join(',')); } catch (e) {} }
// city-rail-tree P4: the rows whose children the owner folded (the tree's arrows), remembered in this browser like railClosed
let railShut = new Set();
try {
  const savedShut = localStorage.getItem('agent-city.railShut');

let railRestOpen = new Set();

let lastRail = '';
/* renderRail():#rail-list from railGroups()/railHtml() (only touches the DOM when the html actually
   changed, through lastRail); #rail-n / #rail-you (+ the tab's own badges) from railCount(); #rail /
   #rail-tab show by railFolded, both hidden when railGroups() is empty. On a phone, the rail unfolded is
   the drawer open -- the stage gets .drawer-open while it covers the win/ask panels. renderPanel() calls
   this. */
function renderRail(){
  const groups = railGroups(), sel = selKey(selected);
  const html = railHtml(groups, sel, railClosed, railRestOpen, addState, railShut);   // city-rail-tree P4: + the folded rows
  if (html !== lastRail) { lastRail = html; $('#rail-list').innerHTML = html; }
  const counts = railCount(groups);

  $('#rail-you').hidden = !counts.you;
  $('#rail-you').textContent = counts.you;

  $('#rail-tab-you').hidden = !counts.you;

  stage.classList.toggle('rail-folded', has && railFolded);

/* city-add-agent A2/A4: addAgent(terr, force) -- the "add agent" button of one repo group. Nothing while
   that repo already reads "opening" (one open at a time per repo); else the button reads opening at
   once, then POST /api/agent/add {terr, force} (force: true only from the over-the-limit confirm) and
   addAnswer() turns the answer into the button's next state. A failed request (no answer at all) shows
   an error line too, a broken or empty body counts as {}; the rail is redrawn after every answer. The
   server's 'adding' events (opening / done / late) move the same state on from there.
   */
function addAgent(terr, force){
  const was = addState.get(terr);
  if (was && was.s === 'opening') return;
  addState.set(terr, { s: 'opening', name: '' });
  renderRail();
  fetch('/api/agent/add', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-City-Token': TOKEN }, body: JSON.stringify({ terr, force }) })
    .then(r => r.json().catch(() => ({})).then(body => addAnswer(terr, r.status, body)))
    .catch(() => addAnswer(terr, 0, {}))
    .then(() => renderRail());
}
$('#rail-list').addEventListener('click', e => {
  // city-rail-tree P4: an arrow folds / unfolds that row's children -- first, it is not the row (never selects, never closes the phone drawer)
  const tw = e.target.closest('[data-tw]');
  if (tw) {
    const id = tw.dataset.tw;
    if (railShut.has(id)) railShut.delete(id); else railShut.add(id);
    saveRailShut();
    renderRail();
    return;
  }
  const addBtn = e.target.closest('[data-add]');
  if (addBtn) { addAgent(addBtn.dataset.add, false); return; }
  const goBtn = e.target.closest('[data-add-go]');
  if (goBtn) { addAgent(goBtn.dataset.addGo, true); return; }
  const noBtn = e.target.closest('[data-add-no]');
  if (noBtn) {
    addState.delete(noBtn.dataset.addNo);
    renderRail();
    return;
  }
  const copyBtn = e.target.closest('[data-add-copy]');
  if (copyBtn) {
    const st = addState.get(copyBtn.dataset.addCopy);
    if (!st) return;
    try { navigator.clipboard.writeText(st.cmd).catch(() => {}); } catch (err) {}
    st.copied = true; renderRail();
    return;
  }
  const grp = e.target.closest('[data-grp]');
  if (grp) {
    const terr = grp.dataset.grp;
    if (railClosed.has(terr)) railClosed.delete(terr); else railClosed.add(terr);
    saveRailClosed();
    lastRail = ''; renderRail();
    return;
  }
  const rest = e.target.closest('[data-rest]');
  if (rest) {
    const terr = rest.dataset.rest;
    if (railRestOpen.has(terr)) railRestOpen.delete(terr); else railRestOpen.add(terr);
    lastRail = ''; renderRail();
    return;
  }
  const row = e.target.closest('[data-focus]');
  if (row) selectFrom(row.dataset.focus);
});

/* V1 (city-ux2 v2): the panel folds to a thin tab on its own right edge, exactly like the rail
   (#rail-fold/#rail-tab/setRailFolded) -- setWinFolded(v) sets the state, remembers it (localStorage
   'agent-city.winFolded'), and redraws; the page reads it back at start, below. Folding also remembers
   how many conversation entries were showing (winFoldBase), so the tab can badge how many are new since
   -- winEntryCount() is only ever used for that badge. */
let winFolded = readStoredBool('agent-city.winFolded', false);
let winFoldBase = 0;
/* city-polish C2: the "show the steps" toggle of the history (#hist-all), remembered like the fold;
   setHistAll(v) redraws the panel -- renderDetail's per-call refresh rebuilds the list and the button
   in place (no card rebuild, so the button keeps its focus and the scroll place is kept). */

/* the badge counts what the list would show: the main messages, or everything while histAll is on (a
   remote person's list has no toggle, it shows all). */
function winEntryCount(){
  if (!selected) return 0;
  if (selected.t === 'c') {
    const c = byId(selected.id); if (!c) return 0;
    const to = curChatTo(), box = to ? chats.get(to) : null;

/* renderWin(): shows #win or #win-tab by winFolded (both hidden once nothing is open); .short (bottom:
   auto) on a building/site/remote-governor card, which never grows to fill the panel; the tab's own
   text/badge stay current either way, so it is right the moment it appears. .cam (the zoom buttons)
   moves left of whichever of #win/#win-tab actually shows, through the win-open/win-tab-open classes on

/* city-ask-panel K14: an ask's body is built from four parts, so the small dialog (one block with

function askQuestionFields(view){

      <label class="opt"><input type="radio" name="q${i}" value="" data-other><span><b>${i18n('opt.other')}</b><input type="text" data-text="${i}" placeholder="${i18n('opt.customAnswer')}" aria-label="${i18n('opt.customAnswer')}"></span></label>

}

}
/* city-ask-panel K16: shortDir(path, repo) -> a folder, short (pure). repo = the ask's own repo (its git
   dir, ".../name/.git"). Inside the repo: "name" or "name/<path inside>". Else under /Users/<u>/ or
   /home/<u>/: "~" or "~/<rest>". Then, when the result is longer than 48 characters: "…/" and its last two
   parts. An empty path -> ''. The full path stays on the title of the <code> that shows it. */
function shortDir(path, repo){
  if (!path) return '';
  const trim = s => String(s).replace(/\/+$/, '');
  const dir = trim(path);
  let out = dir;
  const root = repo ? trim(repo).replace(/\/\.git$/, '') : '';
  const name = root ? root.slice(root.lastIndexOf('/') + 1) : '';
  if (root && name && (dir === root || dir.startsWith(root + '/'))) out = name + dir.slice(root.length);
  else {
    const home = /^\/(?:Users|home)\/[^/]+(\/.*)?$/.exec(dir);
    if (home) out = '~' + (home[1] || '');
  }
  if (out.length > 48) out = '…/' + out.split('/').filter(Boolean).slice(-2).join('/');
  return out;
}
/* askPermissionDetail(view): what the request is -- the tool, the command / file / url, what it said, the
   folder (short, the full path on hover); no field, no button. askPermissionActs(): the deny reason field
   and 批准 / 拒绝. */
function askPermissionDetail(view){
  const d = view.detail || {};
  const main = d.command ? `<pre class="cmd">${esc(d.command)}</pre>`
    : d.file_path ? `<div class="kv"><span>${i18n('kv.file')}</span><code>${esc(d.file_path)}</code></div>`
    : d.url ? `<div class="kv"><span>${i18n('kv.url')}</span><code>${esc(d.url)}</code></div>`
    : (view.what ? `<pre class="cmd">${esc(view.what)}</pre>` : '');
  return `
    <div class="kv"><span>${i18n('kv.tool')}</span><b>${esc(view.tool || '')}</b></div>
    ${main}
    ${d.description ? `<p class="said">${i18n('said', { text: esc(d.description) })}</p>` : ''}

/* city-ask-panel K7: wireAskControls(root, view) -> the form and button wiring of an open ask, looked up

    if (tms[0]) { mk('worker', t.id, tms[0].id); mk('worker', t.id, tms[0].id); }
    if (i === 1 && tms[1]) { mk('worker', t.id, tms[1].id); mk('merge-deputy', t.id, tms[1].id); }
    if (!themeOf(t.id).designed) mk('designer', t.id);
  });
}

/* ---------- boot: nothing to load, so it runs at once, at a capped frame rate ---------- */
let lastSim = performance.now(), lastDraw = 0, panelT = 0;
function busy(){
  if (drag && drag.moved || pinch || camMove || spin || entering || cam.wantDist != null || follow) return true;
  if (view === 'inside') return true;
  return OUT.open < .99 && OUT.goal === 1;
}
/* what is redrawn four times a second */
function tick(){
  renderPanel(); worldWatch(); floorWatch(); watchDesigners(); maybeAsk(); renderOffice();
  if (!$('#dPop').hidden && !cur) $('#dPop').hidden = true;
}
let lastSignLeft = -1;
function frame(now){
  requestAnimationFrame(frame);
  if (document.hidden) { lastSim = now; return; }
  askAutoClose(now);
  const interval = busy() || needFrame ? FRAME_MS : IDLE_FRAME_MS;
  if (now - lastDraw < interval - 2) return;
  const raw = Math.min(.1, (now - lastSim) / 1000);
  lastSim = now; lastDraw = now; needFrame = false;
  for (let dt = raw; dt > 0; dt -= .05) update(Math.min(dt, .05));
  T += raw;
  if (spin) { spin.t = Math.min(1, spin.t + raw * 2.2); const u = spin.t, e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; cam.az = spin.from + (spin.to - spin.from) * e; if (u >= 1) spin = null; }
  watchFollow();
  const centre = updateCamera(raw);
  if (view === 'inside') {
    updateWalls(raw); updateDoors(raw);
    if (!RM) for (const fn of ANIMS) fn(raw, T);
    syncFigs(raw);
  } else {
    OUT.open += (OUT.goal - OUT.open) * Math.min(1, raw * 5);
    for (const d of OUT.doors) d.o.position.x = d.dx + Math.sign(d.dx) * OUT.open * 1.05;
    updateAnchors();
  }
  const left = Math.round(centre[0]);
  if (left !== lastSignLeft) { lastSignLeft = left; $('#floorSign').style.left = left + 'px'; $('#dPop').style.left = left + 'px'; }
  renderFollow();
  renderer.render(scene, camera);
  panelT += raw;
  if (panelT > .25) { panelT = 0; tick(); }
}
resize();
new ResizeObserver(() => resize()).observe(stage);
if (DEMO) seedDemo(); else connectLive();
worldWatch();
renderPanel(); renderOffice();
requestAnimationFrame(frame);
})();
</script>
