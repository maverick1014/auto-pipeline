<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="city-token" content="__CITY_TOKEN__">
<title>Agent City</title>
<link rel="icon" href="data:,">
<style>
:root{
  --paper:#ECF1FF; --panel:#FFFFFF; --panel-2:#F3F5FE; --ink:#2A2B45; --ink-2:#585D82; --ink-3:#8D91B3;
  --line:#DCE2F6; --sky:#CFE6FF; --berry:#FF7593; --berry-deep:#D9506E; --butter:#FFD36E; --mint:#6FD4A8;
  --focus:#4D7CFE;
  --build-bg:#E1ECFF; --build-ink:#3160B5; --ask-bg:#FFE1E8; --ask-ink:#C2345A;
  --rest-bg:#DAF5E8; --rest-ink:#1E8657; --walk-bg:#EDEFF7; --walk-ink:#5F6488;
  --gov-bg:#FFF0C7; --gov-ink:#8A6000; --ok:#1E8657; --ok-deep:#146342;
  --healthy:#2FB57A; --low:#E8A33A; --missing:#C4C8DD; --na:#9AA0C3;
  --round:ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --display:"Fredoka",ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13162A; --panel:#1C2040; --panel-2:#242951; --ink:#EEF0FF; --ink-2:#B0B5DB; --ink-3:#7B81AA;
    --line:#2D3360; --sky:#1B2046; --focus:#8FB0FF;
    --build-bg:#1E3160; --build-ink:#A9C6FF; --ask-bg:#4A1F33; --ask-ink:#FFB0C3;
    --rest-bg:#173D33; --rest-ink:#93E8C0; --walk-bg:#262B50; --walk-ink:#B3B8DE;
    --gov-bg:#43381A; --gov-ink:#FFDD8A; --ok:#2FA56F; --ok-deep:#1B7049;
    --missing:#3A4070;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#13162A; --panel:#1C2040; --panel-2:#242951; --ink:#EEF0FF; --ink-2:#B0B5DB; --ink-3:#7B81AA;
  --line:#2D3360; --sky:#1B2046; --focus:#8FB0FF;
  --build-bg:#1E3160; --build-ink:#A9C6FF; --ask-bg:#4A1F33; --ask-ink:#FFB0C3;
  --rest-bg:#173D33; --rest-ink:#93E8C0; --walk-bg:#262B50; --walk-ink:#B3B8DE;
  --gov-bg:#43381A; --gov-ink:#FFDD8A; --ok:#2FA56F; --ok-deep:#1B7049;
  --missing:#3A4070;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 var(--round)}
.app{max-width:1500px;margin-inline:auto;padding-inline:16px;padding-block:14px 22px;display:flex;flex-direction:column;gap:14px;min-height:100dvh}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.sign{display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--ink);border-radius:18px;padding:5px 16px 5px 8px;box-shadow:0 3px 0 var(--ink)}
.sign-name{font:700 24px/1 var(--display);letter-spacing:.01em}
.sign-sub{display:block;font:600 10.5px/1.2 var(--mono);color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.stat{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px;color:var(--ink-2)}
.stat b{color:var(--ink);font:700 14px/1 var(--display);font-variant-numeric:tabular-nums}
.stat i{width:9px;height:9px;border-radius:50%;display:block}
.stat.wait{font:inherit;font-size:13px;cursor:pointer;border-color:var(--berry);background:var(--ask-bg);color:var(--ask-ink)}
.stat.wait b{color:var(--ask-ink)}
.stat.wait:disabled{cursor:default;border-color:var(--line);background:var(--panel);color:var(--ink-3)}
.stat.wait:disabled b{color:var(--ink-3)}
.stat.wait:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;flex:1;min-height:0}
.stage-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage{position:relative;overflow:hidden;height:calc(100dvh - 150px);min-height:460px}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas.grabbing{cursor:grabbing}
.proto{position:absolute;top:12px;left:12px;z-index:3;background:var(--butter);color:#4A3500;font:600 12px/1 var(--display);padding:7px 12px;border-radius:999px;box-shadow:0 2px 0 rgba(42,43,69,.18);pointer-events:none}
.cam{position:absolute;top:12px;right:12px;z-index:3;display:flex;flex-direction:column;gap:6px}
.cam .btn{width:38px;height:38px;padding:0;justify-content:center;background:var(--panel)}

.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.ov > div,.ov > button{position:absolute;left:0;top:0;will-change:transform}
.bub{background:#FFFFFF;color:#2A2B45;border:2px solid #2A2B45;border-radius:14px;padding:3px 10px;font:600 12.5px/1.4 var(--round);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 rgba(42,43,69,.2)}
.bub.ask{border-color:#E4476F}
.bub.gov{background:#FFF1C9;border-color:#C99A1E}
.bub.done{border-color:#2FB57A;background:#EFFFF6}
.qm{all:unset;cursor:pointer;display:block;width:28px;height:28px;pointer-events:auto}
.qm span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#FF6F8B;color:#fff;font:700 17px/1 var(--display);border:2px solid #fff;box-shadow:0 2px 0 rgba(42,43,69,.25);animation:hop .7s ease-in-out infinite}
.qm:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.gwait{display:inline-flex;align-items:center;gap:5px;background:var(--gov-bg);color:var(--gov-ink);border:1.5px solid var(--gov-ink);border-radius:999px;padding:2px 9px;font:600 11px/1.4 var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none}
.zz{font:700 14px/1 var(--display);color:#8D91B3;letter-spacing:.1em}
.zz span{display:inline-block;animation:zz 2.4s ease-in-out infinite}
.zz span:nth-child(2){animation-delay:.4s}
.zz span:nth-child(3){animation-delay:.8s}
@keyframes zz{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(8px,-14px);opacity:0}}
.tagl{background:var(--c);color:#fff;border-radius:999px;padding:3px 10px;font:600 11.5px/1.3 var(--mono);white-space:nowrap;box-shadow:0 2px 0 rgba(42,43,69,.2)}
.fl{background:var(--c);color:#fff;border-radius:8px;padding:1px 7px;font:600 11px/1.5 var(--mono)}
.lbl{background:rgba(255,255,255,.94);color:#2A2B45;border-radius:999px;padding:2px 10px;font:600 12px/1.5 var(--display);box-shadow:0 2px 0 rgba(42,43,69,.15);white-space:nowrap}
.era-sign{background:var(--gov-bg);color:var(--gov-ink);border:1.5px solid var(--gov-ink);border-radius:999px;padding:3px 10px;font:600 12px/1.3 var(--round);white-space:nowrap;box-shadow:0 2px 0 rgba(42,43,69,.18)}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:8px}
.group{display:inline-flex;align-items:center;gap:5px}
.clock{margin-left:auto;font:600 12px/1 var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums;padding-right:4px}
.btn{font:600 13px/1 var(--round);border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:12px;padding:0 12px;min-height:36px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,box-shadow .12s,border-color .12s}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible,select:focus-visible,.row:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary{background:var(--berry);border-color:var(--berry);color:#fff;box-shadow:0 3px 0 var(--berry-deep)}
.btn.primary:active{transform:translateY(3px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 3px 0 var(--ok-deep);white-space:nowrap;min-width:92px;justify-content:center}
.btn.ok:active{transform:translateY(3px);box-shadow:none}
.btn.no{background:var(--panel);border-color:var(--ask-ink);color:var(--ask-ink);white-space:nowrap;min-width:92px;justify-content:center}
.btn svg{width:15px;height:15px}
select{font:600 13px/1 var(--round);min-height:36px;border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:12px;padding:0 10px}
.lead{font-size:13px;color:var(--ink-2);margin-right:2px}

.panel{display:flex;flex-direction:column;gap:12px;min-width:0;max-height:calc(100dvh - 100px);overflow:auto;padding-bottom:3px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:14px 16px}
.card-head{margin:0 0 10px;touch-action:none;user-select:none;-webkit-user-select:none}
.card-head button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:8px;font:700 16px/1.2 var(--round);color:var(--ink);cursor:grab;border-radius:10px}
.card-head button:focus-visible{outline:2.5px solid var(--focus);outline-offset:3px}
.card-head .grip{width:14px;height:14px;color:var(--ink-3);flex:none}
.card-head .chev{width:16px;height:16px;margin-left:auto;color:var(--ink-3);transition:transform .15s;flex:none}
.card.collapsed .card-head{margin-bottom:0}
.card.collapsed .card-head .chev{transform:rotate(-90deg)}
.card.collapsed .card-body{display:none!important}
.card.dragging{position:relative;z-index:5;box-shadow:0 10px 24px rgba(42,43,69,.22);border-color:var(--ink-3)}
.card.dragging .card-head button{cursor:grabbing}
.card-head .en{font:600 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}


.sign-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--berry);color:#fff;flex:none}
.sign-icon svg{width:20px;height:20px}
.btn svg.lucide{width:16px;height:16px}
.loading{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:var(--paper);font:600 14px/1.4 var(--display);color:var(--ink-2)}
.rdot{width:18px;height:18px;border-radius:50%;border:4px solid var(--c);background:var(--panel);flex:none;justify-self:center}
.rdot.gov{--c:#FFD36E}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.row{width:100%;display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 8px;border-radius:14px;border:1.5px solid transparent;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.row:hover{background:var(--panel-2)}
.row[aria-current="true"]{border-color:var(--berry);background:var(--panel-2)}
.who{min-width:0;display:flex;flex-direction:column}
.who b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font:12px/1.3 var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font:600 12px/1 var(--round);padding:6px 10px;border-radius:999px;white-space:nowrap}
.pill.build{background:var(--build-bg);color:var(--build-ink)}
.pill.ask{background:var(--ask-bg);color:var(--ask-ink)}
.pill.rest{background:var(--rest-bg);color:var(--rest-ink)}
.pill.walk{background:var(--walk-bg);color:var(--walk-ink)}
.pill.gov{background:var(--gov-bg);color:var(--gov-ink)}
.pill.you{background:#FF4F72;color:#fff}

.detail{display:flex;flex-direction:column;gap:11px}
.d-head{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center}
.d-name{font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.d-role{font:12px/1.3 var(--mono);color:var(--ink-3)}
.d-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;color:var(--ink-2)}
.track{height:10px;border-radius:999px;background:var(--panel-2);border:1.5px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;transition:width .4s}
.d-tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0}
.d-tools div{background:var(--panel-2);border-radius:12px;padding:7px 9px}
.d-tools dt{font:11px/1.2 var(--mono);color:var(--ink-3)}
.d-tools dd{margin:0;font:700 16px/1.3 var(--display);font-variant-numeric:tabular-nums}
.d-qa{display:flex;flex-direction:column;gap:4px;font-size:13px}
.d-qa p{margin:0;color:var(--ink-2)}
.d-qa b{color:var(--ink);font-weight:700}
.d-actions{display:flex;flex-wrap:wrap;gap:6px}
.d-note,.hint{margin:0;font-size:12.5px;color:var(--ink-3)}

/* 城市平衡 card (Balance): era line + sign, one bar per kind, its files when clicked open */
.era{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px;font-size:13px}
.era b{font-size:15px}
.note{margin:0 0 10px;font-size:12.5px;color:var(--ink-3)}
.need{background:var(--panel-2);border-radius:10px;padding:3px 9px;font-weight:600}
.bterr{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.kinds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.kind>button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:16px 52px minmax(0,1fr) 46px;gap:8px;align-items:center;padding:7px 6px;border-radius:10px;cursor:pointer}
.kind>button:hover{background:var(--panel-2)}
.kind>button:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.kind .ic{width:14px;height:14px;border-radius:5px}
.kind .nm{font-weight:700;white-space:nowrap}
.kind .st{font-size:12px;font-weight:700;text-align:right}
.kind .val{grid-column:2 / 5;font-size:12px;color:var(--ink-2);margin-top:-2px}
.st.healthy{color:var(--healthy)} .st.low{color:var(--low)} .st.missing{color:var(--ink-3)} .st.na{color:var(--na)}
.kind .track i{background:var(--ink-3)}
.kind[data-state="healthy"] .track i{background:var(--healthy)}
.kind[data-state="low"] .track i{background:var(--low)}
.kind[data-state="missing"] .track i{background:var(--missing)}
.kind[data-state="na"] .track i{background:var(--na)}
.files{margin:2px 0 8px 24px;padding:8px 10px;background:var(--panel-2);border-radius:10px;font:12px/1.5 var(--mono);max-height:180px;overflow:auto}
.files ol{margin:0;padding:0 0 0 18px}
.files p{margin:4px 0 0;font-family:var(--round);color:var(--ink-2)}
.files p:first-child{margin-top:0}
.files code{background:var(--panel);border-radius:6px;padding:1px 5px}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;max-height:260px;overflow:auto}
.log li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;font-size:13px;line-height:1.45}
.log time{font:12px/1.45 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.log .ask{color:var(--ask-ink)}
.log .done{color:var(--rest-ink)}
.log .wait-you{color:var(--ask-ink)}

/* the "?" panel: sits over the city, inside #stage */
.ask-panel{position:absolute;right:12px;top:12px;z-index:6;width:min(410px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 rgba(42,43,69,.22);padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.ask-head{display:grid;grid-template-columns:minmax(0,1fr) auto 32px;gap:10px;align-items:center}
.ask-title{font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere;outline:none}
.ask-role{font:12px/1.3 var(--mono);color:var(--ink-3)}
.x{all:unset;cursor:pointer;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;color:var(--ink-2)}
.x:hover{background:var(--panel-2)}
.x:focus-visible{outline:2.5px solid var(--focus)}
.why{display:flex;gap:8px;align-items:flex-start;background:var(--ask-bg);color:var(--ask-ink);border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.45}
.why.gov{background:var(--gov-bg);color:var(--gov-ink)}
.q{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.q legend{padding:0;margin-bottom:6px;font-weight:700;font-size:15px;line-height:1.4}
.chip{display:inline-block;font:600 11px/1 var(--mono);letter-spacing:.04em;background:var(--panel-2);color:var(--ink-2);border:1.5px solid var(--line);border-radius:999px;padding:4px 8px;margin-right:6px;vertical-align:2px}
.opt{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start;border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;cursor:pointer;background:var(--panel)}
.opt:hover{border-color:var(--ink-3)}
.opt:has(input:checked){border-color:var(--berry);background:var(--panel-2)}
.opt input{margin:3px 0 0;accent-color:var(--berry)}
.opt b{display:block;font-weight:700}
.opt small{display:block;color:var(--ink-3);font-size:12.5px}
.opt input[type=text]{width:100%;margin-top:6px;font:14px/1.3 var(--round);color:var(--ink);background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.perm{display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:baseline;font-size:13px}
.kv>span{color:var(--ink-3)}
.kv code{font:12.5px/1.4 var(--mono);overflow-wrap:anywhere;color:var(--ink-2)}
.cmd{margin:0;font:13px/1.5 var(--mono);background:var(--panel-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.said{margin:0;font-size:13px;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2)}
.field input{font:14px/1.3 var(--round);color:var(--ink);background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{min-height:40px;padding:0 16px;font-size:14px}
.foot{margin:0;font-size:12.5px;color:var(--ink-3)}
.closed{display:flex;gap:8px;align-items:flex-start;border-radius:12px;padding:9px 11px;font-size:13.5px;line-height:1.45;background:var(--rest-bg);color:var(--rest-ink)}
.closed.no{background:var(--ask-bg);color:var(--ask-ink)}
.closed.late{background:var(--gov-bg);color:var(--gov-ink)}

@media (max-width: 960px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .stage{height:min(66vh,calc(100vw * 1.1));min-height:340px}
  .panel{max-height:none;overflow:visible}
  .stats{margin-left:0}
  .ask-panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:72%}
}
@media (prefers-reduced-motion: reduce){ .qm span,.zz span{animation:none} .track i,.btn,.card-head .chev{transition:none} }
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="sign">
      <span class="sign-icon"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg></span>
      <div><span class="sign-name">Agent City</span><span class="sign-sub">auto-pipeline · 3D</span></div>
    </div>
    <div class="stats" id="stats" aria-live="polite"></div>
  </header>

  <main class="layout">
    <section class="stage-col" aria-label="城市">
      <div class="stage" id="stage">
        <canvas id="city" role="img" aria-label="3D 小岛：每个小人是一个 agent"></canvas>
        <div class="ov" id="ov"></div>

function logAt(t, text, kind){ logEntries.unshift({ t, text, kind: kind || '', real: DEMO ? null : Date.now() }); if (logEntries.length > MAX_LOG) logEntries.length = MAX_LOG; dirty.log = true; }
const log = (text, kind) => logAt(simT, text, kind);

/* a building record: terr/plot/type come from the server (or, in demo, from DEMO_WORLD); gx/gy are world tiles.
   done buildings (already in the server's view) start shown; a live 'build' event starts at 0 and rises. */
function newBuildingRecord(terr, plot, type, x, z, by, done){
  const b = { id:++bid, terr, plot, type, gx:x, gy:z, by, seed:(Math.abs(x*928371+z*12345+plot)) % 1000,
    done:!!done, shown:done ? 1 : 0, risenAt:simT, popAt: done ? -99 : simT,
    name: TYPE_ZH[type] || type, color: DCOL[type] || '#5AA9F0', label: TYPE_ZH[type] || type, ownerId:0 };
  buildings.push(b);
  occupied.set(x + ',' + z, b);
  return b;
}
function standFor(b){
  const [fx, fz] = frontOf(b.gx, b.gy);
  return { x: fx + .5 + (b.gx - fx) * .28, y: fz + .5 + (b.gy - fz) * .28 };
}
function newCitizen(id, role, task, terr){
  const R = ROLES[role], t = terrOf(terr), stand = t ? hallStand(t) : { x:0, y:0 };
  return { id, role, label:role, task, terr, color:R.color, skin:pick(SKIN), x:stand.x, y:stand.y, path:[], state:'spawn', stateT:0,
    alpha:0, tools:{Edit:0,Write:0,Bash:0,Read:0,Other:0}, work:0, bld:null, stand, slot:null, rest:null, pendingBuild:null,
    question:'', answer:'', answered:false, pendingAnswer:'', askT:0, stuck:false, doneFlag:false, leaveFlag:false,
    askKind:'', askPhase:'', qa:[], bubble:null, walkT:Math.random()*5, feed:null, gone:false };
}
const byId = id => citizens.find(c => c.id === id);

function goTo(c, target, state){
  const p = findPath(c.x, c.y, target.x, target.y);
  c.path = p && p.length ? [...p.slice(0, -1), [target.x, target.y]] : [[target.x, target.y]];
  c.state = state; c.stateT = 0;
}
function move(c, dt){
  const [tx, ty] = c.path[0];
  const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy), sp = (c.state === 'to_hall' ? SPRINT_SPEED : WALK_SPEED) * dt;
  c.walkT += dt;
  if (d <= sp) { c.x = tx; c.y = ty; c.path.shift(); if (!c.path.length) onArrive(c); }
  else { c.x += dx / d * sp; c.y += dy / d * sp; }
}
function onArrive(c){
  switch (c.state) {
    case 'to_plot': case 'back':
      c.state = 'building'; c.stateT = 0;
      if (c.pendingBuild) {
        const p = c.pendingBuild; c.pendingBuild = null;
        c.bld = newBuildingRecord(p.terr, p.plot, p.btype, Math.round(c.x), Math.round(c.y), p.by, false);
        c.bld.ownerId = c.id; c.stand = standFor(c.bld);
      }
      if (c.stuck) goHall(c); else if (c.doneFlag) finish(c);
      break;
    case 'to_hall': c.state = 'asking'; c.stateT = 0; c.askT = simT; break;
    case 'to_rest': c.state = 'resting'; c.stateT = 0; if (c.leaveFlag) leave(c); break;
  }
}
function goHall(c){
  const t = terrOf(c.terr);
  const slot = t ? { x: t.cx + rnd(-.6, .6), y: t.cz + .9 + rnd(0, .3), by: c.id, extra: true } : { x: c.x, y: c.y, by: c.id, extra: true };
  c.slot = slot;
  goTo(c, slot, 'to_hall');
}
function releaseSlot(c){ if (c.slot && !c.slot.extra) c.slot.by = 0; c.slot = null; }
function giveAnswer(c){
  if (DEMO) { say(gov, c.answer, 2.6); gov.answered++; }
  c.qa.push({ q: c.question, a: c.answer });
  c.state = 'heard'; c.stateT = 0;
}
function finish(c){
  c.state = 'finishing'; c.stateT = 0;
  say(c, '完工啦！', 1.5);
}
function pickRestSpot(c){
  const t = terrOf(c.terr), slots = t ? restSlotsFor(t) : [];
  const free = slots.filter(r => !r.by);
  let spot = free.length ? pick(free) : null;
  if (spot) spot.by = c.id;
  else spot = { x: c.x, y: c.y, pose: 'lie', by: c.id, extra: true };
  return spot;
}
function goRest(c){
  const spot = pickRestSpot(c);
  c.rest = spot;
  goTo(c, spot, 'to_rest');
}
function leave(c){
  if (c.rest && !c.rest.extra) c.rest.by = 0;
  c.rest = null;
  const t = terrOf(c.terr);
  goTo(c, t ? hallStand(t) : { x: c.x, y: c.y }, 'leaving');
}
function forceLeave(c){
  releaseSlot(c);
  leave(c);
}
function autoLeave(c){
  c.leaveFlag = true;
  leave(c);
  log(`${c.task} 下班了`);
}

const WEIGHT = { Edit:1, Write:1, Bash:.6, Read:.3, Other:.3 };
let govState = 'idle';
let governorCount = 1; // assume present until a snapshot or a 'governors' event says otherwise
let govTerr = null;
function setGovState(state){ govState = state; if (state !== 'waiting') gov.bubble = null; }
function roleOrOther(role){ return ROLES[role] ? role : 'other'; }
/* home = the scene point the default camera looks at: the governor's territory hall, else the first (Camera, Growth) */
function updateHome(){
  const t = terrOf(govTerr) || map.territories[0];
  // the square just south of the hall (2.2 tiles), never the hall's own centre: it would stand in the view line and fade
  home = t ? { x: t.cx - mid.x, z: t.cz - mid.z + 2.2 } : { x: 0, z: 0 };
  if (t) { const s = hallStand(t); gov.x = s.x; gov.y = s.y; }
}
function placeAgent(a){
  const role = roleOrOther(a.role);
  const c = newCitizen(a.id, role, a.task, a.terr);
  c.label = a.label || role;
  c.alpha = 1; c.state = 'building';
  const tools = a.tools || {};
  Object.assign(c.tools, tools);
  c.work = Object.entries(tools).reduce((s, [k, v]) => s + (WEIGHT[k] || .3) * v, 0);
  if (a.done) {
    c.doneFlag = true;
    const spot = pickRestSpot(c);
    c.rest = spot; c.x = spot.x; c.y = spot.y; c.state = 'resting';
  } else if (a.stuck) {
    c.stuck = true; c.question = '需要你看一下';
    goHall(c);
  }
  citizens.push(c);
  return c;
}
function apply(ev){
  const c = ev.id ? byId(ev.id) : null;
  switch (ev.type) {
    case 'snapshot': {
      const agents = ev.agents || [];
      const seen = new Set(agents.map(a => a.id));
      for (const old of citizens.slice()) {
        if (seen.has(old.id)) continue;
        old.leaveFlag = true;
        if (old.state === 'resting' || !old.doneFlag) forceLeave(old);
      }
      // snapshot = live: clear every citizen's ask fields first (a
      // reconnect may find the ask already closed), place the agents, then
      // apply each still-open ask to its agent — same as the live path.
      if (ev.world) buildLand(ev.world);
      if (ev.world) { lastBalanceKey = ''; renderBalance(); }
      if (ev.notice) log(ev.notice);
      for (const old of citizens) applyAsk(old, null);
      for (const a of agents) if (!byId(a.id)) placeAgent(a);
      if (ev.gov && ev.gov.state) setGovState(ev.gov.state);
      if (ev.gov && ev.gov.terr) { govTerr = ev.gov.terr; updateHome(); }
      if (typeof ev.governors === 'number') governorCount = ev.governors;
      asks.clear();
      for (const a of ev.asks || []) asks.set(a.id, a);
      for (const a of ev.asks || []) { const ac = byId(a.agent); if (ac) applyAsk(ac, a); }
      return null;
    }
    case 'world': {
      buildLand(ev.world);
      lastBalanceKey = ''; renderBalance();
      if (ev.notice) log(ev.notice);
      return null;
    }
    case 'spawn': {
      if (byId(ev.id)) return null;
      if (citizens.length >= MAX_CITIZENS) { const old = citizens.find(x => x.state === 'resting') || citizens[0]; if (old) old.gone = true; }
      const role = roleOrOther(ev.role || 'worker');
      const n = newCitizen(ev.id, role, ev.task, ev.terr);
      n.label = ev.label || role;
      citizens.push(n);
      say(gov, `去吧：${ev.task}`, 1.8); gov.dispatched++;
      log(`总督派出 ${n.label}：${ev.task}`);
      return n;
    }
    case 'build': {
      if (ev.id === 'gov') { newBuildingRecord(ev.terr, ev.plot, ev.btype, ev.x, ev.z, ev.by, false); return null; }
      const owner = byId(ev.id);
      if (!owner) { newBuildingRecord(ev.terr, ev.plot, ev.btype, ev.x, ev.z, ev.by, false); return null; }
      owner.pendingBuild = { terr: ev.terr, plot: ev.plot, btype: ev.btype, by: ev.by };
      goTo(owner, { x: ev.x, y: ev.z }, 'to_plot');
      return owner;
    }
    case 'tool': {
      if (!c) return null;
      c.tools[ev.tool] = (c.tools[ev.tool] || 0) + 1;
      c.work += WEIGHT[ev.tool] || .3;
      if (floaters.length < MAX_FLOATERS) floaters.push({ text: ev.tool, x: c.x, y: c.y, t0: simT, color: c.color, el: null });
      return c;
    }
    case 'stuck': {
      if (!c) return null;
      const text = stuckText(ev);
      c.stuck = true; c.question = text; c.answered = false; c.answer = '';
      if (['building','to_plot','back'].includes(c.state)) goHall(c);
      if (DEMO) log(`${c.task} 卡住了：“${text}” → 去问总督`, 'ask');
      return c;
    }
    case 'answer': {
      if (!c) return null;
      const text = typeof ev.answer === 'string' && ev.answer ? ev.answer : '已回答';
      c.answer = text; c.answered = true; c.stuck = false;
      if (DEMO) log(`总督回答 ${c.task}：“${text}”`);
      return c;
    }
    case 'done': {
      if (!c || c.doneFlag) return null;
      c.doneFlag = true;
      if (c.state === 'building') finish(c);
      log(`${c.task} 完工${c.bld ? '：' + TYPE_ZH[c.bld.type] + '封顶' : ''}，去休息`, 'done');
      return c;
    }
    case 'leave': {
      if (!c) return null;
      c.leaveFlag = true;
      if (c.state === 'resting' || !c.doneFlag) forceLeave(c);
      log(`${c.task} 下班了`);
      return c;
    }
    case 'gov': {
      setGovState(ev.state);
      if (ev.terr) { govTerr = ev.terr; updateHome(); }
      return null;
    }
    case 'governors': {
      governorCount = ev.count || 0;
      return null;
    }
    case 'ask': {
      asks.set(ev.id, ev);
      const ac = byId(ev.agent);
      if (ac) applyAsk(ac, ev);
      log(askLine(ev, ev.task || ev.label || ''), ev.phase === 'owner' ? 'wait-you' : 'ask');
      return null;
    }
    case 'ask_phase': {
      const view = asks.get(ev.id);
      const name = view ? (view.task || view.label || '') : '';
      if (view) Object.assign(view, ev);
      const ac = byId(ev.agent);
      if (ac) ac.askPhase = ev.phase;
      log(askLine(ev, name), 'wait-you');
      if (openAskId === ev.id) renderAskPanel();
      return null;
    }
    case 'ask_closed': {
      const view = asks.get(ev.id);
      const name = view ? (view.task || view.label || '') : '';
      const ac = byId(ev.agent);
      if (ac) applyAsk(ac, null);
      log(askLine(ev, name));
      if (ev.by === 'governor' && ev.verb === 'answer') {
        say(gov, ev.text || '已回答', 2.6);
        gov.answered++;
      }
      if (openAskId === ev.id && view) {
        view.closed = { by: ev.by, verb: ev.verb, text: ev.text, reason: ev.reason, at: ev.at };
        renderAskPanel();
      } else {
        asks.delete(ev.id);
      }
      return null;
    }
  }
  return null;
}
const emit = ev => apply(ev);

const ROLE_TYPE = { 'task-manager':'tower', worker:'house', 'fast-lane-deputy':'shop', 'merge-deputy':'workshop' };
/* a free (unlocked, unbuilt) plot of the right district in a territory (Growth: view.territories[].plots) */
function freeDistrictPlot(terr, type){
  const t = terrOf(terr); if (!t) return null;
  const p = (t.plots || []).find(p => p.d === type);
  return p ? { terr, plot: p.k, x: p.x, z: p.z } : null;
}
function makeFeed(role, stuckChance, terr){
  const s = [];
  if (role === 'worker') {
    s.push('Read'); if (Math.random() < .5) s.push('Read');
    const n = Math.floor(rnd(6, 11));
    for (let i = 0; i < n; i++) { s.push(Math.random() < .8 ? 'Edit' : 'Write'); if (i % 3 === 2) s.push('Bash'); }
    s.push('Bash');
  } else if (role === 'task-manager') {
    s.push('Read', 'Read');
    const n = Math.floor(rnd(5, 8)); for (let i = 0; i < n; i++) s.push('Write');
    s.push('Bash', 'Bash');
  } else if (role === 'fast-lane-deputy') {
    s.push('Read', 'Edit', 'Edit'); if (Math.random() < .5) s.push('Edit');
  } else {
    s.push('Bash', 'Bash', 'Bash', 'Bash'); if (Math.random() < .4) s.push('Bash');
  }
  const seq = s.map(tool => ({ t:'tool', tool }));
  const p = stuckChance ?? (role === 'merge-deputy' ? .2 : .4);
  if (Math.random() < p) { const [q, a] = pick(QA); seq.splice(Math.floor(rnd(1, seq.length - 1)), 0, { t:'stuck', q, a }); }
  const plot = freeDistrictPlot(terr, ROLE_TYPE[role] || 'house');
  if (plot) seq.splice(Math.min(seq.length - 1, Math.floor(rnd(1, Math.max(2, seq.length - 1)))), 0, { t:'build', plot });
  seq.push({ t:'done' }, { t:'leave' });
  return { steps: seq, next: 0, restSince: 0, restFor: rnd(16, 30) };
}
function feed(c){
  const f = c.feed; if (!f || simT < f.next) return;
  const s = f.steps[0]; if (!s) return;
  if (c.doneFlag && s.t !== 'leave') { f.steps = f.steps.filter(x => x.t === 'leave'); return; }
  if (s.t === 'leave') {
    if (c.state !== 'resting') return;
    if (!f.restSince) { f.restSince = simT; return; }
    if (simT - f.restSince < f.restFor) return;
    f.steps.shift(); emit({ type:'leave', id:c.id }); return;
  }
  if (c.state !== 'building') return;
  f.steps.shift();
  if (s.t === 'tool') { emit({ type:'tool', id:c.id, tool:s.tool }); f.next = simT + rnd(.55, 1.35); }
  else if (s.t === 'stuck') { c.pendingAnswer = s.a; emit({ type:'stuck', id:c.id, question:s.q }); f.next = simT + .6; }
  else if (s.t === 'build') { const p = s.plot; emit({ type:'build', id:c.id, terr:p.terr, plot:p.plot, btype: ROLE_TYPE[c.role] || 'house', x:p.x, z:p.z, by:c.id }); f.next = simT + rnd(.6, 1.2); }
  else if (s.t === 'done') emit({ type:'done', id:c.id });
}
function spawnDemo(role, task, terr){
  if (!terr) { const ts = map.territories || []; if (!ts.length) return null; terr = pick(ts).id; }
  if (!task) {
    const busy = new Set(citizens.map(c => c.task));
    const opts = TASKS[role].filter(t => !busy.has(t));
    task = pick(opts.length ? opts : TASKS[role]);
  }
  const c = emit({ type:'spawn', id:'d' + (++cid), role, label:role, task, terr });
  if (c) c.feed = makeFeed(role, undefined, terr);
  return c;
}
let nextSpawn = 6;
function spawner(){
  if (simT < nextSpawn) return;
  nextSpawn = simT + rnd(7, 13);
  if (!(map.territories || []).length) return;
  const active = citizens.filter(c => STATE[c.state][0] !== 'rest' && c.state !== 'leaving').length;
  if (active >= 6) return;
  const r = Math.random();
  spawnDemo(r < .5 ? 'worker' : r < .65 ? 'task-manager' : r < .85 ? 'fast-lane-deputy' : 'merge-deputy');
}

function update(dt){
  simT += dt;
  for (const c of citizens) {
    c.stateT += dt;
    if (c.state === 'spawn') { c.alpha = Math.min(1, c.alpha + dt * 2.5); if (c.stateT > .7) { if (c.stuck) goHall(c); else goTo(c, c.stand, 'to_plot'); } }
    else if (c.path.length) move(c, dt);
    switch (c.state) {
      case 'asking':
        if (c.answered && simT - c.askT > .9) giveAnswer(c);
        else if (DEMO && !c.answered && simT - c.askT > 1.9) emit({ type:'answer', id:c.id, answer: c.pendingAnswer || pick(QA)[1] });
        break;
      case 'heard':
        if (c.stateT > 1.5) { releaseSlot(c); say(c, '明白！', 1.1); goTo(c, c.stand, 'back'); }
        break;
      case 'finishing': if (c.stateT > 1.5) goRest(c); break;
      case 'resting': if (!DEMO && !c.leaveFlag && c.stateT > LIVE_REST_SEC) autoLeave(c); break;
      case 'leaving': if (!c.path.length) { c.alpha -= dt * 2; if (c.alpha <= 0) c.gone = true; } break;
    }
    if (DEMO) feed(c);
  }
  for (let i = citizens.length - 1; i >= 0; i--) if (citizens[i].gone) {
    const c = citizens[i];
    if (c.rest && !c.rest.extra) c.rest.by = 0;
    releaseSlot(c);
    if (selected && selected.t === 'c' && selected.id === c.id) selected = c.bld && buildings.includes(c.bld) ? { t:'b', id:c.bld.id } : null;
    citizens.splice(i, 1);
  }
  for (const b of buildings) {
    if (!b.done) { b.shown = Math.min(1, (simT - b.risenAt) * .8); if (b.shown >= 1) { b.done = true; b.popAt = simT; } }
  }
  for (let i = floaters.length - 1; i >= 0; i--) if (simT - floaters[i].t0 > 1.2) { const f = floaters[i]; if (f.el) f.el.remove(); floaters.splice(i, 1); }
  if (DEMO) spawner();
}

  const key = W + '|' + H + '|' + cam.el.toFixed(3) + '|' + L.hx + ',' + L.hz, c = distMax.c || (distMax.c = {});
  if (c.key === key) return c.val;
  let best = DIST_MIN, span = 20 * (L.hx + L.hz + 20);
  /* a single fresh territory (HALF=13, no neighbour) only ever needs the plain 80% fit; a land of several
     territories also needs its wide/narrow sides centred (cx), which costs a little extra distance */
  const single = L.hx === 13 && L.hz === 13;
  for (let i = 0; i < 12; i++) { const az = i * Math.PI / 12;
    let lo = DIST_MIN, hi = span;
    for (let k = 0; k < 30; k++) { const md = (lo + hi) / 2, s = landSpread(az, md, centreHeight(az, md));
      const bad = single ? s[0] > .8 : (s[0] > .86 || Math.abs(s[2]) > .097);
      if (bad) lo = md; else hi = md; }

let camLiftNow = 0;

/* openBalanceKind(kind): toggles the clicked kind open/closed; live asks the server for its file list

   swallowed (network error, non-2xx, or a body that is not JSON). */
async function openBalanceKind(kind){
  const t = currentBalanceTerr(); if (!t) return;
  if (balanceOpen && balanceOpen.kind === kind && balanceOpen.terr === t.id) { balanceOpen = null; renderBalance(); return; }
  if (DEMO) { balanceOpen = { kind, terr: t.id, demo: true }; renderBalance(); return; }
  balanceOpen = { kind, terr: t.id, files: null, total: 0, rules: '', error: '' };
  renderBalance();
  let res;
  try {
    res = await fetch('/api/balance?terr=' + encodeURIComponent(t.id) + '&kind=' + encodeURIComponent(kind), { headers: { 'X-City-Token': TOKEN } });
  } catch (e) {
    balanceOpen = Object.assign({}, balanceOpen, { files: [], error: '没连上城市服务器' });
    renderBalance();
    return;
  }
  if (!res.ok) {
    balanceOpen = Object.assign({}, balanceOpen, { files: [], error: 'HTTP ' + res.status });
    renderBalance();
    return;
  }
  const data = await res.json().catch(() => null);
  if (!data) { balanceOpen = Object.assign({}, balanceOpen, { files: [], error: '数据解析失败' }); renderBalance(); return; }
  balanceOpen = Object.assign({ kind, terr: t.id }, data);
  renderBalance();
}

  else if (next && e.clientY > next.getBoundingClientRect().top + next.offsetHeight / 2) panel.insertBefore(card, next.nextSibling);
  d.y0 += card.offsetTop - top;

  card.style.transform = `translateY(${clamp(e.clientY - d.y0, lo, hi)}px)`;
});
function endCardDrag(e){
  if (!cardDrag || e.pointerId !== cardDrag.id) return;
  const d = cardDrag; cardDrag = null;
  if (!d.moved) return;
  d.card.classList.remove('dragging'); d.card.style.transform = '';
  dragJustEnded = true; setTimeout(() => { dragJustEnded = false; }, 0);
  saveCards();
}
panel.addEventListener('pointerup', endCardDrag);
panel.addEventListener('pointercancel', endCardDrag);
panel.addEventListener('click', e => {
  const head = e.target.closest('.card-head');
  if (!head || dragJustEnded) return;
  const card = head.closest('[data-card]');
  setCollapsed(card, !card.classList.contains('collapsed'));
  saveCards();
});
loadCards();

/* ---------- ask panel: the "?" — questions and permission requests from
   the live city (requirements/city.md, Interaction) ---------- */
function openAsk(id){
  const view = asks.get(id); if (!view) return;
  askReturnFocus = document.activeElement;
  openAskId = id;
  renderAskPanel();
  $('#ask').hidden = false;
  const title = $('#ask-title'); if (title) title.focus();
}
function closeAskPanel(){
  if (openAskId) { const v = asks.get(openAskId); if (v && v.closed) asks.delete(openAskId); }
  openAskId = null;
  $('#ask').hidden = true;
  $('#ask').innerHTML = '';
  if (askReturnFocus && document.contains(askReturnFocus)) askReturnFocus.focus();
  askReturnFocus = null;
  needFrame = true;
}
function askWhyLine(view){
  if (view.kind === 'permission') return `<div class="why">权限只由你来批，总督不批。</div>`;
  if (view.why === 'timeout') return `<div class="why gov">总督 ${view.wait} 秒没回答，交给你。</div>`;
  if (view.why === 'pass') return `<div class="why gov">总督说：这个我定不了，交给你。</div>`;
  return `<div class="why gov">没有总督在，直接交给你。</div>`;
}
function askQuestionBody(view){
  const qs = view.questions || [];
  return `<form id="qform" class="perm" novalidate>` + qs.map((q, i) => `
    <fieldset class="q"><legend>${q.header ? `<span class="chip">${esc(q.header)}</span>` : ''}${esc(q.question || '')}</legend>
      ${(q.options || []).map(o => `<label class="opt"><input type="radio" name="q${i}" value="${esc(o.label)}"><span><b>${esc(o.label)}</b>${o.description ? `<small>${esc(o.description)}</small>` : ''}</span></label>`).join('')}
      <label class="opt"><input type="radio" name="q${i}" value="" data-other><span><b>其他</b><input type="text" data-text="${i}" placeholder="自己写回答" aria-label="自己写回答"></span></label>
    </fieldset>`).join('') + `<div class="acts"><button class="btn primary" type="submit" id="send" disabled>发送回答</button></div></form>`;
}
function askPermissionBody(view){
  const d = view.detail || {};
  const main = d.command ? `<pre class="cmd">${esc(d.command)}</pre>`
    : d.file_path ? `<div class="kv"><span>文件</span><code>${esc(d.file_path)}</code></div>`
    : d.url ? `<div class="kv"><span>网址</span><code>${esc(d.url)}</code></div>`
    : (view.what ? `<pre class="cmd">${esc(view.what)}</pre>` : '');
  return `<div class="perm">
    <div class="kv"><span>工具</span><b>${esc(view.tool || '')}</b></div>
    ${main}
    ${d.description ? `<p class="said">它说：${esc(d.description)}</p>` : ''}
    ${d.cwd ? `<div class="kv"><span>目录</span><code>${esc(d.cwd)}</code></div>` : ''}
    <label class="field" for="reason">拒绝理由（可以不填；填了会原样告诉它）<input id="reason" type="text" placeholder="比如：先别删 dist/，里面有发布包"></label>
    <div class="acts"><button class="btn ok" type="button" data-verb="allow">批准</button><button class="btn no" type="button" data-verb="deny">拒绝</button></div>
  </div>`;
}
function askClosedLine(view){
  const k = view.closed, byZh = { governor:'总督', owner:'你', terminal:'终端' }[k.by] || k.by;
  const t = new Date(k.at || Date.now()).toTimeString().slice(0, 8);
  const late = k.by !== 'owner';
  if (k.verb === 'closed') {
    // only taken off the table (terminal, or a 409 before the real facts
    // arrive by SSE) — never say it was approved, denied or answered.
    return late
      ? `<div class="closed late"><span>晚了一步：<b>${byZh}</b>在 ${t} 已经处理了。这里不用再点了。</span></div>`
      : `<div class="closed"><span>在 ${t} 已经处理了，结果还没传回来。已记下。</span></div>`;
  }
  const text = view.kind === 'question'
    ? (k.text ? `回答了：“${esc(k.text)}”` : '已回答')
    : (k.verb === 'allow' ? '批准了' : `拒绝了${k.reason ? `，理由：“${esc(k.reason)}”` : ''}`);
  return `<div class="closed ${late ? 'late' : (k.verb === 'deny' ? 'no' : '')}"><span>${late ? `晚了一步：<b>${byZh}</b>在 ${t} 先${text}。这里不用再点了。` : `<b>你</b>在 ${t} ${text}。已记下。`}</span></div>`;
}
function renderAskPanel(){
  const view = asks.get(openAskId);
  if (!view) { closeAskPanel(); return; }
  const closed = view.closed;
  const head = `<div class="ask-head"><div><div class="ask-title" id="ask-title" tabindex="-1">${esc(view.task || view.label || '')} ${view.kind === 'question' ? '在问' : '要权限'}</div><div class="ask-role">${esc(view.label || '')}</div></div><span class="pill you">${closed ? '已关闭' : (view.kind === 'question' ? '等你回答' : '等你批')}</span><button class="x" type="button" data-close aria-label="收起（不回答）">✕</button></div>`;
  const why = closed ? '' : askWhyLine(view);
  const body = closed ? '' : (view.kind === 'question' ? askQuestionBody(view) : askPermissionBody(view));
  const closedHtml = closed ? askClosedLine(view) : '';
  const foot = closed ? '' : `<p class="foot">终端里也能答，先答的算。</p>`;
  $('#ask').innerHTML = head + why + closedHtml + body + foot;
  const form = $('#qform');
  if (form) {
    const answers = () => view.questions.map((q, i) => {
      const on = form.querySelector(`input[name="q${i}"]:checked`);
      if (!on) return '';
      return on.hasAttribute('data-other') ? form.querySelector(`[data-text="${i}"]`).value.trim() : on.value;
    });
    const sync = () => { const send = $('#send'); if (send) send.disabled = answers().some(a => !a); };
    form.addEventListener('input', e => { if (e.target.matches('[data-text]')) { const radio = e.target.closest('.opt').querySelector('input[type=radio]'); radio.checked = true; } sync(); });
    form.addEventListener('change', sync);
    form.addEventListener('submit', e => {
      e.preventDefault();
      const a = answers(); if (a.some(x => !x)) return;
      const answersObj = {};
      view.questions.forEach((q, i) => { answersObj[q.question] = a[i]; });
      decide(view.id, { id: view.id, answers: answersObj });
    });
  }
  $('#ask').querySelectorAll('[data-verb]').forEach(btn => btn.addEventListener('click', () => {
    const reasonEl = $('#reason');
    const body = { id: view.id, verb: btn.dataset.verb };
    if (btn.dataset.verb === 'deny' && reasonEl && reasonEl.value.trim()) body.reason = reasonEl.value.trim();
    decide(view.id, body);
  }));
}
function showAskFailure(text){
  const root = $('#ask'); if (!root) return;
  let el = root.querySelector('.why.fail');
  if (!el) {
    el = document.createElement('div');
    el.className = 'why fail';
    const head = root.querySelector('.ask-head');
    if (head) head.insertAdjacentElement('afterend', el); else root.insertBefore(el, root.firstChild);
  }
  el.innerHTML = `<span>${esc(text)}</span>`;
}
function setAskControlsDisabled(on){
  const root = $('#ask'); if (!root) return;
  root.querySelectorAll('#send,[data-verb],input').forEach(el => { el.disabled = on; });
}
async function decide(id, body){
  setAskControlsDisabled(true);
  let res;
  try {
    res = await fetch('/api/decide', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-City-Token': TOKEN }, body: JSON.stringify(body) });
  } catch (e) {
    showAskFailure('没发出去（连不上城市服务器）。终端里还能答。');
    setAskControlsDisabled(false);
    return;
  }
  if (res.ok) {
    const view = asks.get(id);
    if (view && !view.closed) {
      view.closed = body.answers
        ? { by:'owner', verb:'answer', text: Object.values(body.answers).join('；'), reason:'', at: Date.now() }
        : { by:'owner', verb: body.verb, text:'', reason: body.reason || '', at: Date.now() };
    }
    if (openAskId === id) renderAskPanel();
    return;
  }
  if (res.status === 409) {
    const data = await res.json().catch(() => ({}));
    const view = asks.get(id);
    if (view && !view.closed) view.closed = { by: data.by || 'terminal', verb: 'closed', text: '', reason: '' };
    if (openAskId === id) renderAskPanel();
    return;
  }
  showAskFailure(`没发出去（${res.status}）。终端里还能答，可以再试一次。`);
  setAskControlsDisabled(false);
}
$('#ask').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeAskPanel(); });
$('#stats').addEventListener('click', e => {
  if (!e.target.closest('#next')) return;
  const a = oldestOpenAsk(); if (a) openAsk(a.id);
});
ovRoot.addEventListener('click', e => { const t = e.target.closest('[data-open]'); if (t) openAsk(t.getAttribute('data-open')); });

/* ---------- input ---------- */
function selectFrom(val){
  if (val === 'gov') selected = { t:'gov' };
  else if (val) selected = { t:'c', id:val };
  lastDetailKey = ''; lastRoster = ''; renderPanel(); needFrame = true;
}
$('#roster').addEventListener('pointerdown', e => { const r = e.target.closest('[data-sel]'); if (r) selectFrom(r.dataset.sel); });
$('#roster').addEventListener('click', e => { const r = e.target.closest('[data-sel]'); if (r && e.detail === 0) selectFrom(r.dataset.sel); });
$('#detail').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]'); if (!btn || !selected || selected.t !== 'c') return;
  const c = byId(selected.id); if (!c) return;
  if (btn.dataset.act === 'stuck') { const [q, a] = pick(QA); c.pendingAnswer = a; emit({ type:'stuck', id:c.id, question:q }); }
  if (btn.dataset.act === 'done') emit({ type:'done', id:c.id });
  if (btn.dataset.act === 'leave') emit({ type:'leave', id:c.id });
  lastDetailKey = ''; renderPanel();
});
if (DEMO) {
  $('#spawn').addEventListener('click', () => { const c = spawnDemo($('#role').value); if (c) { selected = { t:'c', id:c.id }; lastDetailKey = ''; renderPanel(); } });
} else {
  $('#spawn-group').hidden = true;
  $('#proto').textContent = '实时 · 等服务器';
}
function connectLive(){
  const chip = $('#proto');
  let everOpen = false;
  const es = new EventSource('/events');
  es.onopen = () => { everOpen = true; chip.textContent = '实时 · 已连接'; };
  es.onerror = () => { chip.textContent = everOpen ? '实时 · 重连中…' : '实时 · 等服务器'; };
  es.onmessage = e => {
    let ev;
    try { ev = JSON.parse(e.data); } catch (err) { return; }
    apply(ev);
    needFrame = true;
  };
}
let lastTouch = -Infinity;
const camChanged = () => { needFrame = true; lastTouch = performance.now(); };
/* zoomStep(k): k = +1 zooms out, -1 zooms in; a big enough step that a handful reach distMax() on any land */
function zoomStep(k){ cam.dist = clamp(cam.dist * Math.pow(1.8, k), DIST_MIN, distMax()); camChanged(); }
$('#zin').addEventListener('click', () => zoomStep(-1));
$('#zout').addEventListener('click', () => zoomStep(1));
$('#rot').addEventListener('click', () => { camTween = { from: cam.az, to: cam.az - Math.PI / 2, t: 0 }; camChanged(); });
$('#zfit').addEventListener('click', () => { resetCam(); camChanged(); });
let camTween = null;

const pointers = new Map();
let drag = null, pinch = null;
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pickAt(px, py){
  ndc.set(px / W * 2 - 1, -(py / H) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, true);
  for (const h of hits) {
    let o = h.object;
    while (o && !o.userData.pick) o = o.parent;
    if (!o) continue;
    const pk = o.userData.pick;
    if (pk.t === 'b') { const b = buildings.find(x => x.id === pk.id); const owner = b && byId(b.ownerId); return owner ? { t:'c', id:owner.id } : pk; }
    return pk;
  }
  return null;
}
canvas.addEventListener('pointerdown', e => {
  lastTouch = performance.now();
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 1) drag = { x:e.clientX, y:e.clientY, moved:false, pan: e.button === 2 || e.shiftKey };
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.dist, mx:(a.x + b.x) / 2, my:(a.y + b.y) / 2 }; drag = null; }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
function panBy(dx, dy){
  const k = 2 * cam.dist * Math.tan(FOV * Math.PI / 360) / H;
  const s = Math.sin(cam.az), c = Math.cos(cam.az);
  const f = 1 / Math.sin(cam.el);
  cam.tx = clamp(cam.tx - (dx * c - dy * s * f) * k, -land.hx, land.hx);
  cam.tz = clamp(cam.tz - (-dx * s - dy * c * f) * k, -land.hz, land.hz);
}
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    cam.dist = clamp(pinch.z * Math.max(20, pinch.d) / Math.max(20, d), DIST_MIN, distMax());
    panBy(mx - pinch.mx, my - pinch.my); pinch.mx = mx; pinch.my = my;
    camChanged(); return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 6) return;
  drag.moved = true; canvas.classList.add('grabbing');
  if (drag.pan) panBy(dx, dy);
  else { const out = cam.dist >= distMax() - .01; cam.az -= dx * .008; cam.el = clamp(cam.el + dy * .005, EL_MIN, EL_MAX); if (out) cam.dist = distMax(); }
  drag.x = e.clientX; drag.y = e.clientY;
  camChanged();
});
function endPointer(e){
  const wasTap = drag && !drag.moved && pointers.size === 1;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (wasTap && e.type === 'pointerup') {
    const r = canvas.getBoundingClientRect();
    selected = pickAt(e.clientX - r.left, e.clientY - r.top);
    lastDetailKey = ''; lastRoster = ''; renderPanel(); needFrame = true;
  }
  if (!pointers.size) { drag = null; canvas.classList.remove('grabbing'); }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.dist = clamp(cam.dist * (e.deltaY < 0 ? 1 / 1.1 : 1.1), DIST_MIN, distMax()); camChanged(); }, { passive:false });

/* ---------- opening scene: a city mid-day, not an empty land (Growth: DEMO_WORLD already has some grown territories) ---------- */
function seed(){
  govTerr = (map.territories && map.territories[0] && map.territories[0].id) || null;
  updateHome();
  for (const role of ['worker', 'task-manager', 'fast-lane-deputy', 'worker']) spawnDemo(role);
}

/* ---------- boot: load the ready-made models, then run at a capped frame rate ---------- */
let lastSim = performance.now(), lastDraw = 0, panelT = 0;
function busy(){
  if (drag && drag.moved || pinch || camTween || autoRotating(performance.now())) return true;
  if (floaters.length) return true;
  return citizens.some(c => c.path.length || c.state === 'building' || c.state === 'spawn' || c.state === 'asking');
}
function autoRotating(now){ return !RM && !drag && !pinch && !camTween && now - lastTouch >= AUTO_ROT_IDLE_MS; }
function autoRotate(now, dt){
  if (autoRotating(now)) cam.az -= dt * Math.PI * 2 / AUTO_ROT_SEC;
}
function frame(now){
  requestAnimationFrame(frame);
  if (document.hidden) { lastSim = now; return; }
  const interval = busy() || needFrame ? FRAME_MS : IDLE_FRAME_MS;
  if (now - lastDraw < interval - 2) return;
  const raw = Math.min(.1, (now - lastSim) / 1000);
  lastSim = now; lastDraw = now; needFrame = false;
  const before = new Set(citizens);
  for (let dt = raw; dt > 0; dt -= .05) update(Math.min(dt, .05));
  for (const c of before) if (!citizens.includes(c)) goneOv.push(c);
  autoRotate(now, raw);
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + raw * 2.2);
    const e = camTween.t < .5 ? 2 * camTween.t * camTween.t : 1 - Math.pow(-2 * camTween.t + 2, 2) / 2;
    cam.az = camTween.from + (camTween.to - camTween.from) * e;
    if (camTween.t >= 1) camTween = null;
  }
  applyTheme();
  updateCamera();
  applyFade(viewBlockers(cam.el + camLiftNow));
  sync(simT, raw);
  renderer.render(scene, camera);
  panelT += raw;
  if (panelT > .25) { panelT = 0; renderPanel(); }
}
resize(); resetCam(); updateCamera();
Promise.all([
  loadAll((n, total) => { $('#loading-text').textContent = `正在搬来素材 ${n}/${total}`; }),
  ...['suburban/Textures/variation-a.png', 'suburban/Textures/variation-b.png', 'suburban/Textures/variation-c.png'].map(loadTex),
]).then(([, ...tex]) => {
  tex.forEach(t => { if (t) variations.push(t); });
  if (DEMO) buildLand(DEMO_WORLD);
  makeGovernor(); buildLife();
  if (DEMO) seed(); else connectLive();
  $('#loading').hidden = true;
  new ResizeObserver(() => resize()).observe(stage);
  applyTheme(); updateCamera(); sync(0, 0); renderer.render(scene, camera); renderPanel();
  requestAnimationFrame(frame);
}).catch(err => { $('#loading-text').textContent = '素材没加载成功：' + ((err && err.message) || err); });
})();
