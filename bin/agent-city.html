     c.office) gets a form; a subagent (c.lead) is read only, with a way to its lead's window. The
     #chat list itself is always filled by the per-call refresh below (chatScroll keeps its place, or
     starts a freshly opened one at the bottom) -- this only frames it: the empty ol, the newmsg chip,
     the send error hint, then the form or the read-only hint. */
  function chatSectionHtml(to){
    const box = chats.get(to) || { entries: [], busy: false, canSend: true };
    const isSession = to.slice(0, 4) === 'gov:' || to.slice(0, 2) === 's:';
    const failText = chatFailText(to, box);
    let html = `<ol class="chat" id="chat"></ol>`;
    html += `<button type="button" class="newmsg" id="newmsg" hidden>${i18n('chat.new')}</button>`;
    html += `<p class="hint chat-fail" id="chat-fail"${failText ? '' : ' hidden'}>${esc(failText)}</p>`;
    if (!isSession) {
      const oc = byId(to), leadC = oc && oc.lead ? byId(oc.lead) : null;
      const leadBtn = leadC ? `<p><button class="btn" type="button" data-sel="${leadC.id}">${i18n('btn.findLead', { name: esc(nameOf(leadC)) })}</button></p>` : '';
      return html + `<p class="hint">${i18n('hint.readOnlySub')}</p>` + leadBtn;
    }
    if (box.canSend === false) return html;
    return html + `<form class="say" id="say"><textarea id="say-text" maxlength="4000" placeholder="${i18n('placeholder.saySomething')}"></textarea><button class="btn say-send" type="submit" aria-label="${i18n('btn.send')}" title="${i18n('btn.send')}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg></button></form>`;
  }
  /* city-polish C2: the one small toggle in the history's title line (#hist-all); the refresh at the end
     of this function sets its text, its hidden state and aria-pressed on every call. */
  function histBtnHtml(){
    return `<button type="button" class="hist-all" id="hist-all" aria-pressed="${histAll}" hidden></button>`;
  }
  let rebuilt = false;
  if (key !== lastDetailKey) {
    lastDetailKey = key;
    rebuilt = true;
    if (c && c.remote) {
      // city-join: view only -- who, device, repo, branch, what it is doing, its own history
      // (spawn/done/leave -- U10), remoteNote(); never an answer, allow or deny button, never a
      // reply box (requirements/city.md, Joining).
      const name = memberLabel(c.remote.who, c.remote.device);
      const [rg, rzh] = citizenStatus(c, governorCount);
      el.innerHTML = `
        <div class="p-head">
          <span class="rdot" style="--c:${c.color}"></span>
          <div class="p-main"><div class="p-name">${esc(name)}</div><div class="p-facts"><code>${esc(c.remote.rid)}</code> · <code>${esc(c.remote.br)}</code> · ${esc(c.task)}</div></div>
          <span class="pill ${rg}">${rzh}</span>
        </div>
        <p class="hint hist-h">${i18n('hist.title')}</p>
        <ol class="chat">${historyHtml(personHistory(c, []), name, false)}</ol>
        <p class="why">${esc(remoteNote(name))}</p>`;
    } else if (c) {
      const [g, zh] = citizenStatus(c, governorCount);
      const facts = esc(factsLine(c)); // city-polish P3: the repo once, the task only when the name does not hold it
      const canStuck = !c.doneFlag && !c.stuck && ['building','to_plot','back'].includes(c.state);
      const chain = chainLine(c);
      el.innerHTML = `
        <div class="p-head">
          <span class="rdot" style="--c:${c.color}"></span>
          <div class="p-main"><div class="p-name">${esc(nameOf(c))}</div><div class="p-facts">${facts}</div></div>
          <span class="pill ${g}">${zh}</span>
          <div class="track p-bar"><i style="width:${pct(c)}%;background:${c.color}"></i></div>
        </div>
        ${chain ? `<p class="hint chain">${chain}</p>` : ''}
        ${DEMO ? `
        <div class="d-actions">
          <button class="btn" type="button" data-act="stuck" ${canStuck ? '' : 'disabled'}>${i18n('act.makeStuck')}</button>
          <button class="btn" type="button" data-act="done" ${c.doneFlag ? 'disabled' : ''}>${i18n('act.makeDone')}</button>
          <button class="btn" type="button" data-act="leave" ${c.state === 'resting' && !c.leaveFlag ? '' : 'disabled'}>${i18n('act.makeLeave')}</button>
        </div>
        <p class="d-note">${i18n('act.demoNote')}</p>` : ''}
        ${chatTo ? `<p class="hint hist-h">${i18n('hist.title')}${histBtnHtml()}</p>${chatSectionHtml(chatTo)}` : ''}`;
    } else if (selected && selected.t === 'rg') {
      const rg = remoteGovs.get(selected.id);
      el.innerHTML = `
        <div class="d-head"><span class="rdot gov"></span><div><div class="d-name">${esc(govSign(rg))}</div><div class="d-role">${i18n('gov.rgRole')}</div></div><span class="pill gov">${i18n('pill.hall')}</span></div>
        <div class="why">${esc(remoteNote(memberName(rg.who, rg.device)))}</div>`;
    } else if (b) {
      // U13: the building card's head only -- buildingName(b) and one line with the type word and its
      // district (the 3D look of a building does not change; no quality pill, no level, no files list,
      // no builders list here any more).
      const name = buildingName(b), kind = i18n('type.' + b.type) || b.type, district = i18n('building.district', { kind });
      const roleLine = name === kind ? district : `${kind} · ${district}`;
      el.innerHTML = `
        <div class="d-head"><span class="rdot" style="--c:${b.color}"></span><div><div class="d-name">${esc(name)}</div><div class="d-role">${roleLine}</div></div></div>
        <button type="button" class="btn b-focus" data-focus-b="${b.id}">${i18n('b.focus')}</button>`;
    } else if (selected && selected.t === 'gov') {
      const terr = selected.terr || govTerr, present = !!governorAt(terr);
      const terrRec = terrOf(terr), repoName = terrRec ? terrRec.name : '';
      el.innerHTML = `
        <div class="p-head">
          <span class="rdot gov"></span>
          <div class="p-main"><div class="p-name">${i18n('who.governor')}</div><div class="p-facts">${esc(repoName)} · ${i18n('gov.ownTag')}</div></div>
          <span class="pill ${govRowStatus(terr)[0]}">${govRowStatus(terr)[1]}</span>
          ${!present ? `<p class="hint p-note">${esc(i18n('gov.awayNote'))}</p>` : ''}
        </div>
        ${chatTo ? `<p class="hint hist-h">${i18n('hist.title')}${histBtnHtml()}</p>${chatSectionHtml(chatTo)}` : ''}`;
    } else if (!DEMO && citizens.length === 0) {
      el.innerHTML = `<p class="hint">${i18n('hint.noAgents')}</p>`;
    } else {
      el.innerHTML = `<p class="hint">${i18n('hint.pickSomething')}</p>`;
    }
    // U8: a freshly built card wires its own newmsg chip once: a click scrolls to the bottom and
    // hides it, and it hides again once the owner scrolls back within CHAT_STICK_PX of the bottom.
    // A rebuild of the SAME chat target keeps the chip showing if it already was (never re-hidden
    // just because the card was rebuilt).
    const freshOl = el.querySelector('#chat'), freshChip = el.querySelector('#newmsg');
    if (freshOl && freshChip) {
      if (savedChat && savedChat.to === chatTo && savedChat.chip) freshChip.hidden = false;
      freshChip.addEventListener('click', () => { freshOl.scrollTop = freshOl.scrollHeight; freshChip.hidden = true; });
      freshOl.addEventListener('scroll', () => {
        if (freshOl.scrollHeight - freshOl.scrollTop - freshOl.clientHeight <= CHAT_STICK_PX) freshChip.hidden = true;
      });
    }
  }
  lastChatTo = chatTo;
  // city-work-anim: the status word changes with every work step, so the open person's pill is
  // refreshed on every call (text and class, only when changed) -- never by rebuilding the card.
  if (c && selected && selected.t === 'c') {
    const pill = el.querySelector('.p-head .pill');
    if (pill) {
      const [pg, pzh] = citizenStatus(c, governorCount), pcls = 'pill ' + pg;
      if (pill.className !== pcls) pill.className = pcls;
      if (pill.textContent !== pzh) pill.textContent = pzh;
    }
  }
  if (c && !c.remote && selected && selected.t === 'c') {
    const bar = el.querySelector('.p-bar i'); if (bar) bar.style.width = pct(c) + '%';
  }
  if (chatTo) {
    // U8: chatScroll() decides the scroll position both when the log only refreshes (prev = the live
    // DOM state) and when the whole card was just rebuilt (prev = the state saved above, when the
    // rebuild kept the same chat target -- a different target starts at the bottom, prev null) --
    // never an unconditional jump to the bottom. res.chip only ever SHOWS the chip: it hides only on
    // its own click, or when the owner scrolls back within CHAT_STICK_PX of the bottom (both wired
    // once per fresh card above), or a different chat target is opened (a fresh, hidden chip).
    const box = chats.get(chatTo) || { entries: [], busy: false, canSend: true };
    // city-polish C2: the list shows the main messages, or every item while histAll is on; the toggle
    // (#hist-all, in the title line) says how many are hidden. Nothing main yet but something hidden ->
    // one line that says so, not "nothing yet".
    const isGov = !!(selected && selected.t === 'gov');
    const all = isGov ? markMain(box.entries, false) : personHistory(c, box.entries);
    const shown = histAll ? all : mainOnly(all);
    const hiddenN = all.length - mainOnly(all).length;
    let listHtml;
    if (!shown.length && hiddenN) listHtml = `<li class="msg-empty">${i18n('hist.onlyMech')}</li>`;
    else listHtml = isGov ? chatHtml(shown, chatName, box.busy) : historyHtml(shown, chatName, box.busy);
    const histBtn = el.querySelector('#hist-all');
    if (histBtn) {
      const label = histAll ? i18n('hist.hide') : i18n('hist.all', { n: hiddenN });
      if (histBtn.textContent !== label) histBtn.textContent = label;
      histBtn.hidden = !histAll && !hiddenN;
      histBtn.setAttribute('aria-pressed', String(histAll));
    }
    const ol = el.querySelector('#chat');
    if (ol) {
      const prev = !rebuilt ? { top: ol.scrollTop, height: ol.scrollHeight, client: ol.clientHeight }
        : (savedChat && savedChat.to === chatTo ? { top: savedChat.top, height: savedChat.height, client: savedChat.client } : null);
      if (ol.innerHTML !== listHtml) ol.innerHTML = listHtml;
      const next = { height: ol.scrollHeight, client: ol.clientHeight };
      const res = chatScroll(prev, next);
      ol.scrollTop = res.top;
      const chip = el.querySelector('#newmsg');
      if (chip && res.chip) chip.hidden = false;
    }
    const fail = el.querySelector('#chat-fail');
    if (fail) { const failText = chatFailText(chatTo, box); fail.hidden = !failText; if (fail.textContent !== failText) fail.textContent = failText; }
  }
}
function renderLog(){
  if (!dirty.log) return; dirty.log = false;
  $('#log').innerHTML = logEntries.map(e => `<li><time>${e.real ? new Date(e.real).toTimeString().slice(0, 8) : clock(e.t)}</time><span class="${e.kind}">${esc(e.text)}</span></li>`).join('');
}

/* ---------- rail: the compact, collapsible team list, left (V1) ---------- */
function readStoredBool(key, dflt){
  try { const v = localStorage.getItem(key); return v === null ? dflt : v === '1'; } catch (e) { return dflt; }
}
function writeStoredBool(key, v){ try { localStorage.setItem(key, v ? '1' : '0'); } catch (e) {} }
let railClosed = new Set();
try {
  const savedClosed = localStorage.getItem('agent-city.railClosed');
  if (savedClosed) railClosed = new Set(savedClosed.split(',').filter(Boolean));
} catch (e) {}
function saveRailClosed(){ try { localStorage.setItem('agent-city.railClosed', [...railClosed].join(',')); } catch (e) {} }
let railRestOpen = new Set();
// a phone with nothing saved starts with the rail folded; a computer starts with it open.
let railFolded = readStoredBool('agent-city.railFolded', matchMedia('(max-width: 960px)').matches);
function setRailFolded(v){
  railFolded = v;
  writeStoredBool('agent-city.railFolded', v);
  renderRail();
}
let lastRail = '';
/* renderRail(): #rail-list from railGroups()/railHtml() (only touches the DOM when the html actually
   changed, through lastRail); #rail-n / #rail-you (+ the tab's own badges) from railCount(); #rail /
   #rail-tab show by railFolded, both hidden when railGroups() is empty. On a phone, the rail unfolded is
   the drawer open -- the stage gets .drawer-open while it covers the win/ask panels. renderPanel() calls
   this. */
function renderRail(){
  const groups = railGroups();
  const html = railHtml(groups, selKey(selected), railClosed, railRestOpen, addState);
  if (html !== lastRail) { lastRail = html; $('#rail-list').innerHTML = html; }
  const counts = railCount(groups);
  $('#rail-n').textContent = i18n('rail.count', { n: counts.active });
  $('#rail-you').hidden = !counts.you;
  $('#rail-you').textContent = counts.you;
  $('#rail-tab-t').textContent = i18n('rail.tab', { n: counts.active });
  $('#rail-tab-you').hidden = !counts.you;
  $('#rail-tab-you').textContent = counts.you;
  const has = groups.length > 0, shown = has && !railFolded;
  $('#rail').hidden = !shown;
  $('#rail-tab').hidden = !(has && railFolded);
  stage.classList.toggle('drawer-open', shown && matchMedia('(max-width: 960px)').matches);
}
/* city-add-agent A2/A4: addAgent(terr, force) -- the "add agent" button of one repo group. Nothing while
   that repo already reads "opening" (one open at a time per repo); else the button reads opening at
   once, then POST /api/agent/add {terr, force} (force: true only from the over-the-limit confirm) and
   addAnswer() turns the answer into the button's next state. A failed request (no answer at all) shows
   an error line too, a broken or empty body counts as {}; the rail is redrawn after every answer. The
   server's 'adding' events (opening / done / late) move the same state on from there. */
function addAgent(terr, force){
  const was = addState.get(terr);
  if (was && was.s === 'opening') return;
  addState.set(terr, { s: 'opening', name: '' });
  renderRail();
  fetch('/api/agent/add', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-City-Token': TOKEN }, body: JSON.stringify({ terr, force }) })
    .then(r => r.json().catch(() => ({})).then(body => addAnswer(terr, r.status, body)))
    .catch(() => addAnswer(terr, 0, {}))
    .then(() => renderRail());
}
$('#rail-list').addEventListener('click', e => {
  const addBtn = e.target.closest('[data-add]');
  if (addBtn) { addAgent(addBtn.dataset.add, false); return; }
  const goBtn = e.target.closest('[data-add-go]');
  if (goBtn) { addAgent(goBtn.dataset.addGo, true); return; }
  const noBtn = e.target.closest('[data-add-no]');
  if (noBtn) { addState.delete(noBtn.dataset.addNo); renderRail(); return; }
  const copyBtn = e.target.closest('[data-add-copy]');
  if (copyBtn) {
    const st = addState.get(copyBtn.dataset.addCopy);
    if (!st) return;
    try { navigator.clipboard.writeText(st.cmd).catch(() => {}); } catch (err) {}
    st.copied = true; renderRail();
    return;
  }
  const grp = e.target.closest('[data-grp]');
  if (grp) {
    const terr = grp.dataset.grp;
    if (railClosed.has(terr)) railClosed.delete(terr); else railClosed.add(terr);
    saveRailClosed();
    lastRail = ''; renderRail();
    return;
  }
  const rest = e.target.closest('[data-rest]');
  if (rest) {
    const terr = rest.dataset.rest;
    if (railRestOpen.has(terr)) railRestOpen.delete(terr); else railRestOpen.add(terr);
    lastRail = ''; renderRail();
    return;
  }
  const row = e.target.closest('[data-focus]');
  if (row) selectFrom(row.dataset.focus);
});
$('#rail-fold').addEventListener('click', () => { setRailFolded(true); $('#rail-tab').focus(); });
$('#rail-tab').addEventListener('click', () => setRailFolded(false));
/* renderFollow(): the "Following <name>" chip, top middle of the free part of the map -- shown only
   while following; left = freeCentre()'s own x (the chip itself is translateX(-50%)); touches the DOM
   only on change. frame() calls this every frame (not throttled like renderPanel: the chip tracks the
   map's own free middle, eased every frame in updateCamera()). */
let lastFollowKey = '';
function renderFollow(){
  const el = $('#follow');
  if (!follow) {
    if (lastFollowKey) { el.hidden = true; lastFollowKey = ''; }
    return;
  }
  let name;
  if (follow.slice(0, 4) === 'gov:') {
    const terrRec = terrOf(follow.slice(4));
    name = i18n('who.governor') + ' · ' + (terrRec ? terrRec.name : '');
  } else {
    const c = byId(follow);
    name = c ? nameOf(c) : '';
  }
  const centre = freeCentre(W, H, railBoxNow, winBoxNow);
  const left = Math.round(centre[0]);
  const key = follow + '|' + name + '|' + left;
  if (key === lastFollowKey) return;

function renderPanel(){ renderRail(); renderStats(); renderDetail(); renderLog(); renderWin(); }

/* ---------- window: the person / building / governor detail, or the page log (动态) -- V1 (city-ux2
   v2, owner 2026-09-29): a right-docked message panel, one person's own (requirements/city.md, Look,
   owner 2026-09-27: replaces the right column of cards; U11's team window is gone -- the rail is the
   team list now). ---------- */
let winLog = false;
/* winState() -> 'log' while winLog, 'detail' once something is selected, else null (window closed, only
   the city shows). */
function winState(){ return winLog ? 'log' : (selected ? 'detail' : null); }
function openLog(){ winLog = true; selected = null; renderPanel(); }
function closeWin(){ winLog = false; selected = null; renderPanel(); }
/* winTitle() -> a short label for the open window, whatever renderDetail() is showing right now -- V1
   (city-ux2 v2): the panel is one person's own, so its title IS that person -- nameOf(c) for a local
   citizen, its member label for a remote one, i18n('who.governor') for the governor (city-polish P3:
   its repo shows in the subtitle) -- never a team title any more. A building/site/log stay as they were. */
function winTitle(){
  if (!selected) return i18n('detail.title');
  if (selected.t === 'c') {
    const c = byId(selected.id); if (!c) return i18n('detail.title');
    return c.remote ? memberLabel(c.remote.who, c.remote.device) : nameOf(c);
  }
  if (selected.t === 'b') { const b = buildings.find(x => x.id === selected.id); if (!b) return i18n('detail.title'); const info = buildingInfo(b); return info.name || i18n('type.' + b.type) || b.type; }
  if (selected.t === 'gov') return i18n('who.governor'); // city-polish P3: the repo is in the subtitle, never twice
  if (selected.t === 'rg') { const rg = remoteGovs.get(selected.id); return rg ? govSign(rg) : i18n('who.governor'); }
  return i18n('detail.title');
}
/* V1 (city-ux2 v2): the panel folds to a thin tab on its own right edge, exactly like the rail
   (#rail-fold/#rail-tab/setRailFolded) -- setWinFolded(v) sets the state, remembers it (localStorage
   'agent-city.winFolded'), and redraws; the page reads it back at start, below. Folding also remembers
   how many conversation entries were showing (winFoldBase), so the tab can badge how many are new since
   -- winEntryCount() is only ever used for that badge. */
let winFolded = readStoredBool('agent-city.winFolded', false);
let winFoldBase = 0;
/* city-polish C2: the "show the steps" toggle of the history (#hist-all), remembered like the fold;
   setHistAll(v) redraws the panel -- renderDetail's per-call refresh rebuilds the list and the button
   in place (no card rebuild, so the button keeps its focus and the scroll place is kept). */
let histAll = readStoredBool('agent-city.histAll', false);
function setHistAll(v){
  histAll = v;
  writeStoredBool('agent-city.histAll', v);
  renderPanel();
}
/* the badge counts what the list would show: the main messages, or everything while histAll is on (a
   remote person's list has no toggle, it shows all). */
function winEntryCount(){
  if (!selected) return 0;
  if (selected.t === 'c') {
    const c = byId(selected.id); if (!c) return 0;
    const to = curChatTo(), box = to ? chats.get(to) : null;
    const items = personHistory(c, box ? box.entries : []);
    return (histAll || c.remote ? items : mainOnly(items)).length;
  }
  if (selected.t === 'gov') {
    const to = curChatTo(); if (!to) return 0;
    const box = chats.get(to);
    if (!box) return 0;
    const items = markMain(box.entries, false);
    return (histAll ? items : mainOnly(items)).length;
  }
  return 0;
}
function setWinFolded(v){
  if (v) winFoldBase = winEntryCount();
  winFolded = v;
  writeStoredBool('agent-city.winFolded', v);
  renderWin();
}
/* renderWin(): shows #win or #win-tab by winFolded (both hidden once nothing is open); .short (bottom:
   auto) on a building/site/remote-governor card, which never grows to fill the panel; the tab's own
   text/badge stay current either way, so it is right the moment it appears. .cam (the zoom buttons)
   moves left of whichever of #win/#win-tab actually shows, through the win-open/win-tab-open classes on
   .stage. */
function renderWin(){
  const state = winState();
  const shown = !!state && !winFolded, tabShown = !!state && winFolded;
  $('#win').hidden = !shown;
  $('#win').classList.toggle('short', state === 'detail' && !!(selected && (selected.t === 'b' || selected.t === 'rg')));
  $('#detail').hidden = state !== 'detail';
  $('#log').hidden = state !== 'log';
  const title = state === 'log' ? i18n('btn.log') : winTitle();
  $('#win-title').textContent = title;
  $('#win-tab').hidden = !tabShown;
  $('#win-tab-t').textContent = i18n('msg.tab', { name: title });
  const fresh = Math.max(0, winEntryCount() - winFoldBase);
  $('#win-tab-n').hidden = !fresh;
  $('#win-tab-n').textContent = fresh;
  stage.classList.toggle('win-open', shown);
  stage.classList.toggle('win-tab-open', tabShown);
}
$('#win-close').addEventListener('click', () => closeWin());
$('#win-fold').addEventListener('click', () => { setWinFolded(true); $('#win-tab').focus(); });
$('#win-tab').addEventListener('click', () => setWinFolded(false));
$('#logbtn').addEventListener('click', () => openLog());

/* ---------- ask panel: the "?" — questions and permission requests from
   the live city (requirements/city.md, Interaction) ---------- */
function openAsk(id){

/* idea-city C1: routes through i18n() (why.*). */
function askWhyLine(view){
  if (view.kind === 'permission') return `<div class="why">${i18n('why.permission')}</div>`;
  if (view.agent === 'gov') return `<div class="why gov">${i18n('why.gov')}</div>`;
  if (view.why === 'timeout') return `<div class="why gov">${i18n('why.timeout', { wait: view.wait })}</div>`;
  if (view.why === 'pass') return `<div class="why gov">${i18n('why.pass')}</div>`;
  return `<div class="why gov">${i18n('why.noGov')}</div>`;
}
function askQuestionBody(view){
  const qs = view.questions || [];
  return `<form id="qform" class="perm" novalidate>` + qs.map((q, i) => `
    <fieldset class="q"><legend>${q.header ? `<span class="chip">${esc(q.header)}</span>` : ''}${esc(q.question || '')}</legend>
      ${(q.options || []).map(o => `<label class="opt"><input type="radio" name="q${i}" value="${esc(o.label)}"><span><b>${esc(o.label)}</b>${o.description ? `<small>${esc(o.description)}</small>` : ''}</span></label>`).join('')}
      <label class="opt"><input type="radio" name="q${i}" value="" data-other><span><b>${i18n('opt.other')}</b><input type="text" data-text="${i}" placeholder="${i18n('opt.customAnswer')}" aria-label="${i18n('opt.customAnswer')}"></span></label>
    </fieldset>`).join('') + `<div class="acts"><button class="btn primary" type="submit" id="send" disabled>${i18n('btn.sendAnswer')}</button></div></form>`;
}
function askPermissionBody(view){
  const d = view.detail || {};
  const main = d.command ? `<pre class="cmd">${esc(d.command)}</pre>`
    : d.file_path ? `<div class="kv"><span>${i18n('kv.file')}</span><code>${esc(d.file_path)}</code></div>`
    : d.url ? `<div class="kv"><span>${i18n('kv.url')}</span><code>${esc(d.url)}</code></div>`
    : (view.what ? `<pre class="cmd">${esc(view.what)}</pre>` : '');
  return `<div class="perm">
    <div class="kv"><span>${i18n('kv.tool')}</span><b>${esc(view.tool || '')}</b></div>
    ${main}
    ${d.description ? `<p class="said">${i18n('said', { text: esc(d.description) })}</p>` : ''}
    ${d.cwd ? `<div class="kv"><span>${i18n('kv.dir')}</span><code>${esc(d.cwd)}</code></div>` : ''}
    <label class="field" for="reason">${i18n('field.denyReason')}<input id="reason" type="text" placeholder="${i18n('field.denyPlaceholder')}"></label>
    <div class="acts"><button class="btn ok" type="button" data-verb="allow">${i18n('btn.allow')}</button><button class="btn no" type="button" data-verb="deny">${i18n('btn.deny')}</button></div>
  </div>`;
}
/* idea-city C1: routes through i18n() (closed.*, and TEXT's own who.* for the "who" table). */
function askClosedLine(view){
  const k = view.closed;
  const byName = { governor: i18n('who.governor'), owner: i18n('who.owner'), terminal: i18n('who.terminal') }[k.by] || k.by;
  const at = new Date(k.at || Date.now()).toTimeString().slice(0, 8);
  const late = k.by !== 'owner';
  if (k.verb === 'closed') {
    // only taken off the table (terminal, or a 409 before the real facts
    // arrive by SSE) — never say it was approved, denied or answered.
    return late
      ? `<div class="closed late"><span>${i18n('closed.late', { who: byName, time: at })}</span></div>`
      : `<div class="closed"><span>${i18n('closed.pending', { time: at })}</span></div>`;
  }
  const text = view.kind === 'question'
    ? (k.text ? i18n('closed.answeredText', { text: esc(k.text) }) : i18n('answer.default'))
    : (k.verb === 'allow' ? i18n('closed.allowedText')
      : i18n('closed.deniedText') + (k.reason ? i18n('closed.deniedReason', { reason: esc(k.reason) }) : ''));
  return `<div class="closed ${late ? 'late' : (k.verb === 'deny' ? 'no' : '')}"><span>${late
    ? i18n('closed.lateFull', { who: byName, time: at, text })
    : i18n('closed.doneByYou', { who: byName, time: at, text })}</span></div>`;
}
function renderAskPanel(){
  const view = asks.get(openAskId);
  if (!view) { closeAskPanel(); return; }
  const closed = view.closed;
  const head = `<div class="ask-head"><div><div class="ask-title" id="ask-title" tabindex="-1">${esc(askName(view))} ${view.kind === 'question' ? i18n('ask.asking') : i18n('ask.needsPermission')}</div><div class="ask-role">${esc(view.label || '')}</div></div><span class="pill you">${closed ? i18n('pill.closed') : (view.kind === 'question' ? i18n('status.waiting_answer') : i18n('status.need_approval'))}</span><button class="x" type="button" data-close aria-label="${i18n('aria.collapse')}">✕</button></div>`;
  const why = closed ? '' : askWhyLine(view);
  const body = closed ? '' : (view.kind === 'question' ? askQuestionBody(view) : askPermissionBody(view));
  const closedHtml = closed ? askClosedLine(view) : '';
  const foot = closed ? '' : `<p class="foot">${i18n('foot.terminalAnswers')}</p>`;
  $('#ask').innerHTML = head + why + closedHtml + body + foot;
  const form = $('#qform');
  if (form) {
    const answers = () => view.questions.map((q, i) => {
      const on = form.querySelector(`input[name="q${i}"]:checked`);
      if (!on) return '';
      return on.hasAttribute('data-other') ? form.querySelector(`[data-text="${i}"]`).value.trim() : on.value;
    });
    const sync = () => { const send = $('#send'); if (send) send.disabled = answers().some(a => !a); };
    form.addEventListener('input', e => { if (e.target.matches('[data-text]')) { const radio = e.target.closest('.opt').querySelector('input[type=radio]'); radio.checked = true; } sync(); });
    form.addEventListener('change', sync);
    form.addEventListener('submit', e => {
      e.preventDefault();
      const a = answers(); if (a.some(x => !x)) return;
      const answersObj = {};
      view.questions.forEach((q, i) => { answersObj[q.question] = a[i]; });
      decide(view.id, { id: view.id, answers: answersObj });
    });
  }
  $('#ask').querySelectorAll('[data-verb]').forEach(btn => btn.addEventListener('click', () => {
    const reasonEl = $('#reason');
    const body = { id: view.id, verb: btn.dataset.verb };
    if (btn.dataset.verb === 'deny' && reasonEl && reasonEl.value.trim()) body.reason = reasonEl.value.trim();
    decide(view.id, body);
  }));
}
function showAskFailure(text){
  const root = $('#ask'); if (!root) return;
  let el = root.querySelector('.why.fail');
  if (!el) {
    el = document.createElement('div');
    el.className = 'why fail';
    const head = root.querySelector('.ask-head');
    if (head) head.insertAdjacentElement('afterend', el); else root.insertBefore(el, root.firstChild);
  }
  el.innerHTML = `<span>${esc(text)}</span>`;
}
function setAskControlsDisabled(on){
  const root = $('#ask'); if (!root) return;
  root.querySelectorAll('#send,[data-verb],input').forEach(el => { el.disabled = on; });
}
async function decide(id, body){
  setAskControlsDisabled(true);
  let res;
  try {
    res = await fetch('/api/decide', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-City-Token': TOKEN }, body: JSON.stringify(body) });
  } catch (e) {
    showAskFailure(i18n('err.decideNetwork'));
    setAskControlsDisabled(false);
    return;
  }
  if (res.ok) {
    const view = asks.get(id);
    if (view && !view.closed) {
      view.closed = body.answers
        ? { by:'owner', verb:'answer', text: Object.values(body.answers).join(i18n('punct.answerJoin')), reason:'', at: Date.now() }
        : { by:'owner', verb: body.verb, text:'', reason: body.reason || '', at: Date.now() };
      view.shownAt = performance.now(); // Result line then close: askAutoClose(frame's now) closes it ASK_CLOSE_MS later
    }
    if (openAskId === id) renderAskPanel();
    return;
  }
  if (res.status === 409) {
    const data = await res.json().catch(() => ({}));
    const view = asks.get(id);
    if (view && !view.closed) {
      view.closed = { by: data.by || 'terminal', verb: 'closed', text: '', reason: '' };
      view.shownAt = performance.now(); // someone else was first: the panel still auto-closes ASK_CLOSE_MS later
    }
    if (openAskId === id) renderAskPanel();
    return;
  }
  showAskFailure(i18n('err.decideStatus', { status: res.status }));
  setAskControlsDisabled(false);
}

/* V1 (city-ux2 v2): picking = following -- every way to pick a person (selectPick, selectFrom: a rail
   row, a head tag or bubble in the city, the find-lead button) calls this once `selected` is set (or
   cleared to null, for a tap on empty ground). A person or governor (selKey(selected) not null) ->
   toggleFollow(selKey(selected)) (so a second click on the followed person stops following without
   closing its panel); anything else -> stopFollow(). A real pick also re-opens the message panel even
   if it was folded, and folds the rail drawer away on a phone (the pick itself is why it was open). */
function afterPick(){
  const key = selKey(selected);
  if (key) toggleFollow(key); else stopFollow();
  if (selected) setWinFolded(false);
  if (matchMedia('(max-width: 960px)').matches) setRailFolded(true);
}
function selectFrom(val){
  if (val && val.slice(0, 4) === 'gov:') selected = { t:'gov', terr: val.slice(4) };
  else if (val === 'gov') selected = { t:'gov', terr: govTerr };
  else if (val && val.startsWith('rg:')) selected = { t:'rg', id: val.slice(3) };
  else if (val) selected = { t:'c', id:val };
  winLog = false;
  afterPick();
  lastDetailKey = ''; lastRoster = ''; renderPanel(); needFrame = true;
}
$('#detail').addEventListener('click', e => {

  if (e.target.closest('#hist-all')) { setHistAll(!histAll); return; }
  // V1 (city-ux2 v2): the building card's own "show it" button -- stopFollow() (a building is never
  // followed) then flyTo() its tile, never further out than the owner's own zoom (FOLLOW_DIST).
  const focusB = e.target.closest('[data-focus-b]');

    if (bld) { stopFollow(); flyTo(bld.gx + .5 - mid.x, bld.gy + .5 - mid.z, Math.min(cam.dist, FOLLOW_DIST)); }

let lastTouch = -Infinity;
const camChanged = () => { needFrame = true; lastTouch = performance.now(); };
/* U1: the zoom-out hint (approved mock v3) -- shown ~1.6s whenever a zoom-out was stopped by the
   limit, but never when the limit already shows the whole land (distLimit() == distMax(): nothing
   more to see past it, so nothing to hint about). */
let capHintTimer = null;
function capHint(){
  if (distLimit() >= distMax() - .01) return;
  const el = $('#cap-hint');
  if (!el) return;
  setText(el, i18n('cap.hint'));
  el.hidden = false;
  clearTimeout(capHintTimer);
  capHintTimer = setTimeout(() => { el.hidden = true; }, 1600);
}
/* zoomStep(k): k = +1 zooms out, -1 zooms in; a big enough step that a handful reach distMax() on any
   land -- U1: goes through capZoom() so it never zooms out past the zoom-out limit, showing capHint()
   when the limit stopped it. */
function zoomStep(k){
  stopFly();
  const want = cam.dist * Math.pow(1.8, k);
  const capped = capZoom(want, cam.dist, distLimit(), distMax());
  if (want > cam.dist && capped < want) capHint();
  cam.dist = capped;
  camChanged();
}
$('#zin').addEventListener('click', () => zoomStep(-1));
$('#zout').addEventListener('click', () => zoomStep(1));
$('#rot').addEventListener('click', () => { camTween = { from: cam.az, to: cam.az - Math.PI / 2, t: 0 }; camChanged(); });
$('#zfit').addEventListener('click', () => { stopFollow(); resetCam(); camChanged(); });
/* U1: click a repo tag to fly there -- "All" flies out to the whole land, a repo flies to a view of
   just that territory, never further out than the zoom-out limit. V1: every repo tag (All too) stops
   any follow. */
$('#repos').addEventListener('click', e => {
  const b = e.target.closest('.repo');
  if (!b) return;
  stopFollow();
  const terr = b.dataset.terr;
  if (terr === '*') { flyTo(land.cx || 0, land.cz || 0, distMax()); return; }
  const tag = repoTags(map).find(t => t.id === terr);
  if (!tag) return;
  flyTo(tag.x, tag.z, Math.min(spanDist((map && map.cell) || 26, W, H), distLimit()));
});

const pointers = new Map();
let drag = null, pinch = null;
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pickAt(px, py){
  ndc.set(px / W * 2 - 1, -(py / H) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, true);
  for (const h of hits) {
    let o = h.object;
    while (o && !o.userData.pick) o = o.parent;
    if (!o) continue;
    const pk = o.userData.pick;
    if (pk.t === 'b') { const b = buildings.find(x => x.id === pk.id); const owner = b && byId(b.ownerId); return owner ? { t:'c', id:owner.id } : pk; }
    return pk;
  }
  // U6: the ray hit no person or governor -- fall back to the nearest tag-sized hit area over
  // everyone's on-screen feet/body point.
  const cands = [];
  for (const c of citizens) {
    if (c.gone) continue;
    const [x, y] = toScreen(c.x, 0, c.y);
    cands.push({ pick: { t:'c', id: c.id }, x, y });
  }
  if (typeof governorFigures === 'function') for (const g of governorFigures()) {
    const [x, y] = toScreen(g.x, .9, g.y);
    cands.push({ pick: pickOfTag('gov', g.terr === govTerr ? '' : g.terr), x, y });
  }
  return nearestPick(px, py, cands, PICK_PX);
}
canvas.addEventListener('pointerdown', e => {
  lastTouch = performance.now();
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 1) drag = { x:e.clientX, y:e.clientY, moved:false, pan: e.button === 2 || e.shiftKey };
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.dist, mx:(a.x + b.x) / 2, my:(a.y + b.y) / 2 }; drag = null; }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
/* U1: panBy() stops any fly first (a pan is a real user camera control), and clamps the look point to
   the land box (missing cx/cz treated as 0) instead of the scene origin -- an off-centre land no longer
   lets the owner pan the view off the land. */
function panBy(dx, dy){
  stopFly();
  stopFollow(); // V1: a real drag/pan/wheel pan of the map stops any follow
  const [dtx, dtz] = panDelta(dx, dy, cam.az, cam.el, cam.dist, H);
  const cx = land.cx || 0, cz = land.cz || 0;
  cam.tx = clamp(cam.tx + dtx, cx - land.hx, cx + land.hx);
  cam.tz = clamp(cam.tz + dtz, cz - land.hz, cz + land.hz);
}
/* city-join: hover -- pointermove with no button down picks the person under the pointer (pickAt)
   into the top-level `hovered`, so tagVisible() can show that one person's name tag + device chip.
   Cheap: the raycast itself only runs at most every HOVER_MS, never on every mousemove. */
const HOVER_MS = 80;
let lastHoverAt = -Infinity;
function sameHit(a, b){ return a === b || !!(a && b && a.t === b.t && a.id === b.id); }
canvas.addEventListener('pointermove', e => {
  if (e.buttons === 0 && !pointers.size) {
    const now = performance.now();
    if (now - lastHoverAt >= HOVER_MS) {
      lastHoverAt = now;
      const r = canvas.getBoundingClientRect();
      const hit = pickAt(e.clientX - r.left, e.clientY - r.top);
      if (!sameHit(hit, hovered)) { hovered = hit; needFrame = true; }
    }
  }
  if (!pointers.has(e.pointerId)) return;
  if (e.buttons === 0) {
    // U2: the pointer is still tracked but no button is down any more -- end the press (no stuck drag).
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (!pointers.size) { drag = null; canvas.classList.remove('grabbing'); }
    return;
  }
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const want = pinch.z * Math.max(20, pinch.d) / Math.max(20, d);
    const capped = capZoom(want, cam.dist, distLimit(), distMax());
    if (want > cam.dist && capped < want) capHint();
    cam.dist = capped;
    panBy(mx - pinch.mx, my - pinch.my); pinch.mx = mx; pinch.my = my;
    camChanged(); return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && !isDrag(drag.x, drag.y, e.clientX, e.clientY)) return;
  drag.moved = true; canvas.classList.add('grabbing');
  if (drag.pan) panBy(dx, dy);
  else dragBy(dx, dy, distLimit());
  drag.x = e.clientX; drag.y = e.clientY;
  camChanged();
});
// U2: the same tracked-press cleanup when the browser takes pointer capture away from us.
canvas.addEventListener('lostpointercapture', e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) { drag = null; canvas.classList.remove('grabbing'); }
});
/* U6: selectPick(pk) is exactly what a tap on a person/governor does -- endPointer's tap branch and an
   #ov click on a [data-pick-t] tag both call it. */
function selectPick(pk){
  selected = pk;
  winLog = false;
  afterPick();
  lastDetailKey = ''; lastRoster = ''; renderPanel(); needFrame = true;
}
function endPointer(e){
  const wasTap = drag && !drag.moved && pointers.size === 1;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (wasTap && e.type === 'pointerup') {
    const r = canvas.getBoundingClientRect();
    selectPick(pickAt(e.clientX - r.left, e.clientY - r.top));
  }
  if (!pointers.size) { drag = null; canvas.classList.remove('grabbing'); }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
// U6: a tag/bubble takes pointer events now (CSS) -- moving onto one must not clear the hover (no flicker).
canvas.addEventListener('pointerleave', e => {
  if (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-pick-t]')) return;
  if (hovered) { hovered = null; needFrame = true; }
});
/* U3: one wheel listener, on the stage (not just the canvas, so a wheel over a head tag still pans);
   leaves wheels inside .win / .ask-panel / .rail alone (their own scroll). U1: zoom goes through
   capZoom(). */
stage.addEventListener('wheel', e => {
  if (e.target.closest('.win') || e.target.closest('.ask-panel') || e.target.closest('.rail')) return;
  e.preventDefault();
  stopFly();
  const m = wheelMove(e, H);
  if (m.pan) panBy(m.pan[0], m.pan[1]);
  else if (m.zoom) {
    const want = cam.dist * m.zoom;
    const capped = capZoom(want, cam.dist, distLimit(), distMax());
    if (want > cam.dist && capped < want) capHint();
    cam.dist = capped;
  }
  camChanged();
}, { passive:false });
/* U3: Safari's own pinch gesture (no ctrlKey wheel there). */
let gestureStartDist = null;
stage.addEventListener('gesturestart', e => { e.preventDefault(); stopFly(); gestureStartDist = cam.dist; });
stage.addEventListener('gesturechange', e => {
  e.preventDefault();
  if (gestureStartDist == null) gestureStartDist = cam.dist;
  const want = gestureStartDist / e.scale;
  const capped = capZoom(want, cam.dist, distLimit(), distMax());
  if (want > cam.dist && capped < want) capHint();
  cam.dist = capped;
  camChanged();
});

/* city-join demo (#demo, data-remote buttons in #spawn-group): fake other members, so the look
   can be checked without a relay (requirements/city.md, Joining). Every step goes through the same
   apply() a real relay would drive, using the exact event shapes tests/test_agent_city_relay_serve.py
   describes ("remote", "remote_snapshot", "team"). My own device here is mac-mini. */
const DEMO_RELAY_HOST = 'demo-team';
let demoQueued = 0, demoTickAcc = 0;
function seedDemoRemote(){
  const terr = govTerr;
  if (!terr) return;
  meInfo = { who: 'Maverick', device: 'mac-mini' };
  apply({ type: 'team', host: DEMO_RELAY_HOST, state: 'ok', queued: 0 });
  // city-join: pc2's who is blank on purpose (like a machine with no git user.name) so the demo

  apply({ type: 'remote', who: '', device: 'pc2', dev: 'dev-pc2', rid: 'acme/shop', br: 'main',
    ev: { type: 'gov', id: 'r:dev-pc2:gov', state: 'busy', terr, present: true } });
  apply({ type: 'remote', who: '', device: 'pc2', dev: 'dev-pc2', rid: 'acme/shop', br: 'test/checkout',
    ev: { type: 'spawn', id: 'r:dev-pc2:s:1', role: 'worker', label: 'worker', task: i18n('demo.task.checkoutTest'), terr } });
  apply({ type: 'remote', who: 'Ann', device: 'ann-laptop', dev: 'dev-ann', rid: 'acme/shop', br: 'main',
    ev: { type: 'gov', id: 'r:dev-ann:gov', state: 'busy', terr, present: true } });
  apply({ type: 'remote', who: 'Ann', device: 'ann-laptop', dev: 'dev-ann', rid: 'acme/shop', br: 'feat/payment-retry',
    ev: { type: 'spawn', id: 'r:dev-ann:s:1', role: 'worker', label: 'worker', task: i18n('demo.task.paymentRetry'), terr } });
  apply({ type: 'remote', who: 'Ann', device: 'ann-laptop', dev: 'dev-ann', rid: 'acme/shop', br: 'feat/payment-retry',
    ev: { type: 'stuck', id: 'r:dev-ann:s:1', tool: 'AskUserQuestion', question: i18n('demo.q.paymentRetry') } });
  apply({ type: 'remote', who: 'Bo', device: i18n('demo.device.cloud'), dev: 'dev-bo', rid: 'acme/shop', br: 'chore/deps-scan',
    ev: { type: 'spawn', id: 'r:dev-bo:s:1', role: 'worker', label: 'worker', task: i18n('demo.task.depsScan'), terr } });
}
/* the three demo-only #spawn-group buttons: 中继断开 / 恢复 / 退出联城 */
function demoRemote(kind){
  if (kind === 'off') {
    apply({ type: 'team', host: DEMO_RELAY_HOST, state: 'off', queued: demoQueued });
    log(i18n('log.relayOff'));
  } else if (kind === 'on') {
    demoQueued = 0; demoTickAcc = 0;
    apply({ type: 'team', host: DEMO_RELAY_HOST, state: 'ok', queued: 0 });
    log(i18n('log.relayOn'));
  } else if (kind === 'leave') {
    // city-join: the server sends 'leave'/present:false for every person and gov of a dropped
    // team, then the 'team' state -- the demo plays back the same shape (requirements/city.md).
    for (const rc of citizens.slice()) if (rc.remote) {
      apply({ type: 'remote', who: rc.remote.who, device: rc.remote.device, dev: rc.remote.dev, rid: rc.remote.rid, br: rc.remote.br,
        ev: { type: 'leave', id: rc.id } });
    }
    for (const g of [...remoteGovs.values()]) {
      apply({ type: 'remote', who: g.who, device: g.device, dev: g.dev, rid: '', br: '',
        ev: { type: 'gov', id: g.id, terr: g.terr, state: g.state, present: false } });
    }
    apply({ type: 'team', host: DEMO_RELAY_HOST, state: 'left', queued: 0 });
    meInfo = null;
    log(i18n('log.relayLeave'));
  }
  lastDetailKey = ''; lastRoster = ''; renderPanel(); needFrame = true;
}
/* while the demo relay is off, 待发 grows about once a second, like a real queued sender would */
function demoRelayTick(dt){
  if (!anyRelayOff()) return;
  demoTickAcc += dt;
  if (demoTickAcc < 1) return;
  demoTickAcc = 0;
  demoQueued = Math.min(99, demoQueued + 1);
  const i = relays.findIndex(r => r.host === DEMO_RELAY_HOST);
  if (i >= 0) relays[i] = Object.assign({}, relays[i], { queued: demoQueued });
}

/* ---------- boot: load the ready-made models, then run at a capped frame rate ---------- */
let lastSim = performance.now(), lastDraw = 0, panelT = 0;
function busy(){
  if (drag && drag.moved || pinch || camTween || autoRotating()) return true;
  if (typeof shows !== 'undefined' && shows.size) return true; // Balance: an era show is running (builders walking, about to flip)
  return citizens.some(c => c.path.length || workAction(c) || c.state === 'spawn' || c.state === 'handover' || c.state === 'talking' || c.state === 'asking'); // city-work-anim: acting people need frames, a pausing builder does not
}
function frame(now){
  requestAnimationFrame(frame);
  if (document.hidden) { lastSim = now; return; }
  askAutoClose(now); // Result line then close: the open panel closes itself ASK_CLOSE_MS after its result showed
  const interval = busy() || needFrame ? FRAME_MS : IDLE_FRAME_MS;
  if (now - lastDraw < interval - 2) return;
  const raw = Math.min(.1, (now - lastSim) / 1000);
  lastSim = now; lastDraw = now; needFrame = false;
  const before = new Set(citizens);
  for (let dt = raw; dt > 0; dt -= .05) update(Math.min(dt, .05));
  for (const c of before) if (!citizens.includes(c)) goneOv.push(c);
  cameraStep(raw); // the never-stop rotation (through autoRotate) plus the quarter-turn tween
  updateReposAria(now); // U1: aria-current follows the look point, throttled
  applyTheme();
  updateCamera();
  renderFollow(); // V1: the follow chip tracks the map's free middle every frame, not just every renderPanel
  applyFade(viewBlockers(cam.el + camLiftNow));
  stepShows(now); // Balance: the running era show(s) — builders walking, then the one-moment flip
  sync(simT, raw);
  renderer.render(scene, camera);
  panelT += raw;
  if (panelT > .25) { panelT = 0; renderPanel(); }
}
resize(); resetCam(); updateCamera();
Promise.all([
  loadAll((n, total) => { $('#loading-text').textContent = i18n('loading.progress', { n, total }); }),
  loadSmokeTex(), // Worktrees: the stalled-site smoke sprites (siteDecor's 'particles/smoke_01') -- its own loader, not loadTex() (see loadSmokeTex's own comment)
  ...['suburban/Textures/variation-a.png', 'suburban/Textures/variation-b.png', 'suburban/Textures/variation-c.png'].map(loadTex),
]).then(([, smoke, ...tex]) => {
  smokeTex = smoke;
  tex.forEach(t => { if (t) variations.push(t); });
  if (DEMO) buildLand(DEMO_WORLD);
  makeGovernor(); buildLife();
  if (DEMO) seed(); else connectLive();
  $('#loading').hidden = true;
  new ResizeObserver(() => resize()).observe(stage);
  applyTheme(); updateCamera(); sync(0, 0); renderer.render(scene, camera); renderPanel();
  requestAnimationFrame(frame);
}).catch(err => { $('#loading-text').textContent = i18n('loading.error', { err: (err && err.message) || err }); });
})();
</script>
