# agent_repo.conf: this repo's own facts (check-blocks). Written by agent-init.sh, kept up to date by agents; a human may edit it, never has to.
version=1
core_paths=bin/agent_guard.py,bin/agent-guard.sh,bin/agent_owner_order.py,bin/agent-owner-order.sh,bin/agent_conf.py,hooks/,.claude-plugin/
guard_tests=tests/test_rules_text.py,tests/test_rules_structure.py
build_cmd=python3 -m compileall -q bin tests
related_cmd=python3 tests/run2.py {tests}
full_cmd=python3 tests/run2.py
full_run_where=remote
all_skip_ok=test_check_blocks_demo: heavy, its one test runs only in the full run (AGENT_FULL_RUN=1); a named run always skips it
test_config=
data_scripts=
real_data=none
build_seconds=1
build_mb=33
guard_seconds=1
edge=empty value
edge=more than one page
edge=invalid input
edge=day boundary in local time
edge=large size
# fix: fix-two-roots-env: tests never inherit the runner's CLAUDE_PID
weight.full=460 s 900 MB
edge=a list cut to fit with a line after it: the fold counts only the list rows and the line after stays
edge=a long text sent to a remote terminal arrives cut (only its tail)
